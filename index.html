function route(){
  closeModal(); closeMenu();
  // #app is reused across routes (innerHTML swapped, not replaced), so a data-tab left over
  // from a previous trip visit would otherwise persist onto the hub/Places pages too
  const appEl = $('#app'); if(appEl) delete appEl.dataset.tab;
  // baseline for every route - a page that isn't a trip (Games, Design...) has no other call
  // to renderSidebar of its own; the trip route below overrides this with the fuller trip menu
  renderSidebar(null);
  if(!pinOk()){ CUR_TRIP_ID = null; stopSub(); renderPinGate(); renderTabbar(); return; }
  setTimeout(renderTabbar, 0);   // after whichever render below has settled CUR_TRIP_ID/CUR_TAB
  const h = location.hash;
  /* Home is the app's front door now - Places used to answer the bare hash (see its own
     comment below), redirected here instead so every "active tab" check keyed on '#/home'
     still works without needing to also recognise the bare hash as home */
  if(h === '' || h === '#/'){ location.hash = '#/home'; return; }
  if(h === '#/changelog'){
    renderChangelog(); window.scrollTo(0,0); return;
  }
  if(h === '#/home'){
    CUR_TRIP_ID = null; stopSub();
    renderDashboard(); window.scrollTo(0,0); return;
  }
  /* '#/places/been' and friends are the three list screens under the Places hub */
  if(h === '#/places' || h.startsWith('#/places/')){
    const v = h.split('/')[2];
    CUR_TRIP_ID = null; stopSub();
    if(!v){ renderPlacesHub(); window.scrollTo(0,0); return; }
    renderPlaces(v); window.scrollTo(0,0); return;
  }
  if(h === '#/games'){
    CUR_TRIP_ID = null; stopSub();
    renderGames(); window.scrollTo(0,0); return;
  }
  if(h.startsWith('#/game/')){
    CUR_TRIP_ID = null; stopSub();
    renderGameDetail(decodeURIComponent(h.slice('#/game/'.length))); window.scrollTo(0,0); return;
  }
  if(h === '#/settings'){
    CUR_TRIP_ID = null; stopSub();
    renderSettings(); window.scrollTo(0,0); return;
  }
  if(h === '#/gigs'){
    CUR_TRIP_ID = null; stopSub();
    renderGigs(); window.scrollTo(0,0); return;
  }
  if(h === '#/films'){
    CUR_TRIP_ID = null; stopSub();
    renderFilms(); window.scrollTo(0,0); return;
  }
  if(h === '#/theatre'){
    CUR_TRIP_ID = null; stopSub();
    renderTheatre(); window.scrollTo(0,0); return;
  }
  if(h === '#/plants'){
    CUR_TRIP_ID = null; stopSub();
    renderPlants(); window.scrollTo(0,0); return;
  }
  if(h.startsWith('#/plant/')){
    CUR_TRIP_ID = null; stopSub();
    renderPlantDetail(decodeURIComponent(h.slice('#/plant/'.length))); window.scrollTo(0,0); return;
  }
  if(h.startsWith('#/films/stats/year/')){
    CUR_TRIP_ID = null; stopSub();
    renderFilmsStatsFiltered('year', decodeURIComponent(h.slice('#/films/stats/year/'.length)));
    window.scrollTo(0,0); return;
  }
  if(h.startsWith('#/films/stats/rating/')){
    CUR_TRIP_ID = null; stopSub();
    renderFilmsStatsFiltered('rating', decodeURIComponent(h.slice('#/films/stats/rating/'.length)));
    window.scrollTo(0,0); return;
  }
  if(h === '#/films/stats/rewatches'){
    CUR_TRIP_ID = null; stopSub();
    renderFilmsStatsFiltered('rewatch', ''); window.scrollTo(0,0); return;
  }
  if(h.startsWith('#/view/')){
    // legacy snapshot link, adopt the trip locally, then switch to the stable per-trip URL
    try{
      const snap = JSON.parse(LZString.decompressFromEncodedURIComponent(h.slice(7)));
      if(!snap || !snap.name || !snap.id) throw 0;
      if(!getTrip(snap.id)){ DB.trips.unshift(snap); saveLocal(); }
      location.hash = '#/trip/'+snap.id; return;
    }catch(e){
      CUR_TRIP_ID = null; stopSub();
          $('#app').innerHTML = `<div class="empty" style="margin-top:40px">This trip link appears to be broken or incomplete.<br>Ask whoever set it up to send it again.</div>`;
    }
  } else if(h.startsWith('#/trip/')){
    openTrip(h.slice(7).split('/')[0]);
  } else if(h === '#/trips'){
    CUR_TRIP_ID = null; stopSub(); renderHome();
  } else {
    /* fallback for a broken/unrecognised hash - the bare hash itself is handled above */
    CUR_TRIP_ID = null; stopSub(); renderPlacesHub();
  }
  window.scrollTo(0,0);
}
function openTrip(id){
  CUR_TAB = 'home';   // opening a trip always lands on the dashboard
  CUR_TRIP_ID = id;
  // 'busy' until the real .info/connected listener (in initCloud) confirms the connection,
  // don't claim Synced before Firebase has actually said so
  syncState = cloudEnabled() ? 'busy' : 'local';
  subscribeTrip(id);
  const local = getTrip(id);
  if(local){
    renderTrip(local);
  } else if(fbRoot){
      $('#app').innerHTML = `<div class="empty" style="margin-top:40px">Loading trip…</div>`;
    fetchTripOnce(id, remote=>{
      if(CUR_TRIP_ID!==id) return;
      if(remote){
        normalizeTrip(remote);
        if(!getTrip(id)){ DB.trips.unshift(remote); saveLocal(); }
        const t = getTrip(id); renderTrip(t);
      } else {
        $('#app').innerHTML = `<div class="empty" style="margin-top:40px">We couldn't find this trip.<br>Ask whoever set it up to share the link again.</div>`;
      }
    });
  } else {
      $('#app').innerHTML = `<div class="empty" style="margin-top:40px">This trip isn't saved on this device.<br>Shared trips need the app's cloud config set up first.</div>`;
  }
}

/* ================= plants (vegetable growing tracker) ================= */
/* one universal list for every vegetable, not tailored per type - kept to stages that genuinely
   apply across the board. "Flowering / Fruiting" used to be in here but didn't fit root veg like
   carrots (they don't fruit, and flowering usually means bolting, not progress), so it's gone;
   see PLANT_STAGE_LEGACY_MAP for what happens to any vegetable still sat on that old stage.
   "Not Planted" leads the list - a vegetable you're tracking but haven't actually got seeds in
   the ground for yet, the state a freshly-added one starts in (see PLANT_STAGE_DEFAULT).
   emoji is only set where one's actually accurate for the stage */
const PLANT_STAGES = [
  {k:'unplanted', label:'Not Planted'},
  {k:'seed', label:'Seed Sown', emoji:'🌱'},
  {k:'sprout', label:'Sprouted', emoji:'🌿'},
  {k:'growing', label:'Growing', emoji:'🪴'},
  {k:'ready', label:'Ready to Harvest', emoji:'🧺'},
  {k:'harvested', label:'Harvested', emoji:'✅'},
];
const PLANT_STAGE_DEFAULT = PLANT_STAGES[0].k;
/* a vegetable saved while "Flowering / Fruiting" still existed keeps that raw key in its data -
   this maps it back to the closest stage still on the list (still growing, not yet ready) so it
   reads sensibly everywhere a stage gets looked up, without needing to rewrite old records */
const PLANT_STAGE_LEGACY_MAP = {flowering:'growing'};
const PLANT_EMOJIS = ['🍅','🥕','🥬','🥦','🌽','🥒','🫑','🌶️','🧄','🧅','🥔','🍆','🫛','🫘','🫜','🥑','🫒','🌿','🍓','🫐','🍇','🎃','🍈','🍉','🌱'];
/* a handful of common name -> emoji matches so a fresh vegetable often gets the right icon
   picked automatically as soon as its name is typed - plantNameInputImpl only applies this
   while the emoji hasn't been touched by hand (PLANT_FORM_EMOJI_MANUAL), so picking one
   yourself always wins over the guess. Every emoji used here also has to be in PLANT_EMOJIS
   above - the guess only actually shows as "picked" if it's one of the grid's own buttons.
   No dedicated emoji exists for radish, turnip, beetroot, parsnip or swede, so they share
   Unicode 15's generic "root vegetable" glyph rather than falling through to the plain 🌱. */
const PLANT_EMOJI_GUESS = [
  [/tomato/,'🍅'], [/carrot/,'🥕'],
  [/lettuce|spinach|kale|chard|salad|rocket|arugula|cabbage|cauliflower|bok choy|pak choi|leaf/,'🥬'],
  [/broccoli/,'🥦'], [/corn|maize|sweetcorn/,'🌽'], [/cucumber|courgette|zucchini/,'🥒'],
  [/pepper|capsicum/,'🫑'], [/chilli|chili|jalapeno/,'🌶️'], [/garlic/,'🧄'], [/onion|leek|shallot/,'🧅'],
  [/potato/,'🥔'], [/aubergine|eggplant/,'🍆'], [/pea/,'🫛'], [/bean/,'🫘'],
  [/radish|turnip|beet|parsnip|swede|rutabaga/,'🫜'], [/avocado/,'🥑'], [/olive/,'🫒'],
  [/basil|mint|coriander|cilantro|parsley|thyme|rosemary|sage|chive|dill|herb/,'🌿'],
  [/strawberr/,'🍓'], [/blueberr/,'🫐'], [/grape/,'🍇'], [/pumpkin|squash|butternut/,'🎃'],
  [/watermelon/,'🍉'], [/melon/,'🍈'],
];
function guessPlantEmoji(name){
  const n = (name||'').trim().toLowerCase();
  if(!n) return '';
  const hit = PLANT_EMOJI_GUESS.find(([re])=>re.test(n));
  return hit ? hit[1] : '';
}
/* watering is a log now (p.waterings, newest last), not a single date - so it supports
   watering twice on a hot day and shows exactly when, not just which day. plantLastWateredTs
   falls back to the old single p.lastWatered field for anything watered before this changed
   (savePlantImpl migrates it into the log properly the next time that plant's actually saved). */
function plantLastWateredTs(p){
  const arr = Array.isArray(p.waterings) ? p.waterings : [];
  if(arr.length) return arr[arr.length-1];
  return p.lastWatered ? p.lastWatered+'T12:00:00' : null;
}
/* whole calendar days apart, not 24h chunks - watered at 11pm and checked again at 7am is
   "yesterday", one day ago, not zero */
function daysSinceTs(ts){
  if(!ts) return null;
  const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return Math.round((startOfDay(new Date()) - startOfDay(new Date(ts))) / 86400000);
}
function plantOverdue(p){
  const days = daysSinceTs(plantLastWateredTs(p));
  return days===null || days>=(p.wateringFrequencyDays||3);
}
/* the one piece of logic every status readout on a plant (the health badge, the water-status
   chip, the Success Tracker's "Soil Moist" line) all key off, so they can never disagree with
   each other - red once actually overdue (see plantOverdue), amber the day before that so
   there's a heads-up rather than the state jumping straight from fine to overdue with no
   warning, green otherwise. No verdict for a still-unplanted vegetable - nothing's growing yet
   to have a watering opinion about. */
function plantHealthState(p){
  if(p.stage===PLANT_STAGE_DEFAULT) return null;
  if(plantOverdue(p)) return 'red';
  const days = daysSinceTs(plantLastWateredTs(p));
  if(days===(p.wateringFrequencyDays||3)-1) return 'yellow';
  return 'green';
}
const PLANT_HEALTH_META = {
  green: {emoji:'🟢', label:'On Track'},
  yellow: {emoji:'🟡', label:'Check Today'},
  red: {emoji:'🔴', label:'Needs Water'},
};
/* the most prominent thing on the card after the name, per the redesign brief - a single glance
   at colour + label should be enough to know whether this vegetable needs anything right now. */
function plantHealthBadgeHTML(p){
  const state = plantHealthState(p); if(!state) return '';
  const m = PLANT_HEALTH_META[state];
  return `<div class="plant-health-badge ${state}">${m.emoji} ${m.label}</div>`;
}
/* the same three-state verdict as the health badge, phrased for water specifically rather than
   "the plant" generally - a short icon-led chip rather than the "Should feel dry/moist" prose
   line this replaces, and now three states instead of two so there's a heads-up state instead of
   jumping straight from "fine" to "overdue" with nothing in between. */
function plantWaterStatusHTML(p){
  const state = plantHealthState(p); if(!state) return '';
  const text = state==='red' ? 'Water Needed' : state==='yellow' ? 'Check Today' : 'Soil Moist';
  return `<div class="plant-water-status ${state}">💧 ${text}</div>`;
}
/* how many whole days a vegetable's been growing, preferring the edit form's own Planted date
   (p.plantedDate - the grower's actual answer to "when did you sow this") over guessing from the
   stage-change log, which only exists as a fallback for a plant that predates this reading it
   (or one whose Planted date was left on the default and never actually confirmed). When it does
   fall back, it counts from the most recent time the plant was actually set to Seed Sown (a
   re-sown batch resets the clock, which is correct - see plantLogStageChange). */
function plantDaysSinceSown(p){
  if(p.plantedDate) return daysSinceTs(p.plantedDate+'T12:00:00');
  const entries = (Array.isArray(p.stageChanges) ? p.stageChanges : []).filter(e => plantStageKey(e.stage)==='seed');
  if(!entries.length) return null;
  const latest = entries.reduce((a,b) => new Date(b.ts) > new Date(a.ts) ? b : a);
  return daysSinceTs(latest.ts);
}
/* only meaningful while it's actually germinating, and only for a vegetable this app has a
   known germination window for (see PLANT_CARE_DATA) - returns null otherwise so callers can
   just skip the row/section rather than showing a countdown for numbers nobody supplied. */
function plantGerminationInfo(p){
  if(!['seed','sprout'].includes(plantStageKey(p.stage))) return null;
  const care = plantCareDataFor(p); if(!care || !care.germDays) return null;
  const days = plantDaysSinceSown(p); if(days===null) return null;
  return {day: days+1, min: care.germDays[0], max: care.germDays[1]};
}
function plantGerminationRowHTML(p){
  const g = plantGerminationInfo(p); if(!g) return '';
  return `<div class="plant-germ-label">⏳ ${g.min} to ${g.max}d</div>`;
}
/* how many whole days since the plant last actually entered a given stage (its most recent
   stageChanges entry for that stage) - every stage transition gets logged (see
   plantSetStageImpl/plantLogStageChange), so this works for any stage a plant has actually
   reached, not just the current one. */
function plantDaysSinceStageEntered(p, stageKey){
  const entries = (Array.isArray(p.stageChanges) ? p.stageChanges : []).filter(e => plantStageKey(e.stage)===stageKey);
  if(!entries.length) return null;
  const latest = entries.reduce((a,b) => new Date(b.ts) > new Date(a.ts) ? b : a);
  return daysSinceTs(latest.ts);
}
/* how many days until the next watering is actually due, going by the same wateringFrequencyDays
   every other watering readout uses - only meaningful once it's actually been watered at least
   once (a never-watered plant is already 'red' via plantHealthState, which callers check first). */
function plantDaysUntilWaterDue(p){
  const last = plantLastWateredTs(p); if(!last) return null;
  return (p.wateringFrequencyDays||3) - daysSinceTs(last);
}
/* real elapsed time for anything watered in the last day (matches the brief's own "2h ago"
   example), falling back to the calendar-day phrasing the rest of the app already uses (see
   daysSinceTs) once it's further out than that - a bare "23h ago" reads oddly once it tips into
   yesterday, "Yesterday" doesn't. */
function plantWaterRelativeLabel(p){
  const ts = plantLastWateredTs(p);
  if(!ts) return 'Never';
  const mins = Math.round((Date.now() - new Date(ts).getTime())/60000);
  if(mins < 1) return 'Just now';
  if(mins < 60) return mins+'m ago';
  const hrs = Math.round(mins/60);
  if(hrs < 24) return hrs+'h ago';
  const days = daysSinceTs(ts);
  return days===1 ? 'Yesterday' : days+'d ago';
}
function plantWaterFooterHTML(p){
  if(p.stage===PLANT_STAGE_DEFAULT) return '';
  return `<div class="plant-water-footer">🕒 ${esc(plantWaterRelativeLabel(p))}</div>`;
}
/* ---- the detail page's "friendly coach" layer ----
   Everything below reads the exact same underlying state (plantHealthState, plantGerminationInfo,
   plantStageKey) the sticky header and the data-y sections already use - this is purely a warmer,
   plainer-English presentation of it for a beginner who's never grown anything before, not a
   second source of truth. */
/* one consistent section-heading style for the whole page (Font Awesome icon + label) instead of
   a different decorative emoji per heading - the CRM redesign brief's own "emojis identify the
   plant, icons label the sections" rule. Plain <h2>-equivalent, same weight/size everywhere. */
function plantSectionHeadingHTML(icon, label){
  return `<h2 class="plant-section-heading">${fa(icon)}<span>${esc(label)}</span></h2>`;
}
/* the beginner-facing "what do I actually do" card - the thing this whole redesign is for. One
   short paragraph, changes with the stage (and, during germination, whether it's still early or
   getting close to the expected window), never assumes any gardening knowledge. */
function plantWhatsNextText(p){
  const stage = plantStageKey(p.stage);
  const g = plantGerminationInfo(p);
  const care = plantCareDataFor(p);
  if(stage===PLANT_STAGE_DEFAULT) return "Once you've got seeds in the pot, tap Mark as Planted below to start tracking it.";
  if(stage==='seed'){
    const window = (g && `Most seeds like this take ${g.min} to ${g.max} days to sprout.`)
      || (care && care.germDays && `Most seeds like this take ${care.germDays[0]} to ${care.germDays[1]} days to sprout.`)
      || "Every seed's a little different, so there's no exact day to expect it by.";
    return `You're waiting for the first shoots. ${window} Nothing visible yet is normal.`;
  }
  if(stage==='sprout') return "Your seedling's up. It needs plenty of light now to grow strong rather than tall and floppy.";
  if(stage==='growing') return "Keep the water and sunlight coming. There's nothing else to do but let it get on with growing.";
  if(stage==='ready') return "This one's ready. Harvest it whenever suits you - it won't spoil by waiting a day or two.";
  if(stage==='harvested') return "This one's done. If you're growing another batch, tap a stage below to start tracking it.";
  return '';
}
function plantWhatsNextHTML(p){
  return `
    <div class="plant-next-card">
      ${plantSectionHeadingHTML('signs-post',"What Happens Next?")}
      <p>${esc(plantWhatsNextText(p))}</p>
    </div>`;
}
/* the four generic stages the visual journey steps through - unplanted has no step of its own
   (nothing to show yet), and Ready/Harvested share the last step since "harvest" is the
   destination whether it's freshly ready or already picked. */
const PLANT_JOURNEY_STEPS = [
  {stages:['seed'], emoji:'🌱', label:'Seed Sown'},
  {stages:['sprout'], emoji:'🌿', label:'Sprouted'},
  {stages:['growing'], emoji:'🪴', label:'Growing'},
  {stages:['ready','harvested'], emoji:'🥦', label:'Harvest'},
];
function plantJourneyStepIdx(p){
  return PLANT_JOURNEY_STEPS.findIndex(s => s.stages.includes(plantStageKey(p.stage)));
}
/* a short, stage-specific blurb for the Progress Timeline below - independent of the plant's own
   current stage, since tapping a *future* node should still explain what that stage actually
   involves, not just describe whatever's happening right now. */
function plantJourneyStepDescription(i, p){
  const care = plantCareDataFor(p);
  if(i===0) return care && care.germDays
    ? `Waiting for the seed to sprout. Most seeds like this take ${care.germDays[0]} to ${care.germDays[1]} days.`
    : "Waiting for the seed to sprout. Every seed's a little different, so there's no exact day to expect it by.";
  if(i===1) return "The seedling's up. Give it plenty of light so it grows strong, not tall and floppy.";
  if(i===2) return "Actively growing. Keep the water and sunlight coming - nothing else needed.";
  return "Ready to pick. Harvest whenever suits you - it won't spoil by waiting a day or two.";
}
function plantJourneyStepCompletedOn(p, step){
  const entries = (Array.isArray(p.stageChanges)?p.stageChanges:[]).filter(e=>step.stages.includes(plantStageKey(e.stage)));
  if(!entries.length) return '';
  const latest = entries.reduce((a,b) => new Date(b.ts) > new Date(a.ts) ? b : a);
  return fmtDate(latest.ts.slice(0,10));
}
/* the page's one visual timeline (folds the old separate "day count" text block and "Growing
   Journey" accordion list into a single component, per the CRM redesign brief) - a connected
   vertical line of stops rather than either a horizontal stepper or oversized cards. Every node
   (not just the current one) can jump the plant straight to that stage - the same jump-to-any-
   stage behaviour the flat button list (plantStagePickerHTML) gives, just presented as a
   progression instead. The current node also carries the germination day count/expected range
   where there is one - the one bit of the old separate text block worth keeping front and centre.

function plantProgressTimelineHTML(p){

      const done = i<idx, current = i===idx;

      const meta = current ? 'Current' : done ? ('Done' + (completedOn ? ' · '+completedOn : '')) : '';
      return `

}

function plantWateringNextAction(state){

/* simplified per the CRM redesign brief - one "last watered" line, one colour-coded action line

function plantWateringCardHTML(p){

/* the sticky header's own watering hint - short enough to sit on one line next to the status and
   (for a growing plant) a harvest-timing line, so it's phrased as a single word or two rather
   than the fuller sentence the Watering card below gets. */
function plantStickyWaterHint(p, state){
  if(state==='red') return '💧 Water today';
  if(state==='yellow') return '💧 Check soil today';
  const until = plantDaysUntilWaterDue(p);
  if(until===1) return '💧 Water tomorrow';
  if(until>1) return `💧 Water in ${until} days`;
  return '✅ Nothing to do today';
}
/* the header's own status line - urgency (needing water) always wins over the stage-flavoured
   "going well" phrasing, since "growing strong" reads oddly next to a plant that's actually
   overdue a drink. Otherwise each stage gets its own upbeat label rather than reusing the plain
   health-badge wording everywhere. */
function plantStickyStatusLine(p, state){
  const stage = plantStageKey(p.stage);
  if(state==='red') return `${PLANT_HEALTH_META.red.emoji} Needs Water`;
  if(state==='yellow') return `${PLANT_HEALTH_META.yellow.emoji} Check Today`;
  if(stage==='sprout') return '🟢 Growing Well';
  if(stage==='growing') return '🪴 Growing Strong';
  if(stage==='ready') return '🧺 Ready to Harvest';
  if(stage==='harvested') return '✅ All Done';
  return '🟢 Looking Good';
}
/* the sticky header's own three-line dashboard - deliberately different content per stage rather
   than reusing the same fields everywhere, since "what's worth knowing right now" genuinely
   changes: a germination countdown while it's a seed, days-since-sprouting once it's up, a
   watering + harvest-timing hint once it's actually growing. This is the CRM-style "what do I
   need to do next" summary the whole redesign is built around - everything below it is detail. */
function plantStickyLines(p){
  if(p.stage===PLANT_STAGE_DEFAULT) return ['⚪ Not Planted Yet', 'Tap Change Stage below to get started'];
  const stage = plantStageKey(p.stage);
  const state = plantHealthState(p);
  const lines = [plantStickyStatusLine(p, state)];
  if(stage==='seed'){
    const g = plantGerminationInfo(p);
    if(g){ lines.push(`📅 Day ${g.day}`); lines.push(`⏳ ${g.min} to ${g.max} days until expected sprouts`); }
    else lines.push(plantStickyWaterHint(p, state));
  } else if(stage==='sprout'){
    const days = plantDaysSinceStageEntered(p, 'sprout');
    lines.push(days!=null ? `🌿 Sprouted ${days===0?'today':days===1?'yesterday':days+' days ago'}` : '🌿 Sprouted');
    lines.push(plantStickyWaterHint(p, state));
  } else if(stage==='growing'){
    lines.push(plantStickyWaterHint(p, state));
    const guide = plantGuideFor(p);
    const munch = guide && guide.facts && guide.facts.munch;
    if(munch) lines.push(`🥦 Harvest ${munch}`);
  } else if(stage==='ready'){
    lines.push('🥦 Harvest whenever suits you');
  } else if(stage==='harvested'){
    lines.push('🎉 Nice work growing this one');
  }
  return lines;
}
/* the one-line version shown once the header's collapsed (see plantBindStickyScroll) - name,
   day count where there is one, and the same status line the expanded view leads with, so
   scrolling away never loses the answer to "is everything OK" even once the detail's gone. */
function plantStickyCollapsedText(p, state){
  if(p.stage===PLANT_STAGE_DEFAULT) return `${p.name||'Untitled'} · Not Planted`;
  const parts = [p.name||'Untitled'];
  const g = plantGerminationInfo(p);
  if(g) parts.push(`Day ${g.day}`);
  parts.push(plantStickyStatusLine(p, state));
  return parts.join(' · ');
}
/* the page's own dashboard for this one plant (per the CRM-style redesign) - full width, sticks
   to the top of the viewport while the rest of the page scrolls underneath it, and collapses to a
   single summary line once scrolled past (both states are rendered up front; CSS just toggles
   which one shows, so collapsing is a plain class flip rather than a re-render - see
   plantBindStickyScroll). The plant's name lives here and nowhere else on the page - the crumb

function plantStickyHeaderHTML(p){
  const unplanted = p.stage===PLANT_STAGE_DEFAULT;

    <div class="plant-sticky-header${unplanted?' plant-unplanted':''}" id="plant-detail-sticky">
      <div class="plant-sticky-expanded">

          <div class="plant-sticky-name">${esc(p.name||'Untitled')}</div>
          ${lines.map(l=>`<div class="plant-sticky-line">${esc(l)}</div>`).join('')}
          ${unplanted ? '' : plantWaterButtonHTML(p)}
        </div>
      </div>
      <div class="plant-sticky-collapsed">

/* one persistent scroll listener (registered lazily, the first time a plant detail page ever
   renders) rather than binding/unbinding one per visit - cheaply a no-op via the DOM guard
   whenever some other page is showing, same pattern the rest of this page's draw functions use. */
let PLANT_STICKY_SCROLL_BOUND = false;
function plantBindStickyScroll(){
  if(PLANT_STICKY_SCROLL_BOUND) return;
  PLANT_STICKY_SCROLL_BOUND = true;
  window.addEventListener('scroll', () => {
    const el = document.getElementById('plant-detail-sticky');

  }, {passive:true});

/* 24-hour HH:MM rather than toLocaleTimeString's 12-hour "6:00 PM" - shorter, and reads
   unambiguously at the small size this sits at on the card */
function hhmm(ts){
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
/* same idea as plantWaterRelativeLabel but cut down to fit Home's much narrower per-vegetable
   chips - just the clock time if it was today (the useful part when it's the same day), otherwise a
   bare day count */
function plantWaterShortLabel(p){
  const ts = plantLastWateredTs(p);
  if(!ts) return 'Never';
  const days = daysSinceTs(ts);
  if(days===0) return new Date(ts).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  if(days===1) return 'Yesterday';
  return `${days}d ago`;
}
/* a custom uploaded image (see plantIconStatusHTML) takes over from the emoji wherever a

function plantIconHTML(p, cls){

    : `<span class="${cls}" aria-hidden="true">${p.emoji||'🌱'}</span>`;
}
function plantStageKey(k){ return PLANT_STAGE_LEGACY_MAP[k] || k; }
function plantStageIdx(k){ const i = PLANT_STAGES.findIndex(s=>s.k===plantStageKey(k)); return i<0 ? 0 : i; }
/* the current stage's own label, with its emoji if it has one - used on the Plants grid card,
   the one place a status readout is needed without also being a way to change it (the
   detail page's own picker below already shows the current stage via its .on button, so it
   doesn't repeat this as a separate line) */
function plantStageStatusText(p){

/* every stage as its own labelled button - only the current one highlighted, not a filled-up-
   to-here progress readout, since the point here is "which one is it right now", not "how far
   along the sequence". Tapping any of them jumps straight there, same App.plantSetStage the
   old dots called. Detail-page only: the Plants grid card just shows plantStageStatusText. */
function plantStagePickerHTML(p){
  const cur = plantStageIdx(p.stage);
  return `<div class="plant-stage-picker">${PLANT_STAGES.map((s,i)=>`
    <button type="button" class="plant-stage-btn${i===cur?' on':''}"
      onclick="event.stopPropagation();App.plantSetStage('${esc(p.id)}','${s.k}')">
      ${s.emoji?`<span aria-hidden="true">${s.emoji}</span> `:''}${esc(s.label)}</button>`).join('')}</div>`;

const PLANTS_SORT_OPTIONS = [
  ['attention','Needs Attention'],
  ['watered','Recently Watered'],
  ['name','Plant Name'],
  ['sown','Date Sown'],
];
let CUR_PLANTS_SORT = 'attention';
/* the default (and only) ordering used to be "Needs Attention" - overdue-watering plants float
   to the top (the thing most worth noticing at a glance), harvested ones sink to the bottom
   (done, least worth the eye), everything else by name. Now one of four, picked via the sort
   select above the grid (see plantsSortSelectHTML/App.plantsSortChange). */
function plantsSorted(){
  const list = [...(DB.plants||[])];
  if(CUR_PLANTS_SORT==='name') return list.sort((a,b) => (a.name||'').localeCompare(b.name||''));
  if(CUR_PLANTS_SORT==='watered') return list.sort((a,b) => {
    const ta = plantLastWateredTs(a), tb = plantLastWateredTs(b);
    if(!ta && !tb) return 0;
    if(!ta) return 1; if(!tb) return -1;   // never-watered sinks to the bottom either way
    return new Date(tb) - new Date(ta);   // most recently watered first
  });
  if(CUR_PLANTS_SORT==='sown') return list.sort((a,b) => {
    const da = plantDaysSinceSown(a), db = plantDaysSinceSown(b);
    if(da===null && db===null) return 0;
    if(da===null) return 1; if(db===null) return -1;   // never-sown sinks to the bottom
    return da - db;   // most recently sown (fewest days ago) first
  });
  return list.sort((a,b) => {
    if((a.stage==='harvested') !== (b.stage==='harvested')) return a.stage==='harvested' ? 1 : -1;
    const oa = plantOverdue(a), ob = plantOverdue(b);
    if(oa !== ob) return oa ? -1 : 1;
    return (a.name||'').localeCompare(b.name||'');
  });
}
function plantsSortSelectHTML(){
  return `<select id="plants-sort-select" aria-label="Sort vegetables" onchange="App.plantsSortChange(this.value)">
    ${PLANTS_SORT_OPTIONS.map(([k,label]) => `<option value="${k}"${CUR_PLANTS_SORT===k?' selected':''}>${esc(label)}</option>`).join('')}
  </select>`;
}
/* the four counts above the grid - purely informational (no destination to tap through to, it's
   all the exact same list right below), so plain tiles rather than the app's usual clickable
   dash-widget ones. Recomputed by drawPlantsGrid on every redraw, same as the grid itself, so

  const stats = [

    ['💧', list.filter(p => plantHealthState(p)==='red').length, 'Need Water'],

/* the couple of seconds right after a tap (PLANT_UNDO_TIMERS) is the one time the button shows
   something other than "log a watering" - an accidental tap is common (it's a small target
   sitting right where a card is otherwise all tap-to-open), so it turns into a plain "undo that"
   button instead, then reverts back on its own once the window's passed. sm is used by the
   Home widget's smaller chips (see dashPlantsWidgetHTML) - same behaviour, smaller button. */
let PLANT_UNDO_TIMERS = {};
const PLANT_UNDO_MS = 5000;
/* Home's chips (sm) keep the small icon-only circular button (.plant-water-btn); the full
   Plants page card gets a bigger labelled button instead - "Watered" with the emoji
   beside it, its own class (.plant-water-action-btn) since it's a different shape
   entirely, not just a bigger version of the same button. */
function plantWaterButtonHTML(p, sm){
  const showUndo = !!PLANT_UNDO_TIMERS[p.id];
  if(sm){
    // no overdue/done border colour here - see .plant-water-btn.sm's own comment for why - but
    // the icon itself still swaps to a checkmark once it's had enough water for now (not
    // overdue), so Home's still glanceable without needing a colour cue. Still tappable either
    // way - watering twice in a day is normal, not something to block.
    if(showUndo) return `<button type="button" class="plant-water-btn sm undo" aria-label="Undo watering"
          onclick="event.stopPropagation();App.plantUndoWater('${esc(p.id)}')">↩</button>`;
    // a still-unplanted vegetable isn't overdue for water, it just hasn't started yet - tapping
    // the shovel plants it (advances to Seed Sown) rather than logging a watering it can't have
    // had yet, since there's nothing in the ground to water
    if(p.stage===PLANT_STAGE_DEFAULT) return `<button type="button" class="plant-water-btn sm" aria-label="Mark as planted"
          onclick="event.stopPropagation();App.plantSetStage('${esc(p.id)}','${PLANT_STAGES[1].k}')">🪏</button>`;
    const enough = !plantOverdue(p);
    return `<button type="button" class="plant-water-btn sm${enough?' checkmark':''}" aria-label="${enough?'Watered enough for now - log another watering':'Log watering'}"
          onclick="event.stopPropagation();App.plantWater('${esc(p.id)}')">${enough?'✅':'💧'}</button>`;
  }
  // same reasoning as the sm shovel above, just the full-page button shape - "Watered" makes no
  // sense yet for something that isn't in the ground, so this replaces it with the same planting
  // action instead of disabling a button whose whole label is wrong for this stage
  if(p.stage===PLANT_STAGE_DEFAULT){
    return `<button type="button" class="plant-water-action-btn plant-mark-planted"
        onclick="event.stopPropagation();App.plantSetStage('${esc(p.id)}','${PLANT_STAGES[1].k}')">Mark as Planted<span class="plant-water-btn-emoji" aria-hidden="true">🪏</span></button>`;
  }
  // not just "watered today" - a plant on a 2-day schedule watered yesterday isn't due yet
  // either, and the button needs to look that way (faded, not just non-bold) rather than
  // reading as a normal tappable action for a watering it doesn't need
  const notDue = !showUndo && !plantOverdue(p);
  const state = showUndo ? ' undo' : notDue ? ' done' : ' overdue';
  return showUndo
    ? `<button type="button" class="plant-water-action-btn${state}"
        onclick="event.stopPropagation();App.plantUndoWater('${esc(p.id)}')">Undo Watering<span class="plant-water-btn-emoji" aria-hidden="true">↩</span></button>`
    : `<button type="button" class="plant-water-action-btn${state}"${notDue?' disabled':''}
        onclick="event.stopPropagation();App.plantWater('${esc(p.id)}')">Watered<span class="plant-water-btn-emoji" aria-hidden="true">💧</span></button>`;
}
/* the card, top to bottom: icon, name, the health badge (the most prominent thing here after

/* everything a vegetable's had happen to it, newest first - watering and stage changes merged
   into one chronological run rather than two separate lists, since "what happened when" is the
   point of a timeline, not which kind of thing it was. Each entry can be deleted on its own
   (see plantDeleteLogEntryImpl) for a mis-tap on either the water button or a stage dot. */
/* the delete action lives behind a tap-to-reveal overflow menu (a plain <details> - the app's own
   disclosure-widget idiom, see .grow-phase) rather than a permanently-visible icon, so the row
   reads as activity content first and a manageable log second, per the CRM redesign brief. A
   shared `name` groups every row's menu on the page into one exclusive accordion, so opening one
   closes any other that was left open. */
function plantTimelineHTML(p){
  const waterings = (Array.isArray(p.waterings)?p.waterings:[]).map(ts=>({type:'water', ts}));
  const stages = (Array.isArray(p.stageChanges)?p.stageChanges:[]).map(e=>({type:'stage', ts:e.ts, stage:e.stage}));
  const events = [...waterings, ...stages].sort((a,b)=>new Date(b.ts)-new Date(a.ts));
  if(!events.length) return `<p class="small muted">Nothing logged yet.</p>`;
  return `<div class="plant-timeline">${events.map(ev=>{
    const stageInfo = PLANT_STAGES[plantStageIdx(ev.stage)]||{};
    const label = ev.type==='water' ? 'Watered' : 'Set to '+esc(stageInfo.label||ev.stage);
    const emoji = ev.type==='water' ? '💧' : (stageInfo.emoji||'🌱');
    return `
      <div class="plant-timeline-item">
        <span class="plant-timeline-dot" aria-hidden="true">${emoji}</span>
        <div class="plant-timeline-body">
          <span class="plant-timeline-text"><strong>${label}</strong><span>${esc(fmtDate(ev.ts.slice(0,10)))} &middot; ${esc(hhmm(ev.ts))}</span></span>
          <details class="plant-timeline-menu" name="plant-timeline-menu">
            <summary aria-label="More actions">${fa('ellipsis-vertical')}</summary>
            <button type="button" class="plant-timeline-delete"
              onclick="App.plantDeleteLogEntry('${esc(p.id)}','${ev.type}','${esc(ev.ts)}')">Delete</button>
          </details>
        </div>
      </div>`;
  }).join('')}</div>`;
}
function plantActivityTimelineHTML(p){
  return `
    ${plantSectionHeadingHTML('clock-rotate-left','Activity Timeline')}
    ${plantTimelineHTML(p)}`;
}
/* the card keeps this to a single icon+word chip (plantWaterStatusHTML) - full sentences live
   here instead, one labelled row per known growing condition, only for a vegetable this app
   actually has care data for (see PLANT_CARE_DATA). Nothing shown for a vegetable with none,
   rather than guessing at conditions nobody's supplied. */
/* setup decisions (spacing, pot size) are dropped entirely here, not just de-emphasised - by the
   time a plant has a detail page it's already in its pot, so those two numbers can't actually be
   acted on any more. Light/Water/Temperature stay since they affect daily care, plus Harvest
   Season off the growing guide where one exists. Lives inside the collapsed Plant Information
   section (see plantInfoSectionHTML) rather than as its own top-level section - reference
   material, not something worth a glance every visit. */
function plantInfoConditionRows(p){
  const care = plantCareDataFor(p); if(!care) return '';
  const guide = plantGuideFor(p);
  const munch = guide && guide.facts && guide.facts.munch;
  const rows = [
    care.sun && ['☀️','Light', care.sun],
    ['💧','Water', care.water],
    care.temp && ['🌡️','Temperature', care.temp],
    munch && ['🥦','Harvest Season', munch],
  ].filter(Boolean);
  if(!rows.length) return '';
  return `<div class="plant-info-rows">${rows.map(([icon,label,val]) => `
    <div class="plant-info-row"><span aria-hidden="true">${icon}</span><span class="plant-info-label">${esc(label)}</span><span class="plant-info-value">${esc(val)}</span></div>`).join('')}</div>`;
}
/* derived from the same care data rather than hand-written per vegetable - the water/sun/temp
   tips restate PLANT_CARE_DATA's own fields as an actual tip rather than a bare label, and the
   two generic ones (slugs, thinning) are genuinely true of pot-grown vegetables in general.
   Capped at 4 per the brief. */
function plantCareTips(care){
  if(!care) return [];
  const tips = [{icon:'💧', text:care.water}];
  if(care.sun==='Full Sun') tips.push({icon:'☀️', text:'Give it as much direct sun as you can'});
  else if(care.sun) tips.push({icon:'🌤', text:'Partial shade is fine - avoid direct heat'});
  if(care.temp==='Warm Spot') tips.push({icon:'🔥', text:'Keep it warm, especially while young'});
  else if(care.temp==='Cool Crop') tips.push({icon:'❄️', text:'Prefers cool conditions, not a hot spot'});
  tips.push({icon:'🐌', text:'Watch for slugs on young seedlings'});
  tips.push({icon:'✂️', text:'Thin out crowded seedlings for room'});
  return tips.slice(0,4);
}
/* one plain per-plant flip, no confirmation needed either way since ticking either of these
   wrong costs nothing and is just as easy to untick. Kept as simple persistent booleans (same as
   every other manual flag in this app) rather than resetting nightly - a proper daily-reset habit
   tracker is a bigger feature than this checklist is trying to be. The whole row is the tap
   target and the check itself is a filled square with a checkmark rather than a bare ☑/☐ glyph -
   the same prominent, packing-list-style row this app already uses for the trip Packing List
   (see packRowHTML), reused here since it's proven to read as clearly tappable at a glance. */
function plantChecklistRowHTML(p, key, label, on){
  return `
    <div class="plant-checklist-row${on?' done':''}" role="checkbox" aria-checked="${on}" tabindex="0"
      onclick="App.plantToggleChecklist('${esc(p.id)}','${key}')"
      onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();App.plantToggleChecklist('${esc(p.id)}','${key}')}">
      <span class="plant-checklist-check${on?' on':''}" aria-hidden="true">${on?fa('check'):''}</span>
      <span class="plant-checklist-label">${esc(label)}</span>
    </div>`;
}
/* the auto-tracked rows share the exact same big-checkbox visual as the manual ones above (so the
   whole checklist reads as one consistent list), just without the tap target - role="checkbox" is
   dropped and there's no click handler, since these reflect state the app already knows rather
   than something the grower sets. */
function plantChecklistAutoRowHTML(it){
  return `
    <div class="plant-checklist-row auto${it.on?' done':''}">
      <span class="plant-checklist-check${it.on?' on':''}" aria-hidden="true">${it.on?fa('check'):''}</span>
      <span class="plant-checklist-label">${esc(it.label)}</span>
    </div>`;
}
/* the most valuable section on the page, per the CRM redesign brief - Today's Tips folded in
   underneath rather than kept as its own separate section, since it's the same "what do I need to
   know for today" purpose, just advice instead of a checkbox. The checklist itself stays split so
   it's obvious at a glance which rows are this app's own read on things (auto-tracked, read-only)
   and which are the grower's own honest yes/no (manually tapped). */
function plantChecklistHTML(p){
  if(p.stage===PLANT_STAGE_DEFAULT) return '';
  const g = plantGerminationInfo(p);
  const auto = [
    {on: daysSinceTs(plantLastWateredTs(p))===0, label:'Watered recently'},
  ];
  if(g) auto.push({on:true, label:'Germination active'});
  const tips = plantCareTips(plantCareDataFor(p));
  return `
    ${plantSectionHeadingHTML('list-check',"Today's Checklist")}
    <div class="plant-checklist-group">
      <div class="plant-checklist-group-label">Needs Your Check</div>
      <div class="plant-checklist-rows">
        ${plantChecklistRowHTML(p, 'soil', 'Soil feels moist', !!p.soilMoistOk)}
        ${plantChecklistRowHTML(p, 'sun', 'Pot gets enough sun', !!p.locationOk)}
      </div>
    </div>
    <div class="plant-checklist-group">
      <div class="plant-checklist-group-label">Already Tracked</div>
      <div class="plant-checklist-rows">${auto.map(plantChecklistAutoRowHTML).join('')}</div>
    </div>
    ${tips.length ? `
      <div class="plant-checklist-group">
        <div class="plant-checklist-group-label">Tips</div>
        <ul class="plant-care-tips">${tips.map(t=>`<li><span aria-hidden="true">${t.icon}</span>${esc(t.text)}</li>`).join('')}</ul>
      </div>` : ''}`;
}

   easy to untick. */
function plantToggleChecklistImpl(id, key){
  const p = (DB.plants||[]).find(x=>x.id===id); if(!p) return;
  if(key==='soil') p.soilMoistOk = !p.soilMoistOk;
  else if(key==='sun') p.locationOk = !p.locationOk;

function plantDeleteLogEntryImpl(id, type, ts){
  const p = (DB.plants||[]).find(x=>x.id===id); if(!p) return;
  if(type==='water'){
    const idx = (p.waterings||[]).indexOf(ts);
    if(idx>-1) p.waterings.splice(idx,1);
  } else {
    p.stageChanges = Array.isArray(p.stageChanges) ? p.stageChanges : [];
    const idx = p.stageChanges.findIndex(e=>e.ts===ts);
    if(idx>-1) p.stageChanges.splice(idx,1);
    // the plant's actual current stage always tracks whichever entry is now the most recent,
    // so removing one - especially the latest - can't leave the two disagreeing about "now"
    const latest = [...p.stageChanges].sort((a,b)=>new Date(b.ts)-new Date(a.ts))[0];
    p.stage = latest ? latest.stage : PLANT_STAGE_DEFAULT;
  }
  savePlants();
  drawPlantsGrid();
  drawDashPlantsSlot();
  drawPlantDetail(id);
}
/* appends rather than overwrites - watering twice in one day (a hot spell, a top-up after
   forgetting the morning one) is a normal thing to want, not an edge case to guard against, so
   there's no "already watered today" check here blocking a second tap */
function plantWaterImpl(id){
  const p = (DB.plants||[]).find(x=>x.id===id); if(!p) return;
  p.waterings = Array.isArray(p.waterings) ? p.waterings : [];
  p.waterings.push(new Date().toISOString());
  savePlants();
  clearTimeout(PLANT_UNDO_TIMERS[id]);
  PLANT_UNDO_TIMERS[id] = setTimeout(()=>{
    delete PLANT_UNDO_TIMERS[id];
    drawPlantsGrid();
    drawDashPlantsSlot();
    drawPlantDetail(id);
  }, PLANT_UNDO_MS);
  drawPlantsGrid();
  drawDashPlantsSlot();
  drawPlantDetail(id);
  toast('Watered');
}
function plantUndoWaterImpl(id){
  const p = (DB.plants||[]).find(x=>x.id===id); if(!p) return;
  if(Array.isArray(p.waterings) && p.waterings.length) p.waterings.pop();
  clearTimeout(PLANT_UNDO_TIMERS[id]);
  delete PLANT_UNDO_TIMERS[id];
  savePlants();
  drawPlantsGrid();
  drawDashPlantsSlot();
  drawPlantDetail(id);
}
/* p.stageChanges - {ts,stage} entries, appended whenever the stage actually changes (here and

function savePlantImpl(id){
  const name = ($('#plant-name').value||'').trim();
  if(!name) return markErr('#plant-name','Enter a name');
  const existing = id ? (DB.plants||[]).find(x=>x.id===id) : null;
  // migrates a plant last watered before the switch to a timestamped log (a bare p.lastWatered
  // date, no p.waterings yet) into the log here, so its history survives being edited
  const waterings = (existing && Array.isArray(existing.waterings) && existing.waterings.length) ? existing.waterings
    : (existing && existing.lastWatered) ? [existing.lastWatered+'T12:00:00'] : [];
  const stage = $('#plant-stage').value;
  const stageChanges = (existing && Array.isArray(existing.stageChanges)) ? existing.stageChanges.slice() : [];

  // catches a stage set from the edit form as well - and gives a brand-new plant its first
  // entry, marking when it was actually added
  if(!existing || existing.stage !== stage) stageChanges.push({ts:new Date().toISOString(), stage});
  const plant = {
    id: (existing&&existing.id) || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random()),
    name,
    emoji: PLANT_FORM_EMOJI || guessPlantEmoji(name) || '🌱',
    customIcon: PLANT_FORM_CUSTOM_ICON || null,
    stage,
    stageChanges,
    plantedDate: $('#plant-planted').value || null,
    wateringFrequencyDays: parseInt($('#plant-freq').value,10) || 3,
    waterings,

/* who's coming, trimmed so a big group can't push a card out of shape. limit defaults to 3
   (tight spots like the Edit Trip tile's one-line summary); the trip card itself passes a
   higher one, since it has the room to actually list a bigger group. */
function peopleSummary(t, empty, limit){
  limit = limit || 3;
  const people = t.participants||[];
  if(!people.length) return empty || '';
  if(people.length <= limit) return people.join(', ');
  return `${people.slice(0,limit-1).join(', ')} +${people.length-(limit-1)} more`;
}
function tripCardHTML(t){
  const people = peopleSummary(t, '', 8);
  return `
    <div class="trip-card ${isArchived(t)?'archived':''}" role="button" tabindex="0"
         onclick="location.hash='#/trip/${t.id}'"
         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();location.hash='#/trip/${t.id}'}">
      ${tripFlags(t)?`<div class="trip-flags">${tripFlags(t)}</div>`:''}
      <h3>${esc(t.name)}</h3>
      ${t.destination?`<div class="muted">${esc(t.destination)}</div>`:''}
      <div class="small" style="margin-top:8px">${esc(tripWhenLine(t))}</div>
      ${people?`<div class="small muted trip-people">${fa('user')}<span class="trip-people-names">${esc(people)}</span></div>`:''}
      <div style="margin-top:12px">${statusPill(t)}</div>
    </div>`;
}
function homeGridHTML(trips, loading){
  if(!trips.length){
    // while trips are still being fetched from the cloud, "No trips yet" would be
    // misleading, it hasn't actually checked yet, so say so instead
    return loading ? `<div class="empty" style="margin-top:24px">Loading trips…</div>` : `<div class="empty" style="margin-top:24px">
      No trips yet.<br><br>
      <button class="btn primary" onclick="App.newTrip()">Create Your First Trip</button>
    </div>`;
  }
  /* Everything not yet archived sits in one chronological line, soonest date first - that
     puts trips still to come first, in the order they'll happen, and a trip that just ended
     right at the top of what's left (its date is the most recent one in the past), so it
     doesn't drop out of sight the moment it's over. Only once a trip's been over for two
     weeks (isArchived) does it fall out of this line entirely, to the very bottom, faded,
     oldest-ended first. A trip with only a rough idea of when sorts by that, so "Summer 2027"
     sits where it belongs rather than at one end. */
  const soonestFirst = (a,b) => (tripSortDate(a)||'9999').localeCompare(tripSortDate(b)||'9999');
  const latestFirst  = (a,b) => (tripSortDate(b)||'').localeCompare(tripSortDate(a)||'');
  const ordered = trips.filter(t=>!isArchived(t)).sort(soonestFirst)
    .concat(trips.filter(isArchived).sort(latestFirst));
  return `<div class="trip-grid">${ordered.map(tripCardHTML).join('')}</div>`;
}
/* everyone who's entered the PIN can see every trip, not just the ones this particular
   browser happened to create or open before, so the full list comes from Firebase itself
   rather than this browser's local index. Falls back to the local list when cloud sync
   isn't configured, or if the fetch fails for any reason. */
let _listErrorToasted = false;
function fetchAllTrips(cb){
  if(!fbRoot){ cb(DB.trips); return; }
  fbRoot.ref('trips').once('value')
    .then(snap => {
      const val = snap.val() || {};
      const merged = Object.values(val).map(r => {
        normalizeTrip(r);
        const local = getTrip(r.id);
        return local ? mergeRemote(local, r) : r;
      });
      cb(merged);
    })
    .catch(err => {
      console.error("My Trips, couldn't list trips from the cloud:", err);
      if(!_listErrorToasted && /permission[_-]?denied/i.test((err&&(err.code||err.message||err)||'').toString())){
        _listErrorToasted = true;
        noteModal("Can't See Everyone's Trips", 'The database rules only allow reading one trip at a time. Open the Firebase console, Realtime Database, Rules, and add a top-level read rule for trips alongside the existing one.');
      }
      cb(DB.trips);
    });
}

/* ---- backup / restore ----
   No longer surfaced anywhere: trips sync to the cloud, so the buttons were clutter. Kept
   reachable from the console (App.exportTrips() / App.importTrips(input)) as a manual escape
   hatch, since losing every trip with no way to pull a copy out would be a bad day. */
App.exportTrips = () => {
  const blob = new Blob([JSON.stringify({app:'cals-trippin', schema:SCHEMA, exportedAt:Date.now(), trips:DB.trips}, null, 0)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `cals-trippin-backup-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast(`Backed up ${DB.trips.length} trip${DB.trips.length===1?'':'s'}`);
};
App.importTrips = input => {
  const file = input.files[0]; input.value=''; if(!file) return;
  const fr = new FileReader();
  fr.onload = e => {
    let data;
    try{ data = JSON.parse(e.target.result); }catch(err){ noteModal('Bad Backup File', "That file isn't a valid backup."); return; }
    const trips = Array.isArray(data) ? data : (data && data.trips);
    if(!Array.isArray(trips) || !trips.length){ noteModal('Nothing To Restore', 'No trips were found in that file.'); return; }
    let added=0, updated=0;
    trips.forEach(t=>{
      if(!t || !t.id || !t.name) return;
      normalizeTrip(t);
      const i = DB.trips.findIndex(x=>x.id===t.id);
      if(i<0){ DB.trips.unshift(t); added++; }
      else { DB.trips[i] = t; updated++; }        // incoming copy wins on a straight restore
    });
    saveLocal();
    if(fbRoot) trips.forEach(t=>{ if(t && t.id) pushTrip(t); });   // seed the cloud too, if on
    renderHome();
    toast(`Restored ${added} new · ${updated} updated`);
  };
  fr.readAsText(file);
};

App.copyText = (enc, btn) => {
  const text = decodeURIComponent(enc);

    if(!btn) return;
    const was = btn.innerHTML;
    btn.innerHTML = `<span class="sec-emoji" aria-hidden="true">✅</span>`;
    setTimeout(()=>{ btn.innerHTML = was; }, 1200);

const TAB_EMOJI = {

function secEmoji(e){ return `<span class="sec-emoji" aria-hidden="true">${e}</span>`; }
/* Inside an iOS home-screen web app a target=_blank link opens Apple's cut-down in-app
   browser: no saved Google login, no password autofill, and no handoff to the Google Flights
   app. x-safari-https: hands the URL to Safari proper instead. It's an undocumented Apple
   scheme, so if it does nothing we're still here a moment later and fall back to the ordinary
   new tab. Every other platform is left completely alone. */
function iosStandalone(){
  return /iP(hone|ad|od)/.test(navigator.userAgent) && window.navigator.standalone === true;
}
App.openExternal = (ev, url) => {
  if(!iosStandalone()) return true;          // let the plain link do its job everywhere else
  ev.preventDefault();
  /* window.open() in a home-screen app IS the in-app browser, so this fallback only exists for
     the case where x-safari- silently did nothing.

     Cancelling it on the way out isn't enough on its own. iOS SUSPENDS timers while the app is
     backgrounded rather than running them, so a fallback still pending when Safari took over
     would fire on the way back IN - which is why an article or a map you'd already read in
     Safari was sitting there in the in-app browser when you returned, waiting to be dismissed.

     So the timer checks, at the moment it fires, whether it still makes sense: the app must
     have stayed visible throughout, and no more wall-clock time may have passed than the delay
     itself. A suspended-then-resumed timer fails both. */
  const DELAY = 900;
  const startedAt = Date.now();
  let leftTheApp = false;
  const events = ['visibilitychange','pagehide','blur'];
  const noteLeaving = () => { leftTheApp = true; };
  const stopListening = () => events.forEach(e => window.removeEventListener(e, noteLeaving));
  events.forEach(e => window.addEventListener(e, noteLeaving));
  setTimeout(() => {
    stopListening();
    if(leftTheApp || document.hidden || Date.now() - startedAt > DELAY + 400) return;
    window.open(url, '_blank', 'noopener');
  }, DELAY);
  location.href = 'x-safari-' + url;
  return false;
};

   it when it does nothing itself (the non-iOS-standalone case) - for a click target that isn't
   an anchor (the flight card's head), that fallback has to be done by hand instead */

App.saveTrip = () => {
  const t = getTrip(CUR_TRIP_ID); if(!t) return;
  const name = $('#et-name').value.trim();
  if(!name) return markErr('#et-name','Give the trip a name');
  const w = readWhenFields('et');
  const wasRough = hasRoughWhen(t), oldStart = t.startDate;
  t.name = name; t.startDate = w.startDate; t.endDate = w.endDate;
  /* switching to exact dates has to clear the rough idea, or hasRoughWhen would keep
     answering yes and the trip would show both */
  if(w.when) t.when = w.when; else delete t.when;
  /* Pinning the dates down shouldn't throw away the plan. A day number becomes the date it
     lands on, and going the other way a date becomes the day of the trip it fell on, so
     "Day 3: beach" survives the trip becoming real and vice versa. */
  if(wasRough && !w.when && t.startDate){
    (t.itinerary||[]).forEach(s=>{ if(s.day){ s.date = isoAddDays(t.startDate, s.day-1); s.day = 0; } });
  } else if(!wasRough && w.when && oldStart){
    (t.itinerary||[]).forEach(s=>{
      if(!s.date) return;
      const n = Math.round((new Date(s.date+'T00:00:00') - new Date(oldStart+'T00:00:00'))/DAY_MS) + 1;
      if(n > 0){ s.day = n; s.date = ''; }
    });
  }
  logEdit('Trip info','updated the trip details');
  save(); closeModal(); rerender();
};

/* ---- bottom bar: the app's main navigation, always within thumb reach ----
   Trip-specific slots stay in place but go inert on the home and Places pages, so the
   green New Trip button never shifts sideways as you move around. */
function renderTabbar(){
  const bar = $('#tabbar'); if(!bar) return;
  if(!pinOk()){ bar.innerHTML = ''; bar.classList.remove('on'); return; }
  bar.classList.add('on');
  /* Home is the front door now; Places still owns its own list screens and Your Trips
     (reached from the Going card) - Trips no longer has a tab of its own */
  const onHomeDash = location.hash==='#/home';
  const onPlaces = location.hash.startsWith('#/places') || location.hash==='#/trips';
  const onGames  = location.hash.startsWith('#/games');
  const onGigs   = location.hash.startsWith('#/gigs');
  const onFilms  = location.hash.startsWith('#/films');
  const onTheatre = location.hash.startsWith('#/theatre');
  const onPlants = location.hash.startsWith('#/plants');
  /* with the menu open the bar rides above it; anything tapped from there dismisses the menu
     on the way through (the menu itself now opens from a button in the trip header, not here) */
  const menuOpen = menuIsOpen();
  bar.classList.toggle('over-menu', menuOpen);
  const go = fn => menuOpen ? 'App.closeMenu();'+fn : fn;
  /* icon-only: a 6th item (Films) made the text labels too cramped to read, and the label was
     always redundant with aria-label anyway - screen readers still get the name, sighted users
     get more breathing room per icon */
  const item = (label, emoji, fn, active, off) => `
    <button class="tabbar-item${active?' active':''}" ${off?'disabled aria-disabled="true"':''}
            ${off?'':`onclick="${fn}"`} aria-label="${esc(label)}">
      <span class="tabbar-emoji" aria-hidden="true">${emoji}</span>
    </button>`;
  bar.innerHTML =
      item('Home','🏠',go("App.goDashboard()"), onHomeDash && !menuOpen, false)
    + item('Travel','🌎',go("App.goPlaces()"), onPlaces && !menuOpen, false)
    + item('Films','🎬',go("App.goFilms()"), onFilms && !menuOpen, false)
    + item('Theatre','🎭',go("App.goTheatre()"), onTheatre && !menuOpen, false)
    + item('Music','🎤',go("App.goGigs()"), onGigs && !menuOpen, false)
    + item('Games','🎮',go("App.goGames()"), onGames && !menuOpen, false)
    + item('Plants','🥕',go("App.goPlants()"), onPlants && !menuOpen, false);
  /* anything that has to sit on top of the bar (the Places search, the hub's height) needs
     its real height, inset and all, not a number that was right on one phone */
  document.documentElement.style.setProperty('--bar-h', bar.offsetHeight+'px');
}
function menuIsOpen(){ return !!$('#menu-root').firstChild; }

/* ================= TAB: home (dashboard) ================= */
function tabHome(t, ro){
  const n = t.notes||{contacts:[],general:''};
  const nTravel = (t.flights||[]).length + (t.ferries||[]).length + (t.carHire||[]).length;
  const nDocs = (t.documents||[]).length, nLinks = (t.docLinks||[]).length,
        nRec = (t.receipts||[]).length, nStops = (t.itinerary||[]).filter(s=>s.kind!=='travel').length,
        nPins = (t.moodBoard||[]).length,
        nContacts = (n.contacts||[]).length;
  const albumUrl = t.photoAlbum && t.photoAlbum.url || '';
  const album = albumUrl ? detectAlbumService(albumUrl) : '';
  const docParts = [];
  if(nLinks) docParts.push(nLinks+(nLinks===1?' Link':' Links'));
  if(nDocs) docParts.push(nDocs+(nDocs===1?' File':' Files'));
  const travParts = [];
  if((t.flights||[]).length) travParts.push((t.flights.length)+(t.flights.length===1?' Flight':' Flights'));
  if((t.ferries||[]).length) travParts.push((t.ferries.length)+(t.ferries.length===1?' Ferry':' Ferries'));
  if((t.carHire||[]).length) travParts.push('Car Hire');
  // each row doubles as a counter: what's booked, added, pinned and owed
  const net = nRec ? computeBalances(t) : null;
  const allSettled = net && Object.values(net).every(v=>Math.abs(v)<0.005);
  const moneySum = !nRec ? 'No receipts yet' : allSettled ? 'All settled' : 'Receipts added';
  const accoms = t.accommodations||[];
  const staySum = !accoms.length ? 'Not Added Yet' :
    accoms.length===1 ? (accoms[0].name||'1 Stay Added') :
    accoms.length+' Stays Added';
  const nNotes = (n.items||[]).length;
  /* travel legs live in the same itinerary array as the stops but aren't activities, so they
     don't inflate the count; a plan that's only travel still isn't "nothing planned" though */
  const nLegs = (t.itinerary||[]).length - nStops;
  const planSum = nStops ? nStops+(nStops===1?' Activity Planned':' Activities Planned')
    : nLegs ? nLegs+(nLegs===1?' Travel Leg Planned':' Travel Legs Planned')
    : 'Nothing Planned Yet';
  const tasks = t.tasks||[];
  const openTasks = tasks.filter(x=>!x.done).length;
  /* everything that shows in the derived Tasks list, not just what's typed in by hand: a Not
     Booked Yet flight/ferry/car hire/accommodation/travel leg, a stretch of nights with
     nowhere booked, and a day with nothing on it yet - all outstanding the same way a
     hand-typed task is */
  const undecidedCount = (t.flights||[]).filter(f=>f.undecided).length
    + (t.ferries||[]).filter(f=>f.undecided).length
    + (t.carHire||[]).filter(c=>c.undecided).length
    + (t.accommodations||[]).filter(a=>a.undecided).length
    + (t.itinerary||[]).filter(s=>s.kind==='travel' && s.notBooked).length;
  const gaps = stayGaps(t);
  const {groups:planGroups, keys:planKeys} = planDayGroups(t);
  const gapFirstNights = new Set(gaps.map(g=>g.firstNight));
  const emptyDayCount = planKeys.filter(k => planGroups[k].length===0 && !gapFirstNights.has(k)).length;
  const outstanding = openTasks + undecidedCount + gaps.length + emptyDayCount;
  const allBooked = tasks.length>0 && !outstanding;
  const taskSum = outstanding ? outstanding+(outstanding===1?' Thing to Book':' Things to Book')
    : allBooked ? 'All Booked' : 'Nothing Added Yet';
  const tiles = [
    ['plan','Itinerary', planSum, !(nStops || nLegs)],
    ['tasks','Tasks', taskSum, !allBooked],
    ['mood','Ideas', nPins ? nPins+' Pinned' : 'Nothing Pinned Yet', !nPins],
    ['travel','Travel', travParts.join(', ') || 'Nothing Booked Yet', !travParts.length],
    ['stay','Accommodation', staySum, !accoms.length],
    ['pack','Packing', packSummaryLine(t), !(t.packing||[]).length || !!packStats(t).left],
    ['polls','Polls', pollSummaryLine(t), !(t.polls||[]).length],
    ['money','Money', moneySum, !nRec],
    ['photos','Photos', album ? album+' Linked' : 'No Shared Album Yet', !album],
    ['contacts','Contacts', nContacts ? nContacts+(nContacts===1?' Contact Logged':' Contacts Logged') : 'None Added Yet', !nContacts],
    ['docs','Docs & Links', docParts.join(', ') || 'Nothing Saved Yet', !docParts.length],
    ['notes','Notes', nNotes ? nNotes+(nNotes===1?' Note':' Notes') : 'No Notes Yet', !nNotes]
  ];
  // every tile, including Photos, opens its own tab first; the tab itself links out to the album
  const tile = ([k,label,sum,empty]) => `
    <div class="dash-tile" role="button" tabindex="0" aria-label="${esc(label)}"
         onclick="App.tab('${k}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();App.tab('${k}')}">
      <span class="dash-icon">${tileIcon(k)}</span>
      <span class="dash-text"><span class="dash-label">${esc(label)}</span><span class="dash-sum${empty?' unfilled':''}">${esc(sum)}</span></span>
    </div>`;
  return `<div class="dash-grid">${tiles.map(tile).join('')}</div>`;
}
/* ================= TAB: log (what changed) ================= */
/* which tab a log entry's section belongs to, so each row can jump straight there,
   'Trip info'/'People' edits live on Overview itself (where this list already sits),

const LOG_SECTION_TAB = {

/* ================= TAB: packing (shared checklist + calendar reminder) ================= */
/* One shared list, one shared tick per item - there's no "who's still got things to pack"
   split since it's just the one person using this. */
const PACK_STARTERS = [
  'Passport','Travel insurance','Phone charger','Adapter plug','Toothbrush','Sun cream',
  'Medication','Cards and cash','Headphones','Reusable water bottle'
];
function packStats(t){
  const items = t.packing||[];
  const done = items.filter(it=>it.done).length;
  return { total: items.length, done, left: items.length-done };
}
function packSummaryLine(t){
  const s = packStats(t);
  if(!s.total) return 'Nothing Listed Yet';
  if(!s.left) return `All Packed (${s.done} of ${s.total})`;
  return `${s.left} Still To Pack`;
}
/* how many days until the trip starts, or null once it's begun, used for the nudge */
function packDaysToGo(t){
  if(!t.startDate) return null;
  const day = 86400000, today = new Date(); today.setHours(0,0,0,0);
  const s = new Date(t.startDate+'T00:00:00');
  const n = Math.round((s-today)/day);
  return n >= 0 ? n : null;
}
function packNudgeHTML(t){
  const s = packStats(t);
  const n = packDaysToGo(t);
  if(n===null || !s.left) return '';
  if(n > 14) return '';   // no point nagging months out
  const when = n===0 ? 'You leave today' : n===1 ? 'You leave tomorrow' : `${n} days to go`;
  return `<div class="pack-nudge">${ICONS.bell}<span><strong>${esc(when)}</strong> and you've still got ${s.left} thing${s.left===1?'':'s'} to pack.</span></div>`;
}
function packRowHTML(t, it, i, ro){
  const ticked = !!it.done;
  const canTick = !ro;
  return `
    <div class="pack-row${ticked?' done':''}">
      <span class="pack-check${ticked?' on':''}" ${canTick?`role="checkbox" aria-checked="${ticked}" tabindex="0"
        onclick="App.togglePack('${it.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();App.togglePack('${it.id}')}"`:''}
        aria-label="${esc(it.text)}">${ticked?fa('check'):''}</span>
      <span class="pack-text">
        <span class="pack-label">${esc(it.text)}</span>
      </span>
      ${!ro?`<button class="iconbtn del" title="Remove" aria-label="Remove ${esc(it.text)}" onclick="App.delPack('${it.id}')">${ICONS.trash}</button>`:''}
    </div>`;
}
function tabPack(t, ro){
  const items = t.packing||[];
  const s = packStats(t);
  const addRow = ro ? '' : `
    <div class="pack-add">
      <input type="text" id="pk-new" placeholder="Add an item…" onkeydown="if(event.key==='Enter'){event.preventDefault();App.addPack()}">
      <button class="btn" type="button" onclick="App.addPack()">+ Add</button>
    </div>`;
  if(!items.length){

      <div class="empty">Nothing on the packing list yet.${!ro?`<br><br>
        <button class="btn primary" onclick="App.addPackStarters()">Add the usual essentials</button>`:''}</div>`;
  }
  const todo = items.filter(it=>!it.done);
  const done = items.filter(it=>it.done);
  return `
    ${packNudgeHTML(t)}
    ${addRow}
    <div class="pack-progress">
      <div class="pack-progress-bar" style="width:${s.total?Math.round(s.done/s.total*100):0}%"></div>
      <span>${s.done} of ${s.total} packed</span>
    </div>
    ${todo.map((it,i)=>packRowHTML(t,it,i,ro)).join('')}
    ${done.length?`<h3 class="pack-heading">Packed</h3>${done.map((it,i)=>packRowHTML(t,it,i,ro)).join('')}`:''}`;
}
App.addPack = () => {
  const t = getTrip(CUR_TRIP_ID); if(!t) return;
  const el = $('#pk-new'); if(!el) return;
  const text = (el.value||'').trim();
  if(!text) return markErr('#pk-new','Type something to pack');
  t.packing = t.packing||[];
  t.packing.push({id:uid(), text, done:false});

App.addPackStarters = () => {
  const t = getTrip(CUR_TRIP_ID); if(!t) return;
  t.packing = t.packing||[];
  const have = new Set(t.packing.map(it=>it.text.toLowerCase()));
  PACK_STARTERS.forEach(text=>{ if(!have.has(text.toLowerCase())) t.packing.push({id:uid(), text, done:false}); });

App.togglePack = itemId => {
  const t = getTrip(CUR_TRIP_ID); if(!t) return;

App.delPack = itemId => {
  const t = getTrip(CUR_TRIP_ID); if(!t) return;
  const tripId = t.id;
  const i = (t.packing||[]).findIndex(x=>x.id===itemId); if(i<0) return;

  });
};
function packUnpackedFor(t){
  return (t.packing||[]).filter(it=>!it.done);
}

/* ================= TAB: tasks (placeholders for things still to book) ================= */
/* Freeform, unlike the accommodation/flight gaps: those are worked out from dates you've
   already committed to, this is for something you know you need before you've worked out
   the details (a hotel by the airport for the night before an early flight, say). Linking
   one to a day folds it into that day's Itinerary too, in the same red, until it's ticked

function taskWhenLabel(t, task){
  const day = hasRoughWhen(t) ? (task.day ? 'Day '+task.day : '') : (task.date ? fmtDate(task.date) : '');
  const time = task.time || (task.period && PLAN_PERIODS[task.period] && PLAN_PERIODS[task.period][0]) || '';
  return [day, time].filter(Boolean).join(' · ');
}
/* a task nobody has put a day against isn't on the Itinerary yet, so it's the one still

const taskUnscheduled = (t, task) => !task.done && !(hasRoughWhen(t) ? task.day : task.date);

/* everything still outstanding, read straight out of where it actually lives rather than a

   nothing that needs deleting separately). */
function undecidedItemsHTML(t, ro){
  const rows = [];
  const rough = hasRoughWhen(t);
  (t.flights||[]).forEach((f,i)=>{ if(f.undecided) rows.push({icon:secEmoji('✈️'), label:'Flight',
    inner:flightStripHTML(f,i,''), editFn:`App.flightForm(${i})`, sortKey: rough?'':(f.date||'')}); });
  (t.ferries||[]).forEach((f,i)=>{ if(f.undecided) rows.push({icon:secEmoji('⛴️'), label:'Ferry',
    inner:ferryStripHTML(f,i,''), editFn:`App.ferryForm(${i})`, sortKey: rough?'':(f.date||'')}); });
  (t.carHire||[]).forEach((c,i)=>{ if(c.undecided) rows.push({icon:secEmoji('🚗'), label:'Car Hire',
    inner:carStripHTML(c,i,''), editFn:`App.carForm(${i})`, sortKey: rough?'':(c.pickupDate||c.dropoffDate||'')}); });
  (t.accommodations||[]).forEach((a,i)=>{ if(a.undecided) rows.push({icon:secEmoji('🏠'), label:'Accommodation',
    inner:accomCardHTML(a,{}), editFn:`App.accomForm(${i})`, sortKey: rough?'':(a.checkin||a.checkout||'')}); });
  (t.itinerary||[]).forEach((s,i)=>{ if(s.kind==='travel' && s.notBooked){
    const mode = TRAVEL_MODES[s.mode] || TRAVEL_MODES.undecided;
    const place = s.from && s.to ? `${esc(s.from)} → ${esc(s.to)}` : s.to ? `To ${esc(s.to)}` : s.from ? `From ${esc(s.from)}` : mode.label;
    const k = rough ? (s.day ? 'd'+s.day : '') : (s.date||'');
    const when = k ? planDayLabel(t, k, rough, true) : '';
    rows.push({icon:secEmoji(mode.emoji), label:'Not Booked Yet',
      inner:`<div class="card card-undecided"><h3 style="margin:0;font-size:1rem">${place}</h3>${when?`<p class="small muted" style="margin-top:4px">${esc(when)}</p>`:''}</div>`,
      editFn:`App.travelLegForm(${i})`, sortKey:k});
  }});
  /* an empty itinerary day counts toward the dashboard's "things to book" tile (tabHome uses
     the same planDayGroups + stayGaps math), so it needs a card here too or the tile's number
     and this list disagree */
  const {groups:dGroups, keys:dKeys} = planDayGroups(t);
  const gapFirstNights = new Set(stayGaps(t).map(g=>g.firstNight));
  dKeys.forEach(k=>{
    if(dGroups[k].length===0 && !gapFirstNights.has(k)){
      // date sits under the title as its own line, same as every other card here, rather than
      // folded into one combined "Day N · date" title
      const {title, sub} = planDayLabelSplit(t, k, rough);
      rows.push({icon:secEmoji('❌'), label:'Nothing Planned',
        inner:`<div class="card card-undecided"><h3 style="margin:0;font-size:1rem">${esc(title)}</h3>${sub?`<p class="small muted" style="margin-top:4px">${esc(sub)}</p>`:''}</div>`,
        editFn:`App.planGapForm('${k}', ${rough})`, sortKey:k});
    }
  });
  /* a stretch of nights with nowhere booked gets the same tag-above-card treatment as every
     other row here, instead of sitting on its own with no label - tapping it opens the same
     Add Accommodation form the gap card's own button does, so nothing's lost by dropping it */
  stayGaps(t).forEach(g => {
    const n = g.nights;
    const when = n===1 ? fmtDate(g.firstNight) : fmtRange(g.firstNight, g.lastNight);
    rows.push({icon:secEmoji('🛏️'), label:'Not Booked Yet',
      inner:`<div class="card card-undecided"><h3 style="margin:0;font-size:1rem">${n} Night${n===1?'':'s'}</h3><p class="small muted" style="margin-top:4px">${esc(when)}</p></div>`,
      editFn:`App.accomGapForm('${g.firstNight}','${g.checkout}')`, sortKey:g.firstNight});
  });
  /* the whole list reads in day order - a flight/car/accommodation still marked entirely TBC
     (no date at all yet) has nothing to sort by, so it sinks to the end rather than to some
     arbitrary spot by category */
  rows.sort(dayKeyCompare(rough));
  return rows.map(r => ({sortKey:r.sortKey, html:`
    <div class="plan-auto${!ro?' plan-click':''}" ${!ro?`role="button" tabindex="0" onclick="${r.editFn}"
         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${r.editFn}}"`:''}>
      <div class="plan-auto-tag">${r.icon}<strong>${r.label}</strong></div>
      ${r.inner}
    </div>`}));
}
