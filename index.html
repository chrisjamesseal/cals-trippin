  const removed = t.receipts[i];
  confirmModal('Remove This Receipt?', `"${removed.title}" (${money(receiptTotal(removed))}) will be removed.`, 'Remove', ()=>{
    t.receipts.splice(i,1); logEdit('Money','removed receipt '+(removed.title||'')); save(); rerender();
    toast('Receipt removed', ()=>{
      const t2 = getTrip(tripId); if(!t2) return;
      t2.receipts = t2.receipts||[];
      t2.receipts.splice(Math.min(i,t2.receipts.length),0,removed);
      logEdit('Money','restored receipt '+(removed.title||'')); save(); rerender();
    });
  });
};

/* ================= TAB: photos ================= */
function detectAlbumService(url){
  if(/photocircle|circle38/i.test(url)) return 'PhotoCircle';
  if(/icloud\.com/i.test(url)) return 'Apple Shared Album';
  if(/photos\.(app\.goo\.gl|google\.com)|goo\.gl/i.test(url)) return 'Google Photos';
  return url ? 'Shared album' : '';
}
/* what everyone can actually do with this kind of album link */
function albumNote(service){
  if(service==='PhotoCircle') return 'Everyone with the link can view <strong>and add</strong> photos on iPhone, Android or the web.';
  if(service==='Google Photos') return 'Anyone with the link can view and add photos.';
  if(service==='Apple Shared Album') return 'iPhone users can add photos in the Photos app. Everyone, including Android, can view and download from the link but can\'t add.';
  return 'Anyone with the link can open it.';
}
function tabPhotos(t, ro){
  const a = t.photoAlbum || {url:''};
  const service = a.url ? detectAlbumService(a.url) : '';
  return `
    ${a.url ? `
      <div class="card">
        <h3 style="margin-bottom:8px">${esc(service)}</h3>
        <p class="muted small" style="margin-bottom:12px">${albumNote(service)}</p>
        <div class="btn-row">
          <a class="btn primary" href="${esc(a.url)}" target="_blank" rel="noopener">Open Album ${ICONS.ext}</a>
          ${!ro?`<button class="iconbtn edit" aria-label="Edit album link" title="Edit link" onclick="App.albumForm()">${ICONS.edit}</button>
          <button class="iconbtn del" aria-label="Remove album link" title="Remove link" onclick="App.removeAlbum()">${ICONS.trash}</button>`:''}
        </div>
      </div>` : `
      <div class="empty">No shared album linked yet.
        ${!ro?`<br><br><button class="btn primary" onclick="App.albumForm()">+ Add Album Link</button>`:''}
      </div>
      ${!ro?`
      <h2 style="margin-top:30px">Set One Up</h2>
      ${bannerHTML('📸 <strong>PhotoCircle</strong> works best. It\'s free, cross-platform, and <strong>everyone can add photos</strong> from iPhone, Android or the web.')}
      <details open>
        <summary> PhotoCircle (recommended)</summary>
        <div class="d-body"><ol class="steps">
          <li>Everyone installs <strong>PhotoCircle</strong> (App Store / Google Play), or uses the web app at photocircleapp.com.</li>
          <li>Create a <strong>circle</strong> named after the trip.</li>
          <li>Tap <strong>Share / Invite</strong> to get the <strong>invite link</strong> (or QR code).</li>
          <li>Paste that invite link here. Anyone who opens it joins the circle and can add photos from any device.</li>
        </ol></div>
      </details>
      <details>
        <summary> Already use Apple or Google Photos?</summary>
        <div class="d-body">
          <p class="small" style="margin-bottom:10px"><strong>Google Photos:</strong> open the album, tap <strong>Share</strong>, then <strong>Create link</strong>. Turn on <strong>Collaborate</strong> so everyone can add, then paste the link here. Works on iPhone and Android.</p>
          <p class="small"><strong>Apple Shared Album:</strong> in Photos, create a <strong>New Shared Album</strong>, turn on <strong>Public Website</strong> and paste the icloud.com link here. That link is view and download only. Invited iPhone users can add photos, but Android friends can't.</p>
        </div>
      </details>`:''}`}`;
}
App.removeAlbum = () => {
  const t = getTrip(CUR_TRIP_ID); if(!t) return;
  confirmModal('Remove the Album Link?', 'The link will be removed for everyone on this trip. The album itself is not affected.', 'Remove Link', ()=>{
    t.photoAlbum = {url:'', service:''};
    logEdit('Photos','removed the photo album link');
    save(); rerender();
  });
};
App.albumForm = () => {
  const t = getTrip(CUR_TRIP_ID);
  openModal(`
    <h2>Shared Album Link</h2>
    <p class="small" style="margin-bottom:12px">Paste your <strong>PhotoCircle</strong> invite link (recommended), or any Apple/Google album link.</p>
    <div class="field"><label class="label" for="al-url">Photo Album Link</label>
      <input id="al-url" type="url" value="${esc(t.photoAlbum.url||'')}" placeholder="https://photocircleapp.com/…"></div>
    <div class="modal-actions"><button class="btn primary" style="width:100%" onclick="App.saveAlbum()">Save</button></div>`);
};
App.saveAlbum = () => {
  const t = getTrip(CUR_TRIP_ID);
  let url = $('#al-url').value.trim();
  if(url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
  t.photoAlbum = {url, service:detectAlbumService(url)};
  logEdit('Photos', url?('linked '+(detectAlbumService(url)||'a photo album')):'removed the photo album link');
  save(); closeModal(); rerender();
};
/* ================= TAB: mood board ================= */
function fab(name){ return `<i class="icon fa-brands fa-${name}"></i>`; }
function detectVideoEmbed(url){
  if(!url) return null;
  if(/tiktok\.com\//i.test(url)) return {provider:'tiktok'};
  if(/instagram\.com\/(reel|reels|p)\//i.test(url)) return {provider:'instagram'};
  return null;
}
let VIDEO_THUMB = {}; // videoUrl -> {status:'loading'|'ok'|'error', thumb}
/* TikTok's oEmbed endpoint is public and CORS-open (no key needed) and returns a real
   thumbnail for the specific video. Instagram's oEmbed now requires an authenticated
   Facebook app token we don't have, so Instagram gets a branded placeholder instead of
   a real per-post thumbnail, both are just a clickable card that opens the real post. */
function loadVideoThumb(url){
  if(VIDEO_THUMB[url]) return;
  VIDEO_THUMB[url] = {status:'loading'};
  fetch('https://www.tiktok.com/oembed?url='+encodeURIComponent(url))
    .then(r=>r.json())
    .then(data=>{ VIDEO_THUMB[url] = {status:'ok', thumb:(data&&data.thumbnail_url)||null}; if(CUR_TAB==='mood') rerender(); })
    .catch(err=>{
      console.error('TikTok thumbnail fetch failed for', url, err);
      VIDEO_THUMB[url] = {status:'error'};
      if(CUR_TAB==='mood') rerender();
    });
}
function videoThumbHTML(embed, url){
  if(embed.provider==='tiktok'){
    loadVideoThumb(url);
    const entry = VIDEO_THUMB[url];
    const thumb = entry && entry.status==='ok' ? entry.thumb : null;
    return `<a class="video-thumb video-thumb-tiktok" href="${esc(url)}" target="_blank" rel="noopener" aria-label="Watch on TikTok"${thumb?` style="background-image:url('${esc(thumb)}')"`:''}>
      ${!thumb?`<span class="video-thumb-fallback">${fab('tiktok')}</span>`:''}
      <span class="video-thumb-play">${fa('play')}</span>
    </a>`;
  }
  return `<a class="video-thumb video-thumb-instagram" href="${esc(url)}" target="_blank" rel="noopener" aria-label="Watch on Instagram">
    <span class="video-thumb-fallback">${fab('instagram')}</span>
    <span class="video-thumb-play">${fa('play')}</span>
  </a>`;
}
function tabMood(t, ro){
  const cards = (t.moodBoard||[]).map((m,i)=>{
    const embed = detectVideoEmbed(m.videoUrl);
    const mapsHref = m.mapsUrl || m.url || '';
    const inItinerary = m.itineraryId && (t.itinerary||[]).some(s=>s.id===m.itineraryId);
    return `
    <div class="mood-card">
      ${embed
        ? videoThumbHTML(embed, m.videoUrl)
        : (m.dataUrl ? `<img src="${m.dataUrl}" alt="${esc(m.title||'Idea image')}">` : '')}
      ${m.title
        ? `<h3 class="mood-title" style="margin-bottom:4px">${m.emoji?`<span class="mood-emoji" aria-hidden="true">${esc(m.emoji)}</span>`:''}${esc(m.title)}</h3>`
        : (m.emoji?`<div class="mood-emoji solo" aria-hidden="true">${esc(m.emoji)}</div>`:'')}
      ${m.text?`<p class="small" style="margin-top:6px;white-space:pre-wrap">${esc(m.text)}</p>`:''}
      <div class="mood-actions">
        ${m.title && !ro?(inItinerary
          ?`<button class="btn sm" style="width:100%" onclick="App.removeIdeaFromItinerary(${i})">Remove from Itinerary</button>`
          :`<button class="btn sm" style="width:100%" onclick="App.planFromIdea(${i})">+ Add to Itinerary</button>`):''}
        ${mapsHref?`<a class="btn sm" style="width:100%" href="${esc(mapsHref)}" target="_blank" rel="noopener">${secEmoji('🗺️')}Open Map</a>`:''}
        ${!ro?`<button class="btn sm" style="width:100%" onclick="App.moodForm(${i})">${ICONS.edit}Edit Idea</button>`:''}
      </div>
    </div>`;
  }).join('');
  return `
    ${cards ? `<div class="mood-grid">${cards}</div>` : `<div class="empty">No ideas yet.</div>`}`;
}
/* ---- picking an emoji for an idea ----
   First match wins, so the specific rules sit above the general ones ("sushi" before
   "restaurant", "wine bar" before "bar"). Titles are lower-cased and stripped of accents
   first so "Café" and "Cafe" both land on the same rule. */
const IDEA_EMOJI_DEFAULT = '💡';
const IDEA_EMOJI_RULES = [
  [/\b(sunset|sunrise)\b/, '🌅'],
  [/\b(snorkel|scuba|diving|dive)\b/, '🤿'],
  [/\b(surf\w*)\b/, '🏄'],
  [/\b(swim\w*|pool|lido)\b/, '🏊'],
  [/\b(beach|sand|seaside|shore|cove)\b/, '🏖️'],
  [/\b(island)\b/, '🏝️'],
  [/\b(ferry)\b/, '⛴️'],
  [/\b(boat|sail\w*|yacht|cruise|kayak|canoe)\b/, '⛵'],
  [/\b(waterfall|falls)\b/, '💦'],
  [/\b(lake|river|gorge)\b/, '🏞️'],
  [/\b(volcano|crater)\b/, '🌋'],
  [/\b(mountain\w*|peak|summit|alps|andes|dolomites)\b/, '⛰️'],
  [/\b(hike|hiking|trek\w*|trail|walk|walking)\b/, '🥾'],
  [/\b(cave|caves|grotto)\b/, '🕳️'],
  [/\b(forest|jungle|woods|rainforest|park|garden|botanic\w*)\b/, '🌳'],
  [/\b(safari|zoo|wildlife)\b/, '🦁'],
  [/\b(aquarium)\b/, '🐠'],
  [/\b(museum|gallery|exhibition)\b/, '🏛️'],
  [/\b(castle|palace|fort|fortress)\b/, '🏰'],
  [/\b(cathedral|church|basilica|chapel|monastery|abbey)\b/, '⛪'],
  [/\b(mosque)\b/, '🕌'],
  [/\b(temple|shrine|pagoda)\b/, '⛩️'],
  [/\b(ruins?|ancient|acropolis|amphitheat\w*|colosseum|archaeolog\w*)\b/, '🏺'],
  [/\b(tower|viewpoint|lookout|miradouro|panoram\w*|observation)\b/, '🗼'],
  [/\b(bridge)\b/, '🌉'],
  [/\b(spa|thermal|sauna|massage|hot spring\w*)\b/, '♨️'],
  [/\b(restaurant|dinner|lunch|eat|food|dining|tapas)\b/, '🍽️'],
  [/\b(market|bazaar|souk)\b/, '🧺'],
  [/\b(shop\w*|mall|boutique)\b/, '🛍️'],
  [/\b(wine|winery|vineyard)\b/, '🍷'],
  [/\b(beer|brewery|brewpub)\b/, '🍺'],
  [/\b(coffee|cafe|espresso)\b/, '☕'],
  [/\b(breakfast|brunch|bakery|pastr\w*)\b/, '🥐'],
  [/\b(ice cream|gelato)\b/, '🍦'],
  [/\b(pizza)\b/, '🍕'],
  [/\b(sushi|ramen)\b/, '🍣'],
  [/\b(taco\w*|burrito)\b/, '🌮'],
  [/\b(seafood|oyster\w*|lobster)\b/, '🦞'],
  [/\b(bar|pub|cocktail\w*|drinks?)\b/, '🍸'],
  [/\b(club|nightlife|dancing|party)\b/, '🎉'],
  [/\b(music|concert|gig|festival|live)\b/, '🎵'],
  [/\b(football|stadium|match|game)\b/, '⚽'],
  [/\b(bike|cycling|cycle)\b/, '🚲'],
  [/\b(train|railway)\b/, '🚂'],
  [/\b(road trip|drive|driving)\b/, '🚗'],
  [/\b(flight|airport|fly)\b/, '✈️'],
  [/\b(hotel|hostel|airbnb|stay)\b/, '🏠'],
  [/\b(tour|guided|guide)\b/, '🧭'],
  [/\b(ticket\w*|show|theatre|theater|cinema)\b/, '🎟️'],
  [/\b(photo\w*|instagram|insta)\b/, '📸']
];
function ideaEmojiFor(title){
  const s = String(title||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  if(!s.trim()) return IDEA_EMOJI_DEFAULT;
  const hit = IDEA_EMOJI_RULES.find(([re]) => re.test(s));
  return hit ? hit[1] : IDEA_EMOJI_DEFAULT;
}
/* leans towards things you'd actually do on a trip, since this row is what you fall back on
   when the title gives nothing away and the suggestion lands on the default bulb */
const IDEA_EMOJI_PICKS = [
  '💡','🍽️','🍸','☕','🍷','🍺',
  '🏖️','🏊','🤿','🏄','⛵','🛶',
  '🥾','⛰️','🧗','🚲','🐎','🎿',
  '🏛️','🏰','⛪','🗼','🎡','🦁',
  '🎵','🎭','⚽','🛍️','♨️','🧖',
  '📸','🌅','🎉','🧭'
];
let IDEA_EMOJI_TOUCHED = false;   // once you choose one yourself, the title stops overriding it
App.touchIdeaEmoji = () => { IDEA_EMOJI_TOUCHED = true; };
App.ideaTitleTyped = (titleSel) => {
  if(IDEA_EMOJI_TOUCHED) return;
  const el = $('#md-emoji'), src = $(titleSel || '#md-title');
  if(!el || !src) return;
  el.value = ideaEmojiFor(src.value);
  paintIdeaEmojiPicks(el.value);
};
App.pickIdeaEmoji = e => {
  const el = $('#md-emoji'); if(!el) return;
  el.value = e; IDEA_EMOJI_TOUCHED = true;
  paintIdeaEmojiPicks(e);
};
function paintIdeaEmojiPicks(cur){
  document.querySelectorAll('.emoji-pick').forEach(x=>x.classList.toggle('on', x.dataset.emoji===cur));
}
function ideaEmojiFieldHTML(cur){
  return `<div class="field"><label class="label" for="md-emoji">Emoji</label>
    <input id="md-emoji" class="emoji-input" type="text" maxlength="8" value="${esc(cur)}"
           aria-label="Chosen emoji" oninput="App.touchIdeaEmoji()">
    <div class="emoji-picks">
      ${IDEA_EMOJI_PICKS.map(e=>`<button type="button" class="emoji-pick${e===cur?' on':''}" data-emoji="${e}"
          aria-label="Use ${e}" onclick="App.pickIdeaEmoji('${e}')">${e}</button>`).join('')}
    </div>
  </div>`;
}
let MOOD_IMG = null;   // pending pin image while the form is open
function moodImgStatus(){
  return MOOD_IMG
    ? `<img src="${MOOD_IMG}" alt="" style="width:44px;height:44px;object-fit:cover;border-radius:8px"> <button type="button" class="iconbtn del" aria-label="Remove image" title="Remove image" onclick="App.clearMoodImg()">${ICONS.trash}</button>`
    : `<span class="muted small">No image added</span>`;
}
App.clearMoodImg = () => { MOOD_IMG = null; const el=$('#md-img-status'); if(el) el.innerHTML = moodImgStatus(); };
App.attachMoodImg = input => {
  const file = input.files[0]; input.value=''; if(!file) return;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    const scale = Math.min(1, 1600/Math.max(img.width,img.height));
    c.width = img.width*scale; c.height = img.height*scale;
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    MOOD_IMG = c.toDataURL('image/jpeg',.85);
    const el=$('#md-img-status'); if(el) el.innerHTML = moodImgStatus();
  };
  img.src = URL.createObjectURL(file);
};
App.moodForm = i => {
  const t = getTrip(CUR_TRIP_ID); if(!t) return;
  const m = (i>=0 && (t.moodBoard||[])[i]) || {};
  MOOD_IMG = m.dataUrl || null;
  // an idea you've already given an emoji keeps it; a new one follows the title until you pick
  IDEA_EMOJI_TOUCHED = !!m.emoji;
  const emoji = m.emoji || ideaEmojiFor(m.title||'');
  openModal(`
    <h2>${i>=0?'Edit Idea':'New Idea'}</h2>
    <div class="field"><label class="label" for="md-title">Title</label><input id="md-title" type="text" value="${esc(m.title||'')}" placeholder="e.g. Sunset at Miradouro" oninput="App.ideaTitleTyped()"></div>
    ${ideaEmojiFieldHTML(emoji)}
    <div class="field"><label class="label" for="md-video">TikTok or Instagram link</label><input id="md-video" type="url" value="${esc(m.videoUrl||'')}" placeholder="https://www.tiktok.com/@user/video/…"></div>
    <div class="field"><label class="label" for="md-maps">Google Maps link</label><input id="md-maps" type="url" value="${esc(m.mapsUrl||'')}" placeholder="https://maps.google.com/…"></div>
    <div class="field"><label class="label">Image</label>
      <div id="md-img-status" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px">${moodImgStatus()}</div>
      <label class="btn sm" style="cursor:pointer">${ICONS.upload} ${MOOD_IMG?'Replace image':'Add image'}<input type="file" accept="image/*" style="display:none" onchange="App.attachMoodImg(this)"></label>
    </div>
    <div class="modal-actions">
      <button class="btn primary" style="width:100%" onclick="App.saveMood(${i>=0?i:-1})">${i>=0?'Save':'Add Idea'}</button>
      ${i>=0?`<button class="btn danger" style="width:100%;margin-top:10px" onclick="App.deleteMoodFromForm(${i})">Delete Idea</button>`:''}
    </div>`, {autofocus:false});
};
App.saveMood = i => {
  const t = getTrip(CUR_TRIP_ID); if(!t) return;
  const title = $('#md-title').value.trim();
  let videoUrl = $('#md-video').value.trim();
  if(videoUrl && !/^https?:\/\//i.test(videoUrl)) videoUrl = 'https://' + videoUrl;
  let mapsUrl = $('#md-maps').value.trim();
  if(mapsUrl && !/^https?:\/\//i.test(mapsUrl)) mapsUrl = 'https://' + mapsUrl;
  if(!title && !videoUrl && !mapsUrl && !MOOD_IMG) return markErr('#md-title','Add a title, video link, maps link or image');
  t.moodBoard = t.moodBoard||[];
  const emoji = (($('#md-emoji')||{}).value||'').trim() || ideaEmojiFor(title);
  const idea = {id: i>=0 && t.moodBoard[i] ? t.moodBoard[i].id : uid(),
    title, emoji, videoUrl, mapsUrl, ...(MOOD_IMG?{dataUrl:MOOD_IMG}:{})};
  if(i>=0) t.moodBoard[i]=idea; else t.moodBoard.push(idea);
  MOOD_IMG = null;
  logEdit('Ideas', (i>=0?'edited ':'added ')+(title||videoUrl||'an idea'));
  save(); closeModal(); rerender(); toast(i>=0?'Idea updated':'Idea added');
};
App.deleteMoodFromForm = i => { closeModal(); App.delMood(i); };
App.delMood = i => {
  const t=getTrip(CUR_TRIP_ID); if(!t) return;
  const tripId = t.id;
  const removed = t.moodBoard[i]; const label = removed.title||removed.videoUrl||'an idea';
  t.moodBoard.splice(i,1); logEdit('Ideas','removed '+label); save(); rerender();
  toast('Idea removed', ()=>{
    const t2=getTrip(tripId); if(!t2) return;
    t2.moodBoard = t2.moodBoard||[];
    t2.moodBoard.splice(Math.min(i,t2.moodBoard.length),0,removed);
    logEdit('Ideas','restored '+label); save(); rerender();
  });
};

</script>
