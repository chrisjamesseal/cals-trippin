const WORLD_MAP_UK_NATIONS = ['XE','XS','XW','XI'];
function worldMapStatus(code, trips){
  if(code==='GB'){
    const sts = WORLD_MAP_UK_NATIONS.map(c=>placesStatusOf(c, trips[c]));
    if(sts.includes('been')) return 'been';
    if(sts.includes('going')) return 'going';
    if(sts.includes('want')) return 'want';
    return 'none';
  }
  return placesStatusOf(code, trips[code]);
}
function worldMapLabel(code){
  if(code==='GB') return 'United Kingdom';
  const co = countryByCode(code);
  return co ? co.name : code;
}
/* the map is a picture, not a form - tapping a country just names it and says where it stands,
   rather than trying to squeeze the Been tick or the Want to Go switch onto a shape a few
   pixels wide. Plain text, not HTML - this feeds both an aria-label attribute (escaped at the
   call site) and a textContent write (which must NOT be pre-escaped, or entities show up
   literally in the label). */
function worldMapTapLabel(code, trips){
  const status = worldMapStatus(code, trips);
  const label = worldMapLabel(code);
  const statusText = status==='been' ? "Been" : status==='going' ? 'Going' : status==='want' ? 'Want to Go' : 'Not Explored';
  return `${label} · ${statusText}`;
}
function beenMapHTML(trips){
  const codes = Object.keys(WORLD_MAP_PATHS);
  const shapes = codes.map(code => {
    const status = worldMapStatus(code, trips);
    return `<path class="wm-country wm-${status}" d="${WORLD_MAP_PATHS[code]}" onclick="App.worldMapTap('${code}')" role="button" tabindex="0" aria-label="${esc(worldMapTapLabel(code, trips))}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();App.worldMapTap('${code}')}"></path>`;
  }).join('');
  return `<div class="been-map-wrap">
    <div class="been-map-label" id="been-map-label">Tap a country to see it here</div>
    <svg class="been-map" viewBox="${WORLD_MAP_VIEWBOX}" role="img" aria-label="World map showing countries you've been to and want to go to">${shapes}</svg>
    <div class="been-map-legend">
      <span class="been-map-legend-item"><span class="been-map-swatch wm-been" aria-hidden="true"></span>Been</span>
      <span class="been-map-legend-item"><span class="been-map-swatch wm-going" aria-hidden="true"></span>Going</span>
      <span class="been-map-legend-item"><span class="been-map-swatch wm-want" aria-hidden="true"></span>Want to Go</span>
    </div>
    <div class="been-map-credit muted small">Map data: <a href="https://github.com/flekschas/simple-world-map" target="_blank" rel="noopener" onclick="return App.openExternal(event, 'https://github.com/flekschas/simple-world-map')">simple-world-map</a> (CC BY-SA 3.0) - a simplified map, so a handful of small nations aren't shown</div>
  </div>`;
}

/* four glanceable numbers above the Been list, same plain-tile grid Plants' own dashboard stats
   use (see plantsDashboardStatsHTML) - purely informational, no destination to tap through to
   since it's the exact same list right below. Reflects the full unfiltered Been list regardless
   of what's typed into the search box above it - a search narrowing the list shouldn't make "how
   many countries have I been to" appear to shrink too. Longest Trip only appears once at least
   one trip actually has both a start and end date to measure from. */
function beenStatsHTML(list){
  const pctWorld = COUNTRY_CODES.length ? Math.round(list.length / COUNTRY_CODES.length * 100) : 0;
  const continentsVisited = new Set(list.map(co => continentOf(co.code))).size;
  let longestDays = 0;
  (DB.trips||[]).forEach(t=>{
    if(!t.startDate || !t.endDate) return;
    const days = Math.round((new Date(t.endDate) - new Date(t.startDate))/86400000) + 1;
    if(days > longestDays) longestDays = days;
  });
  const stats = [
    ['🌍', `${list.length} ${list.length===1?'Country':'Countries'} Been`],
    ['📊', `${pctWorld}% of the World`],
    ['🗺️', `${continentsVisited} of ${CONTINENT_ORDER.length} Continents`],
  ];
  if(longestDays) stats.push(['🏆', `${longestDays}-Day Longest Trip`]);
  return `<div class="been-stats">${stats.map(([icon,text]) => `
    <div class="been-stat-tile"><span class="been-stat-icon" aria-hidden="true">${icon}</span><span class="been-stat-text">${esc(text)}</span></div>`).join('')}</div>`;
}
/* Been can be read two ways: the order you went (one numbered run) or where in the world it
   was (grouped by continent). Same cards and the same numbers either way, just regrouped. */
function drawBeenSubtabs(){
  const el = $('#been-subtabs'); if(!el) return;
  const tab = (k, label) => `<button class="subtab${CUR_BEEN_VIEW===k?' on':''}" onclick="App.beenView('${k}')">${label}</button>`;
  el.innerHTML = tab('list','🔢 In Order') + tab('continents','🌍 Continents') + tab('map','🗺️ Map');
  const searchEl = $('.places-search');
  if(searchEl) searchEl.style.display = CUR_BEEN_VIEW==='map' ? 'none' : '';
}
function beenCardHTML(co, num){
  return `
    <div class="place-card been-card" data-code="${co.code}">
      <span class="been-num" aria-hidden="true">#${num}</span>
      <span class="flag">${co.flag}</span>
      <span class="place-name-text">${esc(co.name)}</span>
    </div>`;
}
/* a country whose trip is booked but hasn't happened yet. It sits in the same numbered run as
   everywhere you've actually been, just faded and with nothing to tap: it's the next number in
   the sequence, and it becomes a real entry the day the trip's dates pass. */
function beenUpcomingCardHTML(co, num){
  return `
    <div class="place-card been-card been-upcoming" data-code="${co.code}">
      <span class="been-num" aria-hidden="true">#${num}</span>
      <span class="flag">${co.flag}</span>
      <span class="place-name-text">${esc(co.name)}</span>
    </div>`;
}
/* the real, remembered order of first sixteen: given by hand rather than derived, since
   nothing in the data says *when* each of these actually happened. Oldest first - England
   was the very first (#1, at the foot of the list), Wales second, and so on up to the most
   recent of these sixteen. Anything ticked Been from here on (not in this list) is assumed
   to be more recent than all of these and sorts above them. */
const BEEN_VISIT_ORDER = ['HR','TH','VA','IT','NO','CH','PT','BE','NL','ES','US','XS','IE','FR','XW','XE'];
const BEEN_VISIT_SET = new Set(BEEN_VISIT_ORDER);
/* Greece, Albania, Australia and Japan were archived out of order by the pre-fix
   applyArchiveTransitions bug, and the wrong order was already written into DB.places'
   insertion order by the time it was caught - there's nothing left in the data to recover the
   real dates from, so this is corrected by hand instead, same as the older sixteen above.
   Most recent of this set first (Japan), oldest last (Greece), and it sorts more recent than
   the sixteen but older than anything else, matching where this cluster already sits. */
const BEEN_MANUAL_ORDER = ['JP','AU','AL','GR'];
const BEEN_MANUAL_SET = new Set(BEEN_MANUAL_ORDER);
function beenOrderedCountries(trips){
  const out = [], seen = new Set();
  const placesKeys = Object.keys(DB.places||{});
  /* newest-added first: DB.places preserves insertion order oldest-key-first, so this walks
     it backwards */
  for(let i=placesKeys.length-1; i>=0; i--){
    const code = placesKeys[i];
    if(seen.has(code) || BEEN_VISIT_SET.has(code) || BEEN_MANUAL_SET.has(code) || placesStatusOf(code, trips[code])!=='been') continue;
    const co = COUNTRIES.find(c=>c.code===code);
    if(co){ out.push(co); seen.add(code); }
  }
  /* the rare country that's Been purely because a trip finished but hasn't archived yet, so
     nothing's been written down for it anywhere to give it a real position */
  COUNTRY_CODES.forEach(code=>{
    if(seen.has(code) || BEEN_VISIT_SET.has(code) || BEEN_MANUAL_SET.has(code) || placesStatusOf(code, trips[code])!=='been') return;
    const co = COUNTRIES.find(c=>c.code===code);
    if(co){ out.push(co); seen.add(code); }
  });
  BEEN_MANUAL_ORDER.forEach(code=>{
    if(seen.has(code) || placesStatusOf(code, trips[code])!=='been') return;
    const co = COUNTRIES.find(c=>c.code===code);
    if(co){ out.push(co); seen.add(code); }
  });
  BEEN_VISIT_ORDER.forEach(code=>{
    if(seen.has(code) || placesStatusOf(code, trips[code])!=='been') return;
    const co = COUNTRIES.find(c=>c.code===code);
    if(co){ out.push(co); seen.add(code); }
  });
  return out;
}
function beenUpcomingCountries(trips){
  // earliest upcoming trip's start date per country, so a country you're going to sooner
  // (Australia in 2027) sorts ahead of one further out (Japan in 2028), not in whatever order
  // COUNTRY_CODES happens to list them
  const startOf = {};
  DB.trips.forEach(t=>{
    const start = upcomingStartDate(t);
    if(!start) return;
    (t.countries||[]).forEach(c=>{ if(!startOf[c] || start < startOf[c]) startOf[c] = start; });
  });
  return COUNTRY_CODES
    .filter(code => placesStatusOf(code, trips[code])==='going')
    .map(code => COUNTRIES.find(c=>c.code===code))
    .filter(Boolean)
    .sort((a,b) => (startOf[a.code]||'9999-99-99').localeCompare(startOf[b.code]||'9999-99-99'));
}
function drawPlacesGrid(){
  const el = $('#places-grid'); if(!el) return;
  const q = (($('#places-filter')||{}).value||'').trim().toLowerCase();
  const trips = placesTripMap();

  /* Been isn't a browse-the-world screen like the other two, it's a log of what's already on
     it, so it skips the region picker and continent grouping entirely: just the list, in the
     order countries were added, searchable but not filterable by region, plus a faded preview
     of what's coming once a booked trip's dates pass. */
  if(CUR_PLACES_VIEW==='been'){
    let list = beenOrderedCountries(trips);
    let upcoming = beenUpcomingCountries(trips);
    const statsRoot = $('#been-stats'); if(statsRoot) statsRoot.innerHTML = beenStatsHTML(list);
    if(CUR_BEEN_VIEW==='map'){ el.innerHTML = beenMapHTML(trips); return; }
    if(q){
      list = list.filter(co=>co.name.toLowerCase().includes(q));
      upcoming = upcoming.filter(co=>co.name.toLowerCase().includes(q));
    }
    if(!list.length && !upcoming.length){
      el.innerHTML = `<div class="empty">${q ? `No countries match "${esc(q)}"` : "Nowhere yet. Countries fill in here once a trip there has finished, or tick one off in Want to Go."}</div>`;
      return;
    }
    /* one continuous numbered run rather than two sections: countries on a booked trip lead it
       (they're the next ones to happen) and carry their number like the rest, they're just
       faded until the trip's dates pass */
    const cards = upcoming.map(co => ({co, upcoming:true})).concat(list.map(co => ({co, upcoming:false})));
    /* numbered from the bottom up: #1 is the first place you went, at the foot of the list,
       counting up to the most recent at the top. Worked out once, over the whole run, so a
       country keeps its number in either view - grouping by continent reorders the cards, it
       doesn't renumber them. */
    cards.forEach((c,i) => { c.num = cards.length - i; });
    const cardHTML = c => c.upcoming ? beenUpcomingCardHTML(c.co, c.num) : beenCardHTML(c.co, c.num);
    if(CUR_BEEN_VIEW==='continents'){
      const byContinent = {};
      cards.forEach(c => { const k = continentOf(c.co.code); (byContinent[k] = byContinent[k]||[]).push(c); });
      const order = CONTINENT_ORDER.filter(k=>byContinent[k])
        .concat(Object.keys(byContinent).filter(k=>!CONTINENT_ORDER.includes(k)));
      el.innerHTML = order.map(k => `
        <h3 class="places-continent-heading">${CONTINENT_EMOJI[k]?secEmoji(CONTINENT_EMOJI[k]):''} ${esc(k)}
          <span class="muted small been-cont-count">${byContinent[k].length}</span></h3>
        <div class="places-grid dense">${byContinent[k].map(cardHTML).join('')}</div>`).join('');
      return;
    }
    el.innerHTML = `<div class="places-grid dense">${cards.map(cardHTML).join('')}</div>`;
    return;
  }

  /* Want to Go and Country Finder both show the region tiles up top, to pick a corner of the
     world at a glance; the full list sits right below them rather than behind a click on an
     "All" tile, since that's the same list either way. */
  const regionTilesHTML = (!q && !CUR_PLACES_REGION && PLACES_VIEWS[CUR_PLACES_VIEW].regions)
    ? placesRegionGridHTML() : '';

  let list = COUNTRIES;
  if(q) list = list.filter(c=>c.name.toLowerCase().includes(q));
  else if(CUR_PLACES_REGION) list = list.filter(c=>continentOf(c.code)===CUR_PLACES_REGION);
  /* a search overrides the region the same way it overrides the status filter: you typed a
     country's name, so you want that country whatever state it's in */
  if(!q) list = list.filter(c=>CUR_PLACES_FILTER==='all' || placesStatusOf(c.code, trips[c.code])===CUR_PLACES_FILTER);

  if(!list.length){
    const empty = q ? `No countries match "${esc(q)}"`
      : CUR_PLACES_VIEW==='want' ? 'Nothing on the wish list yet. Countries is where you add them.'
      : 'No countries match this filter';
    el.innerHTML = regionTilesHTML + `<div class="empty">${empty}</div>`; return;
  }

  const backRow = (!q && CUR_PLACES_REGION) ? `<button class="btn sm" style="margin-bottom:14px" onclick="App.clearPlacesRegion()">${ICONS.back} All Regions</button>` : '';
  /* the default browse view (no region picked, no search) is one flat list under the region
     tiles - those tiles are already the continent picker, so grouping the list by continent
     too was saying the same thing twice and just added clutter */
  const topLevel = !q && !CUR_PLACES_REGION;
  if(topLevel){
    /* the region tiles read as their own picker without a label, but the flat list under them
       needs something saying what it is now that it's no longer broken up by continent
       headings of its own */
    const allTitle = regionTilesHTML ? `<h3 class="places-continent-heading">All Countries</h3>` : '';
    el.innerHTML = regionTilesHTML + allTitle + `<div class="places-grid">${list.map(co=>placeCardHTML(co, trips[co.code])).join('')}</div>`;
    return;
  }
  const byContinent = {};
  list.forEach(co => { const k = continentOf(co.code); (byContinent[k] = byContinent[k]||[]).push(co); });
  const order = CONTINENT_ORDER.filter(k=>byContinent[k]).concat(Object.keys(byContinent).filter(k=>!CONTINENT_ORDER.includes(k)));
  /* a search hitting more than one continent still gets grouped, so results don't read as
     one undifferentiated pile; picking a single region never has more than one to group */
  const showHeadings = order.length>1;
  /* a single-continent region view still needs a title now that the per-continent heading
     it used to inherit is suppressed (there's nothing else on the page saying "Europe") */
  const regionTitle = (!q && CUR_PLACES_REGION && !showHeadings) ? `<h3 class="places-continent-heading">${esc(CUR_PLACES_REGION)}</h3>` : '';
  el.innerHTML = regionTilesHTML + backRow + regionTitle + order.map(k => `
    ${showHeadings?`<h3 class="places-continent-heading">${esc(k)}</h3>`:''}
    <div class="places-grid">${byContinent[k].map(co=>placeCardHTML(co, trips[co.code])).join('')}</div>
  `).join('');
}

/* ================= Games (PlayStation progress) =================
   PSN has no public API, and the unofficial one needs an auth step browsers can't make
   themselves (it requires setting a Cookie header cross-origin, which fetch() forbids), so
   this talks to a small proxy you deploy yourself - see psn-proxy/README.md. The proxy's
   URL is just an address, safe to commit (PSN_PROXY_URL, near FIREBASE_CONFIG); your actual
   PSN login token lives only in this browser's localStorage, never in the source. */
const PSN_TOKENS_KEY = 'calstrippin_psn_tokens';
const PSN_HIDDEN_KEY = 'calstrippin_psn_hidden';
let PSN_TITLES = [];   // the last fetch, held so search/hide can re-filter without refetching
function psnConfigured(){ return !!PSN_PROXY_URL; }
function psnTokens(){ try{ return JSON.parse(localStorage.getItem(PSN_TOKENS_KEY)||'null'); }catch(e){ return null; } }
function savePsnTokens(tok){ try{ localStorage.setItem(PSN_TOKENS_KEY, JSON.stringify(tok)); }catch(e){} }
function clearPsnTokens(){ try{ localStorage.removeItem(PSN_TOKENS_KEY); }catch(e){} }
function psnUrl(path){ return PSN_PROXY_URL.replace(/\/$/,'') + path; }
/* hiding a game is a per-device preference, nothing to do with PSN itself */
function psnHidden(){ try{ return new Set(JSON.parse(localStorage.getItem(PSN_HIDDEN_KEY)||'[]')); }catch(e){ return new Set(); } }
function savePsnHidden(set){ try{ localStorage.setItem(PSN_HIDDEN_KEY, JSON.stringify([...set])); }catch(e){} }
/* one retry on a stale access token: refresh, then replay the request once more */
async function psnApi(path){
  const tok = psnTokens();
  if(!tok) throw new Error('Not connected');
  let res = await fetch(psnUrl(path), {headers:{Authorization:'Bearer '+tok.accessToken}});
  if(res.status===401 && tok.refreshToken){
    const r = await fetch(psnUrl('/refresh'), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({refreshToken: tok.refreshToken})
    });
    if(!r.ok){ clearPsnTokens(); throw new Error('Your PlayStation session expired, connect again'); }
    const fresh = await r.json(); savePsnTokens(fresh);
    res = await fetch(psnUrl(path), {headers:{Authorization:'Bearer '+fresh.accessToken}});
  }
  if(!res.ok) throw new Error('Could not reach PlayStation (status '+res.status+')');
  return res.json();
}
/* Games holds two unrelated collections - what you're playing on the PlayStation, and board
   games you might get to the table - so it splits into sub-tabs rather than one mixed list.
   Board Games needs its own BGG_API_TOKEN Vercel environment variable (BoardGameGeek requires
   a registered app token on every request - see psn-proxy/README.md) that hasn't been set up
   yet, so its subtab is hidden until it has been - the feature itself is untouched underneath,
   just not linked to, and flipping this back to true is the whole job of turning it back on. */
const BOARD_GAMES_ENABLED = false;

async function psnConnectImpl(){
  const inp = $('#npsso-input');
  const npsso = (inp.value||'').trim();
  if(!npsso) return markErr('#npsso-input', 'Paste your NPSSO code first');
  const btn = $('#psn-connect-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Connecting…'; }
  try{
    const res = await fetch(psnUrl('/session'), {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({npsso})
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error || ('Connection failed (status '+res.status+')'));
    savePsnTokens(data);
    renderGames();
  }catch(e){
    markErr('#npsso-input', e.message||'Connection failed');
    if(btn){ btn.disabled = false; btn.textContent = 'Connect'; }
  }
}
function psnDisconnectImpl(){ clearPsnTokens(); renderGames(); }
function psnToggleHiddenImpl(id){
  const hidden = psnHidden();
  if(hidden.has(id)) hidden.delete(id); else hidden.add(id);
  savePsnHidden(hidden);
  drawGamesList();
}

/* ================= Board games (BoardGameGeek) =================
   Talks to /api/board-games (see api/board-games.js), a Vercel function rather than the PSN
   proxy - BGG 401s every request that comes from the proxy's Cloudflare network no matter what
   headers are sent, so this one endpoint lives on different infrastructure instead. No login -
   the list is the same for everyone - so what's yours is just which games you've marked, and
   that stays on this device the way the PSN connection does. */
const BG_MARKS_KEY = 'calstrippin_boardgames';
let BG_GAMES = [];          // the last fetch, held so the filters re-run without refetching
let BG_FILTER = {cat:'all', players:0, time:0};
let BG_SEARCH_TIMER = null;
function bgMarks(){ try{ return JSON.parse(localStorage.getItem(BG_MARKS_KEY)||'{}'); }catch(e){ return {}; } }
function saveBgMarks(m){ try{ localStorage.setItem(BG_MARKS_KEY, JSON.stringify(m)); }catch(e){} }
function bgMarkOf(id){ return bgMarks()[id] || ''; }

/* BGG returns dozens of categories and mechanics; these are the handful of shelves people
   actually choose between, matched off the category/mechanic names (and weight rating) it
   returns. They live here rather than in api/board-games.js so a bucket can be retuned without
   a redeploy. */
const BG_CATS = [
  {k:'coop',     emoji:'🤝', label:'Co-op',    test:g => g.mechanics.some(m=>/cooperative/i.test(m))},
  {k:'party',    emoji:'🎉', label:'Party',    test:g => g.categories.some(c=>/party game|humor/i.test(c))},
  {k:'strategy', emoji:'🧠', label:'Strategy', test:g => (g.weight||0) >= 3
                                                  || g.categories.some(c=>/abstract strategy|economic|civilization|territory building/i.test(c))},
  {k:'family',   emoji:'🧸', label:'Family',   test:g => (g.weight||5) < 2
                                                  || g.categories.some(c=>/children|educational/i.test(c))},
  {k:'cards',    emoji:'🃏', label:'Cards',    test:g => g.categories.some(c=>/card game/i.test(c))},
  {k:'mystery',  emoji:'🕵️', label:'Mystery',  test:g => g.categories.some(c=>/deduction|murder|spies/i.test(c))},
  {k:'fighting', emoji:'⚔️', label:'Fighting', test:g => g.categories.some(c=>/wargame|fighting|miniatures/i.test(c))},
  {k:'words',    emoji:'🔤', label:'Words',    test:g => g.categories.some(c=>/word game|trivia/i.test(c))},
];
/* the two that aren't categories at all: your own shelf */
const BG_MARK_FILTERS = [
  {k:'want',   emoji:'⭐', label:'Want to Play'},
  {k:'played', emoji:'✅', label:'Played'},
];
function bgCatsOf(g){ return BG_CATS.filter(c => c.test(g)); }
function bgPlayersLabel(g){
  if(!g.minPlayers && !g.maxPlayers) return '';
  if(!g.maxPlayers || g.minPlayers===g.maxPlayers) return `${g.minPlayers||g.maxPlayers} players`;
  return `${g.minPlayers||1}-${g.maxPlayers} players`;
}
function bgTimeLabel(g){
  const lo = g.minTime, hi = g.maxTime || g.playTime;
  if(!lo && !hi) return '';
  if(!lo || lo===hi) return `${hi} min`;
  return `${lo}-${hi} min`;
}
function renderBoardGames(){
  const body = $('#games-body'); if(!body) return;
  body.innerHTML = `
    <div id="bg-filters"></div>
    <div class="games-search">
      <input type="text" id="bg-search" placeholder="Search board games…" oninput="App.bgSearchInput()">
    </div>
    <div id="bg-grid"><div class="empty">Loading board games…</div></div>`;
  drawBgFilters();
  loadBoardGames('');
}
/* one network call per distinct search; every filter after that works on the held list */
function loadBoardGames(q){
  const grid = $('#bg-grid'); if(!grid) return;
  grid.innerHTML = `<div class="empty">Loading board games…</div>`;
  /* same-origin Vercel function (api/board-games.js), not the Cloudflare Worker the rest of
     this proxy's endpoints go through - see that file for why */
  fetch('/api/board-games' + (q ? '?q='+encodeURIComponent(q) : ''))
    .then(async r => {
      if(!r.ok){
        // the function's own {error: e.message} body carries the real reason (BoardGameGeek
        // rejecting the request, most likely) - a bare "status 500" hid that
        const body = await r.json().catch(()=>({}));
        throw new Error(body.error || ('status '+r.status));
      }
      return r.json();
    })
    .then(data => {
      if(CUR_GAMES_TAB!=='board' || !$('#bg-grid')) return;   // moved on while it was in flight
      BG_GAMES = data.games||[];
      drawBgGrid();
    })
    .catch(e => {
      if(CUR_GAMES_TAB!=='board' || !$('#bg-grid')) return;
      $('#bg-grid').innerHTML = `<div class="empty">Couldn't load board games.<br>${esc(e.message||'')}
        <div class="btn-row" style="justify-content:center; margin-top:14px">

  const el = $('#bg-filters'); if(!el) return;
  const chip = (k, emoji, label) => `
    <button class="bg-chip${BG_FILTER.cat===k?' on':''}" onclick="App.bgCat('${k}')">

  const sel = (id, value, label, opts) => `

  el.innerHTML = `

    </div>

      ${sel('time', BG_FILTER.time, 'Playtime', [[0,'Any'],[30,'Under 30 min'],[60,'Under 1 hour'],[120,'Under 2 hours'],[121,'2 hours +']])}
    </div>`;

function bgMatches(g){
  const f = BG_FILTER;
  if(f.cat!=='all'){
    if(f.cat==='want' || f.cat==='played'){ if(bgMarkOf(g.id)!==f.cat) return false; }
    else{ const c = BG_CATS.find(x=>x.k===f.cat); if(c && !c.test(g)) return false; }
  }
  /* "plays 6" means a group of 6 fits between the game's two ends, not that 6 is its maximum */
  if(f.players){
    const lo = g.minPlayers||1, hi = g.maxPlayers||99, want = +f.players;
    if(want===8 ? hi < 8 : (want < lo || want > hi)) return false;
  }
  if(f.time){
    const t = g.maxTime || g.playTime || g.minTime || 0;
    if(+f.time===121 ? t <= 120 : !(t && t <= +f.time)) return false;
  }
  return true;
}

  const grid = $('#bg-grid'); if(!grid) return;
  const list = BG_GAMES.filter(bgMatches);

  return `

          ${tags?`<div class="bg-tags">${tags}</div>`:''}

      <div class="btn-row bg-actions">

/* ================= Wishlist (new & upcoming video games) =================
   Same proxy pattern as Board Games: a Vercel function (api/game-search.js) rather than the
   Cloudflare Worker, same-origin, no CORS header to add. No login - just a search box, backed
   by RAWG (rawg.io), and a locally-saved shelf of what you've marked, the same way Board
   Games' Want to Play/Played marks stay on-device. */
const WL_KEY = 'calstrippin_game_wishlist';
let WL_LAST_GAMES = [];   // the last fetch, so App.wlToggle can find a game's full data by id
let WL_SEARCH_TIMER = null;
function wishlistGames(){ try{ return JSON.parse(localStorage.getItem(WL_KEY)||'[]'); }catch(e){ return []; } }
function saveWishlist(list){ try{ localStorage.setItem(WL_KEY, JSON.stringify(list)); }catch(e){} }
function isWishlisted(id){ return wishlistGames().some(g=>g.id===id); }
function wlPlatformsLabel(g){ return (g.platforms||[]).slice(0,3).join(' · '); }
function wlReleaseLabel(g){
  if(g.tba || !g.released) return 'To be announced';
  return g.released > todayStr() ? 'Releases '+fmtDate(g.released) : fmtDate(g.released);
}
/* "what should I get next" - a game with no known release date can't be acted on yet, so it
   sinks to the bottom regardless of anything else; everything with a real date sorts by how
   close that date is to today in either direction, closest first. That puts an about-to-release
   game and one that just came out at the top together (both genuinely "get this soon"), and
   something years off (or long since out and still not bought) further down - a plainer, more
   useful ordering than a straight ascending date sort would give. */
function wlUrgencyKey(g){
  if(g.tba || !g.released) return Infinity;
  return Math.abs(new Date(g.released) - new Date(todayStr()));
}
/* the one manual override on top of that automatic ordering - "Play This Next" always wins
   regardless of release date, for the case where the auto sort doesn't match what you actually
   want next. Both pinned and unpinned groups still sort by urgency within themselves. */
function wishlistSorted(){
  return wishlistGames().slice().sort((a,b) => {
    if(!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
    return wlUrgencyKey(a) - wlUrgencyKey(b);
  });
}
function renderWishlist(){
  const body = $('#games-body'); if(!body) return;
  body.innerHTML = `
    <div id="wl-my"></div>
    <div class="games-search">
      <input type="text" id="wl-search" placeholder="Search for a game, e.g. GTA VI…" oninput="App.wlSearchInput()">
    </div>
    <div id="wl-grid"><div class="empty">Loading new &amp; upcoming games…</div></div>`;
  drawWishlistMine();
  loadGameSearch('');
}
function drawWishlistMine(){
  const el = $('#wl-my'); if(!el) return;
  const mine = wishlistSorted();
  if(!mine.length){ el.innerHTML = ''; return; }
  el.innerHTML = `
    <h3 style="margin-bottom:10px">My Wishlist</h3>
    <div class="wl-list" style="margin-bottom:22px">${mine.map(g=>wlCardHTML(g, true)).join('')}</div>`;
}
/* one network call per distinct search; the RAWG function itself decides what "coming up"
   means when there's no query - see api/game-search.js */
function loadGameSearch(q){
  const grid = $('#wl-grid'); if(!grid) return;
  grid.innerHTML = `<div class="empty">Loading new &amp; upcoming games…</div>`;
  fetch('/api/game-search' + (q ? '?q='+encodeURIComponent(q) : ''))
    .then(async r => {
      if(!r.ok){
        const body = await r.json().catch(()=>({}));
        throw new Error(body.error || ('status '+r.status));
      }
      return r.json();
    })
    .then(data => {
      if(CUR_GAMES_TAB!=='wishlist' || !$('#wl-grid')) return;   // moved on while it was in flight
      WL_LAST_GAMES = data.games||[];
      const games = WL_LAST_GAMES.filter(g=>!isWishlisted(g.id));
      $('#wl-grid').innerHTML = games.length
        ? `<div class="wl-list">${games.map(g=>wlCardHTML(g, false)).join('')}</div>`
        : `<div class="empty">${q?`No games match "${esc(q)}"`:'Nothing new to show right now.'}</div>`;
    })
    .catch(e => {
      if(CUR_GAMES_TAB!=='wishlist' || !$('#wl-grid')) return;
      $('#wl-grid').innerHTML = `<div class="empty">Couldn't load games.<br>${esc(e.message||'')}
        <div class="btn-row" style="justify-content:center; margin-top:14px">
          <button class="btn sm" onclick="App.wlReload()">Try Again</button>
        </div></div>`;
    });
}
/* mine=true only inside My Wishlist itself (see drawWishlistMine) - the Play This Next pin only
   makes sense for something already saved, so the browse/search grid below it (still just RAWG
   results, not yet on the shelf) never shows that button. */
function wlCardHTML(g, mine){
  const on = isWishlisted(g.id);
  const facts = [wlPlatformsLabel(g), wlReleaseLabel(g)].filter(Boolean).join(' · ');
  return `
    <div class="wl-card${on?' wl-marked':''}">
      ${mine && g.pinned ? `<div class="wl-pin-badge">🎯 Play Next</div>` : ''}
      <div class="wl-top">
        ${g.image ? `<img class="wl-cover" src="${esc(g.image)}" alt="" loading="lazy">`
                  : `<span class="wl-cover wl-cover-fallback" aria-hidden="true">🕹️</span>`}
        <div class="wl-info">
          <div class="wl-name">${esc(g.name)}</div>
          ${facts?`<div class="wl-facts muted small">${esc(facts)}</div>`:''}
        </div>
      </div>
      <div class="btn-row wl-actions">
        ${mine ? `<button type="button" class="btn sm wl-pin${g.pinned?' on':''}" onclick="App.wlPin('${esc(g.id)}')" aria-pressed="${!!g.pinned}">
          <span aria-hidden="true">🎯</span>${g.pinned?'Playing Next':'Play This Next'}</button>` : ''}
        <button type="button" class="btn sm wl-mark${on?' on':''}" onclick="App.wlToggle('${esc(g.id)}')" aria-pressed="${on}">
          <span aria-hidden="true">${on?'✓':'⭐'}</span>${on?'On Wishlist':'Add to Wishlist'}</button>
      </div>
    </div>`;
}

/* ================= Gigs (live music you've been to) =================
   Its own top-level section rather than folded into a trip: a gig is a moment, not something
   with the trip-shaped start/end dates the rest of the app is built around, and plenty happen
   nowhere near a trip at all. Firebase-synced the same way Places is (DB.gigs, loadGigsCloud/
   saveGigs above), since gig history is worth having on every device. The artist search hits
   the proxy's /spotify-search endpoint for a name/photo/genres lookup, but that's an add-on -
   a gig can be logged with a plain typed name whether or not a proxy is configured. */
let GIG_SEARCH_TIMER = null;
let GIG_SEARCH_RESULTS = [];   // last search response, held so a click on a result doesn't refetch
let GIG_PICKED = null;         // {id,name,image} once a search result's been chosen for the open form

/* ---------- Spotify user login (the Artists checklist) ----------
   Who you follow and how much you actually listen to them is personal library data - Spotify
   only hands that over once you've logged in and approved it (see /spotify-me in worker.js),
   unlike the plain catalogue search above which needs no login at all. Tokens live in
   localStorage exactly like PSN's, and the 401-retry-once shape of spotifyApi mirrors psnApi. */
const SPOTIFY_TOKENS_KEY = 'calstrippin_spotify_tokens';
function spotifyTokens(){ try{ return JSON.parse(localStorage.getItem(SPOTIFY_TOKENS_KEY)||'null'); }catch(e){ return null; } }
function saveSpotifyTokens(tok){ try{ localStorage.setItem(SPOTIFY_TOKENS_KEY, JSON.stringify(tok)); }catch(e){} }
function clearSpotifyTokens(){ try{ localStorage.removeItem(SPOTIFY_TOKENS_KEY); }catch(e){} }
async function spotifyApi(path){
  const tok = spotifyTokens();
  if(!tok) throw new Error('Not connected');
  let res = await fetch(psnUrl(path), {headers:{Authorization:'Bearer '+tok.accessToken}});
  if(res.status===401 && tok.refreshToken){
    const r = await fetch(psnUrl('/spotify-refresh'), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({refreshToken: tok.refreshToken})
    });
    if(!r.ok){ clearSpotifyTokens(); throw new Error('Your Spotify session expired, connect again'); }
    const fresh = await r.json();
    // Spotify doesn't always send a new refresh token back with a refreshed access token -
    // keep the one already on file rather than losing it
    saveSpotifyTokens({...fresh, refreshToken: fresh.refreshToken || tok.refreshToken});
    res = await fetch(psnUrl(path), {headers:{Authorization:'Bearer '+fresh.accessToken}});
  }
  if(!res.ok){
    const body = await res.json().catch(()=>({}));
    throw new Error(body.error || ('Could not reach Spotify (status '+res.status+')'));
  }
  return res.json();
}
/* completes the redirect back from Spotify: exchanges the one-time ?code= for tokens, then
   always scrubs the query string off the address bar (a code is single-use - left sitting in
   the URL, a page refresh would try to redeem it again and fail). The state round-trip guards
   against a stray/forged ?code= being redeemed as if it were one this tab actually started. */
function handleSpotifyRedirect(){
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  if(!code) return Promise.resolve();
  const expectedState = sessionStorage.getItem('spotify_oauth_state');
  sessionStorage.removeItem('spotify_oauth_state');
  history.replaceState(null, '', location.pathname + location.hash);
  if(!expectedState || params.get('state') !== expectedState) return Promise.resolve();
  return fetch(psnUrl('/spotify-callback'), {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({code})
  })
    .then(r => r.json())
    .then(data => { if(data.accessToken){ saveSpotifyTokens(data); location.hash = '#/gigs'; } })
    .catch(()=>{});
}
let SPOTIFY_ARTISTS = null;   // last /spotify-me fetch, held so switching subtabs doesn't refetch
let CUR_GIGS_TAB = 'artists';
function renderGigs(){
  const tab = (k, label) => `<button class="subtab${CUR_GIGS_TAB===k?' on':''}" onclick="App.gigsTab('${k}')">${label}</button>`;
  $('#app').innerHTML = `

    </div>

function renderGigsArtists(){
  const body = $('#gigs-body'); if(!body) return;

    body.innerHTML = `<div class="empty">No proxy is set up yet.<br>Deploy the one in
      <code>psn-proxy/</code> (its README walks through it), then paste your proxy's URL into

   Spotify only computes three fixed listening windows, not real calendar week/month/year, so

   fetchSpotifyTopTracks) rather than approximated to match a "this week" ask that Spotify's
   API has no way to answer. */
const SONGS_TIME_RANGES = [
  {k:'short_term', label:'Last 4 Weeks'},
  {k:'medium_term', label:'Last 6 Months'},
  {k:'long_term', label:'All Time'},
];
let CUR_SONGS_RANGE = 'long_term';
let SONGS_CACHE = {};   // time_range -> tracks[], so flipping between chips doesn't refetch every tap
function renderSongs(){
  const body = $('#gigs-body'); if(!body) return;
  if(!psnConfigured()){
    body.innerHTML = `<div class="empty">No proxy is set up yet.<br>Deploy the one in
      <code>psn-proxy/</code> (its README walks through it), then paste your proxy's URL into
      <code>PSN_PROXY_URL</code> near the top of <code>index.html</code>.</div>`;

function loadSongs(timeRange){

    SONGS_CACHE[timeRange] = data.tracks||[];

    if(!$('#songs-grid')) return;
    $('#songs-grid').innerHTML = `<div class="empty">Couldn't load your top songs.<br>${esc(e.message||'')}

   pattern as Games' drawGamesList() and Board Games' drawBgGrid() */

  const grid = $('#gig-artists-grid'); if(!grid) return;

function gigArtistRowHTML(a){

    ? `<span class="gig-seen-pill">✓ Seen</span>`
    : `<span class="gig-seen-pill off">Not seen yet</span>`;
  // "The Weeknd #2" once you've seen them more than once - the count reads as part of their
  // name here, so the pill above just says Seen rather than repeating it as "Seen ×2"
  const nameSuffix = seenCount>1 ? ` <span class="gig-seen-count">#${seenCount}</span>` : '';
  return `
    <div class="card gig-card gig-artist-row" role="button" tabindex="0" onclick="App.gigFormForArtist('${esc(a.id)}')"

          <div class="gig-name">${esc(a.name)}${nameSuffix}</div>
        </div>

/* Letterboxd's CSV exports (diary.csv, watchlist.csv) carry no poster or genre at all - unlike
   the RSS sync, which at least sometimes finds a poster in the feed entry's own HTML - so a CSV
   import always leaves every entry without either. This fills both in afterwards with a TMDb
   search per title still missing one or the other (via the same api/film-search.js the
   search-select fields use), a handful at a time so a big import doesn't fire hundreds of
   requests at once or take forever doing them one by one. Best-effort: a request that fails or a
   title TMDb doesn't recognise just stays as it came in. */
async function backfillPosters(list, saveFn){
  const missing = (list||[]).filter(f => f.title && (!f.image || !(f.genres&&f.genres.length)));
  if(!missing.length) return 0;
  let filled = 0, idx = 0;
  async function worker(){
    while(idx < missing.length){
      const f = missing[idx++];
      try{
        const r = await fetch('/api/film-search?q='+encodeURIComponent(f.title));
        if(!r.ok) continue;
        const data = await r.json();
        const results = data.films||[];
        const match = results.find(m=>f.year && m.year===f.year) || results[0];
        if(!match) continue;
        let changed = false;
        if(!f.image && match.image){ f.image = match.image; changed = true; }
        if(!(f.genres&&f.genres.length) && match.genres && match.genres.length){ f.genres = match.genres; changed = true; }
        if(changed) filled++;
      }catch(e){}
    }
  }
  await Promise.all(Array.from({length:4}, worker));
  if(filled) saveFn();
  return filled;
}

function filmFormImpl(i, prefill){
  const f = (i>=0 && (DB.films||[])[i]) || (prefill ? {title:prefill.title, year:prefill.year, image:prefill.image} : {});
  FILM_SEARCH_RESULTS = [];
  FILM_WATCHLIST_REMOVE_ID = (prefill && prefill.watchlistId) || null;

/* Letterboxd's RSS sync (id: the feed's <guid>, usually the diary entry's own URL) and the CSV
   import (id: the export's Letterboxd URI column, or a title|year|watchedDate fallback when
   that column's blank) don't always agree on what string identifies the same watch - a trailing
   slash, or a rewatch-count suffix one has and the other doesn't, is enough to make two imports
   of the very same entry look like two different ones by id alone. A title+year+watchedDate
   triple is what actually makes a diary entry unique on Letterboxd itself, so both merges below
   fall back to matching on that whenever the id lookup misses, and dedupeFilms() sweeps up
   anything already duplicated in existing data by the same rule. */
function filmDedupeKey(f){
  return f.watchedDate ? (f.title||'').trim().toLowerCase()+'|'+(f.year||'')+'|'+f.watchedDate : '';
}
function findFilmIndex(f, byId, byKey){
  if(byId.has(f.id)) return byId.get(f.id);
  const key = filmDedupeKey(f);
  return key && byKey.has(key) ? byKey.get(key) : null;
}
function indexFilmAt(list, byId, byKey, idx){
  byId.set(list[idx].id, idx);
  const key = filmDedupeKey(list[idx]);
  if(key) byKey.set(key, idx);
}
/* run once whenever the Diary loads, folding together anything the id-based merges above still
   let through (typically entries logged both by an earlier sync and a CSV import before this
   fallback existed) - keeps whichever side of each duplicate has the more complete data rather
   than just picking one arbitrarily */
function dedupeFilms(){
  const films = DB.films||[];
  const byKey = new Map();
  const kept = [];
  let merged = 0;
  const looksLikeUrl = s => /^https?:\/\//i.test(s||'');
  films.forEach(f=>{
    const key = filmDedupeKey(f);
    const priorIdx = key ? byKey.get(key) : undefined;
    if(priorIdx==null){ if(key) byKey.set(key, kept.length); kept.push(f); return; }
    const prior = kept[priorIdx];
    if(!looksLikeUrl(prior.id) && looksLikeUrl(f.id)) prior.id = f.id;
    if(!prior.link && f.link) prior.link = f.link;
    if(!prior.image && f.image) prior.image = f.image;
    if(!(prior.genres&&prior.genres.length) && f.genres&&f.genres.length) prior.genres = f.genres;
    if(prior.rating==null && f.rating!=null) prior.rating = f.rating;
    if(!prior.rewatch && f.rewatch) prior.rewatch = f.rewatch;
    merged++;
  });
  if(merged) DB.films = kept;
  return merged;
}
async function letterboxdConnectImpl(){
  const inp = $('#letterboxd-user-input');
  const u = (inp.value||'').trim().replace(/^@/,'');
  if(!u) return markErr('#letterboxd-user-input','Enter your Letterboxd username');
  saveLetterboxdUsername(u);
  await letterboxdSyncImpl();
}
async function letterboxdSyncImpl(){
  const u = letterboxdUsername(); if(!u) return;
  const el = $('#settings-letterboxd');
  if(el) el.innerHTML = `<div class="card"><p class="small muted">Syncing with Letterboxd…</p></div>`;
  try{
    const data = await fetch(psnUrl('/letterboxd-diary') + '?user=' + encodeURIComponent(u)).then(async r=>{
      if(!r.ok){
        const body = await r.json().catch(()=>({}));
        // the worker's own catch-all for a route it doesn't recognise returns this exact body -
        // a stale/not-yet-redeployed worker is a far more likely cause of a 404 here than an
        // actual bad username (which gets its own, more specific message from the route itself)
        if(r.status===404 && body.error==='not found') throw new Error("Your proxy is running an older version that doesn't have Letterboxd sync yet. Redeploy the worker in psn-proxy/ and this'll fill in.");
        throw new Error(body.error || ('status '+r.status));
      }
      return r.json();
    });
    const imported = data.films||[];
    DB.films = DB.films||[];
    const byId = new Map(DB.films.map((f,idx)=>[f.id, idx]));
    const byKey = new Map();
    DB.films.forEach((f,idx)=>{ const k = filmDedupeKey(f); if(k) byKey.set(k, idx); });
    let added=0, updated=0;
    imported.forEach(f=>{
      const existingIdx = findFilmIndex(f, byId, byKey);
      // the feed doesn't always have a poster for an entry - don't let a blank overwrite one
      // this film already has (from an earlier sync, a CSV import, or the backfill below)
      const existingImage = existingIdx!=null ? DB.films[existingIdx].image : '';
      const entry = {id:f.id, title:f.title, year:f.year, watchedDate:f.watchedDate,
        rating:f.rating, rewatch:f.rewatch, image:f.image||existingImage, link:f.link, source:'letterboxd'};
      if(existingIdx!=null){ DB.films[existingIdx] = entry; indexFilmAt(DB.films, byId, byKey, existingIdx); updated++; }
      else { DB.films.push(entry); indexFilmAt(DB.films, byId, byKey, DB.films.length-1); added++; }
    });
    saveFilms();
    drawLetterboxdConnect();
    drawFilmsGrid();
    toast(`Synced: ${added} new, ${updated} updated`);
    backfillPosters(DB.films, saveFilms).then(n => { if(n){ drawFilmsGrid(); toast(`Filled in details for ${n} film${n===1?'':'s'}`); } });
  }catch(e){
    const errEl = $('#settings-letterboxd'); if(!errEl) return;
    errEl.innerHTML = `<div class="card"><p class="small" style="color:var(--accent-dark)">Couldn't sync Letterboxd.<br>${esc(e.message||'')}</p>
      <div class="btn-row" style="margin-top:10px">
        <button class="btn sm" onclick="App.letterboxdSync()">Try Again</button>
        <button class="btn sm ghost" onclick="App.letterboxdDisconnect()">Disconnect</button>
      </div></div>`;
  }
}

  drawLetterboxdConnect();
}

/* ================= Films CSV import (full Letterboxd export) =================
   The RSS sync above only ever sees a free account's most recent ~50 diary entries - fine for
   staying current, not for a first-time backfill of a longer history. Letterboxd's own Settings
   -> Data -> Export Your Data has no such cap, so this reads that export's diary.csv directly,
   entirely client-side (no proxy, no setup, unlike the RSS sync) using the same merge-by-id
   logic as letterboxdSyncImpl - importing twice, or importing then later syncing, updates
   existing entries rather than duplicating them. Whatever tool produces the CSV doesn't matter
   as long as it's shaped like Letterboxd's own export (a Name column at minimum; Year,
   Letterboxd URI, Rating, Rewatch and Watched Date/Date fill in the rest when present). */
function parseCsv(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0; i<text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else inQuotes = false; }
      else field += c;
    }else{
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if(c === '\r'){ /* skip - \n follows on both \r\n and lone \r line endings */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f=>f.trim()!==''));
}
function filmsImportCsvImpl(){
  openModal(`
    <h2>Import from Letterboxd</h2>
    <p class="small muted" style="margin-bottom:14px">
      Connect Letterboxd's sync only ever sees your most recent ~50 diary entries. For your full
      history instead, get Letterboxd's own export - Settings &rsaquo; Data &rsaquo; Export Your
      Data on letterboxd.com, unzip the download, then pick <strong>diary.csv</strong> below.
      Importing again later (or syncing) updates entries already here rather than duplicating
      them, though an entry logged both ways may occasionally show up twice if the two don't
      agree on its identifier - safe to just delete the extra.
    </p>
    <div class="field"><label class="label" for="films-csv-file">diary.csv</label>
      <input type="file" id="films-csv-file" accept=".csv,text/csv" onchange="App.filmsImportCsvFile(this.files[0])"></div>
    <div id="films-csv-status"></div>`);

function filmsImportCsvFileImpl(file){
  if(!file) return;
  const status = $('#films-csv-status');
  if(status) status.innerHTML = `<p class="small muted" style="margin-top:10px">Reading…</p>`;
  const reader = new FileReader();
  reader.onerror = () => { const s = $('#films-csv-status'); if(s) s.innerHTML = `<p class="small" style="color:var(--accent-dark); margin-top:10px">Couldn't read that file.</p>`; };
  reader.onload = () => {
    const s = $('#films-csv-status');
    try{
      const rows = parseCsv(String(reader.result||''));
      if(!rows.length) throw new Error('No rows found in that file');
      const header = rows[0].map(h=>h.trim().toLowerCase());
      const col = name => header.indexOf(name);
      const iName = col('name'), iYear = col('year'), iUri = col('letterboxd uri'),
        iRating = col('rating'), iRewatch = col('rewatch'), iWatched = col('watched date'), iDate = col('date');
      if(iName<0) throw new Error("That doesn't look like a Letterboxd diary.csv - no Name column found");
      const imported = rows.slice(1).filter(r=>r[iName]).map(r => {
        const title = (r[iName]||'').trim();
        const year = (iYear>=0 ? r[iYear] : '')||'';
        const link = (iUri>=0 ? r[iUri] : '')||'';
        const ratingRaw = (iRating>=0 ? r[iRating] : '')||'';
        const rating = ratingRaw.trim() ? parseFloat(ratingRaw) : NaN;
        const rewatch = iRewatch>=0 && /^yes$/i.test((r[iRewatch]||'').trim());
        const watchedDate = ((iWatched>=0 && r[iWatched]) || (iDate>=0 && r[iDate]) || '').trim();
        return {
          id: link || [title, year, watchedDate].join('|'),
          title, year: year.trim() || null, watchedDate: watchedDate || null,
          rating: isNaN(rating) ? null : rating, rewatch, link, image: '',
        };
      }).filter(f=>f.title);
      if(!imported.length) throw new Error('No films found in that file');
      DB.films = DB.films||[];
      const byId = new Map(DB.films.map((f,idx)=>[f.id, idx]));
      const byKey = new Map();
      DB.films.forEach((f,idx)=>{ const k = filmDedupeKey(f); if(k) byKey.set(k, idx); });
      let added=0, updated=0;
      imported.forEach(f=>{
        const existingIdx = findFilmIndex(f, byId, byKey);
        // diary.csv carries no poster at all - never let that blank out an image this film
        // already has (backfillPosters below fills the rest in from scratch)
        const existingImage = existingIdx!=null ? DB.films[existingIdx].image : '';
        const entry = {id:f.id, title:f.title, year:f.year, watchedDate:f.watchedDate,
          rating:f.rating, rewatch:f.rewatch, image:existingImage||f.image, link:f.link, source:'letterboxd'};
        if(existingIdx!=null){ DB.films[existingIdx] = entry; indexFilmAt(DB.films, byId, byKey, existingIdx); updated++; }
        else { DB.films.push(entry); indexFilmAt(DB.films, byId, byKey, DB.films.length-1); added++; }
      });
      saveFilms();
      closeModal();
      drawFilmsGrid();
      toast(`Imported: ${added} new, ${updated} updated - filling in details…`);
      backfillPosters(DB.films, saveFilms).then(n => { drawFilmsGrid(); toast(n?`Filled in details for ${n} film${n===1?'':'s'}`:'Nothing more found'); });
    }catch(e){
      if(s) s.innerHTML = `<p class="small" style="color:var(--accent-dark); margin-top:10px">${esc(e.message||"Couldn't read that file")}</p>`;
    }
  };
  reader.readAsText(file);
}

/* ================= Films Watchlist =================
   Films worth watching, saved before you've actually seen them - its own Firebase node
   (DB.filmsWatchlist) rather than folded into the Diary (DB.films), so "meant to watch" and
   "actually watched" stay two different lists instead of one conflating a rating/date that
   doesn't exist yet. Search reuses the Log Film form's own TMDb-backed api/film-search.js -
   nothing new needed there. Marking one Watched hands off to the ordinary Log Film form
   (pre-filled), so the actual watched date/rating/rewatch still get entered same as any other
   diary entry - this list only ever remembers "want to", never "did". */
function loadFilmsWatchlistCloud(cb){
  if(!fbRoot){ cb(DB.filmsWatchlist||[]); return; }
  fbRoot.ref('filmsWatchlist').once('value')
    .then(snap => cb(snap.exists() ? snap.val() : (DB.filmsWatchlist||[])))
    .catch(() => cb(DB.filmsWatchlist||[]));
}

  if(!fbRoot) return;

      }else{

      }
    });
}

let FW_SEARCH_TIMER = null;
let FW_LAST_RESULTS = [];

/* shared by every "open this film on Letterboxd" link app-wide (Watchlist cards, and the Home
   dashboard's Last Seen/Watchlist-pick widgets) - a Diary entry synced from Letterboxd or a
   CSV-imported one carries the exact Letterboxd URI (that export's own column / the diary RSS
   guid); one logged by hand or added via TMDb search never has one, so the closest honest
   fallback is a Letterboxd search for its title - not the exact film page, but still one tap
   from it, and the best this app can do without its own Letterboxd film-id lookup */
function filmLetterboxdUrl(f){
  return f.link || ('https://letterboxd.com/search/films/'+encodeURIComponent(f.title||'')+'/');
}
/* UK streaming availability (Watch Next widget, Watchlist cards) - via api/film-providers.js,
   a Vercel function alongside this app rather than the psn-proxy Worker (same TMDB_API_KEY the
   Log Film search already needs, same same-origin/no-CORS reasoning as film-search.js).
   Cached client-side per title+year for the session, since Watch Next and a Watchlist card can
   easily land on the same film more than once in one visit. */
let FILM_PROVIDERS_CACHE = {};
/* bump this whenever api/film-providers.js's own de-dupe/filtering logic changes - the endpoint
   caches each title's response for 24h (Cache-Control), keyed by the full request URL, so a code
   fix alone doesn't touch anything already cached from before the fix shipped. Changing this
   query param gives every request a new cache key, forcing a fresh response immediately instead
   of waiting up to a day for the old cached one to expire on its own. */
const FILM_PROVIDERS_CACHE_VERSION = 2;
function fetchFilmProviders(title, year, cb){
  const key = (title||'')+'|'+(year||'');
  if(FILM_PROVIDERS_CACHE[key]){ cb(FILM_PROVIDERS_CACHE[key]); return; }
  fetch('/api/film-providers?v='+FILM_PROVIDERS_CACHE_VERSION+'&title='+encodeURIComponent(title||'')+(year?'&year='+encodeURIComponent(year):''))
    .then(res => res.ok ? res.json() : Promise.reject())
    .then(data => { FILM_PROVIDERS_CACHE[key] = data; cb(data); })
    .catch(() => { cb({providers: []}); });   // no key configured, or the lookup failed - just show nothing
}
/* which streaming services you actually have (Settings > Streaming Services) - a per-device
   preference like PSN_HIDDEN_KEY above, not synced anywhere. Unset (null from the getter) means
   "never configured" and shows every provider TMDb returns, same as always - only once the user
   actually touches a chip does this start filtering, so nobody sees an empty Watch Next widget
   just because they never opened Settings. `match` is deliberately loose (TMDb's exact provider
   name varies by title - "Disney Plus" vs "Disney+", "Now" vs "NOW") rather than requiring exact
   string equality against the picker's own label. */
const STREAMING_SERVICES_KEY = 'calstrippin_streaming_services';
const STREAMING_SERVICES = [
  {key:'netflix', label:'Netflix', match:/netflix/i},
  {key:'prime', label:'Amazon Prime Video', match:/prime video/i},
  {key:'disney', label:'Disney+', match:/disney/i},
  {key:'paramount', label:'Paramount+', match:/paramount/i},
  {key:'appletv', label:'Apple TV+', match:/apple tv/i},
  {key:'now', label:'NOW', match:/^now\b/i},
  {key:'iplayer', label:'BBC iPlayer', match:/iplayer/i},
  {key:'itvx', label:'ITVX', match:/itvx/i},
  {key:'channel4', label:'Channel 4', match:/channel ?4|all ?4/i},
  {key:'my5', label:'My5', match:/my ?5/i},
  {key:'britbox', label:'BritBox', match:/britbox/i},
  {key:'mubi', label:'MUBI', match:/mubi/i},
  {key:'sky', label:'Sky / NOW Cinema', match:/^sky/i},
  {key:'discovery', label:'Discovery+', match:/discovery/i},
];
function selectedStreamingServices(){
  try{
    const raw = localStorage.getItem(STREAMING_SERVICES_KEY);
    if(raw==null) return null;
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? new Set(arr) : null;
  }catch(e){ return null; }
}
function saveStreamingServices(set){ try{ localStorage.setItem(STREAMING_SERVICES_KEY, JSON.stringify([...set])); }catch(e){} }
function filterProvidersToOwned(providers){
  const selected = selectedStreamingServices();
  if(!selected) return providers;   // never configured - show everything, unfiltered
  const owned = STREAMING_SERVICES.filter(s => selected.has(s.key));
  return providers.filter(p => owned.some(s => s.match.test(p.name||'')));
}
/* provider logos only, no per-logo link and no on-screen credit line - each logo's own title
   attribute still names the service on hover/long-press. TMDb's terms for this endpoint ask for
   a JustWatch credit + link when the data's shown; dropped here at the user's explicit request
   in favour of a clean poster badge, so noting the tradeoff here for whoever finds this later. */
function filmProvidersHTML(data){
  if(!data || !data.providers || !data.providers.length) return '';
  const providers = filterProvidersToOwned(data.providers);
  if(!providers.length) return '';
  return `<div class="film-providers-badge">
    ${providers.map(p => p.logo
      ? `<img class="film-provider-logo" src="${esc(p.logo)}" alt="${esc(p.name)}" title="${esc(p.name)}" loading="lazy">`
      : `<span class="film-provider-name">${esc(p.name)}</span>`).join('')}
  </div>`;
}
/* the year that used to sit under the poster here is gone - the poster/provider row already
   fills that space now, and the year wasn't load-bearing information the way the title (kept
   only as a fallback when there's no poster) or the streaming logos are */

/* one lookup per visible card, fired right after drawFwMine renders the grid - each fills in
   independently (via fetchFilmProviders' own cache) rather than waiting on the slowest one */
function loadFwProviders(list){

    fetchFilmProviders(f.title, f.year, data => {
      const slot = document.querySelector(`[data-fw-providers="${CSS.escape(f.id)}"]`);
      if(slot) slot.innerHTML = filmProvidersHTML(data);
    });
  });
}

/* its own screen (openModal's "push" full-page mode - see that function's own comment) rather
   than a search box sitting inline at the foot of the Watchlist grid, the same way Log Film gets
   its own "+ Log Film" button/screen instead of living inline on the Diary. Each search is a
   real TMDb call (via the same api/film-search.js the Log Film form uses), so it waits for a
   pause in typing rather than firing per key, same as everywhere else this app searches a live
   catalogue. */
function fwAddFilmImpl(){
  openModal(`
    <h2>Find a Film</h2>
    <div class="field"><input type="text" id="fw-search" placeholder="Search for a film…"
      autocomplete="off" oninput="App.fwSearchInput()"></div>
    <div id="fw-results"></div>`);
}
function fwSearchInputImpl(){
  clearTimeout(FW_SEARCH_TIMER);
  const q = ($('#fw-search').value||'').trim();
  const results = $('#fw-results'); if(results) results.innerHTML = '';
  if(!q) return;
  FW_SEARCH_TIMER = setTimeout(()=>fwSearch(q), 400);
}
function fwSearch(q){
  const results = $('#fw-results'); if(!results) return;
  results.innerHTML = `<div class="empty">Searching…</div>`;
  fetch('/api/film-search?q=' + encodeURIComponent(q))
    .then(async r => {
      if(r.status===503) throw new Error("Film search isn't set up - add TMDB_API_KEY as a Vercel environment variable (see psn-proxy/README.md).");
      if(!r.ok){ const body = await r.json().catch(()=>({})); throw new Error(body.error || ('status '+r.status)); }
      return r.json();
    })
    .then(data => {
      const cur = $('#fw-results'); if(!cur) return;
      FW_LAST_RESULTS = data.films||[];
      cur.innerHTML = FW_LAST_RESULTS.length
        ? `<div class="film-grid">${FW_LAST_RESULTS.map(f=>fwResultCardHTML(f)).join('')}</div>`
        : `<div class="empty">No films match "${esc(q)}"</div>`;
    })
    .catch(e => {
      const cur = $('#fw-results'); if(!cur) return;
      cur.innerHTML = `<div class="empty">Couldn't search.<br>${esc(e.message||'')}</div>`;
    });
}
/* watchlist.csv is Letterboxd's export for the watchlist itself, a separate file from
   diary.csv - same shape minus Rating/Rewatch/Watched Date, which a watchlist entry doesn't
   have yet by definition. Reuses the same parseCsv() and the same posterless-until-backfilled
   situation as the Diary's CSV import (see backfillPosters). */
function filmsWatchlistImportCsvImpl(){
  openModal(`
    <h2>Import Watchlist from Letterboxd</h2>
    <p class="small muted" style="margin-bottom:14px">
      Get this from Letterboxd's own export - Settings &rsaquo; Data &rsaquo; Export Your Data on
      letterboxd.com, unzip the download, then pick <strong>watchlist.csv</strong> below (a
      separate file from diary.csv). Importing again later just updates entries already here
      rather than duplicating them.
    </p>
    <div class="field"><label class="label" for="fw-csv-file">watchlist.csv</label>
      <input type="file" id="fw-csv-file" accept=".csv,text/csv" onchange="App.fwImportCsvFile(this.files[0])"></div>
    <div id="fw-csv-status"></div>`);
}
function filmsWatchlistImportCsvFileImpl(file){
  if(!file) return;
  const status = $('#fw-csv-status');
  if(status) status.innerHTML = `<p class="small muted" style="margin-top:10px">Reading…</p>`;
  const reader = new FileReader();
  reader.onerror = () => { const s = $('#fw-csv-status'); if(s) s.innerHTML = `<p class="small" style="color:var(--accent-dark); margin-top:10px">Couldn't read that file.</p>`; };
  reader.onload = () => {
    const s = $('#fw-csv-status');
    try{
      const rows = parseCsv(String(reader.result||''));
      if(!rows.length) throw new Error('No rows found in that file');
      const header = rows[0].map(h=>h.trim().toLowerCase());
      const col = name => header.indexOf(name);
      const iName = col('name'), iYear = col('year'), iUri = col('letterboxd uri');
      if(iName<0) throw new Error("That doesn't look like a Letterboxd watchlist.csv - no Name column found");
      const imported = rows.slice(1).filter(r=>r[iName]).map(r => {
        const title = (r[iName]||'').trim();
        const year = ((iYear>=0 ? r[iYear] : '')||'').trim();
        const link = ((iUri>=0 ? r[iUri] : '')||'').trim();
        return { id: link || [title, year].join('|'), title, year: year || null, link, image: '' };
      }).filter(f=>f.title);
      if(!imported.length) throw new Error('No films found in that file');
      DB.filmsWatchlist = DB.filmsWatchlist||[];
      const byId = new Map(DB.filmsWatchlist.map((f,idx)=>[f.id, idx]));
      let added=0, updated=0;
      imported.forEach(f=>{
        const existingIdx = byId.get(f.id);
        const existingImage = existingIdx!=null ? DB.filmsWatchlist[existingIdx].image : '';
        const entry = {id:f.id, title:f.title, year:f.year, link:f.link, image:existingImage||f.image};
        if(existingIdx!=null){ DB.filmsWatchlist[existingIdx] = entry; updated++; }
        else { DB.filmsWatchlist.push(entry); byId.set(f.id, DB.filmsWatchlist.length-1); added++; }
      });
      saveFilmsWatchlist();
      closeModal();
      drawFwMine();
      toast(`Imported: ${added} new, ${updated} updated - filling in details…`);
      backfillPosters(DB.filmsWatchlist, saveFilmsWatchlist).then(n => { drawFwMine(); toast(n?`Filled in details for ${n} film${n===1?'':'s'}`:'Nothing more found'); });
    }catch(e){
      if(s) s.innerHTML = `<p class="small" style="color:var(--accent-dark); margin-top:10px">${esc(e.message||"Couldn't read that file")}</p>`;
    }
  };
  reader.readAsText(file);
}

/* ================= Films Stats =================
   Two breakdowns of the Diary - watched by year, and by rating - each row a live count that
   drills into its own filtered poster grid (App.filmsStatsYear/Rating -> a real #/films/stats/…
   route rather than living purely in memory, so the back button and a bookmark both land
   where you'd expect). Ratings are grouped
   by their exact value (half-stars included) rather than rounded to a whole star, since the
   data already carries that precision and rounding would just throw it away. */
function filmsStatsByYear(){
  const counts = new Map();
  (DB.films||[]).forEach(f=>{
    const key = f.watchedDate ? f.watchedDate.slice(0,4) : 'nodate';
    counts.set(key, (counts.get(key)||0)+1);
  });
  return counts;
}
function filmsStatsByRating(){
  const counts = new Map();
  (DB.films||[]).forEach(f=>{
    const key = f.rating==null ? 'none' : String(f.rating);
    counts.set(key, (counts.get(key)||0)+1);
  });
  return counts;
}
/* a bar per entry, height proportional to its count relative to the tallest bar - the count
   sits above the bar itself rather than needing a hover/tap to read it, and the whole bar is the
   click target (same filtered poster grid every row-style stat already drilled into). Height is
   a percentage of .stats-bar-track's own fixed pixel height, not the button's, so the count
   label sitting above it doesn't eat into that percentage's basis. */
function statsBarChartHTML(entries, onclickFn){
  const max = Math.max(1, ...entries.map(e=>e.count));
  return `<div class="stats-chart">
    ${entries.map(e => `
      <button type="button" class="stats-bar" onclick="${onclickFn(e.key)}" aria-label="${esc(String(e.label))}: ${e.count} film${e.count===1?'':'s'}">
        <span class="stats-bar-track">
          <span class="stats-bar-count">${e.count}</span>
          <span class="stats-bar-fill" style="height:${Math.round(Math.max(6, (e.count/max)*100))}%"></span>
        </span>
        <span class="stats-bar-label">${esc(String(e.label))}</span>
      </button>`).join('')}
  </div>`;
}
const FILM_RATING_VALUES = [5,4.5,4,3.5,3,2.5,2,1.5,1,0.5];
function renderFilmsStats(){
  const body = $('#films-body'); if(!body) return;
  drawFilmsStats();
  loadFilmsCloud(cloud => {
    DB.films = Array.isArray(cloud) ? cloud : [];
    saveLocal();
    if(CUR_FILMS_TAB==='stats') drawFilmsStats();
  });
}
function drawFilmsStats(){
  const body = $('#films-body'); if(!body) return;
  const films = DB.films||[];
  if(!films.length){ body.innerHTML = `<div class="empty">Log some films to see stats here.</div>`; return; }
  const rewatches = films.filter(f=>f.rewatch).length;
  const rated = films.filter(f=>f.rating!=null);
  const avgRating = rated.length ? (rated.reduce((s,f)=>s+f.rating,0)/rated.length) : null;

  const byYear = filmsStatsByYear();
  // ascending, oldest first - a chart reads left to right as a timeline, unlike the old list
  // (newest first, easier to scan as a plain list) it replaces
  const years = [...byYear.keys()].filter(k=>k!=='nodate').sort((a,b)=>a.localeCompare(b));
  const noDateCount = byYear.get('nodate')||0;
  const yearEntries = years.map(y=>({key:y, label:y, count:byYear.get(y)}));
  if(noDateCount) yearEntries.push({key:'nodate', label:'No Date', count:noDateCount});

  const byRating = filmsStatsByRating();
  const noRatingCount = byRating.get('none')||0;
  const ratingEntries = FILM_RATING_VALUES.slice().reverse()
    .filter(v=>byRating.get(String(v)))
    .map(v=>({key:v, label:v.toFixed(1), count:byRating.get(String(v))}));
  if(noRatingCount) ratingEntries.push({key:'none', label:'N/A', count:noRatingCount});

  body.innerHTML = `
    <div class="stat-overview-row">
      <div class="dash-widget dash-widget-stat" role="button" tabindex="0" onclick="CUR_FILMS_GENRE='';App.filmsTab('diary')"
        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();CUR_FILMS_GENRE='';App.filmsTab('diary')}">
        <div class="dash-stat-num">${films.length}</div><div class="dash-stat-label">Logged</div></div>
      <div class="dash-widget dash-widget-stat" role="button" tabindex="0" onclick="App.filmsStatsRewatches()"
        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();App.filmsStatsRewatches()}">
        <div class="dash-stat-num">${rewatches}</div><div class="dash-stat-label">Rewatches</div></div>
      <div class="dash-widget dash-widget-stat"><div class="dash-stat-num">${avgRating!=null?avgRating.toFixed(1):'—'}</div><div class="dash-stat-label">Avg Rating</div></div>
    </div>
    <h3 style="margin:20px 0 10px">By Year</h3>
    ${statsBarChartHTML(yearEntries, key => `App.filmsStatsYear('${key}')`)}
    <h3 style="margin:20px 0 10px">By Rating</h3>
    ${statsBarChartHTML(ratingEntries, key => `App.filmsStatsRating('${key}')`)}`;
}
function renderFilmsStatsFiltered(type, valueStr){
  const films = DB.films||[];
  let matched, title;
  if(type==='year'){
    if(valueStr==='nodate'){ matched = films.filter(f=>!f.watchedDate); title = 'No Date'; }
    else { matched = films.filter(f=>f.watchedDate && f.watchedDate.slice(0,4)===valueStr); title = valueStr; }
  }else if(type==='rating'){
    if(valueStr==='none'){ matched = films.filter(f=>f.rating==null); title = 'Not Rated'; }
    else { const v = parseFloat(valueStr); matched = films.filter(f=>f.rating===v); title = `★ ${v.toFixed(1)}`; }
  }else{
    matched = films.filter(f=>f.rewatch); title = 'Rewatches';
  }
  const ordered = matched.slice()
    .sort((a,b) => (b.watchedDate||'').localeCompare(a.watchedDate||'') || (a.title||'').localeCompare(b.title||''))
    .map(f => ({f, i: films.indexOf(f)}));
  $('#app').innerHTML = `
    <div class="crumb">
      <div class="crumb-titlerow" style="display:grid; grid-template-columns:1fr auto 1fr">
        <button class="btn sm ghost" style="justify-self:start" onclick="App.goFilmsStats()">${ICONS.back}Stats</button>
        <span class="crumb-here" style="text-align:center">${esc(title)}</span>
        <span class="gig-seen-pill" style="justify-self:end">${ordered.length}</span>
      </div>
    </div>
    <div id="films-grid">${ordered.length
      ? `<div class="film-grid">${ordered.map(o=>filmCardHTML(o.f,o.i)).join('')}</div>`
      : `<div class="empty">No films here.</div>`}</div>`;
}

/* ---------- theatre (stage shows: seen + want to see) ----------
   Mirrors Films' Diary/Watchlist split, but there's no TMDb-equivalent catalogue of stage
   productions to search - both lists are typed in by hand. Reuses Gigs' plain list-card look
   (no poster art suits a stage show any better than a gig) and Films' half-star rating dropdown
   (FILM_RATING_VALUES/filmRatingLabel are rating-agnostic - only the field's id is renamed). */
function loadTheatreCloud(cb){
  if(!fbRoot){ cb(DB.theatre||[]); return; }
  fbRoot.ref('theatre').once('value')
    .then(snap => cb(snap.exists() ? snap.val() : (DB.theatre||[])))
    .catch(() => cb(DB.theatre||[]));
}
function pushTheatre(){
  if(!fbRoot) return;
  fbRoot.ref('theatre').set(DB.theatre||[])
    .catch(err => {
      console.error("My Trips, couldn't save Theatre:", err);
      if(/permission[_-]?denied/i.test((err&&(err.code||err.message||err)||'').toString())){
        noteModal('Theatre Not Saved', "The database rules don't allow writing Theatre. Open the Firebase console, Realtime Database, Rules, and add a 'theatre' rule.");
      }else{
        noteModal('Not Saved', 'Check your connection and try again.');
      }
    });
}
function saveTheatre(){ saveLocal(); pushTheatre(); }

function loadTheatreWatchlistCloud(cb){
  if(!fbRoot){ cb(DB.theatreWatchlist||[]); return; }
  fbRoot.ref('theatreWatchlist').once('value')
    .then(snap => cb(snap.exists() ? snap.val() : (DB.theatreWatchlist||[])))
    .catch(() => cb(DB.theatreWatchlist||[]));
}
function pushTheatreWatchlist(){
  if(!fbRoot) return;
  fbRoot.ref('theatreWatchlist').set(DB.theatreWatchlist||[])
    .catch(err => {
      console.error("My Trips, couldn't save the Theatre watchlist:", err);
      if(/permission[_-]?denied/i.test((err&&(err.code||err.message||err)||'').toString())){
        noteModal('Watchlist Not Saved', "The database rules don't allow writing theatreWatchlist. Open the Firebase console, Realtime Database, Rules, and add a 'theatreWatchlist' rule.");
      }else{
        noteModal('Not Saved', 'Check your connection and try again.');
      }
    });
}
function saveTheatreWatchlist(){ saveLocal(); pushTheatreWatchlist(); }

/* targets its own #theatre-list, not the shared #theatre-body - the Watchlist tab reuses that

          <button class="iconbtn edit" aria-label="Edit show" title="Edit" onclick="App.theatreForm(${i})">${ICONS.edit}</button>
          <button class="iconbtn del" aria-label="Remove show" title="Remove" onclick="App.delTheatre(${i})">${ICONS.trash}</button>
        </div>

      ${t.notes?`<div class="small muted" style="margin-top:8px">${esc(t.notes)}</div>`:''}

  return `<div class="field"><label class="label" for="theatre-rating">Rating</label>

      <option value=""${value==null?' selected':''}>No rating</option>

}
/* no catalogue exists to search for a stage show's poster the way Log Film searches TMDb - this
