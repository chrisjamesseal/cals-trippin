/* shared by every "open this film on Letterboxd" link app-wide (Watchlist cards, and the Home
   dashboard's Last Seen/Watchlist-pick widgets) - a Diary entry synced from Letterboxd or a
   CSV-imported one carries the exact Letterboxd URI (that export's own column / the diary RSS
   guid); one logged by hand or added via TMDb search never has one, so the closest honest
   fallback is a Letterboxd search for its title - not the exact film page, but still one tap
   from it, and the best this app can do without its own Letterboxd film-id lookup */
function filmLetterboxdUrl(f){
  return f.link || ('https://letterboxd.com/search/films/'+encodeURIComponent(f.title||'')+'/');
}
function fwMineCardHTML(f){
  return `
    <div class="film-card">
      <a href="${esc(filmLetterboxdUrl(f))}" target="_blank" rel="noopener" aria-label="${esc(f.title||'Film')} on Letterboxd">
        ${f.image ? `<img class="film-poster" src="${esc(f.image)}" alt="" loading="lazy">`
                   : `<span class="film-poster film-poster-fallback" aria-hidden="true">${fa('film')}</span>`}
        <div class="film-title">${esc(f.title||'Untitled')}</div>
      </a>

   diary.csv - same shape minus Rating/Rewatch/Watched Date, which a watchlist entry doesn't
   have yet by definition. Reuses the same parseCsv() and the same posterless-until-backfilled
   situation as the Diary's CSV import (see backfillPosters). */
function filmsWatchlistImportCsvImpl(){
  openModal(`
    <h2>Import Watchlist from Letterboxd</h2>
    <p class="small muted" style="margin-bottom:14px">
      Get this from Letterboxd's own export - Settings &rsaquo; Data &rsaquo; Export Your Data on
      letterboxd.com, unzip the download, then pick <strong>watchlist.csv</strong> below (a
      separate file from diary.csv). Importing again later just updates entries already here
      rather than duplicating them.
    </p>
    <div class="field"><label class="label" for="fw-csv-file">watchlist.csv</label>
      <input type="file" id="fw-csv-file" accept=".csv,text/csv" onchange="App.fwImportCsvFile(this.files[0])"></div>
    <div id="fw-csv-status"></div>`);
}
function filmsWatchlistImportCsvFileImpl(file){
  if(!file) return;
  const status = $('#fw-csv-status');
  if(status) status.innerHTML = `<p class="small muted" style="margin-top:10px">Reading…</p>`;
  const reader = new FileReader();
  reader.onerror = () => { const s = $('#fw-csv-status'); if(s) s.innerHTML = `<p class="small" style="color:var(--accent-dark); margin-top:10px">Couldn't read that file.</p>`; };
  reader.onload = () => {
    const s = $('#fw-csv-status');
    try{
      const rows = parseCsv(String(reader.result||''));
      if(!rows.length) throw new Error('No rows found in that file');
      const header = rows[0].map(h=>h.trim().toLowerCase());
      const col = name => header.indexOf(name);
      const iName = col('name'), iYear = col('year'), iUri = col('letterboxd uri');
      if(iName<0) throw new Error("That doesn't look like a Letterboxd watchlist.csv - no Name column found");
      const imported = rows.slice(1).filter(r=>r[iName]).map(r => {
        const title = (r[iName]||'').trim();
        const year = ((iYear>=0 ? r[iYear] : '')||'').trim();
        const link = ((iUri>=0 ? r[iUri] : '')||'').trim();
        return { id: link || [title, year].join('|'), title, year: year || null, link, image: '' };
      }).filter(f=>f.title);
      if(!imported.length) throw new Error('No films found in that file');
      DB.filmsWatchlist = DB.filmsWatchlist||[];
      const byId = new Map(DB.filmsWatchlist.map((f,idx)=>[f.id, idx]));
      let added=0, updated=0;
      imported.forEach(f=>{
        const existingIdx = byId.get(f.id);
        const existingImage = existingIdx!=null ? DB.filmsWatchlist[existingIdx].image : '';
        const entry = {id:f.id, title:f.title, year:f.year, link:f.link, image:existingImage||f.image};
        if(existingIdx!=null){ DB.filmsWatchlist[existingIdx] = entry; updated++; }
        else { DB.filmsWatchlist.push(entry); byId.set(f.id, DB.filmsWatchlist.length-1); added++; }
      });
      saveFilmsWatchlist();
      closeModal();
      drawFwMine();
      toast(`Imported: ${added} new, ${updated} updated - filling in details…`);
      backfillPosters(DB.filmsWatchlist, saveFilmsWatchlist).then(n => { drawFwMine(); toast(n?`Filled in details for ${n} film${n===1?'':'s'}`:'Nothing more found'); });
    }catch(e){
      if(s) s.innerHTML = `<p class="small" style="color:var(--accent-dark); margin-top:10px">${esc(e.message||"Couldn't read that file")}</p>`;
    }
  };
  reader.readAsText(file);
}

/* ================= Films Stats =================
   Two breakdowns of the Diary - watched by year, and by rating - each row a live count that
   drills into its own filtered poster grid (App.filmsStatsYear/Rating -> a real #/films/stats/…
   route, the same way News' own articles get their own #/news/<i> rather than living purely in
   memory, so the back button and a bookmark both land where you'd expect). Ratings are grouped
   by their exact value (half-stars included) rather than rounded to a whole star, since the
   data already carries that precision and rounding would just throw it away. */
function filmsStatsByYear(){
  const counts = new Map();
  (DB.films||[]).forEach(f=>{
    const key = f.watchedDate ? f.watchedDate.slice(0,4) : 'nodate';
    counts.set(key, (counts.get(key)||0)+1);
  });
  return counts;
}
function filmsStatsByRating(){
  const counts = new Map();
  (DB.films||[]).forEach(f=>{
    const key = f.rating==null ? 'none' : String(f.rating);
    counts.set(key, (counts.get(key)||0)+1);
  });
  return counts;
}
/* a bar per entry, height proportional to its count relative to the tallest bar - the count
   sits above the bar itself rather than needing a hover/tap to read it, and the whole bar is the
   click target (same filtered poster grid every row-style stat already drilled into). Height is
   a percentage of .stats-bar-track's own fixed pixel height, not the button's, so the count
   label sitting above it doesn't eat into that percentage's basis. */
function statsBarChartHTML(entries, onclickFn){
  const max = Math.max(1, ...entries.map(e=>e.count));
  return `<div class="stats-chart">
    ${entries.map(e => `
      <button type="button" class="stats-bar" onclick="${onclickFn(e.key)}" aria-label="${esc(String(e.label))}: ${e.count} film${e.count===1?'':'s'}">
        <span class="stats-bar-track">
          <span class="stats-bar-count">${e.count}</span>
          <span class="stats-bar-fill" style="height:${Math.round(Math.max(6, (e.count/max)*100))}%"></span>
        </span>
        <span class="stats-bar-label">${esc(String(e.label))}</span>
      </button>`).join('')}
  </div>`;
}
const FILM_RATING_VALUES = [5,4.5,4,3.5,3,2.5,2,1.5,1,0.5];
function renderFilmsStats(){
  const body = $('#films-body'); if(!body) return;
  drawFilmsStats();

function drawFilmsStats(){
  const body = $('#films-body'); if(!body) return;
  const films = DB.films||[];
  if(!films.length){ body.innerHTML = `<div class="empty">Log some films to see stats here.</div>`; return; }
  const rewatches = films.filter(f=>f.rewatch).length;
  const rated = films.filter(f=>f.rating!=null);
  const avgRating = rated.length ? (rated.reduce((s,f)=>s+f.rating,0)/rated.length) : null;

  const byYear = filmsStatsByYear();
  // ascending, oldest first - a chart reads left to right as a timeline, unlike the old list
  // (newest first, easier to scan as a plain list) it replaces
  const years = [...byYear.keys()].filter(k=>k!=='nodate').sort((a,b)=>a.localeCompare(b));
  const noDateCount = byYear.get('nodate')||0;
  const yearEntries = years.map(y=>({key:y, label:y, count:byYear.get(y)}));
  if(noDateCount) yearEntries.push({key:'nodate', label:'No Date', count:noDateCount});

  const byRating = filmsStatsByRating();
  const noRatingCount = byRating.get('none')||0;
  const ratingEntries = FILM_RATING_VALUES.slice().reverse()
    .filter(v=>byRating.get(String(v)))
    .map(v=>({key:v, label:v.toFixed(1), count:byRating.get(String(v))}));
  if(noRatingCount) ratingEntries.push({key:'none', label:'N/A', count:noRatingCount});

  body.innerHTML = `
    <div class="stat-overview-row">
      <div class="dash-widget dash-widget-stat" role="button" tabindex="0" onclick="CUR_FILMS_GENRE='';App.filmsTab('diary')"
        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();CUR_FILMS_GENRE='';App.filmsTab('diary')}">
        <div class="dash-stat-num">${films.length}</div><div class="dash-stat-label">Logged</div></div>
      <div class="dash-widget dash-widget-stat" role="button" tabindex="0" onclick="App.filmsStatsRewatches()"
        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();App.filmsStatsRewatches()}">
        <div class="dash-stat-num">${rewatches}</div><div class="dash-stat-label">Rewatches</div></div>
      <div class="dash-widget dash-widget-stat"><div class="dash-stat-num">${avgRating!=null?avgRating.toFixed(1):'—'}</div><div class="dash-stat-label">Avg Rating</div></div>
    </div>
    <h3 style="margin:20px 0 10px">By Year</h3>
    ${statsBarChartHTML(yearEntries, key => `App.filmsStatsYear('${key}')`)}
    <h3 style="margin:20px 0 10px">By Rating</h3>
    ${statsBarChartHTML(ratingEntries, key => `App.filmsStatsRating('${key}')`)}`;
}
function renderFilmsStatsFiltered(type, valueStr){
  const films = DB.films||[];
  let matched, title;
  if(type==='year'){
    if(valueStr==='nodate'){ matched = films.filter(f=>!f.watchedDate); title = 'No Date'; }
    else { matched = films.filter(f=>f.watchedDate && f.watchedDate.slice(0,4)===valueStr); title = valueStr; }
  }else if(type==='rating'){
    if(valueStr==='none'){ matched = films.filter(f=>f.rating==null); title = 'Not Rated'; }
    else { const v = parseFloat(valueStr); matched = films.filter(f=>f.rating===v); title = `★ ${v.toFixed(1)}`; }
  }else{
    matched = films.filter(f=>f.rewatch); title = 'Rewatches';
  }
  const ordered = matched.slice()
    .sort((a,b) => (b.watchedDate||'').localeCompare(a.watchedDate||'') || (a.title||'').localeCompare(b.title||''))
    .map(f => ({f, i: films.indexOf(f)}));
  $('#app').innerHTML = `
    <div class="crumb">
      <div class="crumb-titlerow" style="display:grid; grid-template-columns:1fr auto 1fr">
        <button class="btn sm ghost" style="justify-self:start" onclick="App.goFilmsStats()">${ICONS.back}Stats</button>
        <span class="crumb-here" style="text-align:center">${esc(title)}</span>
        <span class="gig-seen-pill" style="justify-self:end">${ordered.length}</span>
      </div>
    </div>
    <div id="films-grid">${ordered.length
      ? `<div class="film-grid">${ordered.map(o=>filmCardHTML(o.f,o.i)).join('')}</div>`
      : `<div class="empty">No films here.</div>`}</div>`;
}

function route(){
  closeModal(); closeMenu();
  // #app is reused across routes (innerHTML swapped, not replaced), so a data-tab left over
  // from a previous trip visit would otherwise persist onto the hub/Places pages too
  const appEl = $('#app'); if(appEl) delete appEl.dataset.tab;
  // baseline for every route - a page that isn't a trip (Games, Design...) has no other call
  // to renderSidebar of its own; the trip route below overrides this with the fuller trip menu
  renderSidebar(null);
  if(!pinOk()){ CUR_TRIP_ID = null; stopSub(); renderPinGate(); renderTabbar(); return; }
  setTimeout(renderTabbar, 0);   // after whichever render below has settled CUR_TRIP_ID/CUR_TAB
  const h = location.hash;
  /* Home is the app's front door now - Places used to answer the bare hash (see its own
     comment below), redirected here instead so every "active tab" check keyed on '#/home'
     still works without needing to also recognise the bare hash as home */
  if(h === '' || h === '#/'){ location.hash = '#/home'; return; }
  if(h === '#/changelog'){
    renderChangelog(); window.scrollTo(0,0); return;
  }
  if(h === '#/home'){
    CUR_TRIP_ID = null; stopSub();
    renderDashboard(); window.scrollTo(0,0); return;
  }
  /* '#/places/been' and friends are the three list screens under the Places hub */
  if(h === '#/places' || h.startsWith('#/places/')){
    const v = h.split('/')[2];
    CUR_TRIP_ID = null; stopSub();
    if(!v){ renderPlacesHub(); window.scrollTo(0,0); return; }
    renderPlaces(v); window.scrollTo(0,0); return;
  }
  if(h === '#/games'){
    CUR_TRIP_ID = null; stopSub();
    renderGames(); window.scrollTo(0,0); return;
  }
  if(h === '#/settings'){
    CUR_TRIP_ID = null; stopSub();
    renderSettings(); window.scrollTo(0,0); return;
  }
  if(h === '#/gigs'){
    CUR_TRIP_ID = null; stopSub();
    renderGigs(); window.scrollTo(0,0); return;
  }
  if(h === '#/films'){
    CUR_TRIP_ID = null; stopSub();
    renderFilms(); window.scrollTo(0,0); return;
  }
  if(h === '#/plants'){
    CUR_TRIP_ID = null; stopSub();
    renderPlants(); window.scrollTo(0,0); return;
  }
  if(h.startsWith('#/films/stats/year/')){
    CUR_TRIP_ID = null; stopSub();
    renderFilmsStatsFiltered('year', decodeURIComponent(h.slice('#/films/stats/year/'.length)));
    window.scrollTo(0,0); return;
  }
  if(h.startsWith('#/films/stats/rating/')){
    CUR_TRIP_ID = null; stopSub();
    renderFilmsStatsFiltered('rating', decodeURIComponent(h.slice('#/films/stats/rating/'.length)));
    window.scrollTo(0,0); return;
  }
  if(h === '#/films/stats/rewatches'){
    CUR_TRIP_ID = null; stopSub();
    renderFilmsStatsFiltered('rewatch', ''); window.scrollTo(0,0); return;
  }
  if(h.startsWith('#/news/')){
    CUR_TRIP_ID = null; stopSub();
    renderNewsArticle(+h.slice('#/news/'.length)); window.scrollTo(0,0); return;
  }
  if(h === '#/news'){
    CUR_TRIP_ID = null; stopSub();
    renderNews(); window.scrollTo(0,0); return;
  }
  if(h.startsWith('#/view/')){
    // legacy snapshot link, adopt the trip locally, then switch to the stable per-trip URL
    try{
      const snap = JSON.parse(LZString.decompressFromEncodedURIComponent(h.slice(7)));
      if(!snap || !snap.name || !snap.id) throw 0;
      if(!getTrip(snap.id)){ DB.trips.unshift(snap); saveLocal(); }
      location.hash = '#/trip/'+snap.id; return;
    }catch(e){
      CUR_TRIP_ID = null; stopSub();
          $('#app').innerHTML = `<div class="empty" style="margin-top:40px">This trip link appears to be broken or incomplete.<br>Ask whoever set it up to send it again.</div>`;
    }
  } else if(h.startsWith('#/trip/')){
    openTrip(h.slice(7).split('/')[0]);
  } else if(h === '#/trips'){
    CUR_TRIP_ID = null; stopSub(); renderHome();
  } else {
    /* fallback for a broken/unrecognised hash - the bare hash itself is handled above */
    CUR_TRIP_ID = null; stopSub(); renderPlacesHub();
  }
  window.scrollTo(0,0);
}
function openTrip(id){
  CUR_TAB = 'home';   // opening a trip always lands on the dashboard
  CUR_TRIP_ID = id;
  // 'busy' until the real .info/connected listener (in initCloud) confirms the connection,
  // don't claim Synced before Firebase has actually said so
  syncState = cloudEnabled() ? 'busy' : 'local';
  subscribeTrip(id);
  const local = getTrip(id);
  if(local){
    renderTrip(local);
  } else if(fbRoot){
      $('#app').innerHTML = `<div class="empty" style="margin-top:40px">Loading trip…</div>`;
    fetchTripOnce(id, remote=>{
      if(CUR_TRIP_ID!==id) return;
      if(remote){
        normalizeTrip(remote);
        if(!getTrip(id)){ DB.trips.unshift(remote); saveLocal(); }
        const t = getTrip(id); renderTrip(t);
      } else {
        $('#app').innerHTML = `<div class="empty" style="margin-top:40px">We couldn't find this trip.<br>Ask whoever set it up to share the link again.</div>`;

    });

  }
}

/* ================= plants (vegetable growing tracker) ================= */
const PLANT_STAGES = [
  {k:'seed', label:'Seed Sown'},
  {k:'sprout', label:'Sprouted'},
  {k:'growing', label:'Growing'},
  {k:'flowering', label:'Flowering / Fruiting'},
  {k:'ready', label:'Ready to Harvest'},
  {k:'harvested', label:'Harvested'},
];
const PLANT_EMOJIS = ['🍅','🥕','🥬','🥦','🌽','🥒','🫑','🧄','🧅','🥔','🍆','🫛','🌶️','🍓','🫐','🍇','🎃','🍉','🌱'];
/* a handful of common name -> emoji matches so a fresh vegetable often gets the right icon
   picked automatically as soon as its name is typed - plantNameInputImpl only applies this
   while the emoji hasn't been touched by hand (PLANT_FORM_EMOJI_MANUAL), so picking one
   yourself always wins over the guess */
const PLANT_EMOJI_GUESS = [
  [/tomato/,'🍅'], [/carrot/,'🥕'], [/lettuce|spinach|kale|chard|leaf/,'🥬'], [/broccoli/,'🥦'],
  [/corn|maize/,'🌽'], [/cucumber/,'🥒'], [/pepper/,'🫑'], [/chilli|chili/,'🌶️'],
  [/garlic/,'🧄'], [/onion|leek|shallot/,'🧅'], [/potato/,'🥔'], [/aubergine|eggplant/,'🍆'],
  [/pea/,'🫛'], [/strawberr/,'🍓'], [/blueberr/,'🫐'], [/grape/,'🍇'],
  [/pumpkin|squash|courgette|zucchini/,'🎃'], [/melon/,'🍉'],
];
function guessPlantEmoji(name){
  const n = (name||'').trim().toLowerCase();
  if(!n) return '';
  const hit = PLANT_EMOJI_GUESS.find(([re])=>re.test(n));
  return hit ? hit[1] : '';
}
function daysSinceStr(dateStr){
  if(!dateStr) return null;
  return Math.round((new Date(todayStr()+'T00:00:00') - new Date(dateStr+'T00:00:00')) / 86400000);
}
function plantOverdue(p){
  const since = daysSinceStr(p.lastWatered);
  return since===null || since>=(p.wateringFrequencyDays||3);
}
/* the single most useful thing to say about a plant right now: overdue watering trumps
   everything else (letting it dry out undoes any other progress), then how close it is to
   harvest, otherwise just a steady "looking good" - each card only ever shows the one tip
   that matters most, not a wall of every fact it has */
function plantTip(p){
  if(plantOverdue(p)) return {text:'💧 Needs watering', cls:'plant-tip-warn'};
  if(p.stage==='ready') return {text:'🌟 Ready to harvest!', cls:'plant-tip-good'};
  if(p.stage==='flowering') return {text:'👀 Getting close - check daily', cls:'plant-tip-info'};
  if(p.stage==='harvested') return {text:'✅ All harvested', cls:'plant-tip-good'};
  return {text:'✅ Looking good', cls:'plant-tip-good'};
}
function plantStageIdx(k){ const i = PLANT_STAGES.findIndex(s=>s.k===k); return i<0 ? 0 : i; }
function plantStageDotsHTML(k){
  const cur = plantStageIdx(k);
  return PLANT_STAGES.map((s,i)=>`<span class="plant-dot${i<=cur?' on':''}"></span>`).join('');
}
/* overdue-watering plants float to the top (the thing most worth noticing at a glance),
   harvested ones sink to the bottom (done, least worth the eye), everything else by name */
function plantsSorted(){
  return [...(DB.plants||[])].sort((a,b)=>{
    if((a.stage==='harvested') !== (b.stage==='harvested')) return a.stage==='harvested' ? 1 : -1;
    const oa = plantOverdue(a), ob = plantOverdue(b);
    if(oa !== ob) return oa ? -1 : 1;
    return (a.name||'').localeCompare(b.name||'');
  });
}
function plantCardHTML(p){
  const tip = plantTip(p);
  const since = daysSinceStr(p.lastWatered);
  const waterLabel = since===null ? 'Never watered' : since===0 ? 'Watered today' : `Watered ${since} day${since===1?'':'s'} ago`;
  return `
    <div class="card plant-card" role="button" tabindex="0" onclick="App.plantForm('${esc(p.id)}')"
      onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();App.plantForm('${esc(p.id)}')}">
      <div class="plant-emoji" aria-hidden="true">${p.emoji||'🌱'}</div>
      <div class="plant-name">${esc(p.name||'Untitled')}</div>
      <div class="plant-stage-label">${esc((PLANT_STAGES[plantStageIdx(p.stage)]||{}).label||'')}</div>
      <div class="plant-dots" aria-hidden="true">${plantStageDotsHTML(p.stage)}</div>
      <div class="plant-tip ${tip.cls}">${tip.text}</div>
      <div class="plant-water-row">
        <span class="plant-water-label">${waterLabel}</span>
        <button class="btn sm" onclick="event.stopPropagation();App.plantWater('${esc(p.id)}')">💧 Watered Today</button>
      </div>
    </div>`;
}
function drawPlantsGrid(){
  const grid = $('#plants-grid'); if(!grid) return;

/* who's coming, trimmed so a big group can't push a card out of shape. limit defaults to 3
   (tight spots like the Edit Trip tile's one-line summary); the trip card itself passes a
   higher one, since it has the room to actually list a bigger group. */
function peopleSummary(t, empty, limit){
  limit = limit || 3;
  const people = t.participants||[];
  if(!people.length) return empty || '';
  if(people.length <= limit) return people.join(', ');
  return `${people.slice(0,limit-1).join(', ')} +${people.length-(limit-1)} more`;
}
function tripCardHTML(t){
  const people = peopleSummary(t, '', 8);
  return `
    <div class="trip-card ${isArchived(t)?'archived':''}" role="button" tabindex="0"
         onclick="location.hash='#/trip/${t.id}'"
         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();location.hash='#/trip/${t.id}'}">
      ${tripFlags(t)?`<div class="trip-flags">${tripFlags(t)}</div>`:''}
      <h3>${esc(t.name)}</h3>
      ${t.destination?`<div class="muted">${esc(t.destination)}</div>`:''}
      <div class="small" style="margin-top:8px">${esc(tripWhenLine(t))}</div>
      ${people?`<div class="small muted trip-people">${fa('user')}<span class="trip-people-names">${esc(people)}</span></div>`:''}
      <div style="margin-top:12px">${statusPill(t)}</div>
    </div>`;
}
function homeGridHTML(trips, loading){
  if(!trips.length){
    // while trips are still being fetched from the cloud, "No trips yet" would be
    // misleading, it hasn't actually checked yet, so say so instead
    return loading ? `<div class="empty" style="margin-top:24px">Loading trips…</div>` : `<div class="empty" style="margin-top:24px">
      No trips yet.<br><br>
      <button class="btn primary" onclick="App.newTrip()">Create Your First Trip</button>
    </div>`;
  }
  /* Everything not yet archived sits in one chronological line, soonest date first - that
     puts trips still to come first, in the order they'll happen, and a trip that just ended
     right at the top of what's left (its date is the most recent one in the past), so it
     doesn't drop out of sight the moment it's over. Only once a trip's been over for two
     weeks (isArchived) does it fall out of this line entirely, to the very bottom, faded,
     oldest-ended first. A trip with only a rough idea of when sorts by that, so "Summer 2027"
     sits where it belongs rather than at one end. */
  const soonestFirst = (a,b) => (tripSortDate(a)||'9999').localeCompare(tripSortDate(b)||'9999');
  const latestFirst  = (a,b) => (tripSortDate(b)||'').localeCompare(tripSortDate(a)||'');
  const ordered = trips.filter(t=>!isArchived(t)).sort(soonestFirst)
    .concat(trips.filter(isArchived).sort(latestFirst));
  return `<div class="trip-grid">${ordered.map(tripCardHTML).join('')}</div>`;
}
/* everyone who's entered the PIN can see every trip, not just the ones this particular
   browser happened to create or open before, so the full list comes from Firebase itself
   rather than this browser's local index. Falls back to the local list when cloud sync
   isn't configured, or if the fetch fails for any reason. */
let _listErrorToasted = false;
function fetchAllTrips(cb){
  if(!fbRoot){ cb(DB.trips); return; }
  fbRoot.ref('trips').once('value')
    .then(snap => {
      const val = snap.val() || {};
      const merged = Object.values(val).map(r => {
        normalizeTrip(r);
        const local = getTrip(r.id);
        return local ? mergeRemote(local, r) : r;
      });
      cb(merged);
    })
    .catch(err => {
      console.error("My Trips, couldn't list trips from the cloud:", err);
      if(!_listErrorToasted && /permission[_-]?denied/i.test((err&&(err.code||err.message||err)||'').toString())){
        _listErrorToasted = true;
        noteModal("Can't See Everyone's Trips", 'The database rules only allow reading one trip at a time. Open the Firebase console, Realtime Database, Rules, and add a top-level read rule for trips alongside the existing one.');
      }
      cb(DB.trips);
    });
}

/* ---- backup / restore ----
   No longer surfaced anywhere: trips sync to the cloud, so the buttons were clutter. Kept
   reachable from the console (App.exportTrips() / App.importTrips(input)) as a manual escape
   hatch, since losing every trip with no way to pull a copy out would be a bad day. */
App.exportTrips = () => {
  const blob = new Blob([JSON.stringify({app:'cals-trippin', schema:SCHEMA, exportedAt:Date.now(), trips:DB.trips}, null, 0)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `cals-trippin-backup-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast(`Backed up ${DB.trips.length} trip${DB.trips.length===1?'':'s'}`);
};
App.importTrips = input => {
  const file = input.files[0]; input.value=''; if(!file) return;
  const fr = new FileReader();
  fr.onload = e => {
    let data;
    try{ data = JSON.parse(e.target.result); }catch(err){ noteModal('Bad Backup File', "That file isn't a valid backup."); return; }
    const trips = Array.isArray(data) ? data : (data && data.trips);
    if(!Array.isArray(trips) || !trips.length){ noteModal('Nothing To Restore', 'No trips were found in that file.'); return; }
    let added=0, updated=0;
    trips.forEach(t=>{
      if(!t || !t.id || !t.name) return;
      normalizeTrip(t);
      const i = DB.trips.findIndex(x=>x.id===t.id);
      if(i<0){ DB.trips.unshift(t); added++; }
      else { DB.trips[i] = t; updated++; }        // incoming copy wins on a straight restore
    });
    saveLocal();
    if(fbRoot) trips.forEach(t=>{ if(t && t.id) pushTrip(t); });   // seed the cloud too, if on
    renderHome();
    toast(`Restored ${added} new · ${updated} updated`);
  };
  fr.readAsText(file);
};

App.copyText = (enc, btn) => {
  const text = decodeURIComponent(enc);

    if(!btn) return;
    const was = btn.innerHTML;
    btn.innerHTML = `<span class="sec-emoji" aria-hidden="true">✅</span>`;
    setTimeout(()=>{ btn.innerHTML = was; }, 1200);

/* Inside an iOS home-screen web app a target=_blank link opens Apple's cut-down in-app
   browser: no saved Google login, no password autofill, and no handoff to the Google Flights
   app. x-safari-https: hands the URL to Safari proper instead. It's an undocumented Apple
   scheme, so if it does nothing we're still here a moment later and fall back to the ordinary
   new tab. Every other platform is left completely alone. */
function iosStandalone(){
  return /iP(hone|ad|od)/.test(navigator.userAgent) && window.navigator.standalone === true;
}
App.openExternal = (ev, url) => {
  if(!iosStandalone()) return true;          // let the plain link do its job everywhere else
  ev.preventDefault();
  /* window.open() in a home-screen app IS the in-app browser, so this fallback only exists for
     the case where x-safari- silently did nothing.

     Cancelling it on the way out isn't enough on its own. iOS SUSPENDS timers while the app is
     backgrounded rather than running them, so a fallback still pending when Safari took over
     would fire on the way back IN - which is why an article or a map you'd already read in
     Safari was sitting there in the in-app browser when you returned, waiting to be dismissed.

     So the timer checks, at the moment it fires, whether it still makes sense: the app must
     have stayed visible throughout, and no more wall-clock time may have passed than the delay
     itself. A suspended-then-resumed timer fails both. */
  const DELAY = 900;
  const startedAt = Date.now();
  let leftTheApp = false;
  const events = ['visibilitychange','pagehide','blur'];
  const noteLeaving = () => { leftTheApp = true; };
  const stopListening = () => events.forEach(e => window.removeEventListener(e, noteLeaving));
  events.forEach(e => window.addEventListener(e, noteLeaving));
  setTimeout(() => {
    stopListening();
    if(leftTheApp || document.hidden || Date.now() - startedAt > DELAY + 400) return;
    window.open(url, '_blank', 'noopener');
  }, DELAY);
  location.href = 'x-safari-' + url;
  return false;
};

   it when it does nothing itself (the non-iOS-standalone case) - for a click target that isn't
   an anchor (the flight card's head), that fallback has to be done by hand instead */

App.saveTrip = () => {
  const t = getTrip(CUR_TRIP_ID); if(!t) return;
  const name = $('#et-name').value.trim();
  if(!name) return markErr('#et-name','Give the trip a name');
  const w = readWhenFields('et');
  const wasRough = hasRoughWhen(t), oldStart = t.startDate;
  t.name = name; t.startDate = w.startDate; t.endDate = w.endDate;
  /* switching to exact dates has to clear the rough idea, or hasRoughWhen would keep
     answering yes and the trip would show both */
  if(w.when) t.when = w.when; else delete t.when;
  /* Pinning the dates down shouldn't throw away the plan. A day number becomes the date it
     lands on, and going the other way a date becomes the day of the trip it fell on, so
     "Day 3: beach" survives the trip becoming real and vice versa. */
  if(wasRough && !w.when && t.startDate){
    (t.itinerary||[]).forEach(s=>{ if(s.day){ s.date = isoAddDays(t.startDate, s.day-1); s.day = 0; } });
  } else if(!wasRough && w.when && oldStart){
    (t.itinerary||[]).forEach(s=>{
      if(!s.date) return;
      const n = Math.round((new Date(s.date+'T00:00:00') - new Date(oldStart+'T00:00:00'))/DAY_MS) + 1;
      if(n > 0){ s.day = n; s.date = ''; }
    });
  }
  logEdit('Trip info','updated the trip details');
  save(); closeModal(); rerender();
};

/* ---- bottom bar: the app's main navigation, always within thumb reach ----
   Trip-specific slots stay in place but go inert on the home and Places pages, so the
   green New Trip button never shifts sideways as you move around. */
function renderTabbar(){
  const bar = $('#tabbar'); if(!bar) return;
  if(!pinOk()){ bar.innerHTML = ''; bar.classList.remove('on'); return; }
  bar.classList.add('on');
  /* Home is the front door now; Places still owns its own list screens and Your Trips
     (reached from the Going card) - Trips no longer has a tab of its own */
  const onHomeDash = location.hash==='#/home';
  const onPlaces = location.hash.startsWith('#/places') || location.hash==='#/trips';
  const onGames  = location.hash.startsWith('#/games');
  const onGigs   = location.hash.startsWith('#/gigs');
  const onFilms  = location.hash.startsWith('#/films');
  const onPlants = location.hash.startsWith('#/plants');
  /* with the menu open the bar rides above it; anything tapped from there dismisses the menu
     on the way through (the menu itself now opens from a button in the trip header, not here) */
  const menuOpen = menuIsOpen();
  bar.classList.toggle('over-menu', menuOpen);
  const go = fn => menuOpen ? 'App.closeMenu();'+fn : fn;
  /* icon-only: a 6th item (Films) made the text labels too cramped to read, and the label was
     always redundant with aria-label anyway - screen readers still get the name, sighted users
     get more breathing room per icon */
  const item = (label, emoji, fn, active, off) => `
    <button class="tabbar-item${active?' active':''}" ${off?'disabled aria-disabled="true"':''}
            ${off?'':`onclick="${fn}"`} aria-label="${esc(label)}">
      <span class="tabbar-emoji" aria-hidden="true">${emoji}</span>
    </button>`;
  bar.innerHTML =
      item('Home','🏠',go("App.goDashboard()"), onHomeDash && !menuOpen, false)
    + item('Travel','🌎',go("App.goPlaces()"), onPlaces && !menuOpen, false)
    + item('Films','🎬',go("App.goFilms()"), onFilms && !menuOpen, false)
    + item('Music','🎤',go("App.goGigs()"), onGigs && !menuOpen, false)
    + item('Games','🎮',go("App.goGames()"), onGames && !menuOpen, false)
    + item('Plants','🥕',go("App.goPlants()"), onPlants && !menuOpen, false);
  /* anything that has to sit on top of the bar (the Places search, the hub's height) needs
     its real height, inset and all, not a number that was right on one phone */
  document.documentElement.style.setProperty('--bar-h', bar.offsetHeight+'px');
}
function menuIsOpen(){ return !!$('#menu-root').firstChild; }
function closeMenu(){

/* ================= TAB: home (dashboard) ================= */
function tabHome(t, ro){
  const n = t.notes||{contacts:[],general:''};
  const nTravel = (t.flights||[]).length + (t.ferries||[]).length + (t.carHire||[]).length;
  const nDocs = (t.documents||[]).length, nLinks = (t.docLinks||[]).length,
        nRec = (t.receipts||[]).length, nStops = (t.itinerary||[]).filter(s=>s.kind!=='travel').length,
        nPins = (t.moodBoard||[]).length,
        nContacts = (n.contacts||[]).length;
  const albumUrl = t.photoAlbum && t.photoAlbum.url || '';
  const album = albumUrl ? detectAlbumService(albumUrl) : '';
  const docParts = [];
  if(nLinks) docParts.push(nLinks+(nLinks===1?' Link':' Links'));
  if(nDocs) docParts.push(nDocs+(nDocs===1?' File':' Files'));
  const travParts = [];
  if((t.flights||[]).length) travParts.push((t.flights.length)+(t.flights.length===1?' Flight':' Flights'));
  if((t.ferries||[]).length) travParts.push((t.ferries.length)+(t.ferries.length===1?' Ferry':' Ferries'));
  if((t.carHire||[]).length) travParts.push('Car Hire');
  // each row doubles as a counter: what's booked, added, pinned and owed
  const net = nRec ? computeBalances(t) : null;
  const allSettled = net && Object.values(net).every(v=>Math.abs(v)<0.005);
  const moneySum = !nRec ? 'No receipts yet' : allSettled ? 'All settled' : 'Receipts added';
  const accoms = t.accommodations||[];
  const staySum = !accoms.length ? 'Not Added Yet' :
    accoms.length===1 ? (accoms[0].name||'1 Stay Added') :
    accoms.length+' Stays Added';
  const nNotes = (n.items||[]).length;
  /* travel legs live in the same itinerary array as the stops but aren't activities, so they
     don't inflate the count; a plan that's only travel still isn't "nothing planned" though */
  const nLegs = (t.itinerary||[]).length - nStops;
  const planSum = nStops ? nStops+(nStops===1?' Activity Planned':' Activities Planned')
    : nLegs ? nLegs+(nLegs===1?' Travel Leg Planned':' Travel Legs Planned')
    : 'Nothing Planned Yet';
  const tasks = t.tasks||[];
  const openTasks = tasks.filter(x=>!x.done).length;
  /* everything that shows in the derived Tasks list, not just what's typed in by hand: a Not
     Booked Yet flight/ferry/car hire/accommodation/travel leg, a stretch of nights with
     nowhere booked, and a day with nothing on it yet - all outstanding the same way a
     hand-typed task is */
  const undecidedCount = (t.flights||[]).filter(f=>f.undecided).length
    + (t.ferries||[]).filter(f=>f.undecided).length
    + (t.carHire||[]).filter(c=>c.undecided).length
    + (t.accommodations||[]).filter(a=>a.undecided).length
    + (t.itinerary||[]).filter(s=>s.kind==='travel' && s.notBooked).length;
  const gaps = stayGaps(t);
  const {groups:planGroups, keys:planKeys} = planDayGroups(t);
  const gapFirstNights = new Set(gaps.map(g=>g.firstNight));
  const emptyDayCount = planKeys.filter(k => planGroups[k].length===0 && !gapFirstNights.has(k)).length;
  const outstanding = openTasks + undecidedCount + gaps.length + emptyDayCount;
  const allBooked = tasks.length>0 && !outstanding;
  const taskSum = outstanding ? outstanding+(outstanding===1?' Thing to Book':' Things to Book')
    : allBooked ? 'All Booked' : 'Nothing Added Yet';
  const tiles = [
    ['plan','Itinerary', planSum, !(nStops || nLegs)],
    ['tasks','Tasks', taskSum, !allBooked],
    ['mood','Ideas', nPins ? nPins+' Pinned' : 'Nothing Pinned Yet', !nPins],
    ['travel','Travel', travParts.join(', ') || 'Nothing Booked Yet', !travParts.length],
    ['stay','Accommodation', staySum, !accoms.length],
    ['pack','Packing', packSummaryLine(t), !(t.packing||[]).length || !!packStats(t).left],
    ['polls','Polls', pollSummaryLine(t), !(t.polls||[]).length],
    ['money','Money', moneySum, !nRec],
    ['photos','Photos', album ? album+' Linked' : 'No Shared Album Yet', !album],
    ['contacts','Contacts', nContacts ? nContacts+(nContacts===1?' Contact Logged':' Contacts Logged') : 'None Added Yet', !nContacts],
    ['docs','Docs & Links', docParts.join(', ') || 'Nothing Saved Yet', !docParts.length],
    ['notes','Notes', nNotes ? nNotes+(nNotes===1?' Note':' Notes') : 'No Notes Yet', !nNotes]
  ];
  // every tile, including Photos, opens its own tab first; the tab itself links out to the album
  const tile = ([k,label,sum,empty]) => `
    <div class="dash-tile" role="button" tabindex="0" aria-label="${esc(label)}"
         onclick="App.tab('${k}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();App.tab('${k}')}">
      <span class="dash-icon">${tileIcon(k)}</span>
      <span class="dash-text"><span class="dash-label">${esc(label)}</span><span class="dash-sum${empty?' unfilled':''}">${esc(sum)}</span></span>
    </div>`;
  return `<div class="dash-grid">${tiles.map(tile).join('')}</div>`;
}
/* ================= TAB: log (what changed) ================= */
/* which tab a log entry's section belongs to, so each row can jump straight there,
   'Trip info'/'People' edits live on Overview itself (where this list already sits),
   so those rows aren't made clickable */
const LOG_SECTION_TAB = {

/* ================= TAB: packing (shared checklist + calendar reminder) ================= */
/* One shared list, one shared tick per item - there's no "who's still got things to pack"
   split since it's just the one person using this. */
const PACK_STARTERS = [
  'Passport','Travel insurance','Phone charger','Adapter plug','Toothbrush','Sun cream',
  'Medication','Cards and cash','Headphones','Reusable water bottle'
];
function packStats(t){
  const items = t.packing||[];
  const done = items.filter(it=>it.done).length;
  return { total: items.length, done, left: items.length-done };
}
function packSummaryLine(t){
  const s = packStats(t);
  if(!s.total) return 'Nothing Listed Yet';
  if(!s.left) return `All Packed (${s.done} of ${s.total})`;
  return `${s.left} Still To Pack`;
}
/* how many days until the trip starts, or null once it's begun, used for the nudge */
function packDaysToGo(t){
  if(!t.startDate) return null;
  const day = 86400000, today = new Date(); today.setHours(0,0,0,0);
  const s = new Date(t.startDate+'T00:00:00');
  const n = Math.round((s-today)/day);
  return n >= 0 ? n : null;
}
function packNudgeHTML(t){
  const s = packStats(t);
  const n = packDaysToGo(t);
  if(n===null || !s.left) return '';
  if(n > 14) return '';   // no point nagging months out
  const when = n===0 ? 'You leave today' : n===1 ? 'You leave tomorrow' : `${n} days to go`;
  return `<div class="pack-nudge">${ICONS.bell}<span><strong>${esc(when)}</strong> and you've still got ${s.left} thing${s.left===1?'':'s'} to pack.</span></div>`;
}
function packRowHTML(t, it, i, ro){
  const ticked = !!it.done;
  const canTick = !ro;
  return `
    <div class="pack-row${ticked?' done':''}">
      <span class="pack-check${ticked?' on':''}" ${canTick?`role="checkbox" aria-checked="${ticked}" tabindex="0"
        onclick="App.togglePack('${it.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();App.togglePack('${it.id}')}"`:''}
        aria-label="${esc(it.text)}">${ticked?fa('check'):''}</span>
      <span class="pack-text">
        <span class="pack-label">${esc(it.text)}</span>
      </span>
      ${!ro?`<button class="iconbtn del" title="Remove" aria-label="Remove ${esc(it.text)}" onclick="App.delPack('${it.id}')">${ICONS.trash}</button>`:''}
    </div>`;
}
function tabPack(t, ro){
  const items = t.packing||[];
  const s = packStats(t);
  const addRow = ro ? '' : `
    <div class="pack-add">
      <input type="text" id="pk-new" placeholder="Add an item…" onkeydown="if(event.key==='Enter'){event.preventDefault();App.addPack()}">
      <button class="btn" type="button" onclick="App.addPack()">+ Add</button>
    </div>`;
  if(!items.length){

      <div class="empty">Nothing on the packing list yet.${!ro?`<br><br>
        <button class="btn primary" onclick="App.addPackStarters()">Add the usual essentials</button>`:''}</div>`;
  }
  const todo = items.filter(it=>!it.done);
  const done = items.filter(it=>it.done);
  return `
    ${packNudgeHTML(t)}
    ${addRow}
    <div class="pack-progress">

      <span>${s.done} of ${s.total} packed</span>
    </div>
    ${todo.map((it,i)=>packRowHTML(t,it,i,ro)).join('')}
    ${done.length?`<h3 class="pack-heading">Packed</h3>${done.map((it,i)=>packRowHTML(t,it,i,ro)).join('')}`:''}`;
}
App.addPack = () => {
  const t = getTrip(CUR_TRIP_ID); if(!t) return;
  const el = $('#pk-new'); if(!el) return;
  const text = (el.value||'').trim();
  if(!text) return markErr('#pk-new','Type something to pack');
  t.packing = t.packing||[];
  t.packing.push({id:uid(), text, done:false});
  logEdit('Packing','added a packing item');

App.addPackStarters = () => {
  const t = getTrip(CUR_TRIP_ID); if(!t) return;
  t.packing = t.packing||[];
  const have = new Set(t.packing.map(it=>it.text.toLowerCase()));
  PACK_STARTERS.forEach(text=>{ if(!have.has(text.toLowerCase())) t.packing.push({id:uid(), text, done:false}); });
  logEdit('Packing','added the starter packing list');
  save(); rerender(); toast('Essentials added, edit away');
};
App.togglePack = itemId => {
  const t = getTrip(CUR_TRIP_ID); if(!t) return;
  const it = (t.packing||[]).find(x=>x.id===itemId); if(!it) return;
  it.done = !it.done;

};
App.delPack = itemId => {
  const t = getTrip(CUR_TRIP_ID); if(!t) return;
  const tripId = t.id;
  const i = (t.packing||[]).findIndex(x=>x.id===itemId); if(i<0) return;
  const removed = t.packing[i];

  toast('Item removed', ()=>{
    const t2 = getTrip(tripId); if(!t2) return;
    t2.packing = t2.packing||[];
    t2.packing.splice(Math.min(i,t2.packing.length),0,removed);

  });
};
function packUnpackedFor(t){
  return (t.packing||[]).filter(it=>!it.done);
}

/* ================= TAB: tasks (placeholders for things still to book) ================= */
/* Freeform, unlike the accommodation/flight gaps: those are worked out from dates you've
   already committed to, this is for something you know you need before you've worked out

function taskWhenLabel(t, task){

  const time = task.time || (task.period && PLAN_PERIODS[task.period] && PLAN_PERIODS[task.period][0]) || '';

}

/* everything still outstanding, read straight out of where it actually lives rather than a

function undecidedItemsHTML(t, ro){
  const rows = [];

  (t.carHire||[]).forEach((c,i)=>{ if(c.undecided) rows.push({icon:secEmoji('🚗'), label:'Car Hire',

  (t.accommodations||[]).forEach((a,i)=>{ if(a.undecided) rows.push({icon:secEmoji('🏠'), label:'Accommodation',

  (t.itinerary||[]).forEach((s,i)=>{ if(s.kind==='travel' && s.notBooked){
    const mode = TRAVEL_MODES[s.mode] || TRAVEL_MODES.undecided;
    const place = s.from && s.to ? `${esc(s.from)} → ${esc(s.to)}` : s.to ? `To ${esc(s.to)}` : s.from ? `From ${esc(s.from)}` : mode.label;
    const k = rough ? (s.day ? 'd'+s.day : '') : (s.date||'');
    const when = k ? planDayLabel(t, k, rough, true) : '';
    rows.push({icon:secEmoji(mode.emoji), label:'Not Booked Yet',
      inner:`<div class="card card-undecided"><h3 style="margin:0;font-size:1rem">${place}</h3>${when?`<p class="small muted" style="margin-top:4px">${esc(when)}</p>`:''}</div>`,
      editFn:`App.travelLegForm(${i})`, sortKey:k});
  }});
  /* an empty itinerary day counts toward the dashboard's "things to book" tile (tabHome uses
     the same planDayGroups + stayGaps math), so it needs a card here too or the tile's number
     and this list disagree */
  const {groups:dGroups, keys:dKeys} = planDayGroups(t);
  const gapFirstNights = new Set(stayGaps(t).map(g=>g.firstNight));
  dKeys.forEach(k=>{
    if(dGroups[k].length===0 && !gapFirstNights.has(k)){
      // date sits under the title as its own line, same as every other card here, rather than
      // folded into one combined "Day N · date" title
      const {title, sub} = planDayLabelSplit(t, k, rough);
      rows.push({icon:secEmoji('❌'), label:'Nothing Planned',
        inner:`<div class="card card-undecided"><h3 style="margin:0;font-size:1rem">${esc(title)}</h3>${sub?`<p class="small muted" style="margin-top:4px">${esc(sub)}</p>`:''}</div>`,
        editFn:`App.planGapForm('${k}', ${rough})`, sortKey:k});
    }
  });
  /* a stretch of nights with nowhere booked gets the same tag-above-card treatment as every
     other row here, instead of sitting on its own with no label - tapping it opens the same
     Add Accommodation form the gap card's own button does, so nothing's lost by dropping it */
  stayGaps(t).forEach(g => {
    const n = g.nights;
    const when = n===1 ? fmtDate(g.firstNight) : fmtRange(g.firstNight, g.lastNight);
    rows.push({icon:secEmoji('🛏️'), label:'Not Booked Yet',
      inner:`<div class="card card-undecided"><h3 style="margin:0;font-size:1rem">${n} Night${n===1?'':'s'}</h3><p class="small muted" style="margin-top:4px">${esc(when)}</p></div>`,
      editFn:`App.accomGapForm('${g.firstNight}','${g.checkout}')`, sortKey:g.firstNight});
  });
  /* the whole list reads in day order - a flight/car/accommodation still marked entirely TBC
     (no date at all yet) has nothing to sort by, so it sinks to the end rather than to some
     arbitrary spot by category */
  rows.sort(dayKeyCompare(rough));
  return rows.map(r => ({sortKey:r.sortKey, html:`
    <div class="plan-auto${!ro?' plan-click':''}" ${!ro?`role="button" tabindex="0" onclick="${r.editFn}"
         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${r.editFn}}"`:''}>
      <div class="plan-auto-tag">${r.icon}<strong>${r.label}</strong></div>
      ${r.inner}
    </div>`}));
}

/* A calendar event imports cleanly everywhere (iOS, Android, desktop) and actually fires an
   alert, which is what "remind me" needs to mean for a static site with no server to push
   from. VTODO would map more neatly onto a reminders app but is widely ignored on import. */
function icsEscape(s){
  return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
}
function icsStamp(d){
  return d.getUTCFullYear()+String(d.getUTCMonth()+1).padStart(2,'0')+String(d.getUTCDate()).padStart(2,'0')
    +'T'+String(d.getUTCHours()).padStart(2,'0')+String(d.getUTCMinutes()).padStart(2,'0')+'00Z';
}
/* RFC 5545 wants content lines folded at 75 octets, with continuations starting with a
   space. A long packing list blows past that easily, and stricter importers reject the
   file outright rather than just wrapping it themselves. */
function icsFold(line){
  const bytes = new TextEncoder().encode(line);
  if(bytes.length <= 75) return line;
  const out = [];
  let cur = '', curLen = 0, limit = 75;
  for(const ch of line){                       // iterate by code point, never split one
    const n = new TextEncoder().encode(ch).length;
    if(curLen + n > limit){ out.push(cur); cur = ' '; curLen = 1; limit = 75; }
    cur += ch; curLen += n;
  }
  if(cur) out.push(cur);
  return out.join('\r\n');
}
App.packReminder = () => {
  const t = getTrip(CUR_TRIP_ID); if(!t) return;
  if(!t.startDate) return noteModal('No Start Date', "Add a start date to the trip first, so there's a day to remind you on.");
  const left = packUnpackedFor(t);
  // the evening before you travel, local time, which is when packing actually happens
  const start = new Date(t.startDate+'T00:00:00');
  start.setDate(start.getDate()-1);
  start.setHours(19,0,0,0);
  const end = new Date(start.getTime() + 30*60000);
  const body = left.length
    ? 'Still to pack:\n' + left.map(it=>'- '+it.text).join('\n')
    : 'Everything on the list is already ticked off. Nice.';
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//My Trips//Packing//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'BEGIN:VEVENT',
    'UID:pack-'+t.id+'-'+Date.now()+'@cals-trippin',
    'DTSTAMP:'+icsStamp(new Date()),
    'DTSTART:'+icsStamp(start),
    'DTEND:'+icsStamp(end),
    'SUMMARY:'+icsEscape('Pack for '+t.name),
    'DESCRIPTION:'+icsEscape(body),
    'BEGIN:VALARM','TRIGGER:PT0S','ACTION:DISPLAY','DESCRIPTION:'+icsEscape('Pack for '+t.name),'END:VALARM',
    'END:VEVENT','END:VCALENDAR'
  ].map(icsFold).join('\r\n');
  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `pack-for-${(t.name||'trip').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}.ics`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast('Reminder saved, open it to add it to your calendar');
};

/* ================= TAB: polls (single-tally voting) ================= */
/* Votes are keyed by an anonymous per-device id (deviceVoteId()), not a name - each device
   gets one vote per poll, results only ever show counts, never who picked what. Anyone can
   close a poll (same trust model as the rest of the app: one shared link, one shared PIN). */
function pollVotes(p){ return (p && p.votes) || {}; }
/* a vote is a single option id for a normal poll, or an array of them once "allow multiple
   answers" is on - every reader goes through this so neither shape needs special-casing
   anywhere else */
function voteHasOpt(v, optId){ return Array.isArray(v) ? v.includes(optId) : v===optId; }
function pollCount(p, optId){ return Object.values(pollVotes(p)).filter(v=>voteHasOpt(v,optId)).length; }
function pollTotal(p){ return Object.keys(pollVotes(p)).length; }
/* the option(s) in front, so a decided poll reads at a glance; ties are kept as ties */
function pollLeaders(p){
  const counts = (p.options||[]).map(o=>pollCount(p,o.id));
  const top = Math.max(0, ...counts);
  return top===0 ? [] : (p.options||[]).filter((o,i)=>counts[i]===top).map(o=>o.id);
}
function pollSummaryLine(t){
  const polls = t.polls||[];
  if(!polls.length) return 'No Polls Yet';
  const open = polls.filter(p=>!p.closed);
  const needsMe = open.filter(p=>!pollVotes(p)[deviceVoteId()]).length;
  if(needsMe) return needsMe===1 ? '1 Poll Needs Your Vote' : needsMe+' Polls Need Your Vote';
  if(open.length) return open.length===1 ? '1 Open Poll' : open.length+' Open Polls';
  return polls.length===1 ? '1 Poll Closed' : 'All '+polls.length+' Polls Closed';
}
function pollCardHTML(t, p, i, ro){
  const mine = pollVotes(p)[deviceVoteId()];
  const total = pollTotal(p);
  const leaders = p.closed ? pollLeaders(p) : [];
  const rows = (p.options||[]).map(o=>{
    const n = pollCount(p, o.id);
    const pct = total ? Math.round(n/total*100) : 0;
    const picked = voteHasOpt(mine, o.id);
    const won = leaders.includes(o.id);
    const canVote = !ro && !p.closed;
    return `
      <div class="poll-opt${picked?' picked':''}${won?' won':''}" ${canVote?`role="button" tabindex="0"
           onclick="App.votePoll('${p.id}','${o.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();App.votePoll('${p.id}','${o.id}')}"`:''}>
        <div class="poll-bar" style="width:${pct}%"></div>
        <div class="poll-opt-row">
          <span class="poll-opt-text">${picked?fa('circle-check'):(won?fa('trophy'):'')}${esc(o.text)}</span>
          <span class="poll-opt-n">${n}${total?` · ${pct}%`:''}</span>
        </div>
      </div>`;
  }).join('');
  return `
    <div class="card poll-card">
      <div class="section-head" style="margin-bottom:${p.multi&&!p.closed?'2px':'10px'}">
        <h3>${esc(p.q)}</h3>
        ${!ro?`<div style="display:flex;gap:2px;flex-shrink:0">
          <button class="iconbtn" title="${p.closed?'Reopen poll':'Close poll'}" aria-label="${p.closed?'Reopen poll':'Close poll'}" onclick="App.togglePoll('${p.id}')">${p.closed?fa('lock-open'):fa('lock')}</button>
          <button class="iconbtn del" title="Remove" aria-label="Remove poll" onclick="App.delPoll('${p.id}')">${ICONS.trash}</button>
        </div>`:''}
      </div>
      ${p.multi&&!p.closed?`<p class="small muted" style="margin:0 0 10px">Pick as many as you like</p>`:''}
      ${p.closed?`<p class="small muted" style="margin:-4px 0 10px;display:flex;align-items:center;gap:6px">${fa('lock')}Closed${leaders.length?' · '+esc((p.options||[]).filter(o=>leaders.includes(o.id)).map(o=>o.text).join(' / ')):''}</p>`:''}
      ${rows}
      ${!ro&&!p.closed?`
      <div class="pack-add" style="margin-top:10px;margin-bottom:0" onclick="event.stopPropagation()">
        <input type="text" id="po-add-${p.id}" placeholder="Add another option…" onkeydown="if(event.key==='Enter'){event.preventDefault();App.addPollOptionLive('${p.id}')}">
        <button class="btn" type="button" onclick="App.addPollOptionLive('${p.id}')">+ Add</button>
      </div>`:''}
      <p class="small muted" style="margin-top:10px">${total?`${total} ${total===1?'vote':'votes'}`:'No votes yet'}</p>
    </div>`;
}

App.addPollOptionLive = pollId => {

App.votePoll = (pollId, optId) => {
  const t = getTrip(CUR_TRIP_ID); if(!t) return;
  const p = (t.polls||[]).find(x=>x.id===pollId); if(!p || p.closed) return;
  const me = deviceVoteId();
  p.votes = p.votes||{};
  if(p.multi){
    // several picks per person, so the stored vote is an array once multi is on
    const cur = Array.isArray(p.votes[me]) ? p.votes[me].slice() : (p.votes[me]!=null ? [p.votes[me]] : []);
    const idx = cur.indexOf(optId);
    if(idx>=0) cur.splice(idx,1); else cur.push(optId);   // tapping a picked option again clears just that one
    if(cur.length) p.votes[me] = cur; else delete p.votes[me];
  } else {
    if(p.votes[me]===optId) delete p.votes[me];   // tapping your own choice again clears it
    else p.votes[me] = optId;
  }
  logEdit('Polls','voted in a poll');
  save(); rerender();
};

App.delPoll = pollId => {
  const t = getTrip(CUR_TRIP_ID); if(!t) return;
  const tripId = t.id;
  const i = (t.polls||[]).findIndex(x=>x.id===pollId); if(i<0) return;

    logEdit('Polls','restored a poll'); save(); rerender();
  });
};

/* ================= weather (Open-Meteo: free, no API key, no sign-up) ================= */
/* Only the next couple of weeks have a real forecast, so days beyond that show nothing
   rather than an invented number. Coordinates are cached in localStorage (a place doesn't
   move); forecasts are fetched fresh each session so they don't go stale. Every failure
   path ends the same way: no weather shown, the itinerary itself is never affected. */
const WX_FORECAST_DAYS = 16;
const WX_GEO_KEY = 'calstrippin_wx_geo';
const WX_STATE = {};   // place -> {status:'loading'|'ok'|'fail', days:{'YYYY-MM-DD':{...}}, label}
/* WMO weather codes, grouped down to the handful of conditions worth showing on a trip plan.
   Emoji rather than icon-font glyphs: the weather is the one thing on the page that is
   genuinely worth a splash of colour, and it keeps rendering even if the icon font doesn't. */
const WX_CODES = {
  0:['Clear','☀️'], 1:['Mainly clear','🌤️'], 2:['Partly cloudy','⛅'], 3:['Overcast','☁️'],
  45:['Fog','🌫️'], 48:['Fog','🌫️'],
  51:['Light drizzle','🌦️'], 53:['Drizzle','🌦️'], 55:['Heavy drizzle','🌦️'],
  56:['Freezing drizzle','🌧️'], 57:['Freezing drizzle','🌧️'],
  61:['Light rain','🌦️'], 63:['Rain','🌧️'], 65:['Heavy rain','🌧️'],
  66:['Freezing rain','🌧️'], 67:['Freezing rain','🌧️'],
  71:['Light snow','🌨️'], 73:['Snow','🌨️'], 75:['Heavy snow','❄️'], 77:['Snow','🌨️'],
  80:['Showers','🌦️'], 81:['Showers','🌧️'], 82:['Heavy showers','🌧️'],
  85:['Snow showers','🌨️'], 86:['Snow showers','🌨️'],
  95:['Thunderstorm','⛈️'], 96:['Thunderstorm','⛈️'], 99:['Thunderstorm','⛈️']
};
function wxGeoGet(place){
  try{
    const v = JSON.parse(localStorage.getItem(WX_GEO_KEY)||'{}')[place.toLowerCase()];
    return v === undefined ? null : v;   // `false` is a remembered miss, not "not looked up"

}
function wxGeoSet(place, val){
  try{
    const m = JSON.parse(localStorage.getItem(WX_GEO_KEY)||'{}');
    m[place.toLowerCase()] = val;
    localStorage.setItem(WX_GEO_KEY, JSON.stringify(m));
  }catch(e){}
}
function wxDayStr(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

/* --- working out where you are on any given day, with no input from anyone ---
   Walk the trip in date order keeping a "current place": a flight or ferry moves you to
   its destination, checking into a stay moves you to that stay's town, and every day in
   between inherits wherever you were last. A multi-country trip therefore switches its
   forecast on the day you actually travel. Each day ends up with a list of candidates,
   best guess first, tried in turn until one geocodes, so a hotel name that means nothing
   to a gazetteer falls through to the airport city and finally to the country. */
function wxAirportPlaces(code){
  const name = AIRPORTS[String(code||'').toUpperCase()];
  if(!name) return [];
  const first = name.split(' ')[0];
  // try the full airport name first ("Nice", "Gran Canaria"), then just the city it starts
  // with, which is what rescues "Rome Fiumicino" and "Amsterdam Schiphol"

function wxStayPlaces(a){
  const parts = String((a&&a.address)||'').split(',').map(s=>s.trim())
    .filter(s => s && /[a-z]{3}/i.test(s) && !/^\d/.test(s));   // drop house numbers and postcodes
  if(!parts.length) return [];
  // the town is usually the second-to-last comma part, with the country last
  return parts.length >= 2 ? [parts[parts.length-2], parts[parts.length-1]] : [parts[0]];
}
function wxDayPlaces(t, dayKeys){
  const fallback = (t.countries||[]).map(c=>(countryByCode(c)||{}).name).filter(Boolean);
  const events = [];
  // rank keeps a stay ahead of the flight that delivered you on the same date, since the
  // stay's address is the more precise of the two
  (t.flights||[]).forEach(f=>{ if(f.date && f.to) events.push({date:f.date, rank:0, cands:wxAirportPlaces(f.to)}); });
  (t.ferries||[]).forEach(f=>{ if(f.date && f.to) events.push({date:f.date, rank:0, cands:[f.to]}); });
  (t.accommodations||[]).forEach(a=>{ if(a.checkin) events.push({date:a.checkin, rank:1, cands:wxStayPlaces(a)}); });
  events.sort((a,b)=> a.date.localeCompare(b.date) || a.rank-b.rank);

  const keys = dayKeys.filter(Boolean).slice().sort();
  const map = {};
  let cur = fallback, ei = 0;
  keys.forEach(k=>{
    while(ei < events.length && events[ei].date <= k){
      if(events[ei].cands.length) cur = [...new Set(events[ei].cands.concat(fallback))];
      ei++;
    }

  });

}
let WX_DAY_PLACES = {};   // 'YYYY-MM-DD' -> candidate place list, rebuilt on each itinerary render
const WX_LIST_GEO = {};   // candidate-list key -> resolved {lat,lon,label}, or false once all missed
/* try each candidate in turn; a miss is remembered so a vague name isn't re-queried forever */
function wxResolve(cands, cb){
  let i = 0;
  const tryNext = () => {
    if(i >= cands.length) return cb(null);
    const place = cands[i++];
    const cached = wxGeoGet(place);
    if(cached === false) return tryNext();
    if(cached && typeof cached.lat === 'number') return cb(cached);
    fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name='+encodeURIComponent(place))
      .then(r=>r.json())
      .then(j=>{
        const r0 = j && j.results && j.results[0];
        if(!r0 || typeof r0.latitude !== 'number'){ wxGeoSet(place, false); return tryNext(); }
        // "Greece, Greece" reads badly, so only add the country when it differs from the name
        const label = (r0.country && r0.country !== r0.name) ? r0.name+', '+r0.country : r0.name;
        const geo = {lat:r0.latitude, lon:r0.longitude, label};
        wxGeoSet(place, geo);
        cb(geo);
      })
      .catch(tryNext);
  };
  tryNext();
}
/* forecasts are keyed by coordinate, so two towns that resolve to the same spot, or a day
   list that repeats a place, only ever cost one request */
function wxForecast(geo, done){
  const key = geo.lat.toFixed(2)+','+geo.lon.toFixed(2);
  const cur = WX_STATE[key];
  if(cur){
    if(cur.status === 'loading') cur.waiting.push(done); else done();
    return;
  }
  const st = WX_STATE[key] = {status:'loading', days:{}, label:geo.label||'', waiting:[]};
  const finish = () => { const w = st.waiting; st.waiting = []; done(); w.forEach(fn=>fn()); };
  const today = new Date();
  const end = new Date(today.getTime() + (WX_FORECAST_DAYS-1)*86400000);
  fetch('https://api.open-meteo.com/v1/forecast?latitude='+encodeURIComponent(geo.lat)
    + '&longitude='+encodeURIComponent(geo.lon)
    + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max'
    + '&timezone=auto&start_date='+wxDayStr(today)+'&end_date='+wxDayStr(end))
    .then(r=>r.json())
    .then(j=>{
      const d = j && j.daily;
      if(!d || !Array.isArray(d.time)) throw 0;
      d.time.forEach((day,i)=>{
        st.days[day] = {
          code: (d.weather_code||[])[i],
          max:  (d.temperature_2m_max||[])[i],
          min:  (d.temperature_2m_min||[])[i],
          pop:  (d.precipitation_probability_max||[])[i]
        };
      });
      st.status = 'ok';
      finish();
    })
    .catch(()=>{ st.status = 'fail'; finish(); });
}
/* the small chip beside a day heading, empty whenever there's nothing honest to say */
function wxDayHTML(dateKey){
  const cands = WX_DAY_PLACES[dateKey];
  if(!cands || !cands.length) return '';
  const geo = WX_LIST_GEO[cands.join('|')];
  if(!geo) return '';
  const st = WX_STATE[geo.lat.toFixed(2)+','+geo.lon.toFixed(2)];
  if(!st || st.status !== 'ok') return '';
  const d = st.days[dateKey];
  if(!d || typeof d.max !== 'number') return '';
  const [label, emoji] = WX_CODES[d.code] || ['', '☁️'];
  const rain = (typeof d.pop === 'number' && d.pop >= 20) ? ` · ${Math.round(d.pop)}%` : '';
  const where = geo.label ? ' in '+geo.label : '';
  return `<span class="wx-chip" title="${esc(label+where)}"><span class="wx-emoji" aria-hidden="true">${emoji}</span>${Math.round(d.max)}°/${Math.round(d.min)}°${rain}</span>`;
}
function paintWeather(){
  document.querySelectorAll('#tab-body [data-wx-date]').forEach(el=>{
    el.innerHTML = wxDayHTML(el.dataset.wxDate);
  });
}
function initWeather(t){
  const keys = [...document.querySelectorAll('#tab-body [data-wx-date]')].map(el=>el.dataset.wxDate);
  WX_DAY_PLACES = wxDayPlaces(t, keys);
  const repaint = () => { if(CUR_TAB==='plan' && CUR_TRIP_ID===t.id) paintWeather(); };
  [...new Set(Object.values(WX_DAY_PLACES).map(c=>c.join('|')))].forEach(listKey=>{
    if(!listKey) return;
    const known = WX_LIST_GEO[listKey];
    if(known){ wxForecast(known, repaint); return; }
    if(known === false) return;                       // every candidate already missed
    wxResolve(listKey.split('|'), geo=>{
      WX_LIST_GEO[listKey] = geo || false;
      if(geo) wxForecast(geo, repaint);
    });
  });
}

/* auto flight/ferry/car/check-in/check-out cards are sorted by time, except flight vs

   a same-day flight, force checkout, then flight, then check-in regardless of what the
   individual times say, unless an explicit arrival time has been set for that stay, in
   which case it's real and sorts normally like everything else */
function planCompare(a, b){
  const isAuto = x => !!(x._autoFlight || x._autoFerry || x._autoCar || x._autoStay);
  if(isAuto(a) && isAuto(b)){
    const untrustedCheckin = x => x._autoStay==='checkin' && !(x.ac && x.ac.arrivalTime);
    const rank = x => x._autoStay==='checkout' ? 0 : x._autoFlight ? 1 : untrustedCheckin(x) ? 2 : null;

  const m = /^(\d{1,2}):(\d{2})$/.exec(depTime||''); if(!m) return '';

  if(total < 0) return '00:00';

     actually hold (it offers 00/15/30/45) and the card doesn't shift by five minutes the
     moment you open it. Down rather than nearest: earlier is the safe direction here. */
  total -= total % 15;

/* every same-day "check out of one place, check into another" pair, as the journey between
   them. Returns one entry per move, already skipping the ones you've saved a real travel leg
   for. Only pairs a check-out with a check-in at a DIFFERENT accommodation: extending a stay
   by booking the same place twice back-to-back isn't a journey anywhere. */
function stayMoves(t){
  const stays = (t.accommodations||[]);
  const out = [];
  stays.forEach((leaving, li)=>{
    if(!leaving.checkout || leaving.undecided) return;
    const arriving = stays.findIndex((a,ai)=>ai!==li && a.checkin===leaving.checkout && !a.undecided);
    if(arriving < 0) return;
    const to = stays[arriving];
    const fromName = leaving.name||'', toName = to.name||'';
    if(!fromName && !toName) return;                       // nothing to name the journey by
    if(fromName && fromName === toName) return;            // same place under two bookings
    if((t.itinerary||[]).some(s=>s._autoForStay===arriving)) return;  // you've already saved it
    /* the check-out time is the hard deadline (you have to be out), so that's what the
       journey is pinned to. With no check-out time, fall back to being there for check-in. */
    const time = leaving.checkoutTime || to.checkinTime || '';
    out.push({date: leaving.checkout, from: fromName, to: toName, aci: arriving,

function planDayGroups(t){

    // leg you'd add yourself. Sorted immediately before its flight by sharing the same time

  const autoFlightCard = s => `

    <div class="plan-auto${!ro?' plan-click':''}" ${clickAttrs(`App.ferryForm(${s.fi})`)}>
      ${autoTag(secEmoji('⛴️'), 'Ferry', s.time)}

  /* the tag names the thing and says when you'd get there: the arrival time if the booking has
     one, otherwise the check-in/check-out time it's sorted by - with the property's own
     check-in time tucked in brackets right after it on check-in, since the compact card below

  const autoStayCard = s => {
    const checkin = s._autoStay==='checkin';

                 : s.fi!=null ? `App.airportTravelForm(${s.fi})`
                 : `App.stayTravelForm(${s.aci})`;
    if(!booked){
      /* named by how you're getting there rather than by both ends: "Bus to Kassiopi" is what
         you'd say, where "Corfu Town → Kassiopi" is a timetable entry */
      const modeUndecided = !s.mode || s.mode==='undecided';
      const way = s.mode==='walk' ? 'Walk' : mode.label;
      const line = modeUndecided
                 ? (s.to ? `Travel to ${esc(s.to)} not decided` : 'Travel not decided')
                 : s.to ? `${way} to ${esc(s.to)}`
                 : s.from ? `${way} from ${esc(s.from)}`

      const meta = [when, duration].filter(Boolean).join(' · ');

      </div>`;
    }
    const place = s.from && s.to ? `${esc(s.from)} → ${esc(s.to)}` : s.to ? `To ${esc(s.to)}` : s.from ? `From ${esc(s.from)}` : '?';

    <div class="card plan-card plan-travel${s.notBooked?' card-undecided':''}${!ro?' plan-click':''}" ${clickAttrs(editFn)}>

      ${hasImage ? `<div class="plan-img-wrap">

        ${mapBtnHTML('plan-img-map')}
      </div>`
      : mapHref ? `<div class="btn-row" style="margin-top:8px" onclick="event.stopPropagation()">${mapBtnHTML()}</div>` : ''}
    </div>`;
    // the time - "Evening", or a set clock time - reads as "Plan - Evening" above the card,
    // the same way an auto-generated card's own tag sits above it, rather than as a plain line
    // inside the card competing with the title for the same kind of weight
    return time
      ? `<div class="plan-auto${!ro?' plan-click':''}" ${clickAttrs(`App.planForm(${s._i})`)}>${autoTag(secEmoji('🗺️'), 'Plan', time)}${card}</div>`
      : card;
  };
  const taskCard = s => `
    <div class="card plan-card task-card${s.unscheduled?' task-unscheduled':''}${!ro?' plan-click':''}" ${clickAttrs(`App.taskForm(${s.ti})`)}>

    </div>`;
  const card = s =>
    s._autoFlight ? autoFlightCard(s)
    : s._autoFerry ? autoFerryCard(s)
    : s._autoCar ? autoCarCard(s)
    : s._autoStay ? autoStayCard(s)
    : s.kind==='travel' ? travelCard(s)
    : s.kind==='task' ? taskCard(s)

  /* the same dashed-box treatment as an accommodation gap, for a day nothing's been added to

  const emptyDayCard = k => `
    <div class="card plan-card gap-card">
      <div class="section-head" style="margin-bottom:0"><h3>${secEmoji('❌')}Nothing Planned</h3></div>

        <button class="btn sm" onclick="App.ideasForDay('${k}', ${rough})">${secEmoji('\u{1F4A1}')} Add Ideas</button>

  const stayGapsList = stayGaps(t);
  const stayGapAt = k => stayGapsList.find(g => g.firstNight === k);
  const dayBlock = k => {
    const dayItems = groups[k].slice().sort(planCompare);

    return `<h3 class="plan-day">${dayLabel(k)}${k===todayKey?` <span class="status-pill now">Today</span>`:''}${k&&!rough?`<span class="wx-slot" data-wx-date="${esc(k)}"></span>`:''}</h3>

      ${gap?stayGapCardHTML(gap, ro):''}
      ${dayItems.length ? dayItems.map(card).join('') : (gap?'':emptyDayCard(k))}`;
  };
  return `
    ${hasAny ? keys.map(dayBlock).join('')
    : `<div class="empty">Nothing planned yet.${!ro?`<br><br><span class="btn-row" style="justify-content:center">
        <button class="btn" onclick="App.tab('mood')">Browse Ideas</button>

/* A stop or travel leg is pinned to a date on a normal trip and to a day number on one

function roundToQuarterHour(timeStr){
  if(!timeStr) return {h:9, m:0};
  let [h,m] = timeStr.split(':').map(Number);

/* A small square logo for a card, from whatever we know about who it's with: the booking
   link's own domain for a stay, the airline's site for a flight. This is the site's icon, not
   a photo of the room - a real photo would mean scraping the page's og:image through the
   proxy, and the big travel sites (Airbnb especially) block that. */
const AIRLINE_SITES = {
  'easyJet':'easyjet.com','Ryanair':'ryanair.com','British Airways':'britishairways.com',
  'Jet2':'jet2.com','Wizz Air':'wizzair.com','Virgin Atlantic':'virginatlantic.com',
  'Emirates':'emirates.com','Qatar Airways':'qatarairways.com','Lufthansa':'lufthansa.com',
  'Air France':'airfrance.com','KLM':'klm.com','Iberia':'iberia.com','Vueling':'vueling.com',
  'TAP Air Portugal':'flytap.com','Aer Lingus':'aerlingus.com','Aegean Airlines':'aegeanair.com',
  'Turkish Airlines':'turkishairlines.com','SWISS':'swiss.com','Norwegian':'norwegian.com',
  'Finnair':'finnair.com','SAS':'flysas.com','Transavia':'transavia.com','Volotea':'volotea.com',
  'Pegasus Airlines':'flypgs.com','Brussels Airlines':'brusselsairlines.com','Eurowings':'eurowings.com',
  'American Airlines':'aa.com','Delta':'delta.com','United':'united.com','JetBlue':'jetblue.com',
  'Southwest':'southwest.com','Alaska Airlines':'alaskaair.com','WestJet':'westjet.com',
  'Air Canada':'aircanada.com','Qantas':'qantas.com','Etihad Airways':'etihad.com',
  'Singapore Airlines':'singaporeair.com','Cathay Pacific':'cathaypacific.com','Icelandair':'icelandair.com',
  'ITA Airways':'ita-airways.com','airBaltic':'airbaltic.com','Croatia Airlines':'croatiaairlines.com'
};
/* Google's favicon service doesn't guarantee it actually has one - some sites (easyJet's
   among them) come back blank rather than 404, which an onerror alone won't catch, so this
   also gives the <img> a byte-count floor: a real favicon is never a 1x1 transparent pixel,
   but that's exactly what a "no icon" response looks like. Either way, restoreText is what the
   caller wanted showing if there'd been no logo at all, so losing the logo just falls back to
   that rather than leaving a gap. */
function logoSquare(domain, label, restoreText){
  if(!domain) return '';
  return `<img class="card-logo" src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=128"
    alt="${esc(label||'')}" loading="lazy" data-restore="${esc(restoreText||label||'')}"
    onerror="App.cardLogoFail(this)" onload="App.cardLogoCheck(this)">`;
}
function siteLogoFor(url, label, restoreText){
  try{ return logoSquare(new URL(url).hostname, label, restoreText); }catch(e){ return ''; }
}
function airlineLogoFor(name, restoreText){
  const site = AIRLINE_SITES[name];
  return site ? logoSquare(site, name, restoreText) : '';
}
function faviconFor(url){
  try{ const h = new URL(url).hostname; return `<img class="fav" src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(h)}&sz=64" alt="" loading="lazy">`; }
  catch(e){ return ''; }
}
function googleMapsUrl(q){ return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q); }
/* a Google Maps link gets Google's own icon, the same way a booking link gets the site's;
   anything else (a maps.apple.com or what3words link somebody pasted) keeps the emoji.
   The domain can be preceded by the start of the string, a "." (a subdomain, as in
   "www.google.com/maps"), OR a "/" - which is what actually sits right before it in every
   real "https://maps.google.com/…" or "https://goo.gl/maps/…" URL this is tested against,
   so matching only "^" or "." here meant those never matched at all. */
function mapIcon(url){
  return /(^|[./])maps\.google\.[^/]*(\/|\?|$)|(^|[./])google\.[^/]*\/maps|(^|[./])goo\.gl\/maps|(^|[./])maps\.app\.goo\.gl/i.test(url||'')
    ? faviconFor('https://maps.google.com') : secEmoji('🗺️');
}
/* best-effort town/city out of a full address, drop a trailing postcode-looking segment,
   then take the last comma-separated part, e.g. "1 Rua X, Lisbon, 1000-001" -> "Lisbon" */
function guessCityFromAddress(address){
  if(!address) return '';
  const parts = address.split(',').map(s=>s.trim()).filter(Boolean);
  if(!parts.length) return '';
  const looksLikePostcode = /\d/.test(parts[parts.length-1]) && parts[parts.length-1].length<=10;
  if(looksLikePostcode && parts.length>1) parts.pop();
  // "Saranda, Albania" shouldn't guess the country as the city, drop it and use the town
  if(parts.length>1 && countryByName(parts[parts.length-1])) parts.pop();
  return parts[parts.length-1] || '';
}
function detectBookingService(url){
  if(!url) return '';
  if(/airbnb\./i.test(url)) return 'Airbnb';
  if(/booking\.com/i.test(url)) return 'Booking.com';
  if(/vrbo\.com/i.test(url)) return 'Vrbo';
  if(/expedia\./i.test(url)) return 'Expedia';
  if(/hotels\.com/i.test(url)) return 'Hotels.com';
  return '';
}
function autoAccomName(url, address){
  const service = detectBookingService(url);
  const city = guessCityFromAddress(address);
  if(service && city) return service+' in '+city;
  if(service) return service;
  if(city) return 'Stay in '+city;
  return '';
}
/* the full accommodation card, shared by Accommodation and, read-only, by the Itinerary.
   opts: headerActions (edit/delete, top-right), footerActions (e.g. a link back to this
   section), showDates (hide the check-in/out chips when the itinerary already shows the
   time), compact (icon-only View Booking/Open Map buttons, no label - used by the itinerary,
   where the favicon/pin are already clear enough and the label is just noise) */
function accomCardHTML(a, opts){
  opts = opts || {};
  const arrivalSuffix = a.arrivalTime ? ` (arriving ${esc(a.arrivalTime)})` : '';
  /* the year lands once, on the check-out, with each end's time tucked in after its own date:
     "23 September 15:00 - 25 September 2026 11:00" */
  const p = a.checkin && a.checkout ? rangeParts(a.checkin, a.checkout) : null;
  const stayRange = p
    ? `${p.from}${a.checkinTime?' '+esc(a.checkinTime):''}${arrivalSuffix} - ${p.to}${a.checkoutTime?' '+esc(a.checkoutTime):''}`
    : a.checkin ? `${fmtDate(a.checkin)}${a.checkinTime?' '+esc(a.checkinTime):''}${arrivalSuffix}`
    : a.checkout ? `${fmtDate(a.checkout)}${a.checkoutTime?' '+esc(a.checkoutTime):''}`
    : '';
  /* the head's right-hand slot mirrors a flight's date. On the Accommodation tab, where both
     ends are spelled out in the body anyway, it carries the check-in date instead. On the
     Itinerary's compact card it's a Maps link instead - the outer "Accommodation - 23:00" tag
     already carries this end's specific time, so repeating it here (as "From 15:00") was just
     the property's generic check-in window standing in for the useful thing, a way there. */
  const headNote = opts.phase==='checkin'  ? (a.checkinTime  ? 'From '+a.checkinTime   : 'Check in')
                 : opts.phase==='checkout' ? (a.checkoutTime ? 'Until '+a.checkoutTime : 'Check out')
                 : '';
  /* every button here is its own icon: a favicon, a map pin, a link, a pencil, a bin. The
     labels were saying what the icons already say, and three of them wrapped onto two lines
     each on a phone. */
  const iconBtn = (inner, label, attrs) =>
    `<a class="btn icon-only" ${attrs} aria-label="${esc(label)}" title="${esc(label)}">${inner}</a>`;
  const mapsUrl = a.address ? googleMapsUrl(a.address) : '';
  const bookingBtn = a.bookingUrl ? iconBtn(faviconFor(a.bookingUrl), 'View Booking',
      `href="${esc(a.bookingUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()"`) : '';
  const mapBtn = mapsUrl ? iconBtn(mapIcon(mapsUrl), 'Open Map',
      `href="${mapsUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()"`) : '';
  const copyBtn = a.address
      ? `<button type="button" class="btn icon-only" onclick="event.stopPropagation();App.copyText('${jsArg(a.address)}',this)" aria-label="Copy address" title="Copy address">${secEmoji('\u{1F517}')}</button>`
      : '';
  /* the two ends of the stay, a line each. They used to share one line that also repeated the
     check-in date already sitting up in the head. */
  const inLine  = a.checkin  ? `${fmtDate(a.checkin)}${a.checkinTime?' '+esc(a.checkinTime):''}${arrivalSuffix}` : '';
  const outLine = a.checkout ? `${fmtDate(a.checkout)}${a.checkoutTime?' '+esc(a.checkoutTime):''}` : '';
  const stayLine = (label, value) => value
    ? `<div class="small accom-when"><span class="accom-when-label">${label}</span><span>${value}</span></div>` : '';
  /* the compact itinerary card folds both footer buttons into the head instead of a row below:
     the logo becomes the booking link itself, and Maps takes the right-hand slot - between the
     two there's nothing left for the footer row to do, so it drops entirely and the card is
     just the one line. */
  const logoInner = a.bookingUrl ? siteLogoFor(a.bookingUrl, '', a.name||'Accommodation') : '';
  const logo = (opts.compact && a.bookingUrl)
    ? `<a href="${esc(a.bookingUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" aria-label="View Booking" title="View Booking">${logoInner}</a>`
    : logoInner;
  /* "Airbnb in Palaiokastritsa" said the same thing twice once the logo is doing the "Airbnb"
     part - only strips the exact auto-filled pattern, so a name typed or edited by hand is
     left alone */

    + (a.ref?`<div class="btn-row" style="margin-top:10px"><span class="chip">Ref: ${esc(a.ref)}</span></div>`:'')

        ${headRight}

      ${bodyInner ? `<div class="accom-body">${bodyInner}</div>` : ''}
