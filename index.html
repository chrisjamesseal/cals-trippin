    'Places I\'ve Been counts from the bottom up, so #1 is the first place you went.',
    'Accommodation cards: check-in and check-out on a line each instead of one repeated range, and every button (booking, map, copy, edit, delete) is now just its icon, all on one row.',
    'Tasks are simpler: no date, no edit, just tick or delete. "Booked" is now "Completed".',
    'Getting a bus, taxi or walking somewhere reads as a line on the Itinerary ("Bus to Kassiopi - leave by 14:00") rather than a card. Flights, ferries and trains keep theirs, since those are booked and timed.',
    '"Nothing Planned" days offer Add Ideas as well as Add Stop.',
    'Fixed cards keeping a red outline after you tapped them: that was a hover effect sticking on a touch screen.',
    'Documents & Links is now Docs & Links so it fits, and Google Maps links show the Maps pin rather than the Google G.'
  ]},
  {version:'1.65.0', notes:[
    'Design articles now open and read inside the app instead of sending you off to the browser, at a proper reading width. The original is still one tap away at the bottom of each one.',
    'Where a publication only puts a preview in its feed, the reader says so rather than showing you a stub.'
  ]},
  {version:'1.64.0', notes:[
    'Places I\'ve Been has two tabs now: In Order (the numbered list) and Continents, which groups the same countries by where in the world they are, with a count on each. A country keeps its number in both.',
    'Closed the gap between the Your Trips heading and the first trip card.',
    'Board Games now says so plainly when the proxy is running an older version without the board games endpoint, rather than just showing a 404.'
  ]},
  {version:'1.63.0', notes:[
    'Places I\'ve Been is one continuous numbered list now: countries on a booked trip sit at the top with their own number, still faded, instead of under a separate "Coming Up" heading.',
    'Want to Go is now ❤️ rather than a star.',
    'Accommodation on the Itinerary shows a 🏠 and the time you\'d actually get there, and the card drops the address line - the copy button next to Open Map already has it.',
    'Google Maps links show the Google Maps icon instead of a map emoji.',
    'Fixed links opening in Safari and ALSO opening in the in-app browser behind them, so coming back to the app no longer finds the article sitting there.'
  ]},
  {version:'1.62.0', notes:[
    'Games is now split into PlayStation and Board Games. Board Games browses BoardGameGeek\'s top games (or anything you search), with emoji chips for the sort of game it is, and filters for players, playtime and complexity.',
    'The players filter answers "will this work for six of us", so it keeps a game that plays 2-8 and drops one that plays 2-4, rather than matching on the maximum.',
    'Mark a board game ⭐ Want to Play or ✅ Played from its card, and filter down to either shelf.'
  ]},
  {version:'1.61.0', notes:[
    'Accommodation cards now look like flight cards: the name sits in a title bar at the top with the time you can get in ("From 15:00") or have to be out ("Until 11:00") to its right. On the Itinerary the label above them just says "Accommodation" now, since the card itself says which end of the stay it is.',
    'Dropped the location pin from accommodation and stop cards, and added a 🔗 button next to Open Map that copies the address.',
    'Places I\'ve Been: "Coming Up" moved to the top of the page, above the numbered list of everywhere you\'ve already been.',
    'Places I\'ve Been is now 📍 and Going is now ✈️ on the front page, and all four card emojis are a third smaller.',
    'Tightened the gap under Your Trips, and the bottom bar and search box now stay put properly while the page scrolls.'
  ]},
  {version:'1.60.0', notes:[
    'The bottom bar\'s Places is now labelled Travel, and Country Finder is now just Countries.',
    'The serif headline font now shows on every page title and card title (My Travels, Games, trip names, dashboard tiles, country names…), not just the section headings inside a trip; things you actually need to read at speed - flight codes, times, numbers - stay on the plain sans-serif body font.',
    'Removed the permanent gap above every page\'s title that existed to stop the title riding up under the status bar while a search box\'s keyboard was open; that protection now only kicks in while a text field is actually focused, so the rest of the time the title sits right at the top.',
    'Fixed the Games search box disappearing behind the keyboard once you started typing and results appeared.',
    'Every external link (maps, bookings, flight search, albums, videos, articles) now hands off to Safari itself rather than the in-app browser, on an iPhone with the app on your home screen - previously only Search Flights and Design articles did this.'
  ]},
  {version:'1.59.0', notes:[
    'The brief App Style picker on Design is gone - Sunset Postcard (terracotta and plum, warm serif headings, soft rounded corners) is now just the app\'s look, no switching needed.'
  ]},
  {version:'1.58.0', notes:[
    'Design: added an App Style picker - four full alternate looks (Signature, Boarding Pass, Sunset Postcard, Field Notes) with their own colours, corners and typeface, switchable with one tap and remembered on your device.'
  ]},
  {version:'1.57.0', notes:[
    'Itinerary: nothing deletes straight from a card any more, tap in and Delete Stop is there in the form, same as everywhere else.',
    'Itinerary: added a Day 1 / Day 2 / … All picker at the top, so you can look at one day at a time instead of the whole trip at once.',
    'Itinerary: more space between days and cards, and the booking/map buttons on itinerary cards (accommodation, a stop\'s location) are now icon-only, no label - the favicon or pin says enough.'
  ]},
  {version:'1.56.0', notes:[
    'The bottom bar\'s Itinerary shortcut is now Design: a feed of recent UX/design articles from a handful of well-known publications, trimmed to short summaries. Itinerary itself hasn\'t gone anywhere, it\'s still on the Overview dashboard and in the trip menu, just not a bottom-bar shortcut any more.'
  ]},
  {version:'1.55.0', notes:[
    'New Tasks tab: a place for anything you know you need to sort but haven\'t booked yet (a hotel by the airport the night before a flight, say). Each one shows in red until it\'s ticked booked, on the dashboard tile and, when it\'s linked to a day, right there in the Itinerary too - same record, tick it off in either place.'
  ]},
  {version:'1.54.0', notes:[
    'Itinerary: once a trip has anything on it, every day shows, not just the ones with something planned - a day with nothing yet gets the same dashed card as an accommodation gap, with its own + Add Stop button, right where the gap falls.',
    'Travel: no flights booked now shows the same dashed card instead of a plain message.'
  ]},
  {version:'1.53.0', notes:[
    'An archived trip shows "Archived" as a pill top-right of its title, instead of a small pin-emoji phrase sharing the line with the countdown.'
  ]},
  {version:'1.52.0', notes:[
    '"How long" (on a trip with a rough idea of when) adds A Day, Weekend and Long Weekend, alongside the week options.',
    'Trip cards show up to 8 names before trimming to "+N more", up from 3.',
    'Removed the "this trip is archived and read-only" banner - trips stay fully editable after archiving, that was never intentional.',
    'A trip now archives (fades, drops to the bottom of Your Trips) two weeks after it ends instead of a month, and stays in its normal chronological place - right at the top of what\'s left - for those two weeks rather than dropping down immediately.'
  ]},
  {version:'1.51.0', notes:[
    'Places I\'ve Been cards now show a # for the order you visited, and a faded "Coming Up" preview of countries on a booked trip that hasn\'t happened yet.',
    'Fixed the page title riding up under the status bar when the keyboard opened over a search box.'
  ]},
  {version:'1.50.0', notes:[
    'Places I\'ve Been drops its region picker again and its capital/language row; it\'s now a flat list, in the order you added each country, with a bigger flag stacked above the name and a delete icon in the corner instead of a switch.',
    'Country Finder gets its region picker back.'
  ]},
  {version:'1.49.0', notes:[
    'Your Trips now lives on My Travels itself, below the four cards, instead of behind a tap on Going; + New Trip moved up next to the My Travels title.',
    'Places I\'ve Been gets its region picker back, and its list runs two columns wide (its cards are simpler than Want to Go\'s and Country Finder\'s, so they fit).',
    'Places I\'ve Been\'s check icon is now a Been / Want to Go switch, so you can mark a wishlist country without leaving the list; tapping the pill that\'s already on clears it.'
  ]},
  {version:'1.48.0', notes:[
    'Games: fixed PlayStation connect failing with a 401 (the proxy had the wrong OAuth client secret).',
    'Games: added a search box and a per-game hide toggle (hidden games sink to the bottom and fade rather than disappearing).',
    'Games: Disconnect moved to the bottom of the list.'
  ]},
  {version:'1.47.0', notes:[
    'My Travels cards drop their subheadings and now hug their content instead of stretching to fill the screen, with all four staying the same height.',
    'Country Finder\'s emoji changed from 🌐 to 🌍.',
    'Trips and Places are now one bottom-bar item (Places, the app\'s front door); Your Trips is still one tap away from the Going card.',
    'Added a Games tab: connect a PlayStation account (via a proxy you deploy yourself, see psn-proxy/README.md) to see trophy progress on what you\'re playing.'
  ]},
  {version:'1.46.0', notes:[
    'Places I\'ve Been is now the app\'s front door: four cards for what you\'ve done, what\'s coming, what you fancy and everywhere else in the world.',
    'Tap Places I\'ve Been for a plain list of everywhere you\'ve gone, grouped by continent, with a single tick to remove a country instead of one for a flight and one for a star.',
    'Tap Going to jump straight to Your Trips. A country you\'ve been to before and are heading back to counts here even though it\'s also marked Been.',
    '223 Countries is now Country Finder: every country in the world with a switch on each one for Want to Go or Not Exploring.',
    'The search bar on these lists now sits flush against the bottom bar with no gap beneath it.'
  ]},
  {version:'1.45.3', notes:[
    'The country search now sits just above the bottom bar, within reach of a thumb, and stays there while the list scrolls.',
    'The + buttons spring out of the circle and fold back into it, instead of appearing and vanishing on the spot.'
  ]},
  {version:'1.45.2', notes:[
    'Your Trips now leads with the next trip rather than the furthest away one. Trips still to come are listed in the order they will happen, then ones that have been and gone, then the archive.'
  ]},
  {version:'1.45.1', notes:[
    'Countries are listed one per row, so long names and their details have somewhere to go. Two per row on a wider screen.',
    'Going sits in the top right corner of a country instead of pushing everything else down, and the flag now sits beside the name rather than above it.'
  ]},
  {version:'1.45.0', notes:[
    'A trip no longer needs dates to exist. Pick Rough Idea when you make one and say a month, a season, a range of months, or just a year, plus roughly how many weeks you will be away.',
    'A trip planned that loosely runs on day numbers: its itinerary reads Day 1, Day 2, Day 3 rather than pretending to know dates.',
    'Pin the dates down later and every Day 3 becomes the actual third day. Go the other way and the dates fold back into day numbers, so the plan survives either move.',
    'Trips still being planned say so on their card instead of counting down to nothing.'
  ]},
  {version:'1.44.0', notes:[
    'A country on a trip you have not taken yet no longer counts as somewhere you have been. Trips only mark a country as Been once they have finished; until then it counts as Going, which has its own counter.',
    'The counters are now four, two by two, and four in a row on a wider screen.',
    'Dates are written out in full everywhere ("24 September 2026"), and a range says the year once at the end unless it runs into the new year.',
    'Your Trips lists the most recent trip first.'
  ]},
  {version:'1.43.0', notes:[
    'Accommodation now shows the nights you have nowhere to stay, as a dashed card sitting exactly where the gap falls. Its Add Accommodation button opens the form with those dates already filled in.',
    'The black pop-up that slid over the bottom bar after every action is gone. It mostly told you what you had just done. Deleting still asks before it does anything, and the few messages you actually need to read now wait in a box until you dismiss them.',
    'A New Trip button sits at the top right of Your Trips.',
    'The + wheel is down to the five things worth having there: an idea, a stop, a receipt, travel and a document.',
    'Accommodation is a house rather than a hotel throughout.'
  ]},
  {version:'1.42.0', notes:[
    'The + on the bottom bar now fans out into everything you can add: a stop, travel, an idea, a place to stay, a flight, ferry, car hire, a receipt, a poll, a packing item, a note, a contact, a link, a document, or a whole new trip. Tap the + again, tap away, or press escape to close it.',
    'Outside a trip there is only one thing to add, so the + still just starts a new trip.',
    'The compass on an undecided travel leg is a question mark in the form too, not just on the card.',
    'Hours and minutes now sit side by side on a phone instead of stacking, for both the time and the duration.',
    'Turkey and Ivory Coast are listed under their English names again.',
    'Nudged the date and countdown text into line with the icons beside them.'
  ]},
  {version:'1.41.0', notes:[
    'Checking out of one place and into another on the same day now suggests the journey between them, sitting between the two on the itinerary. Tap it to fill in how you\'re getting there, exactly like the trip to the airport.',
    'Travel with no mode chosen yet is marked with a question mark rather than a compass.',
    'Places I\'ve Been now opens on the countries you have been to, rather than the full list of 223.',
    'The three counters have lost their emoji and gained much bigger numbers.',
    'Searching for a country now finds it whichever counter you are filtered by, so you can always tick a new one.'
  ]},
  {version:'1.40.0', notes:[
    'The suggested trip to the airport now assumes you want to be there two hours before the flight, so it reads "arrive by 14:00" for a 16:05 departure instead of telling you to leave at the same moment the plane does. Change it like any other travel leg.',
    'Every page now starts its title the same distance down the screen, so nothing jumps as you move between them.'
  ]},
  {version:'1.39.1', notes:[
    'The Leave by / Arrive by buttons now sit straight under When, and the question above them has gone: the buttons say it themselves.'
  ]},
  {version:'1.39.0', notes:[
    'The top header is gone. Everything it held is now either on the page itself or on the bottom bar, so there is more room for the trip.',
    'The version number and What\'s new have moved to the foot of Your Trips.',
    'Share Trip now sits above Delete Trip on the trip overview, so the destructive button is the last thing on the page.',
    'Travel legs can say whether the time is when you leave or when you need to be there, and the card reads "leave by 16:05" or "arrive by 09:30" instead of a bare time.',
    'Fixed a travel leg you saved from a flight\'s suggestion duplicating itself when you went back and changed the mode.',
    'The emoji box on an idea now sits directly under its name, with the quick picks below it.',
    'Packing rows line up properly with their tick boxes, labels and delete buttons, and Remind me has moved up beside the section title.',
    'Dropped the tap-to-copy on locations and addresses, and the Copy list button on packing.',
    'Removed the back button on Places I\'ve Been and added some breathing room above the search box.'
  ]},
  {version:'1.38.1', notes:[
    'Places I\'ve Been: dropped the row of filter buttons, since the three cards above them now do the same job. The card you\'re filtering by is highlighted.'
  ]},
  {version:'1.38.0', notes:[
    'The bottom bar now stays put when the section menu is open, and the last button turns into Close, so the thumb that opened it can shut it again.',
    'The three Places counters have moved off the home page onto Places I\'ve Been itself.',
    'Emoji now run right through the Itinerary: your stops, travel legs, flights, ferries, car hire, check in and check out. Edit and delete stay as plain icons so they don\'t get lost in the colour.',
    'A stop added from an idea keeps that idea\'s emoji, and stops added by hand get one suggested from their name.',
    'The emoji picker now sits above the box instead of beside it, with far more activity choices for when the title gives nothing away.',
    'Centred the + on the new trip button properly.'
  ]},
  {version:'1.37.0', notes:[
    'Ideas can now have an emoji, and one is suggested from the title as you type: sushi gets a sushi, a hike gets boots, a rooftop bar gets a cocktail.',
    'Tap one of the quick picks or type any emoji you like, and once you have chosen your own the title stops overriding it.'
  ]},
  {version:'1.36.0', notes:[
    'Added a bottom bar as the main way around the app: Trips, Places, a green + in the middle for a new trip, and inside a trip, Itinerary and the menu.',
    'The globe has gone from the top header now that Places lives on the bottom bar.',
    'Trip dates now read "23 Sep - 1 Oct 2026" instead of repeating the year twice.',
    'Trip cards on the home page now show who\'s going.',
    'Removed the Back Up Trips and Restore buttons: trips sync to the cloud, so they were doing nothing useful.'
  ]},
  {version:'1.35.1', notes:[
    'Reordered the trip dashboard: Itinerary and Ideas now lead, and Edit Trip has moved to the end.',
    'Places I\'ve Been: "All" is now the globe, and South America has a llama, so no continent shares the globe with it any more.'
  ]},
  {version:'1.35.0', notes:[
    'The PIN can no longer be changed from inside the app. It now lives only in the code, so it takes a deploy to move it and nobody who gets past the gate can lock everyone else out.',
    'The PIN button has gone from the header.',
    'The three cards at the top of the home page sit a little higher up the page.'
  ]},
  {version:'1.34.1', notes:[
    'The three cards at the top of the home page now use the same plain white card style as the trips below them, instead of the filled green.',
    'Northern Ireland now shows the Irish tricolour on Places I\'ve Been.'
  ]},
  {version:'1.34.0', notes:[
    'The home page now opens with three cards, Places I\'ve Been, Want to Go and Countries. Tapping one goes straight to that list, already filtered.',
    'Your Trips now sits below those three cards.',
    'On an iPhone, with the app added to your home screen, Search Flights now hands over to Safari itself instead of the cut-down in-app browser, so you keep your Google login and can open the Google Flights app.',
    'Africa\'s emoji on Places I\'ve Been is now a lion.'
  ]},
  {version:'1.33.3', notes:[
    'The "Places I\'ve Been" card on the home page now shows its three stats as separate items, each with its own emoji, with the world total on its own line underneath.'
  ]},
  {version:'1.33.2', notes:[
    'Fixed the Itinerary tile counting travel legs as activities, so a day with one thing planned and a couple of journeys no longer reads as "4 Activities Planned".',
    'The Flights, Ferries and Car Hire headings on the Travel tab now use emoji to match the rest of the app.'
  ]},
  {version:'1.33.1', notes:[
    'The Edit Trip tile now lists who\'s going instead of repeating the countdown that already sits in the header.',
    'Places I\'ve Been: each continent card now has its own emoji, and "All" is a globe.',
    'Toned down the calendar and hourglass emoji in the trip header, they were sitting too large next to the dates.'
  ]},
  {version:'1.33.0', notes:[
    'The itinerary now works out where you are on each day by itself: flights, ferries and check-ins move the forecast along with you, so a multi-country trip shows the right town\'s weather on the right days. The "Weather for..." bar and its Change button are gone, there\'s nothing to set up any more.',
    'Weather now shows as an emoji (sun, rain, thunder) next to the temperatures.',
    'The trip header now shows a calendar next to the dates and, for a trip that hasn\'t started, an hourglass with how many days to go.'
  ]},
  {version:'1.32.1', notes:[
    'The trip dashboard tiles now use colourful emoji instead of flat green icons, so the page has more life to it and sits better next to the country flags at the top.'
  ]},
  {version:'1.32.0', notes:[
    'New Packing section: a shared list for the trip, with a one-tap starter list of the usual essentials to get going.',
    'Ticking is per person, so you and everyone else get your own boxes on the same list. An item can also be assigned to one person when it\'s only theirs to bring.',
    'A progress bar shows how much of the list is fully packed, and as the trip gets close the section reminds you how many things you\'ve still got to do.',
    '"Remind me" saves a calendar reminder for the evening before you travel, listing everything you haven\'t packed yet, and "Copy list" puts the whole thing on your clipboard.'
  ]},
  {version:'1.31.0', notes:[
    'New Polls section: settle group decisions in the app instead of a scroll of chat messages. Ask a question, add the options, and everyone taps their pick.',
    'Each option shows the running count, a share-of-the-vote bar and who voted for it, so it\'s clear where things stand and who you\'re still waiting on.',
    'Tap your own choice again to take it back, or tap another option to change your mind. One vote each, keyed to the name you picked for the trip.',
    'Close a poll once it\'s decided and the winner is highlighted; reopen it if plans change. The Overview tile tells you when a poll is waiting on your vote.'
  ]},
  {version:'1.30.0', notes:[
    'Itinerary: each day now shows the weather forecast, high/low temperature, the conditions and the chance of rain, so you can see at a glance which days to plan indoors.',
    'Forecasts only exist about two weeks ahead, so days further out simply show nothing rather than a made-up number.',
    'The forecast defaults to the trip\'s country; tap "Change" at the top of the Itinerary to pin it to the actual town you\'re staying in.'
  ]},
  {version:'1.29.1', notes:[
    'Places I\'ve Been: the Search Flights button is now icon-only (plane icon, no text) and sits bottom-right of each country card, matching the app\'s other icon buttons.',
    'Removed the "N been · N want to go · N countries" summary line from below the page title.'
  ]},
  {version:'1.29.0', notes:[
    'Places I\'ve Been: removed the 3D globe, the pie charts and the colour-key legend, simplifying the page down to region cards, a search box and country cards.',
    'Removed the separate "Going" status. A country on any active trip\'s itinerary now just shows Been ticked automatically, same as ticking it yourself.',
    'Each filter button (All, Been, Want to Go) now shows a live count in brackets.',
    'Added a "Places I\'ve Been" card to the home page with a running total, tap it to jump straight to the page.',
    'Added a "Search Flights" button (with a plane icon) to every country card, linking out to Google Flights (no live prices, just a pre-filled search, there\'s no free flight-price API to pull real numbers from).',
    'Removed the small continent icon badge from each country card (the continent heading above each group already shows this).'
  ]},
  {version:'1.28.1', notes:[
    'Places I\'ve Been: added an "All" region card (spanning the full width) that shows every country at once, and every region card now has a small pie chart showing its percentage complete.',
    'Opening a single region now shows its name as a heading again.',
    'Fixed China sometimes showing as "China mainland" depending on your browser.',
    'Been and Want to Go are now icon-only buttons instead of text.',
    'The flag now sits above the country name instead of beside it.',
    'Removed the currency symbol from each country\'s info (capital and language remain).',
    'Renamed the "Not Yet" status to "Not Interested".'
  ]},
  {version:'1.28.0', notes:[
    'Places I\'ve Been: each country now shows its capital city, language and currency symbol, with icons instead of text labels.',
    'The globe\'s "not yet" colour is duller so ticked countries stand out more, and Going is now blue instead of near-black.',
    'The globe stops auto-spinning as soon as you drag or zoom, instead of fighting your interaction.',
    'Region cards now show a percentage alongside the count.',
    'Selecting a Been/Want to Go/Going filter now also isolates that category on the globe, everything else fades to the default colour.',
    'Share and Menu (or PIN/+ New Trip) now stay in the header while you\'re on the Places page, instead of disappearing, and the globe button is the same height as them.'
  ]},
  {version:'1.27.1', notes:['Fixed the Places I\'ve Been globe not loading (the map data was pointed at the wrong address).', 'Added England, Scotland, Wales and Northern Ireland to Places I\'ve Been, in place of a single "United Kingdom" entry, since they\'re usually tracked separately. On the globe, the UK\'s single shape reflects all four together.']},
  {version:'1.26.2', notes:['The Places I\'ve Been globe icon is now a proper button, sitting next to the Share/Menu buttons inside a trip, and next to + New Trip on the Your Trips page.']},
  {version:'1.26.1', notes:['Places I\'ve Been: the search box now matches the rest of the app\'s field styling, and every country card shows a small continent icon alongside its flag.', 'Travel mode (Add/Edit Travel, and the "Travel to Airport" reminder) is now a row of icon buttons instead of a dropdown, "Not Decided" is still the default until you pick one.']},
  {version:'1.26.0', notes:['Added a "Places I\'ve Been" page (the globe icon next to the logo): tick off every country as Been or Want to Go. Any country on an upcoming trip shows as Going automatically, and once that trip is over its countries are marked Been for you. Countries are grouped by continent with a search box and a running total at the top.']},
  {version:'1.25.0', notes:['Renamed the app from "Cal\'s Trippin\'" to "My Trips".']},
  {version:'1.24.0', notes:['Accommodation: added an arrival time, separate from the check-in time, for when you\'re getting there later (or earlier) than the property\'s standard check-in. Once set, it\'s what the itinerary uses to work out where that day\'s check-in falls relative to flights and everything else, instead of always assuming it comes after them.']},
  {version:'1.23.0', notes:['The "Travel to [Airport]" reminder is now a genuine Add Travel card: clicking it opens the same full form (mode, from, to, date, duration) as any manually-added travel leg, and saving it turns it into a real, ordinary itinerary entry instead of a separate bespoke one.', 'Fixed the itinerary stop card\'s Open Map still being a plain text link instead of the bordered button used everywhere else.', 'Rebalanced the accommodation card\'s View Booking / Open Map buttons so View Booking\'s text fits on one line.', 'Alert banners (e.g. the archived-trip notice) now always fit on one line, with a button to see the full text in a popup if it\'s been truncated.', 'PDFs weren\'t viewable on mobile Safari because the in-page preview (an embedded iframe) doesn\'t render reliably there, a long-standing WebKit limitation. Viewing a PDF now hands it straight to the device\'s own PDF viewer instead of trying to preview it in place.']},
  {version:'1.22.0', notes:['Fixed Save Receipt crashing ("t.receipts.push" error) on any trip missing its receipts list entirely, an older or remote trip can simply be missing a field that was empty when last saved. Every trip now gets its list fields (receipts, flights, notes, contacts and more) guaranteed on load, wherever it came from.', 'Notes now supports multiple separate notes instead of one shared block of text, add, edit and delete each on its own.', 'Contacts: added a "Who is this for?" field, shown as a label on each contact, so a group can tell at a glance whose contact it is.', 'Links open on a tap anywhere on their card now, in a new tab, matching how documents already work.', 'Renamed the "Documents / Links" tab to "Documents & Links".', 'Ideas: each idea\'s buttons (Add/Remove from Itinerary, Open Map, Edit) are now stacked one per line instead of squeezed into a row, which was distorting the pill-shaped buttons on longer labels.', 'The "Travel to [Airport]" reminder\'s Open Map button now matches the bordered button style used elsewhere (e.g. Check In), instead of a plain text link.', 'Switched the app\'s font to Figtree.']},
  {version:'1.21.0', notes:['Travel mode dropdowns (manual travel legs and the new "Travel to [Airport]" reminder) now have a "Not Decided" option at the top, and default to it (a generic icon) instead of assuming Drive, since a plane, train or taxi are just as likely.', 'The "Travel to [Airport]" card is now clickable so you can actually set its mode.', 'Every map link in the app is now the same full "Open Map" button, none are icon-only anymore, and itinerary stops no longer show a separate embedded map preview alongside it.', 'The trip header goes back to showing the plain dates (like before), and the live countdown for an upcoming trip is now a simple "X days to go" shown under Edit Trip on the dashboard instead of a ticking clock under the title.', 'Money tab\'s empty state now says "No Receipts Yet".', 'Toast notifications for longer messages (like a save error) now stay up longer and wrap onto multiple lines instead of being cut off after a couple of seconds.']},
  {version:'1.20.0', notes:['Ideas: the map link on a pinned idea is now the same "Open in Google Maps" button used everywhere else, instead of a small icon-only link.', 'Itinerary: flights now get an automatic "Travel to [Airport]" reminder card right before them, with just a map link for the airport, no other detail to fill in.', 'Overview: Edit Trip is now the first card in the dashboard grid (with the trip dates shown underneath it) instead of a separate button below everything. The line under the trip title now shows a live countdown ticking down to departure for an upcoming trip.']},
  {version:'1.19.2', notes:['Save Receipt could fail with zero feedback if anything unexpected went wrong (or if the trip wasn\'t loaded), it now shows a clear message explaining what happened instead of silently doing nothing.']},
  {version:'1.19.1', notes:['Itinerary stops now show their location as a tap-to-copy address (with a pin icon), matching how accommodation addresses already work.']},
  {version:'1.19.0', notes:['Removed receipt photo scanning (Take a Photo / Upload an Image) entirely; it wasn\'t working reliably, so receipts are now always added by hand, item by item or as an even split.', 'Desktop: the logo now sits hard left and the header buttons sit hard right, using the full header width instead of a narrow centered strip.', 'Desktop: "All Trips" is now the first item in the trip menu, and the trip name no longer repeats at the top of the sidebar (it\'s already shown as the page heading).', 'Desktop: the countdown now sits right-aligned in the same row as the trip title and dates, instead of its own row underneath.', 'Removed long dashes from copy throughout the app in favour of commas, colons and periods.']},
  {version:'1.18.2', notes:['Fixed trips silently failing to appear on other browsers/devices even with cloud sync configured: the database rules needed for listing every trip (and for the in-app PIN change) were missing from the setup instructions, so those reads/writes were being quietly rejected and falling back to "nothing here." Now shows a clear message explaining exactly what\'s missing instead of failing silently, and the README\'s example rules are corrected.']},
  {version:'1.18.1', notes:['Fixed the PIN field overflowing its margin on mobile.', 'The "Your Trips" page no longer briefly says "No trips yet" while it\'s still fetching the real list from the cloud, it now says "Loading trips…" until that finishes.', 'Added a PIN button next to + New Trip so the group PIN can be changed from inside the app, updates it for everyone straight away, no code change needed.']},
  {version:'1.18.0', notes:['Replaced the per-trip "you need the link" model with a single shared PIN for the whole site: enter it once per browser (remembered after that) and the "Your Trips" list now shows every trip that exists, created by anyone, on any device, instead of only trips this particular browser happened to make or open before. The PIN protects the whole app, including direct trip links.']},
  {version:'1.17.2', notes:['Fixed the receipt\'s own "Total" line sometimes being picked up as a fake extra item (e.g. showing as an item literally named "; Total"), a stray OCR character right at the start of a line was breaking the check that\'s meant to exclude it, so it got counted and split like a real purchase on top of the actual items.']},
  {version:'1.17.1', notes:['Receipt scanning now detects the receipt\'s actual currency (£/€/$) instead of always assuming pounds, and converts to £ using today\'s exchange rate, a euro receipt was previously shown, split and totalled as if the numbers were already in pounds. The original amount and rate used are shown on the saved receipt.']},
  {version:'1.17.0', notes:['Countdown restyled in the app\'s own brand colours: no more dark card, tiles are full width and green with white text.', 'Receipt scanning, tested against a real photographed receipt: photos taken sideways (very common for a narrow receipt) now get auto-rotated by trying each orientation and keeping whichever one Tesseract reads most confidently, instead of failing outright. Line items are now reconstructed from each word\'s position on the receipt rather than trusting the raw text\'s line breaks, so tabular receipts (item / unit price / qty / total in separate columns) parse correctly. Also fixed round totals a printer had truncated to one decimal (e.g. "€30.0"), and added Spanish/Portuguese equivalents (parcial, impuesto, propina, servicio…) to the recognized summary-line and service-charge terms.', 'Activity is no longer its own tab, the log now sits below the Delete Trip button on Overview, and each entry links straight to the section it\'s about.']},

/* ================= state ================= */
const LS_KEY = 'calstrippin_v1';
const SCHEMA = 1;
var DB = load();
let CUR_TAB = 'info';
let CUR_TRIP_ID = null;      // id of the trip currently open
let fbRoot = null;           // firebase database ref, or null when local-only
let tripSub = null;          // { id, ref } for the active onValue subscription
let syncState = 'local';     // 'local' | 'ok' | 'busy' | 'off'
let lastPush = '';           // echo guard for our own writes

function load(){
  try{
    const db = JSON.parse(localStorage.getItem(LS_KEY));
    if(db && Array.isArray(db.trips)){
      db.schema = db.schema || SCHEMA;
      db.places = (db.places && typeof db.places==='object') ? db.places : {};
      db.placesArchived = Array.isArray(db.placesArchived) ? db.placesArchived : [];
      db.gigs = Array.isArray(db.gigs) ? db.gigs : [];
      db.films = Array.isArray(db.films) ? db.films : [];
      db.filmsWatchlist = Array.isArray(db.filmsWatchlist) ? db.filmsWatchlist : [];
      db.theatre = Array.isArray(db.theatre) ? db.theatre : [];
      db.theatreWatchlist = Array.isArray(db.theatreWatchlist) ? db.theatreWatchlist : [];
      db.plants = Array.isArray(db.plants) ? db.plants : [];
      return db;
    }
  }catch(e){}
  return {trips:[], schema:SCHEMA, places:{}, placesArchived:[], gigs:[], films:[], filmsWatchlist:[], theatre:[], theatreWatchlist:[], plants:[]};
}
/* persist to localStorage. If storage is full, never lose a trip, drop only the heavy
   in-browser file/photo previews (they still live in the cloud copy when synced) and keep
   every trip and all its details. */
function saveLocal(){
  DB.schema = SCHEMA;
  try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); return; }
  catch(e){}
  try{
    let dropped = 0;
    DB.trips.forEach(t=>{
      (t.documents||[]).forEach(d=>{ if(d.dataUrl){ d.dataUrl=null; d.stripped=true; dropped++; } });
      (t.moodBoard||[]).forEach(m=>{ if(m.dataUrl){ m.dataUrl=null; m.stripped=true; dropped++; } });
    });
    localStorage.setItem(LS_KEY, JSON.stringify(DB));
    if(dropped) noteModal('Storage Full', 'Some file previews were dropped from this device, but your trips are safe.');
  }catch(e2){ noteModal('Storage Full', "That couldn't be saved. Try removing some photos or documents."); }
}
/* save() persists locally AND pushes the open trip to the shared store (when enabled) */
function save(){
  saveLocal();
  const t = CUR_TRIP_ID && getTrip(CUR_TRIP_ID);
  if(t) pushTrip(t);
}

/* ================= cloud sync ================= */
function cloudEnabled(){ return !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL); }
/* surface *why* sync failed instead of a silent Offline pill, permission-denied (locked
   database rules) is by far the most common cause when it's freshly configured */
let _syncErrorToasted = false;
function syncErrorHint(err){
  const code = (err && (err.code||err.message||err)||'').toString();
  if(/permission[_-]?denied/i.test(code)) return "Sync is blocked by the database rules. Open the Firebase console → Realtime Database → Rules and allow read/write.";
  return 'Sync failed: '+code;
}
function reportSyncError(err){
  console.error("My Trips, cloud sync error:", err);
  syncState='off';
  if(!_syncErrorToasted){ _syncErrorToasted = true; noteModal('Sync Problem', syncErrorHint(err)); }
}
function initCloud(){
  if(!cloudEnabled() || typeof firebase==='undefined'){ syncState='local'; return; }
  try{
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    fbRoot = firebase.database();
    firebase.database().ref('.info/connected').on('value', s=>{
      if(CUR_TRIP_ID){ syncState = s.val() ? 'ok' : 'off'; }
    }, reportSyncError);
  }catch(e){ fbRoot = null; syncState='local'; console.error("My Trips, Firebase failed to initialise:", e); }
}
/* strip heavy blobs so the shared document stays small & portable */
function stripForCloud(t){
  const c = JSON.parse(JSON.stringify(t));
  delete c._identifiedHere;
  c.documents = (c.documents||[]).map(d=>
    d.dataUrl && d.dataUrl.length > SYNC_BLOB_CAP ? {...d, dataUrl:null, stripped:true} : d);
  c.moodBoard = (c.moodBoard||[]).map(m=>
    m.dataUrl && m.dataUrl.length > SYNC_BLOB_CAP ? {...m, dataUrl:null, stripped:true} : m);
  // strip large boarding-pass / itinerary attachments from the shared copy too
  ['flights','ferries','carHire','itinerary'].forEach(k=>{
    c[k] = (c[k]||[]).map(x=>{
      if(x.doc && x.doc.dataUrl && x.doc.dataUrl.length > SYNC_BLOB_CAP) x = {...x, doc:{...x.doc, dataUrl:null, stripped:true}};
      if(x.image && x.image.length > SYNC_BLOB_CAP) x = {...x, image:null, imageStripped:true};
      return x;
    });
  });
  return c;
}
function pushTrip(t){
  if(!fbRoot) return;
  const clean = stripForCloud(t);
  const json = JSON.stringify(clean);
  if(json === lastPush) return;
  lastPush = json;
  syncState='busy';
  fbRoot.ref('trips/'+t.id).set(clean)
    .then(()=>{ syncState='ok'; _syncErrorToasted=false; })
    .catch(reportSyncError);
}
/* keep any locally-held blobs that the shared copy dropped */
function mergeRemote(local, remote){
  if(!local) return remote;
  const keepBlob = (arr, rem) => (rem||[]).map(r=>{
    if(r.dataUrl || !r.stripped) return r;
    const l = (arr||[]).find(x=>x.id===r.id);
    return l && l.dataUrl ? {...r, dataUrl:l.dataUrl, stripped:false} : r;
  });
  remote.documents = keepBlob(local.documents, remote.documents);
  remote.moodBoard = keepBlob(local.moodBoard, remote.moodBoard);
  return remote;
}
function subscribeTrip(id){
  if(tripSub){ try{ tripSub.ref.off('value', tripSub.cb); }catch(e){} tripSub=null; }
  if(!fbRoot) return;
  const ref = fbRoot.ref('trips/'+id);
  const cb = snap => {
    const remote = snap.val();
    if(!remote) return;
    // normalise arrays (Firebase can return objects for sparse/keyed data)
    ['flights','ferries','carHire','documents','receipts','moodBoard','participants','editLog','countries','itinerary','docLinks','accommodations']
      .forEach(k=>{ if(remote[k] && !Array.isArray(remote[k])) remote[k]=Object.values(remote[k]); });
    if(remote.notes && remote.notes.contacts && !Array.isArray(remote.notes.contacts))
      remote.notes.contacts = Object.values(remote.notes.contacts);
    normalizeTrip(remote);
    const echo = JSON.stringify(remote) === lastPush;
    const idx = DB.trips.findIndex(x=>x.id===id);
    const merged = mergeRemote(idx>=0?DB.trips[idx]:null, remote);
    if(idx>=0) DB.trips[idx]=merged; else DB.trips.unshift(merged);
    saveLocal();
    syncState='ok';
    if(!echo && CUR_TRIP_ID===id && !modalOpen()) renderTrip(merged);
  };
  ref.on('value', cb, reportSyncError);
  tripSub = {id, ref, cb};
}
function fetchTripOnce(id, done){
  if(!fbRoot){ done(null); return; }
  fbRoot.ref('trips/'+id).get()
    .then(s=>done(s.exists()?s.val():null)).catch(err=>{ reportSyncError(err); done(null); });
}

/* ================= device id (anonymous, for poll voting only) ================= */
/* a single random id, generated once and kept in localStorage - not a name, not tied to any
   trip, just enough to remember "this device already voted on this poll" without asking who's
   using it. There's no more per-trip identity system (see git history: this app is single-user
   now, so "who is this device" was a modal in the way, not a feature). */
function deviceVoteId(){
  try{
    let id = localStorage.getItem('calstrippin_device_id');
    if(!id){ id = uid()+uid(); localStorage.setItem('calstrippin_device_id', id); }
    return id;
  }catch(e){ return 'anon'; }
}

/* ================= edit log ================= */
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<45) return 'just now';
  const m = Math.floor(s/60); if(m<60) return m+' min ago';
  const h = Math.floor(m/60); if(h<24) return h+(h===1?' hour ago':' hours ago');
  const d = Math.floor(h/24); if(d<7) return d+(d===1?' day ago':' days ago');
  return fmtDate(new Date(ts).toISOString().slice(0,10));
}
function logEdit(section, summary){
  const t = CUR_TRIP_ID && getTrip(CUR_TRIP_ID); if(!t) return;
  t.editLog = t.editLog || [];
  t.editLog.push({id:uid(), when:Date.now(), section, summary});
  if(t.editLog.length>200) t.editLog = t.editLog.slice(-200);
}

/* ================= utils ================= */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* text safe to pass as a single-quoted argument inside an onclick attribute. esc() alone
   isn't enough there: the browser turns its &#39; back into a real apostrophe before the JS
   is parsed, so an address like "St John's Road" would end the string early. Percent-encoding
   leaves nothing behind that either parser reacts to; the handler decodeURIComponent's it. */
const jsArg = s => encodeURIComponent(String(s==null?'':s)).replace(/'/g, '%27');
/* The pop-up that used to slide over the bottom bar after every action is gone. It said
   things you already knew ("Stop saved", right after you saved a stop) and covered the bar
   while it did. Every delete already asks first, so its Undo was a second safety net rather
   than the only one. Kept as a no-op so the ~40 places that announce what they just did
   don't each need a special case: they simply say nothing now. Anything you genuinely have
   to read, an error or a "you can't do that yet", goes through noteModal below instead, and
   waits to be dismissed rather than fading away unread. */
function toast(){}
/* the small number of messages that aren't just narration: something failed, or something
   has to be filled in first. Defined here but implemented once openModal exists. */
function noteModal(title, body){
  openModal(`
    <h2>${esc(title)}</h2>
    <p class="small" style="margin-bottom:16px">${esc(body)}</p>
    <div class="modal-actions btn-row" style="justify-content:flex-end">
      <button class="btn primary" onclick="closeModal()">OK</button>
    </div>`);
}
/* One date format everywhere: "24 September 2026", month written out in full. */
function fmtDate(d){
  if(!d) return '';
  return new Date(d + 'T00:00:00').toLocaleDateString(undefined, {day:'numeric', month:'long', year:'numeric'});
}
/* the same date without its year, for the near end of a range that says the year once */
function fmtDateNoYear(d){
  if(!d) return '';
  return new Date(d + 'T00:00:00').toLocaleDateString(undefined, {day:'numeric', month:'long'});
}
/* A short d/m/yy date, for the tight card-meta spots (a film's watched date, a gig's date)
   where fmtDate's spelled-out month - "19 April 2026" - crowds out the year/rating or venue
   sitting right next to it. "19/4/26" reads just as unambiguously in that little a space. */
function fmtShortDate(d){
  if(!d) return '';
  const dt = new Date(d + 'T00:00:00');
  return dt.getDate()+'/'+(dt.getMonth()+1)+'/'+String(dt.getFullYear()).slice(-2);
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
/* The two ends of a range, given separately so a caller can slot times in between them.
   The year is said once, at the end: "24 September - 26 September 2026". A range that runs
   into the new year needs both, since one year at the end would be wrong for the first half:
   "28 December 2026 - 3 January 2027". */
function rangeParts(a, b){
  const crosses = new Date(a+'T00:00:00').getFullYear() !== new Date(b+'T00:00:00').getFullYear();
  return {from: crosses ? fmtDate(a) : fmtDateNoYear(a), to: fmtDate(b)};
}
function fmtRange(a,b){
  if(!a && !b) return 'Dates TBC';
  if(!a || !b) return a ? 'From '+fmtDate(a) : 'Until '+fmtDate(b);
  const p = rangeParts(a,b);
  return p.from+' - '+p.to;
}
/* kept as its own name because the trip header used to want something more compact; it now
   reads exactly like every other range */
const fmtRangeLong = fmtRange;
/* months/weeks/days breakdown for the "to go" countdown, e.g. "1 month 2 weeks to go" */
function daysToGoPhrase(n){
  if(n===0) return 'starts today';
  if(n===1) return '1 day to go';
  let rem = n;
  const months = Math.floor(rem/30); rem -= months*30;
  const weeks = Math.floor(rem/7); rem -= weeks*7;
  const days = rem;
  const parts = [];
  if(months) parts.push(months+(months===1?' month':' months'));
  if(weeks) parts.push(weeks+(weeks===1?' week':' weeks'));
  if(days || !parts.length) parts.push(days+(days===1?' day':' days'));
  return parts.join(' ')+' to go';
}
/* short parenthetical for the trip header: "1 month 2 weeks to go", "day 2 of 8"… */
function statusPhrase(t){
  if(isArchived(t)) return '';   // shown as a pill top-right of the header instead
  const day = 86400000, today = new Date(); today.setHours(0,0,0,0);
  const s = t.startDate ? new Date(t.startDate+'T00:00:00') : null;
  const e = t.endDate ? new Date(t.endDate+'T00:00:00') : null;
  if(s && today < s){ const n = Math.round((s-today)/day); return daysToGoPhrase(n); }
  if(e && today > e){ const n = Math.round((today-e)/day); return n===1?'ended yesterday':'ended '+n+' days ago'; }
  if(s && e){ const d = Math.round((today-s)/day)+1, tot = Math.round((e-s)/day)+1; return 'day '+d+' of '+tot; }
  if(s) return 'happening now';
  return '';
}
/* the trip's start date, but only when it's genuinely still ahead of us, used to decide
   whether the header shows the live countdown card instead of the "N to go" phrase */
function upcomingStartDate(t){
  if(isArchived(t) || !t.startDate) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  return today < new Date(t.startDate+'T00:00:00') ? t.startDate : null;
}
/* flat day count for the Edit Trip tile's summary, e.g. "45 days to go" */
function daysToGoCount(startDate){
  const today = new Date(); today.setHours(0,0,0,0);
  const n = Math.round((new Date(startDate+'T00:00:00') - today)/86400000);
  return n+' day'+(n===1?'':'s')+' to go';
}
/* ---------- trips without dates yet ----------
   Plenty of trips start as "somewhere hot next summer" long before anyone books anything, so
   a trip can carry a rough idea of when instead of two exact dates. t.when holds it and
   startDate/endDate stay empty; the moment real dates are set, t.when goes and everything
   date-driven (weather, the countdown, archiving, accommodation gaps) starts working again. */
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const SEASONS = [['spring','Spring'],['summer','Summer'],['autumn','Autumn'],['winter','Winter']];
const WHEN_KINDS = [['month','Month'],['season','Season'],['months','Month Range'],['year','Just the Year']];
const hasRoughWhen = t => !!(t && t.when && t.when.year && !t.startDate && !t.endDate);
/* "August 2027", "Summer 2027", "August to September 2027", "Sometime in 2027" */
function whenLabel(w){
  if(!w || !w.year) return '';
  const m = n => MONTH_NAMES[Math.max(0,Math.min(11,(n||1)-1))];
  if(w.kind==='season'){ const s = SEASONS.find(x=>x[0]===w.season); return (s?s[1]:'Sometime')+' '+w.year; }
  if(w.kind==='month')  return m(w.month)+' '+w.year;
  if(w.kind==='months'){
    /* a range that wraps past December runs into the next year, so both need saying */
    if(w.endMonth < w.month) return m(w.month)+' '+w.year+' to '+m(w.endMonth)+' '+(w.year+1);
    return w.endMonth===w.month ? m(w.month)+' '+w.year : m(w.month)+' to '+m(w.endMonth)+' '+w.year;
  }
  return 'Sometime in '+w.year;
}
/* short trips are stored as a fraction of a week (day count / 7) rather than adding a
   separate unit, so "How long" stays one field; SHORT_WHEN_LABELS gives those fractions a
   proper name instead of printing "0.14 weeks" */
const SHORT_WHEN_OPTS = [[1/7,'A day'],[2/7,'Weekend'],[4/7,'Long weekend']];
const SHORT_WHEN_LABELS = Object.fromEntries(SHORT_WHEN_OPTS.map(([v,l])=>[v,l]));
const weeksLabel = n => !n ? '' : SHORT_WHEN_LABELS[n] || (n+' week'+(n===1?'':'s'));
/* something sortable for a trip whether its dates are real or still a rough idea, so both
   kinds can be ordered together. A season becomes the month it starts in. */
function tripSortDate(t){
  if(t.startDate) return t.startDate;
  const w = t.when;
  if(!w || !w.year) return '';
  const m = w.kind==='season' ? ({spring:3, summer:6, autumn:9, winter:12}[w.season] || 6)
          : (w.kind==='month' || w.kind==='months') ? (w.month || 1)
          : 1;
  return w.year+'-'+String(m).padStart(2,'0')+'-01';
}
/* how many days a rough trip runs for, when a length has been given. Rounded: a fraction of
   a week (a day/weekend/long weekend, see SHORT_WHEN_OPTS) times 7 lands a hair either side
   of a whole number in floating point, and this is used as an array length elsewhere. */
const roughTripDays = t => hasRoughWhen(t) && t.when.weeks ? Math.round(t.when.weeks*7) : 0;
/* the one line that says when a trip is, whichever way it's been pinned down */
function tripWhenLine(t){
  if(hasRoughWhen(t)){
    const wk = weeksLabel(t.when.weeks);
    return whenLabel(t.when) + (wk?' · '+wk:'');
  }
  return fmtRange(t.startDate, t.endDate);
}
/* The "when" block both trip forms share. Exact dates or a rough idea, with only the fields

        <div class="field" id="${p}-f-endmonth" style="${kind==='months'?'':'display:none'}">
          <label class="label" for="${p}-endmonth">To</label>

/* the two click handlers the block needs live with the rest of App, further down: this runs
   before App exists */
function setWhenModeImpl(p, mode){
  const el = $('#'+p+'-mode'); if(!el) return;
  el.value = mode;
  $('#'+p+'-exact').style.display = mode==='exact' ? '' : 'none';
  $('#'+p+'-rough').style.display = mode==='rough' ? '' : 'none';
  document.querySelectorAll('.mode-when').forEach(x=>{
    const on = x.dataset.mode === mode;
    x.classList.toggle('on', on); x.setAttribute('aria-checked', String(on));
  });
}
function setWhenKindImpl(p, kind){
  const el = $('#'+p+'-kind'); if(!el) return;
  el.value = kind;
  document.querySelectorAll('.when-pick').forEach(x=>{
    const on = x.dataset.when === kind;
    x.classList.toggle('on', on); x.setAttribute('aria-checked', String(on));
  });
  const show = (id, yes) => { const f = $('#'+p+'-f-'+id); if(f) f.style.display = yes ? '' : 'none'; };
  show('month', kind==='month' || kind==='months');
  show('endmonth', kind==='months');
  show('season', kind==='season');
  /* the month select doubles as the start of a range, so its label has to say which it is */
  const ml = document.querySelector('label[for="'+p+'-month"]');
  if(ml) ml.textContent = kind==='months' ? 'From' : 'Month';
}
/* what the when block currently says, as the two fields a trip stores */
function readWhenFields(p){
  const rough = ($('#'+p+'-mode')||{}).value === 'rough';
  if(!rough) return {startDate: $('#'+p+'-start').value, endDate: $('#'+p+'-end').value, when: null};
  const kind = $('#'+p+'-kind').value;
  const when = {kind, year: +$('#'+p+'-year').value, weeks: +$('#'+p+'-weeks').value};
  if(kind==='month' || kind==='months') when.month = +$('#'+p+'-month').value;
  if(kind==='months') when.endMonth = +$('#'+p+'-endmonth').value;
  if(kind==='season') when.season = $('#'+p+'-season').value;
  return {startDate:'', endDate:'', when};
}
function money(n){ return (n<0?'-':'') + '£' + Math.abs(n).toFixed(2); }
/* a trip fades and drops to the bottom of Your Trips two weeks after it ends, not a month:
   long enough that you're not still looking at a trip you're mid-recap on, short enough that
   the list doesn't stay cluttered with old trips */
function isArchived(t){
  if(!t.endDate) return false;
  const cut = new Date(t.endDate + 'T00:00:00');
  cut.setDate(cut.getDate()+14);
  return new Date() > cut;
}
function getTrip(id){ return DB.trips.find(t=>t.id===id); }
/* guarantees every trip loaded from anywhere (local storage, Firebase, a legacy snapshot
   link) has all its list fields as real arrays, an older trip can predate a feature and a
   remote one can simply be missing a key that was empty when last written, either way code
   elsewhere that pushes straight into e.g. t.receipts assumes the array is already there.
   Also carries one-time upgrades: a trip used to hold a single accommodation at notes.accom
   rather than a list at accommodations[], and a single free-text note at notes.general
   rather than a list of separate notes at notes.items[] */
function normalizeTrip(t){
  if(!t) return t;
  ['countries','flights','ferries','carHire','accommodations','documents','docLinks',
   'itinerary','receipts','moodBoard','participants','editLog','polls','packing','tasks'].forEach(k=>{
    if(!Array.isArray(t[k])) t[k] = [];
  });
  t.notes = t.notes || {};
  if(!Array.isArray(t.notes.contacts)) t.notes.contacts = [];
  if(!Array.isArray(t.notes.items)) t.notes.items = [];
  if(t.notes.accom){
    const a = t.notes.accom;
    if(a && (a.name||a.address||a.bookingUrl||a.checkin||a.checkout)) t.accommodations.push({id:uid(), ...a});
    delete t.notes.accom;
  }
  if((t.notes.general||'').trim()){
    t.notes.items.push({id:uid(), text:t.notes.general.trim()});
    delete t.notes.general;
  }
  return t;
}
/* where the trip sits in time, used for at-a-glance status pills */
function tripStatus(t){
  if(isArchived(t)) return {label:'Archived', cls:'off'};
  /* a rough trip has nothing to count down to, so the pill says how firm the plan is
     instead of pretending to know a date */
  if(hasRoughWhen(t)) return {label:'Being Planned', cls:'soon'};
  const day = 86400000, today = new Date(); today.setHours(0,0,0,0);
  const s = t.startDate ? new Date(t.startDate+'T00:00:00') : null;
  const e = t.endDate ? new Date(t.endDate+'T00:00:00') : null;
  if(s && today < s){
    const n = Math.round((s-today)/day);
    return {label: n===0?'Starts today':n===1?'Starts tomorrow':'In '+n+' days', cls:'soon'};
  }
  if(e && today > e){
    const n = Math.round((today-e)/day);
    return {label: n===0?'Just ended':n===1?'Ended yesterday':'Ended '+n+' days ago', cls:'past'};
  }
  if(s){
    if(e){ const d=Math.round((today-s)/day)+1, tot=Math.round((e-s)/day)+1; return {label:'Happening now · day '+d+' of '+tot, cls:'now'}; }
    return {label:'Happening now', cls:'now'};
  }
  return {label:'Dates TBC', cls:''};
}
function statusPill(t){ const s = tripStatus(t); return `<span class="status-pill ${s.cls}">${esc(s.label)}</span>`; }
/* anyone with the link can edit, archived trips included: archived is a visual/sort state

function readOnly(t){ return false; }
function fileSize(b){ return b>1048576 ? (b/1048576).toFixed(1)+' MB' : Math.round(b/1024)+' KB'; }

/* ISO 3166-1 alpha-2 codes; names come from Intl.DisplayNames, flags from regional indicators.
   Plus a small set of "user-assigned" codes (the XA-XZ range ISO guarantees will never be
   handed to a real country) for places that are commonly tracked as their own "country" on a
   travel checklist despite having no ISO code of their own: England, Scotland and Wales use
   their real Unicode flag emoji; XI (Northern Ireland) mirrors the code the UK/EU already use
   for it in customs contexts. There is no Northern Ireland flag emoji, so this shows the Irish
   tricolour by preference (note that is the Republic's flag; NI is part of the UK). */
const COUNTRY_CODES = ('AD AE AF AG AI AL AM AO AR AT AU AW AZ BA BB BD BE BF BG BH BI BJ BM BN BO BR BS BT BW BY BZ CA CD CF CG CH CI CK CL CM CN CO CR CU CV CW CY CZ DE DJ DK DM DO DZ EC EE EG ER ES ET FI FJ FK FM FO FR GA GD GE GG GH GI GL GM GN GQ GR GT GW GY HK HN HR HT HU ID IE IL IM IN IQ IR IS IT JE JM JO JP KE KG KH KI KM KN KP KR KW KY KZ LA LB LC LI LK LR LS LT LU LV LY MA MC MD ME MG MH MK ML MM MN MO MQ MR MS MT MU MV MW MX MY MZ NA NC NE NG NI NL NO NP NR NU NZ OM PA PE PF PG PH PK PL PR PT PW PY QA RO RS RU RW SA SB SC SD SE SG SI SK SL SM SN SO SR SS ST SV SX SY SZ TC TD TG TH TJ TL TM TN TO TR TT TV TW TZ UA UG US UY UZ VA VC VE VG VI VN VU WS YE ZA ZM ZW XE XS XW XI').split(' ');
/* a few codes where different browsers' Intl.DisplayNames disagree or add a disambiguating
   suffix (e.g. some render CN as "China mainland", HK/MO with a "SAR China" suffix), pinned
   to the plain, consistent name so it doesn't vary browser to browser */
/* the browser's own country names are mostly right, but a few come through as the local
   name rather than the English one (CLDR renamed TR to Türkiye in 2022, and CI has always
   been listed under its French name), so those are pinned here. Curaçao and São Tomé keep
   their accents: those ARE the English names, not untranslated ones. */
const CUSTOM_COUNTRY_NAMES = {XE:'England', XS:'Scotland', XW:'Wales', XI:'Northern Ireland', CN:'China', HK:'Hong Kong', MO:'Macao',
  TR:'Turkey', CI:'Ivory Coast'};
/* so typing the name the browser used to show still finds the country */
const COUNTRY_NAME_ALIASES = {'türkiye':'TR', 'turkiye':'TR', 'côte d’ivoire':'CI', "côte d'ivoire":'CI', 'cote d’ivoire':'CI', "cote d'ivoire":'CI'};
const CUSTOM_COUNTRY_FLAGS = {XE:'\u{1F3F4}\u{E0067}\u{E0062}\u{E0065}\u{E006E}\u{E0067}\u{E007F}', XS:'\u{1F3F4}\u{E0067}\u{E0062}\u{E0073}\u{E0063}\u{E0074}\u{E007F}', XW:'\u{1F3F4}\u{E0067}\u{E0062}\u{E0077}\u{E006C}\u{E0073}\u{E007F}', XI:'\u{1F1EE}\u{1F1EA}'};
const flagEmoji = c => CUSTOM_COUNTRY_FLAGS[c] || c.replace(/./g, ch => String.fromCodePoint(127397 + ch.charCodeAt(0)));
const COUNTRIES = (()=>{
  let dn = null;
  try{ dn = new Intl.DisplayNames(['en'], {type:'region'}); }catch(e){}
  return COUNTRY_CODES
    .map(c => ({code:c, name:CUSTOM_COUNTRY_NAMES[c] || (dn && dn.of(c)) || c, flag:flagEmoji(c)}))
    .sort((a,b)=>a.name.localeCompare(b.name));
})();
const countryByName = n => {
  const q = String(n||'').trim().toLowerCase();
  return COUNTRIES.find(c=>c.name.toLowerCase()===q)
      || (COUNTRY_NAME_ALIASES[q] ? countryByCode(COUNTRY_NAME_ALIASES[q]) : undefined);
};
const countryByCode = c => COUNTRIES.find(x=>x.code===String(c||'').toUpperCase());
function countryDatalist(){ return `<datalist id="country-list">${COUNTRIES.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist>`; }
function countryPills(codes, removable, fnName){
  return (codes||[]).map((c,i)=>{
    const co = countryByCode(c); if(!co) return '';
    return `<span class="chip country"><span class="flag">${co.flag}</span>${esc(co.name)}${removable?`<button aria-label="Remove ${esc(co.name)}" onclick="${fnName}(${i})">${fa('xmark')}</button>`:''}</span>`;
  }).join('');
}
function tripFlagsArr(t){
  return (t.countries||[]).map(c=>{ const co=countryByCode(c); return co?co.flag:''; }).filter(Boolean);
}
function tripFlags(t){
  return tripFlagsArr(t).join('');
}

/* countries on any non-archived trip's itinerary auto-count as Been; archived trips don't
   (those get folded into DB.places directly, see applyArchiveTransitions below) */
/* What your trips say about each country: 'been' once a trip there has finished, 'going'
   while it's still ahead of you or under way. A trip you haven't taken yet is not somewhere
   you've been, which is what this used to claim. A trip with no end date counts as still to
   come, since there's nothing to say it's over. */
function placesTripMap(){
  const map = {};
  const today = todayStr();
  DB.trips.forEach(t=>{
    const finished = t.endDate && t.endDate < today;
    (t.countries||[]).forEach(c=>{
      if(finished) map[c] = 'been';
      else if(map[c] !== 'been') map[c] = 'going';
    });
  });
  return map;
}
/* one-time transition: once a trip crosses the archive boundary, mark its countries
   Been for good, otherwise they'd quietly drop out of the auto-Been count with nothing to show for it */
function applyArchiveTransitions(){
  if(!DB.places) DB.places = {};
  if(!Array.isArray(DB.placesArchived)) DB.placesArchived = [];
  let changed = false;
  /* oldest-finished trip first, not whatever order the trips happen to sit in - Been's order
     is read off DB.places' own insertion order (newest key first), so a trip archived out of
     travel-date order would leave its countries reading as more/less recent than they really
     were, regardless of when the trip was actually created in the app */
  DB.trips.slice().sort((a,b)=>(a.endDate||'').localeCompare(b.endDate||'')).forEach(t=>{
    if(!isArchived(t) || DB.placesArchived.includes(t.id)) return;
    (t.countries||[]).forEach(c=>{ DB.places[c] = 'been'; });
    DB.placesArchived.push(t.id);
    changed = true;
  });
  if(changed) savePlaces();
}
/* Been wins over everything: a finished trip proves it, and so does ticking it yourself, and
   neither is undone by having a trip back there booked. Going comes next, since a country
   you're actually travelling to isn't merely one you fancy. */
function placesStatusOf(code, fromTrips){
  const manual = (DB.places||{})[code];
  /* an explicit 'none' is you saying "take this off my list", which has to beat a trip:
     otherwise unticking a country a trip put there would do nothing and look broken */
  if(manual === 'none') return 'none';
  if(fromTrips === 'been' || manual === 'been') return 'been';
  if(fromTrips === 'going') return 'going';
  return manual || 'none';
}
/* Going is the one count that ignores the order above: a country you've been to before and
   are going back to belongs in both, so this asks the trips directly rather than the status. */
function goingCount(){
  const m = placesTripMap();
  return COUNTRY_CODES.filter(c => m[c]==='going' && (DB.places||{})[c] !== 'none').length;
}
function placesCounts(){
  const trips = placesTripMap();
  const counts = {all: COUNTRY_CODES.length, been:0, going:0, want:0};
  COUNTRY_CODES.forEach(c=>{
    const s = placesStatusOf(c, trips[c]);
    if(counts[s]!=null) counts[s]++;
  });
  return counts;
}

let _lastFocus = null;

/* every text field in the app gets a small × button (shown once it has a value) that clears
   it, wired up generically here rather than in each of the many form templates */
function attachFieldClears(root){
  root.querySelectorAll('input[type="text"], input[type="url"], input[type="tel"], input[type="email"], input[type="search"], textarea').forEach(inp=>{
    const wrap = document.createElement('span');
    wrap.className = 'field-clearwrap';
    inp.parentNode.insertBefore(wrap, inp);
    wrap.appendChild(inp);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'field-clear';
    btn.setAttribute('aria-label','Clear');
    btn.innerHTML = fa('xmark');
    const toggle = () => { btn.style.display = inp.value ? 'flex' : 'none'; };
    btn.onclick = () => { inp.value=''; inp.focus(); inp.dispatchEvent(new Event('input',{bubbles:true})); toggle(); };
    inp.addEventListener('input', toggle);
    wrap.appendChild(btn);
    toggle();
  });
}
/* forms and viewers open as full screens (no popups), a Back bar returns to the page below */
function openModal(html, opts){
  opts = opts || {};
  const root = $('#modal-root');
  const prev = root.querySelector('.modal-bg');
  const scrollPos = prev ? prev.scrollTop : 0;
  if(!prev) _lastFocus = document.activeElement;   // keep original opener across re-renders
  root.innerHTML =
    `<div class="modal-bg ${prev?'':'push'}">
       <div class="screen-top"><button class="screen-back" onclick="closeModal()">${ICONS.back}Back</button></div>
       <div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  attachFieldClears(root);
  if(prev) root.querySelector('.modal-bg').scrollTop = scrollPos;
  document.body.style.overflow = 'hidden';
  // autofocus the first real field for keyboard users (skip on re-renders to avoid focus jumps)
  if(opts.autofocus !== false && !prev){
    setTimeout(()=>{ const f = $('#modal-root .modal input:not([type=file]), #modal-root .modal select, #modal-root .modal textarea'); if(f) f.focus(); }, 30);
  }
}
function closeModal(){
  if(!modalOpen()) return;
  $('#modal-root').innerHTML=''; document.body.style.overflow='';
  if(_lastFocus && _lastFocus.focus){ try{ _lastFocus.focus(); }catch(e){} }
  _lastFocus = null;
}

/* inline field validation, injects an error line under the field, clears on next input */
function markErr(sel, msg){
  const inp = $(sel); if(!inp) return false;
  /* an input that isn't wrapped in a .field (the packing add row) has nowhere to hang the
     message, so it just gets the red outline and the cursor. Pressing Add on an empty box
     doesn't warrant stopping you with a dialog. */
  const field = inp.closest('.field');
  if(!field){
    inp.classList.add('err');
    inp.addEventListener('input', ()=>inp.classList.remove('err'), {once:true});
    inp.focus();
    return false;
  }
  field.classList.add('err');
  let e = field.querySelector('.field-err');
  if(!e){ e = document.createElement('div'); e.className='field-err'; field.appendChild(e); }
  e.textContent = msg;
  inp.addEventListener('input', ()=>field.classList.remove('err'), {once:true});
  inp.focus();
  return false;
}

/* two explicit column divs rather than CSS column-count - see .dash-masonry's own comment for
   why - but which tile lands in which column is now decided by measured height (balanceDash
   boardColumns below), not a fixed hand-picked split: with Films' three tiles added on top of
   Trips/Places/Gigs/Games/Songs, a static split routinely left one side visibly taller than the
   other, which is exactly the outcome explicit columns were meant to avoid in the first place.
   Tiles are placed largest-first (not in on-page order) onto whichever column is currently
   shorter: Currently Playing's own poster is tall enough on its own that placing it in
   read/insertion order let it land wherever a column happened to be marginally shorter right
   before it, which could tip the whole layout lopsided regardless of what came after. Largest-
   first is the standard fix for exactly that failure mode (longest-processing-time scheduling)
   and settles on a much closer balance - measured after real layout, not before it, so this
   doesn't hit the original bug that made column-count unusable here (images loading in late and
   changing height after the browser had already balanced things; aspect-ratio now reserves that
   space upfront, so a height measurement at this point is already final). */
function balanceDashboardColumns(){
  const colA = $('#dash-col-a'), colB = $('#dash-col-b');
  if(!colA || !colB) return;
  const nodes = [...colA.children, ...colB.children]
    .map(n => ({n, h: n.getBoundingClientRect().height}))
    .sort((x,y) => y.h - x.h);
  let ha = 0, hb = 0;
  nodes.forEach(({n,h}) => {
    if(ha <= hb){ colA.appendChild(n); ha += h; }
    else { colB.appendChild(n); hb += h; }
  });
}
/* per-device dashboard widget order/visibility (see the Home Dashboard settings section) - a

   wishlistGames/saveWishlist). One person hiding Currently Playing on their own phone shouldn't
   hide it for everyone else sharing the same trips. */
const DASH_PREFS_KEY = 'calstrippin_dash_widgets';
const DASH_WIDGET_DEFS = [
  {key:'trip', label:'Next Trip'},
  {key:'gig', label:'Next Gig'},
  {key:'game', label:'Currently Playing'},
  {key:'song', label:'Most Played'},
  {key:'watchnext', label:'Watch Next'},

/* reconciles whatever's saved with the widgets that actually exist right now - any widget added
   to the app since the prefs were last saved (or before they've ever been customised at all) is
   appended at the end, visible by default, rather than silently vanishing off the dashboard. */
function dashWidgetOrder(){
  const known = new Set(DASH_WIDGET_DEFS.map(d=>d.key));
  let saved;
  try{ saved = JSON.parse(localStorage.getItem(DASH_PREFS_KEY)||'null'); }catch(e){ saved = null; }
  const list = Array.isArray(saved) ? saved.filter(w=>w && known.has(w.key)) : [];
  const listed = new Set(list.map(w=>w.key));
  DASH_WIDGET_DEFS.forEach(d=>{ if(!listed.has(d.key)) list.push({key:d.key, hidden:false}); });
  return list;
}
function saveDashWidgetOrder(list){
  try{ localStorage.setItem(DASH_PREFS_KEY, JSON.stringify(list)); }catch(e){}
}
/* each widget's own markup, keyed the same way DASH_WIDGET_DEFS is - the async ones (games,
   song, plants) keep the exact id'd placeholder div their own loader (loadDashboardGames/
   loadDashboardSong) already looks up by id, so reordering them is just moving that div
   somewhere else in the DOM, not changing how or when it gets filled in. */
function dashWidgetHTML(key){
  if(key==='trip') return dashTripWidgetsHTML();
  if(key==='gig') return dashGigWidgetHTML();
  if(key==='game') return `<div id="dash-games-current-slot" class="dash-slot"></div>`;
  if(key==='song') return `<div id="dash-song-slot">${dashSongPlaceholderHTML()}</div>`;
  if(key==='watchnext') return dashRandomWatchlistWidgetHTML();
  if(key==='lastseen') return dashLastSeenFilmWidgetHTML();
  if(key==='plants') return `<div id="dash-plants-slot">${dashPlantsWidgetHTML()}</div>`;
  return '';
}
/* the Home Dashboard section of Settings (see renderSettings) - up/down to reorder, an eye to
   hide/show, no drag-and-drop (nothing else in this app uses it, and up/down buttons work fine
   with a list this short). */

  const order = dashWidgetOrder();
  const label = k => (DASH_WIDGET_DEFS.find(d=>d.key===k)||{}).label || k;

      <div class="dash-prefs-actions">
        <button class="iconbtn" aria-label="Move ${esc(label(w.key))} up"${i===0?' disabled':''} onclick="App.dashWidgetMove('${w.key}',-1)">${fa('chevron-up')}</button>
        <button class="iconbtn" aria-label="Move ${esc(label(w.key))} down"${i===order.length-1?' disabled':''} onclick="App.dashWidgetMove('${w.key}',1)">${fa('chevron-down')}</button>

}

/* Each screen shows only the controls it's actually for. Been is a checklist you tick off,
   so it has one tick and nothing else. Country Finder is where you decide what you fancy, so
   every row carries the Want to Go / Not Exploring switch. Want to Go keeps the full set,
   since it's the one place you might both cross something off and mark it visited. */
function placeCardHTML(co, tripStatus){
  const status = placesStatusOf(co.code, tripStatus);
  const info = COUNTRY_INFO[co.code];
  const view = CUR_PLACES_VIEW;
  const flightUrl = 'https://www.google.com/travel/flights?q=' + encodeURIComponent('Flights to '+co.name);
  const act = (fn) => `onclick="${fn}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${fn}}"`;
  /* on the Been list the tick is how you take a country back off it again */
  const beenLabel = esc(status==='been' ? "Remove from Places I've Been" : 'Been');
  const beenChip = `<span class="chip pick mode-pick ${status==='been'?'on':''}" role="button" tabindex="0"
      aria-label="${beenLabel}" aria-pressed="${status==='been'}" title="${beenLabel}"
      ${act(`App.setPlaceStatus('${co.code}', ${status==='been'?"'none'":"'been'"})`)}>${fa('check')}</span>`;
  const starChip = `<span class="chip pick mode-pick ${status==='want'?'on':''}" role="button" tabindex="0"
      aria-label="Want to Go" aria-pressed="${status==='want'}" title="Want to Go"
      ${act(`App.setPlaceStatus('${co.code}', ${status==='want'?'null':"'want'"})`)}>${fa('heart')}</span>`;
  /* on Country Finder, a country already on a booked trip has nothing left to toggle between
     Want to Go and Not Exploring - so instead of a fixed pill sitting apart from the switch,
     Going joins it as a third option, styled the same as the other two but locked once it's
     already true (there's no trip to un-book from here). Tapping Going on a country that isn't
     yet is how you'd book one - it opens New Trip with that country already added. */
  const goingLocked = status==='going';
  const wantSwitch = `<div class="want-switch${goingLocked?' locked':''}" role="radiogroup" aria-label="${esc(co.name)}">
      <span class="want-opt ${status==='want'?'on':''}" role="radio" tabindex="0" aria-checked="${status==='want'}"
            ${goingLocked?'aria-disabled="true"':act(`App.setPlaceStatus('${co.code}','want')`)}>Want to Go</span>
      <span class="want-opt ${(!goingLocked && status!=='want')?'on':''}" role="radio" tabindex="0" aria-checked="${!goingLocked && status!=='want'}"
            ${goingLocked?'aria-disabled="true"':act(`App.setPlaceStatus('${co.code}',null)`)}>Not Exploring</span>
      <span class="want-opt ${goingLocked?'on':''}" role="radio" tabindex="0" aria-checked="${goingLocked}"
            ${goingLocked?'aria-disabled="true"':act(`App.setPlaceGoing('${co.code}')`)}>Going</span>
    </div>`;
  const actions =
      view==='finder' ? wantSwitch
    : `<div class="chips">${beenChip}${starChip}</div>
       <a class="iconbtn" href="${esc(flightUrl)}" target="_blank" rel="noopener"
        onclick="return App.openExternal(event, '${esc(flightUrl)}')"
        aria-label="Search flights to ${esc(co.name)}" title="Search Flights">${fa('plane')}</a>`;
  return `
    <div class="place-card" data-code="${co.code}">
      <div class="place-head">
        <div class="place-name">
          <span class="flag">${co.flag}</span>
          <span class="place-name-text">${esc(co.name)}</span>
        </div>
        ${view!=='finder' && status==='going' ? `<span class="status-pill soon">Going</span>` : ''}
      </div>
      ${info ? `<div class="place-info">
        <span title="Capital">${fa('landmark')}${esc(info[0])}</span>
        <span title="Language">${fa('language')}${esc(info[1])}</span>
      </div>` : ''}
      ${actions ? `<div class="place-actions${view==='finder'?' finder':''}" style="margin-top:6px">${actions}</div>` : ''}
    </div>`;
}
