    "Fixed Film and Music News showing nothing - the London-only location filter meant for Design was wrongly applying to those two as well, and Variety/Hollywood Reporter/Resident Advisor/DJ Mag mention Los Angeles/Berlin/Ibiza and the like constantly, so it was quietly dropping almost everything in both categories. It's Design-only now.",
    'Home: the "⚙️ Settings" link at the foot of the page gets breathing room below it now too, not just above.',
    'Home: Last Seen keeps its poster\'s actual 2:3 shape now instead of being cropped to a square, matching the Watchlist pick.',
    'Gigs: dates read as a short 18/8/26 now instead of the spelled-out full date.',
    "Music's four subtabs are two clean rows now instead of wrapping unpredictably - Not Seen on its own up top, Gigs/Artists/Songs evenly filling the row below.",
    "Watchlist: a + Add Manually option next to search, for a film TMDb search doesn't find (not yet released, obscure, or search isn't set up) - it saves with just a title and still gets its poster/genres filled in automatically afterwards.",
  ]},
  {version:'2.17.0', notes:[
    "Home: Places Been, Gigs Seen, Films Seen and Games now sit together in a fixed two-column row up top, above Currently Playing/Most Played/Last Seen - and Places Been and Films Seen now filter by the same All Time/Last Six Months/Last Four Weeks picker Gigs Seen and Games already did.",
    "Home: Most Played, Currently Playing, Last Seen and the Watchlist pick's images are left-aligned now instead of centred, and the Watchlist pick keeps its poster's actual 2:3 shape instead of being cropped to a square.",
    'Settings gets a little breathing room below its last card instead of ending flush with the screen.',
    'Films: fixed the Stats page\'s "Logged" tile not actually opening the Diary (it was changing the hash to where it already was, which does nothing) - it switches tab directly now, the same way Rewatches and the bar charts already did.',
    "Films: the year/rating/Rewatches page's title is genuinely centred now, not just centred within lopsided leftover space next to the back button and count pill.",
    'Films: watched dates are a short 19/4/26 now instead of the spelled-out 19 April 2026, so they sit comfortably next to the year and rating on a small poster card.',
    "Films: poster grids are strictly top-aligned now - a title clamps to exactly two lines, so a row of short titles no longer sits shorter than its neighbours and pulling the next row's posters out of alignment.",
    'Watchlist: tapping a poster now opens that film on Letterboxd (its exact page for anything imported from a Letterboxd CSV, a Letterboxd search for anything added via search) instead of doing nothing.',
  ]},
  {version:'2.16.0', notes:[
    "News: fixed the filter chips not showing which category you'd picked, fixed a thumbed-down article coming back when you navigated away and back, and turned the fade on a dismissed article into a permanent 70% dim instead of it vanishing outright.",
    "News: articles that aren't in English or aren't about London are filtered out now, missing images (DJ Mag's lazy-loaded ones, among others) are found properly, and articles are sorted newest-first using whichever date field a feed actually provides.",
    'Films Stats: films watched by year and by rating are bar charts now instead of plain lists - tap a bar to see just that year or rating, and Logged/Rewatches are tappable too, opening the Diary or a rewatches-only view.',
    "Watchlist films now get their posters (and genres, enabling the genre filter) backfilled automatically the same way the Diary already does - a CSV import leaves both blank, and nothing ever retried it before.",
    'Letterboxd sync moved into Settings alongside the CSV imports, out of the Diary header where it was competing for attention.',
    'Small tidy-ups: dropped the "(optional)" label next to Poster URL, shortened Games\' PlayStation subtab to "PS5/PS4" and Gigs\' "All Gigs" to "Gigs" so they fit their row, and Home\'s Currently Playing/Last Seen widgets now match Most Played\'s half-width image layout.',
  ]},
  {version:'2.15.0', notes:[
    "Design, and the Films and Music tabs' own News subtabs, are now one unified News tab (📰, in Design's old spot) - every article merged into a single dated feed with All/Design/Films/Music filter chips, instead of three separate places to remember to check.",
    "News articles have thumbs up/down now. Thumbs down fades an article out and it's gone for good from then on, and nudges its whole publication down the list; thumbs up nudges a publication up - the closest thing to \"shows more of what you like\" this app can honestly do without a real backend to learn from.",
  ]},
  {version:'2.14.6', notes:[
    "New Settings page (⚙️ Settings, at the foot of Home) - Import Diary CSV and Import Watchlist CSV moved there from the Films header, since they were competing for attention with Log Film and Letterboxd's own sync status for something you only really use once.",
  ]},
  {version:'2.14.5', notes:[
    "Fixed posters staying blank for films logged beyond Letterboxd's own ~50-entry sync limit - finding posters/genres only ever ran right after a CSV import or sync, so anything that failed to match a title at that moment (a hiccup, a title TMDb didn't recognise yet) stayed blank until you re-imported the whole file. It now retries automatically every time the Diary loads.",
  ]},
  {version:'2.14.4', notes:[
    "Films' News subtab drops Variety and The Hollywood Reporter's all-topics feeds (mostly industry deal news) for their Film/Movies-specific ones, and adds IndieWire for cinema culture and criticism and What's on Netflix for new streaming releases.",
  ]},
  {version:'2.14.3', notes:[
    "Fixed the Log Film search results not actually showing up (a missing style meant the dropdown could render off in the wrong spot) - and while in there, picking a result now shows its poster and year right in the form instead of just quietly filling in a URL field.",
    'Rating is a dropdown now instead of a row of stars - individual stars, even the bigger tap targets from an earlier fix, were still fiddly to hit precisely on a phone.',
  ]},
  {version:'2.14.2', notes:[
    "Fixed Diary duplicates from logging the same film both via Letterboxd sync and a CSV import - the two didn't always agree on what identifies an entry, so the same watch could show up twice. Existing duplicates now merge together automatically (keeping whichever side has the fuller data) next time the Diary loads, and new syncs/imports won't recreate them."
  ]},
  {version:'2.14.1', notes:[
    "Dropped the Menu button from a trip's mobile header - Share Trip already has its own button lower down the page, and All Trips is a tap away on the bottom bar's Travel tab, so the button was one more way to do things the page already offered."
  ]},
  {version:'2.14.0', notes:[
    'Films: a new News subtab (alongside Diary/Watchlist/Stats) with film industry headlines from Variety and The Hollywood Reporter, read right in the app the same way Design articles are.',
    'Music: a new News subtab (alongside Not Seen/Artists/Songs/All Gigs) with headlines from Resident Advisor, DJ Mag and Spotify Newsroom.',
  ]},
  {version:'2.13.2', notes:[
    "Home's column balancing now places the biggest tile (usually Currently Playing's own poster) first, instead of wherever it happened to land in reading order - the previous version could still end up noticeably lopsided whenever one tile was much taller than the rest."
  ]},
  {version:'2.13.1', notes:[
    "Home: the two columns now balance themselves by actual height instead of a fixed left/right split, so one side no longer ends up visibly taller than the other."
  ]},
  {version:'2.13.0', notes:[
    'Home: three new Films tiles, styled the same as everything else there - how many you\'ve watched this year, the last one you logged, and a randomly-picked film from your Watchlist (a fresh pick every visit) to nudge you toward actually watching something on it.'
  ]},
  {version:'2.12.1', notes:[
    "Stats' By Rating tiles show actual star icons now instead of a plain \"★ 4.5\" line.",
    "Stats' filtered pages (tap a year or rating to see its films) now put the Stats back button on the left, the year/rating centred, and how many films matched on the right, instead of the title and back button swapped."
  ]},
  {version:'2.12.0', notes:[
    "Diary and Watchlist both have a category dropdown now (Action, Comedy, Drama…) to filter down to just one genre - genres come from TMDb, so a film needs to have been picked from search (or backfilled after a CSV import/Letterboxd sync) to be categorised.",
    'Stats\' By Year and By Rating are now a 3-column grid instead of one column, so more of the breakdown fits on screen at once.'
  ]},
  {version:'2.11.0', notes:[
    "New Stats sub-tab on Films: how many you've watched each year, and a breakdown by star rating (half-stars included) - tap either to see the actual films behind the number.",
    "Films' Watchlist can now import Letterboxd's watchlist.csv export too, the same as the Diary's Import CSV.",
    "Importing a Letterboxd CSV now fetches a poster for every film that came in without one (Letterboxd's export doesn't include posters at all) - a few at a time in the background, right after the import finishes.",
    "Fixed CSV imports and Letterboxd syncs occasionally blanking out a film's poster it already had, when the new data didn't have one of its own."
  ]},
  {version:'2.10.0', notes:[
    "Films' Diary has an Import CSV button now, for Letterboxd's own full-history export (Settings › Data › Export Your Data, diary.csv) - the Connect Letterboxd sync only ever sees your ~50 most recent entries. No setup needed, works entirely on-device, and importing again later just updates entries rather than duplicating them."
  ]},
  {version:'2.9.1', notes:[
    "Log Film's star rating: each half-star's actual tap area now reaches past the visible star on every side, instead of relying on the star itself being bigger - should make it much easier to land the half you meant.",
    "Log Film's Watched date now defaults to today instead of blank."
  ]},
  {version:'2.9.0', notes:[
    'Films now has a Watchlist sub-tab - search and save films you mean to watch, then tap Watched when you actually do to log it properly (date, rating, rewatch) and drop it off the list. Syncs for everyone the same as the Diary.',
    "Log Film's star rating is bigger, so each half-star is an easier tap."
  ]},
  {version:'2.8.0', notes:[
    "Log Film's Title field now searches a real film catalogue as you type - pick a result and its year and poster fill in too - instead of typing everything by hand (needs a one-time TMDb key on the proxy, see psn-proxy/README.md; plain typing still always works).",
    'Log Film\'s Rating is now a row of tappable stars, half-stars included, instead of a dropdown.',
    "Fixed a confusing error when Films' Letterboxd sync hits a proxy that hasn't been redeployed since Films shipped - it now says so directly instead of a bare \"not found\"."
  ]},
  {version:'2.7.1', notes:[
    'Home: Currently Playing\'s box art is back above the title instead of beside it, matching the top song tile.'
  ]},
  {version:'2.7.0', notes:[
    'New Films tab: log films you\'ve watched (title, year, date, star rating, rewatch) with a poster-shelf grid, or connect your Letterboxd username to pull in your diary automatically - ratings, rewatches and all. Syncing again just updates what\'s changed rather than duplicating anything.',
    'The bottom tab bar now shows icons only, no text labels underneath, to make room for the new Films tab.'
  ]},
  {version:'2.6.0', notes:[
    'Home: "Games Played" is now just "Games", and there\'s proper spacing below it. Currently Playing is now a compact row - box art on the left at the same size as the next-gig photo, title and caption on the right - instead of a big square image.'
  ]},
  {version:'2.5.0', notes:[
    'Fixed the Places/Artists search box drifting away from the keyboard on some phones instead of sitting right above it, by telling the browser to resize around the keyboard properly instead of working around it after the fact.',
    'The bottom tab bar now hides outright while a keyboard is open, instead of sometimes showing up stacked above it.'
  ]},
  {version:'2.4.0', notes:[
    'Home: replaced the auto-balancing masonry with two fixed columns, so Games Played and its card can never land with a gap above them again. Places Been and Gigs Seen (renamed from Gigs Been To) are now a compact single-line row - icon left, count and label right - instead of stacked. The article card\'s title and caption now match Currently Playing\'s styling exactly.'
  ]},
  {version:'2.3.0', notes:[
    'Home is now the app\'s front door (opening with nothing after the address takes you straight there, same as tapping the Home tab) - Places is still there under Travel.',
    'Home: the article card is now a compact row - image on the left, title and "Next Article" (normal case, below the title now) on the right - instead of a tall banner. Games Played and Currently Playing always land in the same column together. A trip\'s flags now sit flush against each other.'
  ]},
  {version:'2.2.1', notes:[
    "Home: attempted fix for a stray shadow rendering above the masonry grid on some phones (a known Safari bug where a card's box-shadow can bleed into whatever sits just above a multi-column layout)."
  ]},
  {version:'2.2.0', notes:[
    'Home: the latest article is now a full-width card at the very top of the page, instead of squeezed into one masonry tile - that\'s the one piece of Home that changes on its own schedule, so it gets more room to notice at a glance.'
  ]},
  {version:'2.1.0', notes:[
    "Home: added a Places Been tile. Every tile's caption is now a plain label (Next Trip, Next Gig, Most Played, Next Article) instead of the specific date/location/artist, matching Currently Playing's style. Gigs Been To and Games Played now filter by the same Last 4 Weeks / Last 6 Months / All Time picker as the top song. Fixed a stray shadow under that picker on some phones."
  ]},
  {version:'2.0.0', notes:[
    'Home: a new tile shows your top song, with the same Last 4 Weeks / Last 6 Months / All Time picker as Songs (top right, next to the page title). The next-gig tile now shows its location too, and Gigs Been To / Games Played dropped their big-number look for the same small emoji-led style as everything else. Trips now shows up to three upcoming trips, shuffled, instead of just the next one, to give the masonry more to work with.'
  ]},
  {version:'1.99.0', notes:[
    'Home: the next gig\'s artist photo is now a circular avatar instead of a banner crop, and Currently Playing\'s box art keeps its own square shape instead of being cropped to the same strip as everything else.'
  ]},
  {version:'1.98.0', notes:[
    'Music: the Songs time filter is now a dropdown instead of three buttons, and the Not Seen / Artists / Songs / All Gigs subtabs wrap onto a second row instead of squeezing every label down to an unreadable ellipsis.'
  ]},
  {version:'1.97.0', notes:[
    'Gigs is now Music, and gained a Songs tab: your top tracks from Spotify, with a Last 4 Weeks / Last 6 Months / All Time filter (Spotify\'s own three listening windows - there\'s no real calendar week/month/year to pull from).'
  ]},
  {version:'1.96.0', notes:[
    'Added a Home tab - a quick glance across every section (upcoming trip, gigs been to and coming up, currently playing, latest Design read) in a masonry layout, each tile linking straight into its own tab. First in the bottom bar.'
  ]},
  {version:'1.95.0', notes:[
    'Added a Wishlist to the Games tab - search for a new or upcoming game (GTA VI, say) and save it to a list, backed by RAWG. Needs a free API key, see psn-proxy/README.md.'
  ]},
  {version:'1.94.0', notes:[
    'Removed Switch Name and the per-trip identity system - this is a single-user app, so picking your name before every trip opened was friction with nothing behind it.',
    'Packing is a single shared checklist now instead of per-person: one tick per item, no more "who is this for" field.',
    'Polls vote anonymously per device now instead of by name - one vote per poll, results just show counts.',
    'Money\'s Balances no longer personalise ("You owe"/"you") since there\'s no identity to compare against - still shows every participant\'s balance and the fewest-payments settle-up.',
    'Places I\'ve Been: countries on a future trip now sort by how soon that trip is, not an arbitrary order - a 2027 trip lists ahead of a 2028 one.'
  ]},
  {version:'1.93.0', notes:[
    'Artists checklist cards are centred now - photo on top (a circle, about 70% of the card\'s width), name below it, seen/not-seen status last - instead of the photo-beside-name row.'
  ]},
  {version:'1.92.0', notes:[
    'Board Games\' 401 wasn\'t a network block after all - last version\'s theory was wrong. BoardGameGeek now requires every request to carry a registered app token, which is why moving the request to a different host didn\'t help. Fixed properly this time: BGG_API_TOKEN is a one-time Vercel environment variable, see psn-proxy/README.md for how to get one (free, a couple of minutes).'
  ]},
  {version:'1.91.0', notes:[
    'Board Games is back on BoardGameGeek - Board Game Atlas turned out to have shut down, so last version\'s switch traded one broken source for a dead one. This time it\'s a small serverless function alongside the app itself rather than a route on the proxy, since BGG blocks the proxy\'s network specifically, not BGG access in general. Needs no setup on your end.',
    'Log a Gig drops Venue and Notes - just artist, location and date now.',
    '"City" is now "Location" on gig entries, since not every gig has one.',
    'The Artists checklist shows two columns instead of one, and gained a search box to jump straight to an artist.',
    'Added a "Not Seen" tab next to Artists - just the ones you follow but haven\'t logged a gig for yet, for working through as a checklist.',
    'Design articles with a lead image now show it, both on the card and at the top of the article.',
    'A gig with a future date now shows faded on the All Gigs list, the same treatment upcoming trips get on Places I\'ve Been - it hasn\'t happened yet, so it\'s there without looking like a done deal.'
  ]},
  {version:'1.90.0', notes:[
    'Board Games now talks to Board Game Atlas instead of BoardGameGeek, whose API kept 401ing every request from the proxy no matter what headers were sent - same search and trending list, just a different (and reachable) source. Needs its own free client_id, see psn-proxy/README.md. The Complexity filter is gone with it - Board Game Atlas doesn\'t have BGG\'s weight rating to filter by.',
    'Fixed the Gigs Artists checklist failing to load past the first 50 artists you follow or the first 50 in your listening history - a "next page" URL was being mangled into something fetch() couldn\'t use.',
    'The Artists checklist rows sit closer together now, with less padding inside each one - they\'re just a photo, a name and a status, not a full gig card.'
  ]},
  {version:'1.89.0', notes:[
    'Fixed Design news throwing on every article - a leftover reference to a renamed function meant every feed failed on every load.',
    'Board Games\' proxy request still 401s from BoardGameGeek after last version\'s User-Agent change - added the fuller set of headers a real browser sends along with it.',
    'Design, Board Games and the Gigs Artists checklist now all show the proxy\'s real error message instead of a bare status code when something goes wrong.'
  ]},
  {version:'1.88.0', notes:[
    'Gigs: new Artists tab, a checklist of every artist you follow on Spotify - ranked by how much you actually listen to them - with a Seen/Not seen status for each, worked out from your logged gigs. Tapping one opens the log-a-gig form pre-filled with that artist. Needs connecting your own Spotify account from the tab (separate from the plain artist search Add Gig already had). The old flat list of everything you\'ve logged is still there, now under an All Gigs tab.',
    'Board Games\' proxy requests were getting rejected with a 401 - swapped its User-Agent for a generic browser one, which is what the request was actually being blocked on.',
    'Gig cards on the Artists checklist and the artist search dropdown sit vertically centred against their photo now, and the list between them sits a bit tighter.'
  ]},
  {version:'1.87.0', notes:[
    'A gig card no longer shows the venue - just the artist, city and date (on one line), and any notes.',
    'Design and Board Games now surface the proxy\'s actual error ("BoardGameGeek returned 403", a design feed\'s real status) instead of a bare status code, and Design tells you outright when every feed failed rather than showing "nothing to show right now" as if it were just a quiet news day.'
  ]},
  {version:'1.86.0', notes:[
    'A stop\'s time ("Evening", or a set clock time) now reads as "Plan - Evening" above the card, the same way an auto-generated card\'s own tag sits above it, instead of as a plain line competing with the title inside.',
    'A stop\'s location and description swapped order and the description lost its icon: location (with its pin) now comes first, description underneath as plain text.',
    'Removed the copy-location link button from the bottom of a stop card.',
    'Fixed the Maps icon on a stop or accommodation card showing the plain folded-map emoji instead of Google\'s own for almost every real Google Maps link - the check for "is this a Google Maps URL" only matched a link at the very start of the string or right after a subdomain dot, never right after the "https://" every real link actually has.'
  ]},
  {version:'1.85.0', notes:[
    'The accommodation card\'s logo and Maps icon now sit in matching badges of the same size, instead of two differently-sized icons each pixel-nudged to try to line up.',
    'On desktop, the region tiles (Europe, Asia, Africa…) on Been/Want to Go/Countries now lay out three across instead of stacking one per row.'
  ]},
  {version:'1.84.0', notes:[
    'Added Gigs, a new top-level section for logging live music you\'ve been to - artist, venue, city, date and notes, with the artist field searching Spotify (via the same proxy Games and Design use) for a photo as you type.',
    'The mobile bottom bar dropped its Menu and + Add buttons to make room for Gigs alongside Travel, Games and Design - the menu they opened now lives behind a button in the trip\'s own header instead, and everything the + used to add still has its own button in the section it belongs to.'
  ]},
  {version:'1.83.0', notes:[
    'Fixed the desktop/tablet sidebar going blank on Games, Design and the Travel hub - it only ever held a trip\'s own menu, so leaving a trip left no navigation at all now the mobile bottom bar is hidden there. Travel, Games and Design now sit in the sidebar everywhere, underneath a trip\'s own menu when there is one.'
  ]},
  {version:'1.82.0', notes:[
    'A stop\'s photo: the Maps icon moved to the bottom-right corner of the image, notes and location now carry their own icon, and the leftover gap below the photo is gone.',
    'Fixed the Maps icon showing the folded-map emoji instead of Google\'s own for a "maps.google.com/?q=…" style link.',
    'A not-booked-yet travel leg that\'s just a text line (train, bus, drive…) now gets the same dashed box everything else outstanding has, instead of "- not booked yet" tacked onto the end of the line.',
    'Tasks now reads in day order - hand-typed tasks and the derived Not Booked / Nothing Planned cards are one combined list sorted by date, instead of two separate blocks. Nothing Planned\'s card now puts the date on its own line under "Day N", matching the accommodation-gap card, rather than folding both into one title.',
    'Nudged icon/emoji vertical alignment across cards - logos (Airbnb, airlines, booking sites) sit a couple of px lower and emoji a touch higher, so both actually line up with the text beside them instead of reading slightly off-centre.'
  ]},
  {version:'1.81.0', notes:[
    'Desktop/tablet: the sidebar now shows from 768px up instead of 1024px, so a tablet gets it too. The menu no longer leaves a blank gap above it (it was sized for a header this app hasn\'t had in a long time) - it now fills the space and fits more before scrolling.',
    'Itinerary keeps its mobile width even with the sidebar showing, sitting centred with room either side, instead of stretching edge to edge - that margin shrinks on its own as the window narrows. The rest of a trip\'s pages are unchanged. The mobile bottom bar, which had no width check of its own, no longer shows behind the sidebar.',
    'Shared Album Link now just says "Paste your PhotoCircle invite link below" instead of also mentioning Apple/Google as alternatives.'
  ]},
  {version:'1.80.0', notes:[
    'A bit more air above "All Countries" and below a Day heading.',
    'Country Finder: Going joins Want to Go / Not Exploring as a third option in the same switch, instead of a separate grey pill - locked once a country\'s actually going, and tapping it on one that isn\'t opens New Trip with that country already added.',
    'Places I\'ve Been: removed the delete icon from each card.',
    'The Accommodation gap card in Tasks now has a "Not Booked Yet" title above it like everything else there.',
    'A Task without a specific day now shows the same dashed outline as everything else outstanding in Tasks, and Tasks got a "No Specific Day" toggle - a day-less task no longer shows on the Itinerary, just in Tasks.',
    'The Accommodation tag\'s bracketed time now says what it is - "(15:00 Check In)", "(Check Out)" - and its Maps icon nudged down to sit centred against the row.',
    'Flights on the Travel tab now shows a plain "No flights yet." like Ferries and Car Hire, instead of its own bigger empty-state card.',
    'A stop\'s photo is full width and flush with the card now, with a Maps icon overlaid top-right on it instead of a button below; the time of day moved out of the title into its own line underneath.'
  ]},
  {version:'1.79.0', notes:[
    'The Itinerary\'s accommodation card is one line now: the logo is the booking link itself, Maps takes the header\'s right-hand slot, and the auto-filled "Airbnb in X" name drops the service name since the logo already says it. The check-in time moved into brackets next to the Accommodation tag\'s own time above the card.',
    'A flight card\'s head (airline, number, date) now opens live flight status directly - the separate Track Flight link is gone.'
  ]},
  {version:'1.78.0', notes:[
    'The dashed "still outstanding" border (Not Booked, Nothing Planned) is a faint red now instead of a bold one, matching the accommodation-gap card\'s lighter weight.',
    '"Nothing Planned" now uses ❌ instead of 📍.'
  ]},
  {version:'1.77.0', notes:[
    'Countries: added an "All Countries" title above the flat list, now that it\'s no longer broken up by continent headings of its own.'
  ]},
  {version:'1.76.0', notes:[
    'Fixed Places I\'ve Been order for Greece, Albania, Australia and Japan: they were archived out of order by the same old bug the previous fix addressed, but that fix only prevents new mistakes rather than correcting ones already baked into the saved order. These four are now pinned by hand to the right order (Greece, then Albania, then Australia, then Japan) regardless of how they were originally recorded.'
  ]},
  {version:'1.75.0', notes:[
    'Countries: the full list below the region tiles is one flat list again, not grouped and re-labelled by continent underneath tiles that already sort by continent. The tiles themselves are one column instead of two.',
    '"Not Booked" is now a solid pill instead of just coloured text, so it stands out at a glance.',
    'A travel leg\'s "arrive by" time now reads as just "By 14:00" (leave by is unchanged).',
    'Add Travel\'s icon changed from 🧭 to 🚌, matching Travel everywhere else.',
    'Fixed a stop card (e.g. a plain "Beach Day" with nothing else on it) showing more space below the title than above it.',
    'Day headings on the Itinerary are more distinct: a bigger "Day N" next to a small caps date underneath it, rather than one plain line.',
    'A bit more air above the photo/image upload button on Stop and Idea forms, so it doesn\'t sit jammed against the field above it.',
    'Fixed Tasks: the dashboard tile\'s count includes empty itinerary days, but the Tasks tab itself never showed a card for them, so the two disagreed. It now does, with a Nothing Planned card you can tap to add something.',
    'A "Not Booked Yet" travel leg in Tasks now shows its date (or day number), the same context the accommodation gap card already had, instead of just a bare route.'
  ]},
  {version:'1.74.0', notes:[
    'Only Flight and Ferry legs get a full card on the Itinerary now - Train and everything else (Drive, Walk, Bus, Taxi) read as a single line, the same lighter treatment Bus/Walk already had.',
    '"Undecided?" is now "Not Booked Yet?" everywhere it appears (flights, ferries, car hire, accommodation) - the same wording travel legs already used, so it reads the same across the whole app.',
    'A travel leg marked Not Booked Yet now matches the same dashed-card look as everything else in Tasks, instead of showing as plain text.',
    'Travel\'s emoji is now 🚌, matching the + menu\'s Travel item.',
    'The "Places I\'ve Been" home page card is now just "Places Been".'
  ]},
  {version:'1.73.0', notes:[
    'Travel legs get their own "Not Booked Yet?" toggle, separate from the Mode picker - for when you know it\'s a ferry, know the route and time, just haven\'t actually bought it. Shows dashed on the Itinerary and lists in Tasks, same as everywhere else something\'s still outstanding.',
    'Fixed Places I\'ve Been ordering across multiple finished trips: countries were being marked Been in whatever order the trips happened to sit in rather than the order they actually finished, which could show a more recent trip\'s countries as older than an earlier one\'s.',
    'The four home page cards: number and label are now the same size and style, just the number stays the brand colour. Tapping Going scrolls down to Your Trips instead of opening a second copy of the same list.',
    '"All day" no longer prints on an Itinerary card\'s title - it\'s the default, so leaving it off a card said the same thing a shorter way.',
    'The Tasks dashboard tile now counts everything the Tasks tab actually lists: hand-typed tasks, Undecided flights/ferries/car hire/accommodation, nights with nowhere booked, and days with nothing planned yet - not just hand-typed tasks.',
    'Tasks\' emoji is now ☑.'
  ]},
  {version:'1.72.0', notes:[
    'Undecided items are back to Undecided flights/ferries/car hire/accommodation only - stops and travel legs don\'t need the checkbox, a travel leg\'s existing "Not Decided" mode and a stop\'s own detail already say that clearly enough.',
    'An Undecided flight/ferry/car hire/accommodation is no longer a separate Task kept in sync with it - it IS the Task, read straight from wherever it already lives, so editing or deleting it in either place is editing or deleting the one thing.',
    'Nights with nowhere booked now show on the Itinerary too (not just the Accommodation tab), and as a reminder in Tasks - both worked out fresh each time rather than something that can go stale or get deleted by mistake.',
    'Removed the All / Day 1 / Day 2… row from the top of the Itinerary; every day shows at once.',
    'The four home page cards (Places I\'ve Been, Going, Want to Go, Countries) are shorter now: icon on the left, the count and label together on one line.',
    'Countries: region tiles dropped their "X of Y" count, fit on one line, and the full country list now sits right below them instead of behind a tap on an "All" tile.',
    'A country already on a booked trip no longer shows the Want to Go / Not Exploring switch on Country Finder - nothing to toggle once you\'re already going - just a fixed, greyed "Going" pill.',
    'Train\'s emoji is now 🚆, and Taxi joins Drive/Walk/Ferry/Flight/Train/Bus as a travel mode.'
  ]},
  {version:'1.71.0', notes:[
    'An Undecided item now still shows on the Itinerary (and the Travel/Accommodation tab it belongs to), not just as a Task - drawn with the same dashed red outline as an empty day or a "No Flights Yet" gap, since it isn\'t a plan yet either, just one you know is coming.',
    'Fixed a sticky red hover tint on a card\'s edit/delete icon after tapping it on a touch screen - the fix that stopped whole cards doing this didn\'t cover these icons.',
    'Places I\'ve Been: corrected the order of the earliest countries so England is #1 (the very first) and Wales #2, with the rest of that early run following on from there.',
    'Polls can now allow selecting multiple answers (a new toggle when creating one), and anyone answering an open poll can add another option on the spot, not just when it\'s first created.'
  ]},
  {version:'1.70.0', notes:[
    'Added an "Undecided?" checkbox to every Add form (stops, travel, flights, ferries, car hire, accommodation): tick it for something you know you need but haven\'t sorted yet, and it becomes a single red Task instead of a half-empty card on the Itinerary - resolve it later and the Task clears itself.',
    'A blank airline, operator or company on an otherwise-filled-in card now shows in red with a ❓, rather than just being left out, so a still-open detail stands out even when the rest of the booking is done.'
  ]},
  {version:'1.69.0', notes:[
    'Added Midday to When, alongside All day, Morning, Afternoon and Evening - on stops, travel legs and now tasks too, which get the same picker instead of a bare time field.',
    'Edit Trip is now a button above Share Trip instead of a dashboard tile.',
    'Fixed easyJet\'s logo not showing on flight cards (and any other airline/site whose icon comes back blank rather than missing) - it now falls back to the airline name and flight number instead of a gap.',
    'Flight cards only show the flight number when the airline\'s logo is showing, since the logo already says who; no logo still shows the full airline name.',
    'Airline is now a proper search-as-you-type picker rather than a plain text box - the old one used the browser\'s built-in autocomplete, which iOS Safari doesn\'t actually show a dropdown for.'
  ]},
  {version:'1.68.0', notes:[
    'Tasks take a day and a time again, and show on the Itinerary on that day. One without a day yet sits under "Anytime" in red, on both screens, as the thing still to sort out. Tap a task to fill it in; there\'s still no edit button, the card itself is the way in.',
    'Fixed links opening in the in-app browser when you came BACK to the app after reading them in Safari. iOS pauses timers while the app is in the background, so the fallback that was meant to have been cancelled on the way out was firing on the way back in.'
  ]},
  {version:'1.67.0', notes:[
    'Adding a stop or an idea from a particular day now fills that day in for you, whether you came from the day\'s own card or had that day showing on the Day picker.',
    'When: added an "All day" option, which sits at the head of its day.',
    'Flights and accommodation show the airline or booking site\'s logo as a small square on the card.',
    'A travel leg with no mode chosen now reads "Travel to Kassiopi not decided" rather than "Not Decided to Kassiopi".'
  ]},
  {version:'1.66.0', notes:[
    'Design articles now come through with their images, headings, bold text and quotes rather than as flat paragraphs.',
    'Places I\'ve Been counts from the bottom up, so #1 is the first place you went.',
    'Accommodation cards: check-in and check-out on a line each instead of one repeated range, and every button (booking, map, copy, edit, delete) is now just its icon, all on one row.',
    'Tasks are simpler: no date, no edit, just tick or delete. "Booked" is now "Completed".',
    'Getting a bus, taxi or walking somewhere reads as a line on the Itinerary ("Bus to Kassiopi - leave by 14:00") rather than a card. Flights, ferries and trains keep theirs, since those are booked and timed.',
    '"Nothing Planned" days offer Add Ideas as well as Add Stop.',
    'Fixed cards keeping a red outline after you tapped them: that was a hover effect sticking on a touch screen.',
    'Documents & Links is now Docs & Links so it fits, and Google Maps links show the Maps pin rather than the Google G.'
  ]},
  {version:'1.65.0', notes:[
    'Design articles now open and read inside the app instead of sending you off to the browser, at a proper reading width. The original is still one tap away at the bottom of each one.',
    'Where a publication only puts a preview in its feed, the reader says so rather than showing you a stub.'
  ]},
  {version:'1.64.0', notes:[
    'Places I\'ve Been has two tabs now: In Order (the numbered list) and Continents, which groups the same countries by where in the world they are, with a count on each. A country keeps its number in both.',
    'Closed the gap between the Your Trips heading and the first trip card.',
    'Board Games now says so plainly when the proxy is running an older version without the board games endpoint, rather than just showing a 404.'
  ]},
  {version:'1.63.0', notes:[
    'Places I\'ve Been is one continuous numbered list now: countries on a booked trip sit at the top with their own number, still faded, instead of under a separate "Coming Up" heading.',
    'Want to Go is now ❤️ rather than a star.',
    'Accommodation on the Itinerary shows a 🏠 and the time you\'d actually get there, and the card drops the address line - the copy button next to Open Map already has it.',
    'Google Maps links show the Google Maps icon instead of a map emoji.',
    'Fixed links opening in Safari and ALSO opening in the in-app browser behind them, so coming back to the app no longer finds the article sitting there.'
  ]},
  {version:'1.62.0', notes:[
    'Games is now split into PlayStation and Board Games. Board Games browses BoardGameGeek\'s top games (or anything you search), with emoji chips for the sort of game it is, and filters for players, playtime and complexity.',
    'The players filter answers "will this work for six of us", so it keeps a game that plays 2-8 and drops one that plays 2-4, rather than matching on the maximum.',
    'Mark a board game ⭐ Want to Play or ✅ Played from its card, and filter down to either shelf.'
  ]},
  {version:'1.61.0', notes:[
    'Accommodation cards now look like flight cards: the name sits in a title bar at the top with the time you can get in ("From 15:00") or have to be out ("Until 11:00") to its right. On the Itinerary the label above them just says "Accommodation" now, since the card itself says which end of the stay it is.',
    'Dropped the location pin from accommodation and stop cards, and added a 🔗 button next to Open Map that copies the address.',
    'Places I\'ve Been: "Coming Up" moved to the top of the page, above the numbered list of everywhere you\'ve already been.',
    'Places I\'ve Been is now 📍 and Going is now ✈️ on the front page, and all four card emojis are a third smaller.',
    'Tightened the gap under Your Trips, and the bottom bar and search box now stay put properly while the page scrolls.'
  ]},
  {version:'1.60.0', notes:[
    'The bottom bar\'s Places is now labelled Travel, and Country Finder is now just Countries.',
    'The serif headline font now shows on every page title and card title (My Travels, Games, trip names, dashboard tiles, country names…), not just the section headings inside a trip; things you actually need to read at speed - flight codes, times, numbers - stay on the plain sans-serif body font.',
    'Removed the permanent gap above every page\'s title that existed to stop the title riding up under the status bar while a search box\'s keyboard was open; that protection now only kicks in while a text field is actually focused, so the rest of the time the title sits right at the top.',
    'Fixed the Games search box disappearing behind the keyboard once you started typing and results appeared.',
    'Every external link (maps, bookings, flight search, albums, videos, articles) now hands off to Safari itself rather than the in-app browser, on an iPhone with the app on your home screen - previously only Search Flights and Design articles did this.'
  ]},
  {version:'1.59.0', notes:[
    'The brief App Style picker on Design is gone - Sunset Postcard (terracotta and plum, warm serif headings, soft rounded corners) is now just the app\'s look, no switching needed.'
  ]},
  {version:'1.58.0', notes:[
    'Design: added an App Style picker - four full alternate looks (Signature, Boarding Pass, Sunset Postcard, Field Notes) with their own colours, corners and typeface, switchable with one tap and remembered on your device.'
  ]},
  {version:'1.57.0', notes:[
    'Itinerary: nothing deletes straight from a card any more, tap in and Delete Stop is there in the form, same as everywhere else.',
    'Itinerary: added a Day 1 / Day 2 / … All picker at the top, so you can look at one day at a time instead of the whole trip at once.',
    'Itinerary: more space between days and cards, and the booking/map buttons on itinerary cards (accommodation, a stop\'s location) are now icon-only, no label - the favicon or pin says enough.'
  ]},
  {version:'1.56.0', notes:[
    'The bottom bar\'s Itinerary shortcut is now Design: a feed of recent UX/design articles from a handful of well-known publications, trimmed to short summaries. Itinerary itself hasn\'t gone anywhere, it\'s still on the Overview dashboard and in the trip menu, just not a bottom-bar shortcut any more.'
  ]},
  {version:'1.55.0', notes:[
    'New Tasks tab: a place for anything you know you need to sort but haven\'t booked yet (a hotel by the airport the night before a flight, say). Each one shows in red until it\'s ticked booked, on the dashboard tile and, when it\'s linked to a day, right there in the Itinerary too - same record, tick it off in either place.'
  ]},
  {version:'1.54.0', notes:[
    'Itinerary: once a trip has anything on it, every day shows, not just the ones with something planned - a day with nothing yet gets the same dashed card as an accommodation gap, with its own + Add Stop button, right where the gap falls.',
    'Travel: no flights booked now shows the same dashed card instead of a plain message.'
  ]},
  {version:'1.53.0', notes:[
    'An archived trip shows "Archived" as a pill top-right of its title, instead of a small pin-emoji phrase sharing the line with the countdown.'
  ]},
  {version:'1.52.0', notes:[
    '"How long" (on a trip with a rough idea of when) adds A Day, Weekend and Long Weekend, alongside the week options.',
    'Trip cards show up to 8 names before trimming to "+N more", up from 3.',
    'Removed the "this trip is archived and read-only" banner - trips stay fully editable after archiving, that was never intentional.',
    'A trip now archives (fades, drops to the bottom of Your Trips) two weeks after it ends instead of a month, and stays in its normal chronological place - right at the top of what\'s left - for those two weeks rather than dropping down immediately.'
  ]},
  {version:'1.51.0', notes:[
    'Places I\'ve Been cards now show a # for the order you visited, and a faded "Coming Up" preview of countries on a booked trip that hasn\'t happened yet.',
    'Fixed the page title riding up under the status bar when the keyboard opened over a search box.'
  ]},
  {version:'1.50.0', notes:[
    'Places I\'ve Been drops its region picker again and its capital/language row; it\'s now a flat list, in the order you added each country, with a bigger flag stacked above the name and a delete icon in the corner instead of a switch.',
    'Country Finder gets its region picker back.'
  ]},
  {version:'1.49.0', notes:[
    'Your Trips now lives on My Travels itself, below the four cards, instead of behind a tap on Going; + New Trip moved up next to the My Travels title.',
    'Places I\'ve Been gets its region picker back, and its list runs two columns wide (its cards are simpler than Want to Go\'s and Country Finder\'s, so they fit).',
    'Places I\'ve Been\'s check icon is now a Been / Want to Go switch, so you can mark a wishlist country without leaving the list; tapping the pill that\'s already on clears it.'
  ]},
  {version:'1.48.0', notes:[
    'Games: fixed PlayStation connect failing with a 401 (the proxy had the wrong OAuth client secret).',
    'Games: added a search box and a per-game hide toggle (hidden games sink to the bottom and fade rather than disappearing).',
    'Games: Disconnect moved to the bottom of the list.'
  ]},
  {version:'1.47.0', notes:[
    'My Travels cards drop their subheadings and now hug their content instead of stretching to fill the screen, with all four staying the same height.',
    'Country Finder\'s emoji changed from 🌐 to 🌍.',
    'Trips and Places are now one bottom-bar item (Places, the app\'s front door); Your Trips is still one tap away from the Going card.',
    'Added a Games tab: connect a PlayStation account (via a proxy you deploy yourself, see psn-proxy/README.md) to see trophy progress on what you\'re playing.'
  ]},
  {version:'1.46.0', notes:[
    'Places I\'ve Been is now the app\'s front door: four cards for what you\'ve done, what\'s coming, what you fancy and everywhere else in the world.',
    'Tap Places I\'ve Been for a plain list of everywhere you\'ve gone, grouped by continent, with a single tick to remove a country instead of one for a flight and one for a star.',
    'Tap Going to jump straight to Your Trips. A country you\'ve been to before and are heading back to counts here even though it\'s also marked Been.',
    '223 Countries is now Country Finder: every country in the world with a switch on each one for Want to Go or Not Exploring.',
    'The search bar on these lists now sits flush against the bottom bar with no gap beneath it.'
  ]},
  {version:'1.45.3', notes:[
    'The country search now sits just above the bottom bar, within reach of a thumb, and stays there while the list scrolls.',
    'The + buttons spring out of the circle and fold back into it, instead of appearing and vanishing on the spot.'
  ]},
  {version:'1.45.2', notes:[
    'Your Trips now leads with the next trip rather than the furthest away one. Trips still to come are listed in the order they will happen, then ones that have been and gone, then the archive.'
  ]},
  {version:'1.45.1', notes:[
    'Countries are listed one per row, so long names and their details have somewhere to go. Two per row on a wider screen.',
    'Going sits in the top right corner of a country instead of pushing everything else down, and the flag now sits beside the name rather than above it.'
  ]},
  {version:'1.45.0', notes:[
    'A trip no longer needs dates to exist. Pick Rough Idea when you make one and say a month, a season, a range of months, or just a year, plus roughly how many weeks you will be away.',
    'A trip planned that loosely runs on day numbers: its itinerary reads Day 1, Day 2, Day 3 rather than pretending to know dates.',
    'Pin the dates down later and every Day 3 becomes the actual third day. Go the other way and the dates fold back into day numbers, so the plan survives either move.',
    'Trips still being planned say so on their card instead of counting down to nothing.'
  ]},
  {version:'1.44.0', notes:[
    'A country on a trip you have not taken yet no longer counts as somewhere you have been. Trips only mark a country as Been once they have finished; until then it counts as Going, which has its own counter.',
    'The counters are now four, two by two, and four in a row on a wider screen.',
    'Dates are written out in full everywhere ("24 September 2026"), and a range says the year once at the end unless it runs into the new year.',
    'Your Trips lists the most recent trip first.'
  ]},
  {version:'1.43.0', notes:[
    'Accommodation now shows the nights you have nowhere to stay, as a dashed card sitting exactly where the gap falls. Its Add Accommodation button opens the form with those dates already filled in.',
    'The black pop-up that slid over the bottom bar after every action is gone. It mostly told you what you had just done. Deleting still asks before it does anything, and the few messages you actually need to read now wait in a box until you dismiss them.',
    'A New Trip button sits at the top right of Your Trips.',
    'The + wheel is down to the five things worth having there: an idea, a stop, a receipt, travel and a document.',
    'Accommodation is a house rather than a hotel throughout.'
  ]},
  {version:'1.42.0', notes:[
    'The + on the bottom bar now fans out into everything you can add: a stop, travel, an idea, a place to stay, a flight, ferry, car hire, a receipt, a poll, a packing item, a note, a contact, a link, a document, or a whole new trip. Tap the + again, tap away, or press escape to close it.',
    'Outside a trip there is only one thing to add, so the + still just starts a new trip.',
    'The compass on an undecided travel leg is a question mark in the form too, not just on the card.',
    'Hours and minutes now sit side by side on a phone instead of stacking, for both the time and the duration.',
    'Turkey and Ivory Coast are listed under their English names again.',
    'Nudged the date and countdown text into line with the icons beside them.'
  ]},
  {version:'1.41.0', notes:[
    'Checking out of one place and into another on the same day now suggests the journey between them, sitting between the two on the itinerary. Tap it to fill in how you\'re getting there, exactly like the trip to the airport.',
    'Travel with no mode chosen yet is marked with a question mark rather than a compass.',
    'Places I\'ve Been now opens on the countries you have been to, rather than the full list of 223.',
    'The three counters have lost their emoji and gained much bigger numbers.',
    'Searching for a country now finds it whichever counter you are filtered by, so you can always tick a new one.'
  ]},
  {version:'1.40.0', notes:[
    'The suggested trip to the airport now assumes you want to be there two hours before the flight, so it reads "arrive by 14:00" for a 16:05 departure instead of telling you to leave at the same moment the plane does. Change it like any other travel leg.',
    'Every page now starts its title the same distance down the screen, so nothing jumps as you move between them.'
  ]},
  {version:'1.39.1', notes:[
    'The Leave by / Arrive by buttons now sit straight under When, and the question above them has gone: the buttons say it themselves.'
  ]},
  {version:'1.39.0', notes:[
    'The top header is gone. Everything it held is now either on the page itself or on the bottom bar, so there is more room for the trip.',
    'The version number and What\'s new have moved to the foot of Your Trips.',
    'Share Trip now sits above Delete Trip on the trip overview, so the destructive button is the last thing on the page.',
    'Travel legs can say whether the time is when you leave or when you need to be there, and the card reads "leave by 16:05" or "arrive by 09:30" instead of a bare time.',
    'Fixed a travel leg you saved from a flight\'s suggestion duplicating itself when you went back and changed the mode.',
    'The emoji box on an idea now sits directly under its name, with the quick picks below it.',
    'Packing rows line up properly with their tick boxes, labels and delete buttons, and Remind me has moved up beside the section title.',
    'Dropped the tap-to-copy on locations and addresses, and the Copy list button on packing.',
    'Removed the back button on Places I\'ve Been and added some breathing room above the search box.'
  ]},
  {version:'1.38.1', notes:[
    'Places I\'ve Been: dropped the row of filter buttons, since the three cards above them now do the same job. The card you\'re filtering by is highlighted.'
  ]},
  {version:'1.38.0', notes:[
    'The bottom bar now stays put when the section menu is open, and the last button turns into Close, so the thumb that opened it can shut it again.',
    'The three Places counters have moved off the home page onto Places I\'ve Been itself.',
    'Emoji now run right through the Itinerary: your stops, travel legs, flights, ferries, car hire, check in and check out. Edit and delete stay as plain icons so they don\'t get lost in the colour.',
    'A stop added from an idea keeps that idea\'s emoji, and stops added by hand get one suggested from their name.',
    'The emoji picker now sits above the box instead of beside it, with far more activity choices for when the title gives nothing away.',
    'Centred the + on the new trip button properly.'
  ]},
  {version:'1.37.0', notes:[
    'Ideas can now have an emoji, and one is suggested from the title as you type: sushi gets a sushi, a hike gets boots, a rooftop bar gets a cocktail.',
    'Tap one of the quick picks or type any emoji you like, and once you have chosen your own the title stops overriding it.'
  ]},
  {version:'1.36.0', notes:[
    'Added a bottom bar as the main way around the app: Trips, Places, a green + in the middle for a new trip, and inside a trip, Itinerary and the menu.',
    'The globe has gone from the top header now that Places lives on the bottom bar.',
    'Trip dates now read "23 Sep - 1 Oct 2026" instead of repeating the year twice.',
    'Trip cards on the home page now show who\'s going.',
    'Removed the Back Up Trips and Restore buttons: trips sync to the cloud, so they were doing nothing useful.'
  ]},
  {version:'1.35.1', notes:[
    'Reordered the trip dashboard: Itinerary and Ideas now lead, and Edit Trip has moved to the end.',
    'Places I\'ve Been: "All" is now the globe, and South America has a llama, so no continent shares the globe with it any more.'
  ]},
  {version:'1.35.0', notes:[
    'The PIN can no longer be changed from inside the app. It now lives only in the code, so it takes a deploy to move it and nobody who gets past the gate can lock everyone else out.',
    'The PIN button has gone from the header.',
    'The three cards at the top of the home page sit a little higher up the page.'
  ]},
  {version:'1.34.1', notes:[
    'The three cards at the top of the home page now use the same plain white card style as the trips below them, instead of the filled green.',
    'Northern Ireland now shows the Irish tricolour on Places I\'ve Been.'
  ]},
  {version:'1.34.0', notes:[
    'The home page now opens with three cards, Places I\'ve Been, Want to Go and Countries. Tapping one goes straight to that list, already filtered.',
    'Your Trips now sits below those three cards.',
    'On an iPhone, with the app added to your home screen, Search Flights now hands over to Safari itself instead of the cut-down in-app browser, so you keep your Google login and can open the Google Flights app.',
    'Africa\'s emoji on Places I\'ve Been is now a lion.'
  ]},
  {version:'1.33.3', notes:[
    'The "Places I\'ve Been" card on the home page now shows its three stats as separate items, each with its own emoji, with the world total on its own line underneath.'
  ]},
  {version:'1.33.2', notes:[
    'Fixed the Itinerary tile counting travel legs as activities, so a day with one thing planned and a couple of journeys no longer reads as "4 Activities Planned".',
    'The Flights, Ferries and Car Hire headings on the Travel tab now use emoji to match the rest of the app.'
  ]},
  {version:'1.33.1', notes:[
    'The Edit Trip tile now lists who\'s going instead of repeating the countdown that already sits in the header.',
    'Places I\'ve Been: each continent card now has its own emoji, and "All" is a globe.',
    'Toned down the calendar and hourglass emoji in the trip header, they were sitting too large next to the dates.'
  ]},
  {version:'1.33.0', notes:[
    'The itinerary now works out where you are on each day by itself: flights, ferries and check-ins move the forecast along with you, so a multi-country trip shows the right town\'s weather on the right days. The "Weather for..." bar and its Change button are gone, there\'s nothing to set up any more.',
    'Weather now shows as an emoji (sun, rain, thunder) next to the temperatures.',
    'The trip header now shows a calendar next to the dates and, for a trip that hasn\'t started, an hourglass with how many days to go.'
  ]},
  {version:'1.32.1', notes:[
    'The trip dashboard tiles now use colourful emoji instead of flat green icons, so the page has more life to it and sits better next to the country flags at the top.'
  ]},
  {version:'1.32.0', notes:[
    'New Packing section: a shared list for the trip, with a one-tap starter list of the usual essentials to get going.',
    'Ticking is per person, so you and everyone else get your own boxes on the same list. An item can also be assigned to one person when it\'s only theirs to bring.',
    'A progress bar shows how much of the list is fully packed, and as the trip gets close the section reminds you how many things you\'ve still got to do.',
    '"Remind me" saves a calendar reminder for the evening before you travel, listing everything you haven\'t packed yet, and "Copy list" puts the whole thing on your clipboard.'
  ]},
  {version:'1.31.0', notes:[
    'New Polls section: settle group decisions in the app instead of a scroll of chat messages. Ask a question, add the options, and everyone taps their pick.',
    'Each option shows the running count, a share-of-the-vote bar and who voted for it, so it\'s clear where things stand and who you\'re still waiting on.',
    'Tap your own choice again to take it back, or tap another option to change your mind. One vote each, keyed to the name you picked for the trip.',
    'Close a poll once it\'s decided and the winner is highlighted; reopen it if plans change. The Overview tile tells you when a poll is waiting on your vote.'
  ]},
  {version:'1.30.0', notes:[
    'Itinerary: each day now shows the weather forecast, high/low temperature, the conditions and the chance of rain, so you can see at a glance which days to plan indoors.',
    'Forecasts only exist about two weeks ahead, so days further out simply show nothing rather than a made-up number.',
    'The forecast defaults to the trip\'s country; tap "Change" at the top of the Itinerary to pin it to the actual town you\'re staying in.'
  ]},
  {version:'1.29.1', notes:[
    'Places I\'ve Been: the Search Flights button is now icon-only (plane icon, no text) and sits bottom-right of each country card, matching the app\'s other icon buttons.',
    'Removed the "N been · N want to go · N countries" summary line from below the page title.'
  ]},
  {version:'1.29.0', notes:[
    'Places I\'ve Been: removed the 3D globe, the pie charts and the colour-key legend, simplifying the page down to region cards, a search box and country cards.',
    'Removed the separate "Going" status. A country on any active trip\'s itinerary now just shows Been ticked automatically, same as ticking it yourself.',
    'Each filter button (All, Been, Want to Go) now shows a live count in brackets.',
    'Added a "Places I\'ve Been" card to the home page with a running total, tap it to jump straight to the page.',

/* ================= state ================= */
const LS_KEY = 'calstrippin_v1';
const SCHEMA = 1;
var DB = load();
let CUR_TAB = 'info';
let CUR_TRIP_ID = null;      // id of the trip currently open
let fbRoot = null;           // firebase database ref, or null when local-only
let tripSub = null;          // { id, ref } for the active onValue subscription
let syncState = 'local';     // 'local' | 'ok' | 'busy' | 'off'
let lastPush = '';           // echo guard for our own writes

function load(){
  try{
    const db = JSON.parse(localStorage.getItem(LS_KEY));
    if(db && Array.isArray(db.trips)){
      db.schema = db.schema || SCHEMA;
      db.places = (db.places && typeof db.places==='object') ? db.places : {};
      db.placesArchived = Array.isArray(db.placesArchived) ? db.placesArchived : [];
      db.gigs = Array.isArray(db.gigs) ? db.gigs : [];
      db.films = Array.isArray(db.films) ? db.films : [];
      db.filmsWatchlist = Array.isArray(db.filmsWatchlist) ? db.filmsWatchlist : [];
      db.plants = Array.isArray(db.plants) ? db.plants : [];
      return db;
    }
  }catch(e){}
  return {trips:[], schema:SCHEMA, places:{}, placesArchived:[], gigs:[], films:[], filmsWatchlist:[], plants:[]};
}
/* persist to localStorage. If storage is full, never lose a trip, drop only the heavy
   in-browser file/photo previews (they still live in the cloud copy when synced) and keep
   every trip and all its details. */
function saveLocal(){
  DB.schema = SCHEMA;
  try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); return; }
  catch(e){}
  try{
    let dropped = 0;
    DB.trips.forEach(t=>{
      (t.documents||[]).forEach(d=>{ if(d.dataUrl){ d.dataUrl=null; d.stripped=true; dropped++; } });
      (t.moodBoard||[]).forEach(m=>{ if(m.dataUrl){ m.dataUrl=null; m.stripped=true; dropped++; } });
    });
    localStorage.setItem(LS_KEY, JSON.stringify(DB));
    if(dropped) noteModal('Storage Full', 'Some file previews were dropped from this device, but your trips are safe.');
  }catch(e2){ noteModal('Storage Full', "That couldn't be saved. Try removing some photos or documents."); }
}
/* save() persists locally AND pushes the open trip to the shared store (when enabled) */
function save(){
  saveLocal();
  const t = CUR_TRIP_ID && getTrip(CUR_TRIP_ID);
  if(t) pushTrip(t);
}

/* ================= cloud sync ================= */
function cloudEnabled(){ return !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL); }
/* surface *why* sync failed instead of a silent Offline pill, permission-denied (locked
   database rules) is by far the most common cause when it's freshly configured */
let _syncErrorToasted = false;
function syncErrorHint(err){
  const code = (err && (err.code||err.message||err)||'').toString();
  if(/permission[_-]?denied/i.test(code)) return "Sync is blocked by the database rules. Open the Firebase console → Realtime Database → Rules and allow read/write.";
  return 'Sync failed: '+code;
}
function reportSyncError(err){
  console.error("My Trips, cloud sync error:", err);
  syncState='off';
  if(!_syncErrorToasted){ _syncErrorToasted = true; noteModal('Sync Problem', syncErrorHint(err)); }
}
function initCloud(){
  if(!cloudEnabled() || typeof firebase==='undefined'){ syncState='local'; return; }
  try{
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    fbRoot = firebase.database();
    firebase.database().ref('.info/connected').on('value', s=>{
      if(CUR_TRIP_ID){ syncState = s.val() ? 'ok' : 'off'; }
    }, reportSyncError);
  }catch(e){ fbRoot = null; syncState='local'; console.error("My Trips, Firebase failed to initialise:", e); }
}
/* strip heavy blobs so the shared document stays small & portable */
function stripForCloud(t){
  const c = JSON.parse(JSON.stringify(t));
  delete c._identifiedHere;
  c.documents = (c.documents||[]).map(d=>
    d.dataUrl && d.dataUrl.length > SYNC_BLOB_CAP ? {...d, dataUrl:null, stripped:true} : d);
  c.moodBoard = (c.moodBoard||[]).map(m=>
    m.dataUrl && m.dataUrl.length > SYNC_BLOB_CAP ? {...m, dataUrl:null, stripped:true} : m);
  // strip large boarding-pass / itinerary attachments from the shared copy too
  ['flights','ferries','carHire','itinerary'].forEach(k=>{
    c[k] = (c[k]||[]).map(x=>{
      if(x.doc && x.doc.dataUrl && x.doc.dataUrl.length > SYNC_BLOB_CAP) x = {...x, doc:{...x.doc, dataUrl:null, stripped:true}};
      if(x.image && x.image.length > SYNC_BLOB_CAP) x = {...x, image:null, imageStripped:true};
      return x;
    });
  });
  return c;
}
function pushTrip(t){
  if(!fbRoot) return;
  const clean = stripForCloud(t);
  const json = JSON.stringify(clean);
  if(json === lastPush) return;
  lastPush = json;
  syncState='busy';
  fbRoot.ref('trips/'+t.id).set(clean)
    .then(()=>{ syncState='ok'; _syncErrorToasted=false; })
    .catch(reportSyncError);
}
/* keep any locally-held blobs that the shared copy dropped */
function mergeRemote(local, remote){
  if(!local) return remote;
  const keepBlob = (arr, rem) => (rem||[]).map(r=>{
    if(r.dataUrl || !r.stripped) return r;
    const l = (arr||[]).find(x=>x.id===r.id);
    return l && l.dataUrl ? {...r, dataUrl:l.dataUrl, stripped:false} : r;
  });
  remote.documents = keepBlob(local.documents, remote.documents);
  remote.moodBoard = keepBlob(local.moodBoard, remote.moodBoard);
  return remote;
}
function subscribeTrip(id){
  if(tripSub){ try{ tripSub.ref.off('value', tripSub.cb); }catch(e){} tripSub=null; }
  if(!fbRoot) return;
  const ref = fbRoot.ref('trips/'+id);
  const cb = snap => {
    const remote = snap.val();
    if(!remote) return;
    // normalise arrays (Firebase can return objects for sparse/keyed data)
    ['flights','ferries','carHire','documents','receipts','moodBoard','participants','editLog','countries','itinerary','docLinks','accommodations']
      .forEach(k=>{ if(remote[k] && !Array.isArray(remote[k])) remote[k]=Object.values(remote[k]); });
    if(remote.notes && remote.notes.contacts && !Array.isArray(remote.notes.contacts))
      remote.notes.contacts = Object.values(remote.notes.contacts);
    normalizeTrip(remote);
    const echo = JSON.stringify(remote) === lastPush;
    const idx = DB.trips.findIndex(x=>x.id===id);
    const merged = mergeRemote(idx>=0?DB.trips[idx]:null, remote);
    if(idx>=0) DB.trips[idx]=merged; else DB.trips.unshift(merged);
    saveLocal();
    syncState='ok';
    if(!echo && CUR_TRIP_ID===id && !modalOpen()) renderTrip(merged);
  };
  ref.on('value', cb, reportSyncError);
  tripSub = {id, ref, cb};
}
function fetchTripOnce(id, done){
  if(!fbRoot){ done(null); return; }
  fbRoot.ref('trips/'+id).get()
    .then(s=>done(s.exists()?s.val():null)).catch(err=>{ reportSyncError(err); done(null); });
}

/* ================= device id (anonymous, for poll voting only) ================= */
/* a single random id, generated once and kept in localStorage - not a name, not tied to any
   trip, just enough to remember "this device already voted on this poll" without asking who's
   using it. There's no more per-trip identity system (see git history: this app is single-user
   now, so "who is this device" was a modal in the way, not a feature). */
function deviceVoteId(){
  try{
    let id = localStorage.getItem('calstrippin_device_id');
    if(!id){ id = uid()+uid(); localStorage.setItem('calstrippin_device_id', id); }
    return id;
  }catch(e){ return 'anon'; }
}

/* ================= edit log ================= */
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<45) return 'just now';
  const m = Math.floor(s/60); if(m<60) return m+' min ago';
  const h = Math.floor(m/60); if(h<24) return h+(h===1?' hour ago':' hours ago');
  const d = Math.floor(h/24); if(d<7) return d+(d===1?' day ago':' days ago');
  return fmtDate(new Date(ts).toISOString().slice(0,10));
}
function logEdit(section, summary){
  const t = CUR_TRIP_ID && getTrip(CUR_TRIP_ID); if(!t) return;
  t.editLog = t.editLog || [];
  t.editLog.push({id:uid(), when:Date.now(), section, summary});
  if(t.editLog.length>200) t.editLog = t.editLog.slice(-200);
}

/* ================= utils ================= */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* text safe to pass as a single-quoted argument inside an onclick attribute. esc() alone
   isn't enough there: the browser turns its &#39; back into a real apostrophe before the JS
   is parsed, so an address like "St John's Road" would end the string early. Percent-encoding
   leaves nothing behind that either parser reacts to; the handler decodeURIComponent's it. */
const jsArg = s => encodeURIComponent(String(s==null?'':s)).replace(/'/g, '%27');
/* The pop-up that used to slide over the bottom bar after every action is gone. It said
   things you already knew ("Stop saved", right after you saved a stop) and covered the bar
   while it did. Every delete already asks first, so its Undo was a second safety net rather
   than the only one. Kept as a no-op so the ~40 places that announce what they just did
   don't each need a special case: they simply say nothing now. Anything you genuinely have
   to read, an error or a "you can't do that yet", goes through noteModal below instead, and
   waits to be dismissed rather than fading away unread. */
function toast(){}
/* the small number of messages that aren't just narration: something failed, or something
   has to be filled in first. Defined here but implemented once openModal exists. */
function noteModal(title, body){
  openModal(`

/* One date format everywhere: "24 September 2026", month written out in full. */
function fmtDate(d){
  if(!d) return '';
  return new Date(d + 'T00:00:00').toLocaleDateString(undefined, {day:'numeric', month:'long', year:'numeric'});
}
/* the same date without its year, for the near end of a range that says the year once */
function fmtDateNoYear(d){
  if(!d) return '';
  return new Date(d + 'T00:00:00').toLocaleDateString(undefined, {day:'numeric', month:'long'});
}
/* A short d/m/yy date, for the tight card-meta spots (a film's watched date, a gig's date)
   where fmtDate's spelled-out month - "19 April 2026" - crowds out the year/rating or venue
   sitting right next to it. "19/4/26" reads just as unambiguously in that little a space. */
function fmtShortDate(d){
  if(!d) return '';
  const dt = new Date(d + 'T00:00:00');
  return dt.getDate()+'/'+(dt.getMonth()+1)+'/'+String(dt.getFullYear()).slice(-2);
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
/* The two ends of a range, given separately so a caller can slot times in between them.
   The year is said once, at the end: "24 September - 26 September 2026". A range that runs
   into the new year needs both, since one year at the end would be wrong for the first half:
   "28 December 2026 - 3 January 2027". */
function rangeParts(a, b){
  const crosses = new Date(a+'T00:00:00').getFullYear() !== new Date(b+'T00:00:00').getFullYear();
  return {from: crosses ? fmtDate(a) : fmtDateNoYear(a), to: fmtDate(b)};
}
function fmtRange(a,b){
  if(!a && !b) return 'Dates TBC';
  if(!a || !b) return a ? 'From '+fmtDate(a) : 'Until '+fmtDate(b);
  const p = rangeParts(a,b);
  return p.from+' - '+p.to;
}
/* kept as its own name because the trip header used to want something more compact; it now
   reads exactly like every other range */
const fmtRangeLong = fmtRange;
/* months/weeks/days breakdown for the "to go" countdown, e.g. "1 month 2 weeks to go" */
function daysToGoPhrase(n){
  if(n===0) return 'starts today';
  if(n===1) return '1 day to go';
  let rem = n;
  const months = Math.floor(rem/30); rem -= months*30;
  const weeks = Math.floor(rem/7); rem -= weeks*7;
  const days = rem;
  const parts = [];
  if(months) parts.push(months+(months===1?' month':' months'));
  if(weeks) parts.push(weeks+(weeks===1?' week':' weeks'));
  if(days || !parts.length) parts.push(days+(days===1?' day':' days'));
  return parts.join(' ')+' to go';
}
/* short parenthetical for the trip header: "1 month 2 weeks to go", "day 2 of 8"… */
function statusPhrase(t){
  if(isArchived(t)) return '';   // shown as a pill top-right of the header instead
  const day = 86400000, today = new Date(); today.setHours(0,0,0,0);
  const s = t.startDate ? new Date(t.startDate+'T00:00:00') : null;
  const e = t.endDate ? new Date(t.endDate+'T00:00:00') : null;
  if(s && today < s){ const n = Math.round((s-today)/day); return daysToGoPhrase(n); }
  if(e && today > e){ const n = Math.round((today-e)/day); return n===1?'ended yesterday':'ended '+n+' days ago'; }
  if(s && e){ const d = Math.round((today-s)/day)+1, tot = Math.round((e-s)/day)+1; return 'day '+d+' of '+tot; }
  if(s) return 'happening now';
  return '';
}
/* the trip's start date, but only when it's genuinely still ahead of us, used to decide
   whether the header shows the live countdown card instead of the "N to go" phrase */
function upcomingStartDate(t){
  if(isArchived(t) || !t.startDate) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  return today < new Date(t.startDate+'T00:00:00') ? t.startDate : null;
}
/* flat day count for the Edit Trip tile's summary, e.g. "45 days to go" */
function daysToGoCount(startDate){
  const today = new Date(); today.setHours(0,0,0,0);
  const n = Math.round((new Date(startDate+'T00:00:00') - today)/86400000);
  return n+' day'+(n===1?'':'s')+' to go';
}
/* ---------- trips without dates yet ----------
   Plenty of trips start as "somewhere hot next summer" long before anyone books anything, so
   a trip can carry a rough idea of when instead of two exact dates. t.when holds it and
   startDate/endDate stay empty; the moment real dates are set, t.when goes and everything
   date-driven (weather, the countdown, archiving, accommodation gaps) starts working again. */
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const SEASONS = [['spring','Spring'],['summer','Summer'],['autumn','Autumn'],['winter','Winter']];
const WHEN_KINDS = [['month','Month'],['season','Season'],['months','Month Range'],['year','Just the Year']];
const hasRoughWhen = t => !!(t && t.when && t.when.year && !t.startDate && !t.endDate);
/* "August 2027", "Summer 2027", "August to September 2027", "Sometime in 2027" */
function whenLabel(w){
  if(!w || !w.year) return '';
  const m = n => MONTH_NAMES[Math.max(0,Math.min(11,(n||1)-1))];
  if(w.kind==='season'){ const s = SEASONS.find(x=>x[0]===w.season); return (s?s[1]:'Sometime')+' '+w.year; }
  if(w.kind==='month')  return m(w.month)+' '+w.year;
  if(w.kind==='months'){
    /* a range that wraps past December runs into the next year, so both need saying */
    if(w.endMonth < w.month) return m(w.month)+' '+w.year+' to '+m(w.endMonth)+' '+(w.year+1);
    return w.endMonth===w.month ? m(w.month)+' '+w.year : m(w.month)+' to '+m(w.endMonth)+' '+w.year;
  }
  return 'Sometime in '+w.year;
}
/* short trips are stored as a fraction of a week (day count / 7) rather than adding a
   separate unit, so "How long" stays one field; SHORT_WHEN_LABELS gives those fractions a
   proper name instead of printing "0.14 weeks" */
const SHORT_WHEN_OPTS = [[1/7,'A day'],[2/7,'Weekend'],[4/7,'Long weekend']];
const SHORT_WHEN_LABELS = Object.fromEntries(SHORT_WHEN_OPTS.map(([v,l])=>[v,l]));
const weeksLabel = n => !n ? '' : SHORT_WHEN_LABELS[n] || (n+' week'+(n===1?'':'s'));
/* something sortable for a trip whether its dates are real or still a rough idea, so both
   kinds can be ordered together. A season becomes the month it starts in. */
function tripSortDate(t){
  if(t.startDate) return t.startDate;
  const w = t.when;
  if(!w || !w.year) return '';
  const m = w.kind==='season' ? ({spring:3, summer:6, autumn:9, winter:12}[w.season] || 6)
          : (w.kind==='month' || w.kind==='months') ? (w.month || 1)
          : 1;
  return w.year+'-'+String(m).padStart(2,'0')+'-01';
}
/* how many days a rough trip runs for, when a length has been given. Rounded: a fraction of
   a week (a day/weekend/long weekend, see SHORT_WHEN_OPTS) times 7 lands a hair either side
   of a whole number in floating point, and this is used as an array length elsewhere. */
const roughTripDays = t => hasRoughWhen(t) && t.when.weeks ? Math.round(t.when.weeks*7) : 0;
/* the one line that says when a trip is, whichever way it's been pinned down */
function tripWhenLine(t){
  if(hasRoughWhen(t)){
    const wk = weeksLabel(t.when.weeks);
    return whenLabel(t.when) + (wk?' · '+wk:'');
  }
  return fmtRange(t.startDate, t.endDate);
}
/* The "when" block both trip forms share. Exact dates or a rough idea, with only the fields
   the chosen kind actually needs on screen, so it never looks like a form full of holes.
   Prefixed ids (f- / et-) so the two forms can't collide. */
