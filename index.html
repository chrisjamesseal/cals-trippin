/* the two click handlers the block needs live with the rest of App, further down: this runs
   before App exists */
function setWhenModeImpl(p, mode){
  const el = $('#'+p+'-mode'); if(!el) return;
  el.value = mode;
  $('#'+p+'-exact').style.display = mode==='exact' ? '' : 'none';
  $('#'+p+'-rough').style.display = mode==='rough' ? '' : 'none';
  document.querySelectorAll('.mode-when').forEach(x=>{
    const on = x.dataset.mode === mode;
    x.classList.toggle('on', on); x.setAttribute('aria-checked', String(on));
  });
}
function setWhenKindImpl(p, kind){
  const el = $('#'+p+'-kind'); if(!el) return;
  el.value = kind;
  document.querySelectorAll('.when-pick').forEach(x=>{
    const on = x.dataset.when === kind;
    x.classList.toggle('on', on); x.setAttribute('aria-checked', String(on));
  });
  const show = (id, yes) => { const f = $('#'+p+'-f-'+id); if(f) f.style.display = yes ? '' : 'none'; };
  show('month', kind==='month' || kind==='months');
  show('endmonth', kind==='months');
  show('season', kind==='season');
  /* the month select doubles as the start of a range, so its label has to say which it is */
  const ml = document.querySelector('label[for="'+p+'-month"]');
  if(ml) ml.textContent = kind==='months' ? 'From' : 'Month';
}
/* what the when block currently says, as the two fields a trip stores */
function readWhenFields(p){
  const rough = ($('#'+p+'-mode')||{}).value === 'rough';
  if(!rough) return {startDate: $('#'+p+'-start').value, endDate: $('#'+p+'-end').value, when: null};
  const kind = $('#'+p+'-kind').value;
  const when = {kind, year: +$('#'+p+'-year').value, weeks: +$('#'+p+'-weeks').value};
  if(kind==='month' || kind==='months') when.month = +$('#'+p+'-month').value;
  if(kind==='months') when.endMonth = +$('#'+p+'-endmonth').value;
  if(kind==='season') when.season = $('#'+p+'-season').value;
  return {startDate:'', endDate:'', when};
}
function money(n){ return (n<0?'-':'') + '£' + Math.abs(n).toFixed(2); }
function isArchived(t){
  if(!t.endDate) return false;
  const cut = new Date(t.endDate + 'T00:00:00');
  cut.setMonth(cut.getMonth()+1);
  return new Date() > cut;
}
function getTrip(id){ return DB.trips.find(t=>t.id===id); }
/* guarantees every trip loaded from anywhere (local storage, Firebase, a legacy snapshot
   link) has all its list fields as real arrays, an older trip can predate a feature and a
   remote one can simply be missing a key that was empty when last written, either way code
   elsewhere that pushes straight into e.g. t.receipts assumes the array is already there.
   Also carries one-time upgrades: a trip used to hold a single accommodation at notes.accom
   rather than a list at accommodations[], and a single free-text note at notes.general
   rather than a list of separate notes at notes.items[] */
function normalizeTrip(t){
  if(!t) return t;
  ['countries','flights','ferries','carHire','accommodations','documents','docLinks',
   'itinerary','receipts','moodBoard','participants','editLog','polls','packing'].forEach(k=>{
    if(!Array.isArray(t[k])) t[k] = [];
  });
  t.notes = t.notes || {};
  if(!Array.isArray(t.notes.contacts)) t.notes.contacts = [];
  if(!Array.isArray(t.notes.items)) t.notes.items = [];
  if(t.notes.accom){
    const a = t.notes.accom;
    if(a && (a.name||a.address||a.bookingUrl||a.checkin||a.checkout)) t.accommodations.push({id:uid(), ...a});
    delete t.notes.accom;
  }
  if((t.notes.general||'').trim()){
    t.notes.items.push({id:uid(), text:t.notes.general.trim()});
    delete t.notes.general;
  }
  return t;
}
/* where the trip sits in time, used for at-a-glance status pills */
function tripStatus(t){
  if(isArchived(t)) return {label:'Archived', cls:'off'};
  /* a rough trip has nothing to count down to, so the pill says how firm the plan is
     instead of pretending to know a date */
  if(hasRoughWhen(t)) return {label:'Being Planned', cls:'soon'};
  const day = 86400000, today = new Date(); today.setHours(0,0,0,0);
  const s = t.startDate ? new Date(t.startDate+'T00:00:00') : null;
  const e = t.endDate ? new Date(t.endDate+'T00:00:00') : null;
  if(s && today < s){
    const n = Math.round((s-today)/day);
    return {label: n===0?'Starts today':n===1?'Starts tomorrow':'In '+n+' days', cls:'soon'};
  }
  if(e && today > e){
    const n = Math.round((today-e)/day);
    return {label: n===0?'Just ended':n===1?'Ended yesterday':'Ended '+n+' days ago', cls:'past'};
  }
  if(s){
    if(e){ const d=Math.round((today-s)/day)+1, tot=Math.round((e-s)/day)+1; return {label:'Happening now · day '+d+' of '+tot, cls:'now'}; }
    return {label:'Happening now', cls:'now'};
  }
  return {label:'Dates TBC', cls:''};
}

/* ISO 3166-1 alpha-2 codes; names come from Intl.DisplayNames, flags from regional indicators.

   their real Unicode flag emoji; XI (Northern Ireland) mirrors the code the UK/EU already use
   for it in customs contexts. There is no Northern Ireland flag emoji, so this shows the Irish

const COUNTRY_CODES = ('AD AE AF AG AI AL AM AO AR AT AU AW AZ BA BB BD BE BF BG BH BI BJ BM BN BO BR BS BT BW BY BZ CA CD CF CG CH CI CK CL CM CN CO CR CU CV CW CY CZ DE DJ DK DM DO DZ EC EE EG ER ES ET FI FJ FK FM FO FR GA GD GE GG GH GI GL GM GN GQ GR GT GW GY HK HN HR HT HU ID IE IL IM IN IQ IR IS IT JE JM JO JP KE KG KH KI KM KN KP KR KW KY KZ LA LB LC LI LK LR LS LT LU LV LY MA MC MD ME MG MH MK ML MM MN MO MQ MR MS MT MU MV MW MX MY MZ NA NC NE NG NI NL NO NP NR NU NZ OM PA PE PF PG PH PK PL PR PT PW PY QA RO RS RU RW SA SB SC SD SE SG SI SK SL SM SN SO SR SS ST SV SX SY SZ TC TD TG TH TJ TL TM TN TO TR TT TV TW TZ UA UG US UY UZ VA VC VE VG VI VN VU WS YE ZA ZM ZW XE XS XW XI').split(' ');

   to the plain, consistent name so it doesn't vary browser to browser */

   name rather than the English one (CLDR renamed TR to Türkiye in 2022, and CI has always
   been listed under its French name), so those are pinned here. Curaçao and São Tomé keep
   their accents: those ARE the English names, not untranslated ones. */
const CUSTOM_COUNTRY_NAMES = {XE:'England', XS:'Scotland', XW:'Wales', XI:'Northern Ireland', CN:'China', HK:'Hong Kong', MO:'Macao',

const COUNTRY_NAME_ALIASES = {'türkiye':'TR', 'turkiye':'TR', 'côte d’ivoire':'CI', "côte d'ivoire":'CI', 'cote d’ivoire':'CI', "cote d'ivoire":'CI'};

function pushPlaces(){

    .catch(err => {

      if(/permission[_-]?denied/i.test((err&&(err.code||err.message||err)||'').toString())){
        noteModal('Places Not Saved', "The database rules don't allow writing Places. Open the Firebase console, Realtime Database, Rules, and add a 'places' rule.");
      }else{

/* countries on any non-archived trip's itinerary auto-count as Been; archived trips don't
   (those get folded into DB.places directly, see applyArchiveTransitions below) */
/* What your trips say about each country: 'been' once a trip there has finished, 'going'
   while it's still ahead of you or under way. A trip you haven't taken yet is not somewhere
   you've been, which is what this used to claim. A trip with no end date counts as still to
   come, since there's nothing to say it's over. */
function placesTripMap(){
  const map = {};
  const today = todayStr();
  DB.trips.forEach(t=>{
    const finished = t.endDate && t.endDate < today;
    (t.countries||[]).forEach(c=>{
      if(finished) map[c] = 'been';
      else if(map[c] !== 'been') map[c] = 'going';
    });
  });
  return map;
}
/* one-time transition: once a trip crosses the archive boundary, mark its countries
   Been for good, otherwise they'd quietly drop out of the auto-Been count with nothing to show for it */
function applyArchiveTransitions(){
  if(!DB.places) DB.places = {};
  if(!Array.isArray(DB.placesArchived)) DB.placesArchived = [];
  let changed = false;
  DB.trips.forEach(t=>{
    if(!isArchived(t) || DB.placesArchived.includes(t.id)) return;
    (t.countries||[]).forEach(c=>{ DB.places[c] = 'been'; });
    DB.placesArchived.push(t.id);
    changed = true;
  });
  if(changed) savePlaces();
}
/* Been wins over everything: a finished trip proves it, and so does ticking it yourself, and
   neither is undone by having a trip back there booked. Going comes next, since a country
   you're actually travelling to isn't merely one you fancy. */
function placesStatusOf(code, fromTrips){
  const manual = (DB.places||{})[code];
  /* an explicit 'none' is you saying "take this off my list", which has to beat a trip:
     otherwise unticking a country a trip put there would do nothing and look broken */
  if(manual === 'none') return 'none';
  if(fromTrips === 'been' || manual === 'been') return 'been';
  if(fromTrips === 'going') return 'going';
  return manual || 'none';
}
/* Going is the one count that ignores the order above: a country you've been to before and
   are going back to belongs in both, so this asks the trips directly rather than the status. */
function goingCount(){
  const m = placesTripMap();
  return COUNTRY_CODES.filter(c => m[c]==='going' && (DB.places||{})[c] !== 'none').length;
}
function placesCounts(){
  const trips = placesTripMap();
  const counts = {all: COUNTRY_CODES.length, been:0, going:0, want:0};
  COUNTRY_CODES.forEach(c=>{
    const s = placesStatusOf(c, trips[c]);
    if(counts[s]!=null) counts[s]++;
  });
  return counts;
}

let _lastFocus = null;

/* every text field in the app gets a small × button (shown once it has a value) that clears
   it, wired up generically here rather than in each of the many form templates */
function attachFieldClears(root){
  root.querySelectorAll('input[type="text"], input[type="url"], input[type="tel"], input[type="email"], input[type="search"], textarea').forEach(inp=>{
    const wrap = document.createElement('span');
    wrap.className = 'field-clearwrap';
    inp.parentNode.insertBefore(wrap, inp);
    wrap.appendChild(inp);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'field-clear';
    btn.setAttribute('aria-label','Clear');
    btn.innerHTML = fa('xmark');
    const toggle = () => { btn.style.display = inp.value ? 'flex' : 'none'; };
    btn.onclick = () => { inp.value=''; inp.focus(); inp.dispatchEvent(new Event('input',{bubbles:true})); toggle(); };
    inp.addEventListener('input', toggle);
    wrap.appendChild(btn);
    toggle();
  });
}
/* forms and viewers open as full screens (no popups), a Back bar returns to the page below */
function openModal(html, opts){
  opts = opts || {};
  closeAddWheel();   // a form opened from the wheel takes over; the wheel shouldn't linger
  const root = $('#modal-root');
  const prev = root.querySelector('.modal-bg');
  const scrollPos = prev ? prev.scrollTop : 0;
  if(!prev) _lastFocus = document.activeElement;   // keep original opener across re-renders
  root.innerHTML =
    `<div class="modal-bg ${prev?'':'push'}">
       <div class="screen-top"><button class="screen-back" onclick="closeModal()">${ICONS.back}Back</button></div>
       <div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  attachFieldClears(root);
  if(prev) root.querySelector('.modal-bg').scrollTop = scrollPos;
  document.body.style.overflow = 'hidden';
  // autofocus the first real field for keyboard users (skip on re-renders to avoid focus jumps)
  if(opts.autofocus !== false && !prev){
    setTimeout(()=>{ const f = $('#modal-root .modal input:not([type=file]), #modal-root .modal select, #modal-root .modal textarea'); if(f) f.focus(); }, 30);
  }
}

  if(!modalOpen()) return;
  $('#modal-root').innerHTML=''; document.body.style.overflow='';
  if(_lastFocus && _lastFocus.focus){ try{ _lastFocus.focus(); }catch(e){} }
  _lastFocus = null;
}

/* inline field validation, injects an error line under the field, clears on next input */
function markErr(sel, msg){
  const inp = $(sel); if(!inp) return false;
  /* an input that isn't wrapped in a .field (the packing add row) has nowhere to hang the
     message, so it just gets the red outline and the cursor. Pressing Add on an empty box
     doesn't warrant stopping you with a dialog. */
  const field = inp.closest('.field');
  if(!field){
    inp.classList.add('err');
    inp.addEventListener('input', ()=>inp.classList.remove('err'), {once:true});
    inp.focus();
    return false;
  }
  field.classList.add('err');
  let e = field.querySelector('.field-err');
  if(!e){ e = document.createElement('div'); e.className='field-err'; field.appendChild(e); }
  e.textContent = msg;
  inp.addEventListener('input', ()=>field.classList.remove('err'), {once:true});
  inp.focus();
  return false;
}

function drawPlacesGrid(){
  const el = $('#places-grid'); if(!el) return;
  const q = (($('#places-filter')||{}).value||'').trim().toLowerCase();
  const trips = placesTripMap();

  /* only Want to Go starts on the region picker. Been is a list of somewhere between none and
     a couple of dozen countries, and Country Finder is deliberately the lot, so a screen of
     continents in front of either is a door with nothing behind it. */
  if(!q && !CUR_PLACES_REGION && PLACES_VIEWS[CUR_PLACES_VIEW].regions){
    el.innerHTML = placesRegionGridHTML(trips);
    return;
  }

  let list = COUNTRIES;
  if(q) list = list.filter(c=>c.name.toLowerCase().includes(q));
  else if(CUR_PLACES_REGION && CUR_PLACES_REGION!=='All') list = list.filter(c=>continentOf(c.code)===CUR_PLACES_REGION);
  /* a search overrides the region the same way it overrides the status filter: you typed a
     country's name, so you want that country whatever state it's in. Without this, the page
     opening on Been would mean you could never find a country to tick as Been in the first
     place, the search would just say it matches nothing. */
  if(!q) list = list.filter(c=>CUR_PLACES_FILTER==='all' || placesStatusOf(c.code, trips[c.code])===CUR_PLACES_FILTER);

  if(!list.length){
    const empty = q ? `No countries match "${esc(q)}"`
      : CUR_PLACES_VIEW==='been' ? "Nowhere yet. Countries fill in here once a trip there has finished, or tick one off in Country Finder."
      : CUR_PLACES_VIEW==='want' ? 'Nothing on the wish list yet. Country Finder is where you add them.'
      : 'No countries match this filter';
    el.innerHTML = `<div class="empty">${empty}</div>`; return;
  }

  const backRow = (!q && CUR_PLACES_REGION) ? `<button class="btn sm" style="margin-bottom:14px" onclick="App.clearPlacesRegion()">${ICONS.back} All Regions</button>` : '';
  const byContinent = {};
  list.forEach(co => { const k = continentOf(co.code); (byContinent[k] = byContinent[k]||[]).push(co); });
  const order = CONTINENT_ORDER.filter(k=>byContinent[k]).concat(Object.keys(byContinent).filter(k=>!CONTINENT_ORDER.includes(k)));
  /* a grouped list keeps its heading even when everything happens to fall in one continent:
     without it the Been list of three European countries looks ungrouped rather than grouped */
  const showHeadings = order.length>1 || (!q && !CUR_PLACES_REGION);
  /* a single-continent region view still needs a title now that the per-continent heading
     it used to inherit is suppressed (there's nothing else on the page saying "Europe") */
  const regionTitle = (!q && CUR_PLACES_REGION && CUR_PLACES_REGION!=='All' && !showHeadings) ? `<h3 class="places-continent-heading">${esc(CUR_PLACES_REGION)}</h3>` : '';
  el.innerHTML = backRow + regionTitle + order.map(k => `
    ${showHeadings?`<h3 class="places-continent-heading">${esc(k)}</h3>`:''}
    <div class="places-grid">${byContinent[k].map(co=>placeCardHTML(co, trips[co.code])).join('')}</div>
  `).join('');
}

/* ================= Games (PlayStation progress) =================
   PSN has no public API, and the unofficial one needs an auth step browsers can't make
   themselves (it requires setting a Cookie header cross-origin, which fetch() forbids), so
   this talks to a small proxy you deploy yourself - see psn-proxy/README.md. The proxy's
   URL is just an address, safe to commit (PSN_PROXY_URL, near FIREBASE_CONFIG); your actual
   PSN login token lives only in this browser's localStorage, never in the source. */
const PSN_TOKENS_KEY = 'calstrippin_psn_tokens';
function psnConfigured(){ return !!PSN_PROXY_URL; }
function psnTokens(){ try{ return JSON.parse(localStorage.getItem(PSN_TOKENS_KEY)||'null'); }catch(e){ return null; } }
function savePsnTokens(tok){ try{ localStorage.setItem(PSN_TOKENS_KEY, JSON.stringify(tok)); }catch(e){} }
function clearPsnTokens(){ try{ localStorage.removeItem(PSN_TOKENS_KEY); }catch(e){} }
function psnUrl(path){ return PSN_PROXY_URL.replace(/\/$/,'') + path; }
/* one retry on a stale access token: refresh, then replay the request once more */
async function psnApi(path){
  const tok = psnTokens();
  if(!tok) throw new Error('Not connected');
  let res = await fetch(psnUrl(path), {headers:{Authorization:'Bearer '+tok.accessToken}});
  if(res.status===401 && tok.refreshToken){
    const r = await fetch(psnUrl('/refresh'), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({refreshToken: tok.refreshToken})
    });
    if(!r.ok){ clearPsnTokens(); throw new Error('Your PlayStation session expired, connect again'); }
    const fresh = await r.json(); savePsnTokens(fresh);
    res = await fetch(psnUrl(path), {headers:{Authorization:'Bearer '+fresh.accessToken}});
  }
  if(!res.ok) throw new Error('Could not reach PlayStation (status '+res.status+')');
  return res.json();
}
function renderGames(){

    body.innerHTML = `<div class="empty">No PlayStation proxy is set up yet.<br>Deploy the one in
      <code>psn-proxy/</code> (its README walks through it), then paste your proxy's URL into
      <code>PSN_PROXY_URL</code> near the top of <code>index.html</code>.</div>`;
    return;
  }
  if(!psnTokens()){ renderGamesConnect(body); return; }
  body.innerHTML = `<div class="empty">Loading your games…</div>`;
  psnApi('/titles').then(data => {

}

async function psnConnectImpl(){
  const inp = $('#npsso-input');
  const npsso = (inp.value||'').trim();
  if(!npsso) return markErr('#npsso-input', 'Paste your NPSSO code first');
  const btn = $('#psn-connect-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Connecting…'; }
  try{
    const res = await fetch(psnUrl('/session'), {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({npsso})
    });
    if(!res.ok) throw new Error(res.status===401 ? 'That code was rejected, grab a fresh one' : 'Connection failed');
    savePsnTokens(await res.json());
    renderGames();
  }catch(e){
    markErr('#npsso-input', e.message||'Connection failed');
    if(btn){ btn.disabled = false; btn.textContent = 'Connect'; }
  }

function route(){
  closeModal(); closeMenu(); closeAddWheel();
  if(!pinOk()){ CUR_TRIP_ID = null; stopSub(); renderPinGate(); renderTabbar(); return; }
  setTimeout(renderTabbar, 0);   // after whichever render below has settled CUR_TRIP_ID/CUR_TAB
  const h = location.hash;
  if(h === '#/changelog'){
    renderChangelog(); window.scrollTo(0,0); return;
  }
  /* '#/places/been' and friends are the three list screens; the hub they hang off is the
     app's front door, so it answers to a bare hash rather than a path of its own */
  if(h === '#/places' || h.startsWith('#/places/')){
    const v = h.split('/')[2];
    if(!v){ location.hash = ''; return; }
    CUR_TRIP_ID = null; stopSub();
    renderPlaces(v); window.scrollTo(0,0); return;
  }
  if(h === '#/games'){
    CUR_TRIP_ID = null; stopSub();
    renderGames(); window.scrollTo(0,0); return;
  }
  if(h.startsWith('#/view/')){
    // legacy snapshot link, adopt the trip locally, then switch to the stable per-trip URL
    try{
      const snap = JSON.parse(LZString.decompressFromEncodedURIComponent(h.slice(7)));
      if(!snap || !snap.name || !snap.id) throw 0;
      if(!getTrip(snap.id)){ DB.trips.unshift(snap); saveLocal(); }
      location.hash = '#/trip/'+snap.id; return;
    }catch(e){
      CUR_TRIP_ID = null; stopSub();
          $('#app').innerHTML = `<div class="empty" style="margin-top:40px">This trip link appears to be broken or incomplete.<br>Ask whoever set it up to send it again.</div>`;
    }
  } else if(h.startsWith('#/trip/')){
    openTrip(h.slice(7).split('/')[0]);
  } else if(h === '#/trips'){
    CUR_TRIP_ID = null; stopSub(); renderHome();
  } else {
    /* the front door: what you've seen, what's booked, what you fancy, and everywhere else */
    CUR_TRIP_ID = null; stopSub(); renderPlacesHub();
  }
  window.scrollTo(0,0);
}
function openTrip(id){
  CUR_TAB = 'home';   // opening a trip always lands on the dashboard
  CUR_TRIP_ID = id;
  // 'busy' until the real .info/connected listener (in initCloud) confirms the connection,
  // don't claim Synced before Firebase has actually said so
  syncState = cloudEnabled() ? 'busy' : 'local';
  subscribeTrip(id);
  const local = getTrip(id);
  if(local){
    renderTrip(local);
    if(!whoAmI(id)) identityModal(local, ()=>{});
  } else if(fbRoot){
      $('#app').innerHTML = `<div class="empty" style="margin-top:40px">Loading trip…</div>`;
    fetchTripOnce(id, remote=>{
      if(CUR_TRIP_ID!==id) return;
      if(remote){
        normalizeTrip(remote);
        if(!getTrip(id)){ DB.trips.unshift(remote); saveLocal(); }
        const t = getTrip(id); renderTrip(t);
        if(!whoAmI(id)) identityModal(t, ()=>{});
      } else {
        $('#app').innerHTML = `<div class="empty" style="margin-top:40px">We couldn't find this trip.<br>Ask whoever set it up to share the link again.</div>`;
      }
    });
  } else {
      $('#app').innerHTML = `<div class="empty" style="margin-top:40px">This trip isn't saved on this device.<br>Shared trips need the app's cloud config set up first.</div>`;
  }
}

/* who's coming, trimmed so a big group can't push a card out of shape */
function peopleSummary(t, empty){
  const people = t.participants||[];
  if(!people.length) return empty || '';
  if(people.length <= 3) return people.join(', ');
  return `${people.slice(0,2).join(', ')} +${people.length-2} more`;
}
function tripCardHTML(t){
  const people = peopleSummary(t);
  return `
    <div class="trip-card ${isArchived(t)?'archived':''}" role="button" tabindex="0"
         onclick="location.hash='#/trip/${t.id}'"
         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();location.hash='#/trip/${t.id}'}">
      ${tripFlags(t)?`<div class="trip-flags">${tripFlags(t)}</div>`:''}
      <h3>${esc(t.name)}</h3>
      ${t.destination?`<div class="muted">${esc(t.destination)}</div>`:''}
      <div class="small" style="margin-top:8px">${esc(tripWhenLine(t))}</div>
      ${people?`<div class="small muted trip-people">${fa('user')}${esc(people)}</div>`:''}
      <div style="margin-top:12px">${statusPill(t)}</div>
    </div>`;
}
function homeGridHTML(trips, loading){
  if(!trips.length){
    // while trips are still being fetched from the cloud, "No trips yet" would be
    // misleading, it hasn't actually checked yet, so say so instead
    return loading ? `<div class="empty" style="margin-top:24px">Loading trips…</div>` : `<div class="empty" style="margin-top:24px">
      No trips yet.<br><br>
      <button class="btn primary" onclick="App.newTrip()">Create Your First Trip</button>
    </div>`;
  }
  /* The next trip first: what's soonest is what you're actually thinking about. Trips still
     to come lead, in the order they'll happen, then ones that have been and gone with the
     most recent of those first, then the archive. A trip with only a rough idea of when
     sorts by that, so "Summer 2027" sits where it belongs rather than at one end. */
  const today = todayStr();
  const isPast = t => t.endDate && t.endDate < today;
  const soonestFirst = (a,b) => (tripSortDate(a)||'9999').localeCompare(tripSortDate(b)||'9999');
  const latestFirst  = (a,b) => (tripSortDate(b)||'').localeCompare(tripSortDate(a)||'');
  const live = trips.filter(t=>!isArchived(t));
  const ordered = live.filter(t=>!isPast(t)).sort(soonestFirst)
    .concat(live.filter(isPast).sort(latestFirst))
    .concat(trips.filter(isArchived).sort(latestFirst));
  return `<div class="trip-grid">${ordered.map(tripCardHTML).join('')}</div>`;
}
/* everyone who's entered the PIN can see every trip, not just the ones this particular
   browser happened to create or open before, so the full list comes from Firebase itself
   rather than this browser's local index. Falls back to the local list when cloud sync
   isn't configured, or if the fetch fails for any reason. */
let _listErrorToasted = false;
function fetchAllTrips(cb){
  if(!fbRoot){ cb(DB.trips); return; }
  fbRoot.ref('trips').once('value')
    .then(snap => {
      const val = snap.val() || {};
      const merged = Object.values(val).map(r => {
        normalizeTrip(r);
        const local = getTrip(r.id);
        return local ? mergeRemote(local, r) : r;
      });
      cb(merged);
    })
    .catch(err => {
      console.error("My Trips, couldn't list trips from the cloud:", err);
      if(!_listErrorToasted && /permission[_-]?denied/i.test((err&&(err.code||err.message||err)||'').toString())){
        _listErrorToasted = true;
        noteModal("Can't See Everyone's Trips", 'The database rules only allow reading one trip at a time. Open the Firebase console, Realtime Database, Rules, and add a top-level read rule for trips alongside the existing one.');
      }
      cb(DB.trips);
    });
}

/* ---- backup / restore ----
   No longer surfaced anywhere: trips sync to the cloud, so the buttons were clutter. Kept
   reachable from the console (App.exportTrips() / App.importTrips(input)) as a manual escape
   hatch, since losing every trip with no way to pull a copy out would be a bad day. */
App.exportTrips = () => {
  const blob = new Blob([JSON.stringify({app:'cals-trippin', schema:SCHEMA, exportedAt:Date.now(), trips:DB.trips}, null, 0)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `cals-trippin-backup-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast(`Backed up ${DB.trips.length} trip${DB.trips.length===1?'':'s'}`);
};
App.importTrips = input => {
  const file = input.files[0]; input.value=''; if(!file) return;
  const fr = new FileReader();
  fr.onload = e => {
    let data;
    try{ data = JSON.parse(e.target.result); }catch(err){ noteModal('Bad Backup File', "That file isn't a valid backup."); return; }
    const trips = Array.isArray(data) ? data : (data && data.trips);
    if(!Array.isArray(trips) || !trips.length){ noteModal('Nothing To Restore', 'No trips were found in that file.'); return; }
    let added=0, updated=0;
    trips.forEach(t=>{
      if(!t || !t.id || !t.name) return;
      normalizeTrip(t);
      const i = DB.trips.findIndex(x=>x.id===t.id);
      if(i<0){ DB.trips.unshift(t); added++; }
      else { DB.trips[i] = t; updated++; }        // incoming copy wins on a straight restore
    });
    saveLocal();
    if(fbRoot) trips.forEach(t=>{ if(t && t.id) pushTrip(t); });   // seed the cloud too, if on
    renderHome();
    toast(`Restored ${added} new · ${updated} updated`);
  };
  fr.readAsText(file);
};

App.saveTrip = () => {
  const t = getTrip(CUR_TRIP_ID); if(!t) return;
  const name = $('#et-name').value.trim();
  if(!name) return markErr('#et-name','Give the trip a name');
  const w = readWhenFields('et');
  const wasRough = hasRoughWhen(t), oldStart = t.startDate;
  t.name = name; t.startDate = w.startDate; t.endDate = w.endDate;
  /* switching to exact dates has to clear the rough idea, or hasRoughWhen would keep
     answering yes and the trip would show both */
  if(w.when) t.when = w.when; else delete t.when;
  /* Pinning the dates down shouldn't throw away the plan. A day number becomes the date it
     lands on, and going the other way a date becomes the day of the trip it fell on, so
     "Day 3: beach" survives the trip becoming real and vice versa. */
  if(wasRough && !w.when && t.startDate){
    (t.itinerary||[]).forEach(s=>{ if(s.day){ s.date = isoAddDays(t.startDate, s.day-1); s.day = 0; } });
  } else if(!wasRough && w.when && oldStart){
    (t.itinerary||[]).forEach(s=>{
      if(!s.date) return;
      const n = Math.round((new Date(s.date+'T00:00:00') - new Date(oldStart+'T00:00:00'))/DAY_MS) + 1;
      if(n > 0){ s.day = n; s.date = ''; }
    });
  }
  logEdit('Trip info','updated the trip details');
  save(); closeModal(); rerender();
};

  /* with the menu open the bar rides above it, so the same thumb that opened it can close
     it; anything else you tap from there dismisses the menu on the way through */
  const menuOpen = menuIsOpen();
  bar.classList.toggle('over-menu', menuOpen);
  bar.classList.toggle('over-wheel', wheelIsOpen());
  const go = fn => menuOpen ? 'App.closeMenu();'+fn : fn;
  const item = (label, emoji, fn, active, off) => `
    <button class="tabbar-item${active?' active':''}" ${off?'disabled aria-disabled="true"':''}
            ${off?'':`onclick="${fn}"`} aria-label="${esc(label)}">
      <span class="tabbar-emoji" aria-hidden="true">${emoji}</span>
      <span class="tabbar-label">${esc(label)}</span>
    </button>`;
  bar.innerHTML =
      item('Places','🌎',go("App.goPlaces()"), onPlaces && !menuOpen, false)
    + item('Games','🎮',go("App.goGames()"), onGames && !menuOpen, false)
    + `<button class="tabbar-new${wheelIsOpen()?' open':''}" onclick="${go('App.toggleAddWheel()')}"
        aria-label="${wheelIsOpen()?'Close':'Add something'}" aria-expanded="${wheelIsOpen()}"></button>`
    + item('Itinerary','🗺️',go("App.tab('plan')"), !!t && CUR_TAB==='plan' && !menuOpen, !t)
    + (menuOpen
        ? item('Close','✕',"App.closeMenu()", true, false)
        : item('Menu','☰',"App.openMenu()", false, !t));
  /* anything that has to sit on top of the bar (the Places search, the hub's height) needs
     its real height, inset and all, not a number that was right on one phone */
  document.documentElement.style.setProperty('--bar-h', bar.offsetHeight+'px');

/* ---------- add wheel ----------
   The handful of things you add over and over, on one arc off the +, rather than having to
   know which section each of them lives in first. Everything else is still added from its
   own section, which is where you'd be anyway if you were adding one of the rarer things.
   Documents takes you to its section rather than opening a form, because a file picker has
   to be clicked by the person, not by us. */
function addWheelItems(t, ro){
  if(!t || ro) return [];   // nothing to add on the trips list or an archived trip
  return [
    ['💡','Idea',     "App.moodForm()"],
    ['📍','Stop',     "App.planForm(-1)"],
    ['💰','Receipt',  "App.receiptForm(-1)"],
    ['🚌','Travel',   "App.travelLegForm(-1)"],
    ['📎','Document', "App.tab('docs')"]
  ];
}
/* mid-retraction counts as closed, so the + un-rotates straight away and tapping it again
   re-opens rather than waiting for the animation to finish */
function wheelIsOpen(){
  const r = $('#wheel-root');
  return !!r.firstChild && !r.classList.contains('closing');
}
let WHEEL_CLEANUP = null;
function closeAddWheel(){
  const root = $('#wheel-root');
  if(!root.firstChild || root.classList.contains('closing')) return;
  /* the buttons retract into the + rather than vanishing, so the markup has to outlive the
     click by as long as that takes. Last one out goes first, mirroring the order they
     appeared in, so the wheel folds back the way it unfolded. */
  const items = [...root.querySelectorAll('.wheel-item')];
  items.forEach((el,i)=>{ el.style.animationDelay = ((items.length-1-i)*14)+'ms'; });
  root.classList.add('closing');
  renderTabbar();
  clearTimeout(WHEEL_CLEANUP);
  WHEEL_CLEANUP = setTimeout(()=>{
    const r = $('#wheel-root');
    if(r.classList.contains('closing')){ r.classList.remove('closing'); r.innerHTML = ''; }
  }, 320);
}
App.closeAddWheel = closeAddWheel;
App.toggleAddWheel = () => {
  if(wheelIsOpen()) return closeAddWheel();
  const t = getTrip(CUR_TRIP_ID);
  const items = addWheelItems(t, t && readOnly(t));
  /* nothing to add here means the + keeps its old job: outside a trip it just starts one */
  if(!items.length) return App.newTrip();
  const btn = $('.tabbar-new'); if(!btn) return;
  const b = btn.getBoundingClientRect();
  const cx = b.left + b.width/2, cy = b.top + b.height/2;
  /* the arc has to fit the screen it's drawn on, so the radius comes from the viewport
     rather than being fixed: it never reaches closer than 30px to either edge */
  const r = Math.max(84, Math.min(112, cx - 30, window.innerWidth - cx - 30));
  /* stops well short of horizontal so the end buttons stay clear of the bar's own labels
     rather than sitting on top of "Trips" and "Menu". A lone item sits straight up. */
  const span = 140, from = 90 + span/2, to = 90 - span/2;
  const all = items.map(([emoji,label,fn], n) => {
    const frac = items.length===1 ? 0.5 : n/(items.length-1);
    const rad = (from + (to-from)*frac)*Math.PI/180;
    const x = cx + Math.cos(rad)*r, y = cy - Math.sin(rad)*r;
    /* how far back to the + this button sits: where it springs from, and folds back into */
    return {x, y, dx: Math.round(cx-x), dy: Math.round(cy-y), emoji, label, fn, delay: n*22};
  });
  clearTimeout(WHEEL_CLEANUP);
  const root = $('#wheel-root');
  root.classList.remove('closing');
  root.innerHTML =
    `<div class="wheel-scrim" onclick="App.closeAddWheel()"></div>`
    + `<div role="menu" aria-label="Add">`
    + all.map(w=>`<button class="wheel-item" role="menuitem"
        style="left:${Math.round(w.x)}px; top:${Math.round(w.y)}px; --dx:${w.dx}px; --dy:${w.dy}px; animation-delay:${w.delay}ms"
        aria-label="${esc(w.label)}" title="${esc(w.label)}"
        onclick="App.closeAddWheel();${w.fn}">${secEmoji(w.emoji)}</button>`).join('')
    + `</div>`;
  renderTabbar();
  const first = $('#wheel-root .wheel-item'); if(first) first.focus();
};
function menuIsOpen(){ return !!$('#menu-root').firstChild; }

/* ================= TAB: home (dashboard) ================= */
function tabHome(t, ro){
  const n = t.notes||{contacts:[],general:''};
  const nTravel = (t.flights||[]).length + (t.ferries||[]).length + (t.carHire||[]).length;
  const nDocs = (t.documents||[]).length, nLinks = (t.docLinks||[]).length,
        nRec = (t.receipts||[]).length, nStops = (t.itinerary||[]).filter(s=>s.kind!=='travel').length,
        nPins = (t.moodBoard||[]).length,
        nContacts = (n.contacts||[]).length;
  const albumUrl = t.photoAlbum && t.photoAlbum.url || '';
  const album = albumUrl ? detectAlbumService(albumUrl) : '';
  const docParts = [];
  if(nLinks) docParts.push(nLinks+(nLinks===1?' Link':' Links'));
  if(nDocs) docParts.push(nDocs+(nDocs===1?' File':' Files'));
  const travParts = [];
  if((t.flights||[]).length) travParts.push((t.flights.length)+(t.flights.length===1?' Flight':' Flights'));
  if((t.ferries||[]).length) travParts.push((t.ferries.length)+(t.ferries.length===1?' Ferry':' Ferries'));
  if((t.carHire||[]).length) travParts.push('Car Hire');
  // each row doubles as a counter: what's booked, added, pinned and owed
  const me = whoAmI(t.id);
  const net = nRec ? computeBalances(t) : null;
  const myNet = net && me && net[me]!==undefined ? net[me] : null;
  const moneySum = !nRec ? 'No receipts yet' :
    myNet===null ? 'Receipts added' :
    myNet>0.005 ? `You're owed ${money(myNet)}` :
    myNet<-0.005 ? `You owe ${money(-myNet)}` :
    'All settled';
  const accoms = t.accommodations||[];
  const staySum = !accoms.length ? 'Not Added Yet' :
    accoms.length===1 ? (accoms[0].name||'1 Stay Added') :
    accoms.length+' Stays Added';
  const nNotes = (n.items||[]).length;
  /* travel legs live in the same itinerary array as the stops but aren't activities, so they
     don't inflate the count; a plan that's only travel still isn't "nothing planned" though */
  const nLegs = (t.itinerary||[]).length - nStops;
  const planSum = nStops ? nStops+(nStops===1?' Activity Planned':' Activities Planned')
    : nLegs ? nLegs+(nLegs===1?' Travel Leg Planned':' Travel Legs Planned')
    : 'Nothing Planned Yet';
  const tiles = [
    ['plan','Itinerary', planSum, !(nStops || nLegs)],
    ['mood','Ideas', nPins ? nPins+' Pinned' : 'Nothing Pinned Yet', !nPins],
    ['travel','Travel', travParts.join(', ') || 'Nothing Booked Yet', !travParts.length],
    ['stay','Accommodation', staySum, !accoms.length],
    ['pack','Packing', packSummaryLine(t), !(t.packing||[]).length || !!packStats(t).myLeft],
    ['polls','Polls', pollSummaryLine(t), !(t.polls||[]).length],
    ['money','Money', moneySum, !nRec],
    ['photos','Photos', album ? album+' Linked' : 'No Shared Album Yet', !album],
    ['contacts','Contacts', nContacts ? nContacts+(nContacts===1?' Contact Logged':' Contacts Logged') : 'None Added Yet', !nContacts],
    ['docs','Documents & Links', docParts.join(', ') || 'Nothing Saved Yet', !docParts.length],
    ['notes','Notes', nNotes ? nNotes+(nNotes===1?' Note':' Notes') : 'No Notes Yet', !nNotes]
  ];
  // every tile, including Photos, opens its own tab first; the tab itself links out to the album
  const tile = ([k,label,sum,empty]) => `
    <div class="dash-tile" role="button" tabindex="0" aria-label="${esc(label)}"
         onclick="App.tab('${k}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();App.tab('${k}')}">
      <span class="dash-icon">${tileIcon(k)}</span>
      <span class="dash-text"><span class="dash-label">${esc(label)}</span><span class="dash-sum${empty?' unfilled':''}">${esc(sum)}</span></span>
    </div>`;
  // last tile in the grid rather than a separate full-width button: trip settings are the
  // least-used thing here, so the sections you actually open lead. Its summary lists who's
  // coming, since people are managed from this same Edit Trip screen (the countdown lives in
  // the header now, so repeating it here would just say the same thing twice)
  const goingSum = peopleSummary(t, 'No One Added Yet');
  const editTile = !ro ? `
    <div class="dash-tile" role="button" tabindex="0" aria-label="Edit Trip"
         onclick="App.tripForm()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();App.tripForm()}">
      <span class="dash-icon">${tileIcon('edit')}</span>
      <span class="dash-text"><span class="dash-label">Edit Trip</span><span class="dash-sum${(t.participants||[]).length?'':' unfilled'}">${esc(goingSum)}</span></span>
    </div>` : '';
  return `<div class="dash-grid">${tiles.map(tile).join('')}${editTile}</div>`;
}
/* ================= TAB: log (who changed what) ================= */
/* which tab a log entry's section belongs to, so each row can jump straight there,

/* ================= TAB: packing (shared checklist + calendar reminder) ================= */
/* Items are shared like everything else, but the tick is per person: two people packing
   the same trip need their own boxes, and "who's still got things to pack" only means
   anything if each person's list is tracked separately. An item with a name against it
   belongs to that person alone; an item with no name is everyone's. */
const PACK_STARTERS = [
  'Passport','Travel insurance','Phone charger','Adapter plug','Toothbrush','Sun cream',
  'Medication','Cards and cash','Headphones','Reusable water bottle'
];
function packMine(t, it){
  const me = whoAmI(t.id);
  return !it.who || (me && it.who===me);
}
function packDoneBy(it, who){ return !!((it.done||{})[who]); }
/* an item counts as packed when everyone it applies to has ticked it */
function packOwners(t, it){
  return it.who ? [it.who] : (t.participants||[]).slice();
}
function packIsDone(t, it){
  const owners = packOwners(t, it);
  if(!owners.length) return packDoneBy(it, '_');
  return owners.every(o=>packDoneBy(it, o));
}
function packStats(t){
  const items = t.packing||[];
  const me = whoAmI(t.id);
  const mine = items.filter(it=>packMine(t,it));
  const myLeft = me ? mine.filter(it=>!packDoneBy(it, me)).length : mine.filter(it=>!packIsDone(t,it)).length;
  return {
    total: items.length,
    done: items.filter(it=>packIsDone(t,it)).length,
    mine: mine.length,
    myLeft
  };
}
function packSummaryLine(t){
  const s = packStats(t);
  if(!s.total) return 'Nothing Listed Yet';
  if(!s.myLeft) return `All Packed (${s.done} of ${s.total})`;
  return `${s.myLeft} Still To Pack`;
}
/* how many days until the trip starts, or null once it's begun, used for the nudge */
function packDaysToGo(t){
  if(!t.startDate) return null;
  const day = 86400000, today = new Date(); today.setHours(0,0,0,0);
  const s = new Date(t.startDate+'T00:00:00');
  const n = Math.round((s-today)/day);
  return n >= 0 ? n : null;
}
function packNudgeHTML(t){
  const s = packStats(t);
  const n = packDaysToGo(t);
  if(n===null || !s.myLeft) return '';
  if(n > 14) return '';   // no point nagging months out
  const when = n===0 ? 'You leave today' : n===1 ? 'You leave tomorrow' : `${n} days to go`;
  return `<div class="pack-nudge">${ICONS.bell}<span><strong>${esc(when)}</strong> and you've still got ${s.myLeft} thing${s.myLeft===1?'':'s'} to pack.</span></div>`;
}
function packRowHTML(t, it, i, ro){
  const me = whoAmI(t.id);
  const tickAs = me || '_';
  const ticked = packDoneBy(it, tickAs);
  const owners = packOwners(t, it);
  const others = owners.filter(o=>o!==me && packDoneBy(it,o));
  const canTick = !ro;
  return `
    <div class="pack-row${ticked?' done':''}">
      <span class="pack-check${ticked?' on':''}" ${canTick?`role="checkbox" aria-checked="${ticked}" tabindex="0"
        onclick="App.togglePack('${it.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();App.togglePack('${it.id}')}"`:''}
        aria-label="${esc(it.text)}">${ticked?fa('check'):''}</span>
      <span class="pack-text">
        <span class="pack-label">${esc(it.text)}</span>
        ${it.who?`<span class="pack-who">${esc(it.who)}</span>`:''}
        ${others.length?`<span class="pack-who done">${esc(others.join(', '))} packed</span>`:''}
      </span>
      ${!ro?`<button class="iconbtn del" title="Remove" aria-label="Remove ${esc(it.text)}" onclick="App.delPack('${it.id}')">${ICONS.trash}</button>`:''}
    </div>`;
}
function tabPack(t, ro){
  const items = t.packing||[];
  const s = packStats(t);
  const addRow = ro ? '' : `
    <div class="pack-add">
      <input type="text" id="pk-new" placeholder="Add an item…" onkeydown="if(event.key==='Enter'){event.preventDefault();App.addPack()}">
      <select id="pk-who" aria-label="Who is this for">

  }

App.addPack = () => {

App.addPackStarters = () => {

  const have = new Set(t.packing.map(it=>it.text.toLowerCase()));

App.togglePack = itemId => {

  const it = (t.packing||[]).find(x=>x.id===itemId); if(!it) return;
  const who = whoAmI(t.id) || '_';

App.delPack = itemId => {
  const t = getTrip(CUR_TRIP_ID); if(!t) return;

  const i = (t.packing||[]).findIndex(x=>x.id===itemId); if(i<0) return;

function packUnpackedFor(t){
  const me = whoAmI(t.id) || '_';

/* A calendar event imports cleanly everywhere (iOS, Android, desktop) and actually fires an
   alert, which is what "remind me" needs to mean for a static site with no server to push
   from. VTODO would map more neatly onto a reminders app but is widely ignored on import. */
function icsEscape(s){
  return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
}
function icsStamp(d){
  return d.getUTCFullYear()+String(d.getUTCMonth()+1).padStart(2,'0')+String(d.getUTCDate()).padStart(2,'0')
    +'T'+String(d.getUTCHours()).padStart(2,'0')+String(d.getUTCMinutes()).padStart(2,'0')+'00Z';
}
/* RFC 5545 wants content lines folded at 75 octets, with continuations starting with a
   space. A long packing list blows past that easily, and stricter importers reject the
   file outright rather than just wrapping it themselves. */
function icsFold(line){
  const bytes = new TextEncoder().encode(line);
  if(bytes.length <= 75) return line;
  const out = [];
  let cur = '', curLen = 0, limit = 75;
  for(const ch of line){                       // iterate by code point, never split one
    const n = new TextEncoder().encode(ch).length;
    if(curLen + n > limit){ out.push(cur); cur = ' '; curLen = 1; limit = 75; }
    cur += ch; curLen += n;
  }
  if(cur) out.push(cur);
  return out.join('\r\n');
}
App.packReminder = () => {
  const t = getTrip(CUR_TRIP_ID); if(!t) return;
  if(!t.startDate) return noteModal('No Start Date', "Add a start date to the trip first, so there's a day to remind you on.");
  const left = packUnpackedFor(t);
  // the evening before you travel, local time, which is when packing actually happens
  const start = new Date(t.startDate+'T00:00:00');
  start.setDate(start.getDate()-1);
  start.setHours(19,0,0,0);
  const end = new Date(start.getTime() + 30*60000);
  const body = left.length
    ? 'Still to pack:\n' + left.map(it=>'- '+it.text).join('\n')
    : 'Everything on the list is already ticked off. Nice.';
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//My Trips//Packing//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'BEGIN:VEVENT',
    'UID:pack-'+t.id+'-'+Date.now()+'@cals-trippin',
    'DTSTAMP:'+icsStamp(new Date()),
    'DTSTART:'+icsStamp(start),
    'DTEND:'+icsStamp(end),
    'SUMMARY:'+icsEscape('Pack for '+t.name),
    'DESCRIPTION:'+icsEscape(body),
    'BEGIN:VALARM','TRIGGER:PT0S','ACTION:DISPLAY','DESCRIPTION:'+icsEscape('Pack for '+t.name),'END:VALARM',
    'END:VEVENT','END:VCALENDAR'
  ].map(icsFold).join('\r\n');
  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `pack-for-${(t.name||'trip').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}.ics`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast('Reminder saved, open it to add it to your calendar');
};

/* ================= TAB: polls (group decisions) ================= */
/* Votes are keyed by the name you picked for this trip, so switching your answer replaces
   your old one rather than stacking up, and everyone can see who wanted what. Anyone can
   close a poll (same trust model as the rest of the app: one shared link, one shared PIN). */
function pollVotes(p){ return (p && p.votes) || {}; }
function pollCount(p, optId){ return Object.values(pollVotes(p)).filter(v=>v===optId).length; }
function pollTotal(p){ return Object.keys(pollVotes(p)).length; }
function pollVotersFor(p, optId){
  return Object.keys(pollVotes(p)).filter(n=>pollVotes(p)[n]===optId);
}
/* the option(s) in front, so a decided poll reads at a glance; ties are kept as ties */
function pollLeaders(p){
  const counts = (p.options||[]).map(o=>pollCount(p,o.id));
  const top = Math.max(0, ...counts);
  return top===0 ? [] : (p.options||[]).filter((o,i)=>counts[i]===top).map(o=>o.id);
}
function pollSummaryLine(t){
  const polls = t.polls||[];
  if(!polls.length) return 'No Polls Yet';
  const me = whoAmI(t.id);
  const open = polls.filter(p=>!p.closed);
  const needsMe = me ? open.filter(p=>!pollVotes(p)[me]).length : 0;
  if(needsMe) return needsMe===1 ? '1 Poll Needs Your Vote' : needsMe+' Polls Need Your Vote';
  if(open.length) return open.length===1 ? '1 Open Poll' : open.length+' Open Polls';
  return polls.length===1 ? '1 Poll Closed' : 'All '+polls.length+' Polls Closed';
}
function pollCardHTML(t, p, i, ro){
  const me = whoAmI(t.id);
  const mine = me ? pollVotes(p)[me] : null;
  const total = pollTotal(p);
  const leaders = p.closed ? pollLeaders(p) : [];
  const rows = (p.options||[]).map(o=>{
    const n = pollCount(p, o.id);
    const pct = total ? Math.round(n/total*100) : 0;
    const voters = pollVotersFor(p, o.id);
    const picked = mine===o.id;
    const won = leaders.includes(o.id);
    const canVote = !ro && !p.closed && me;
    return `
      <div class="poll-opt${picked?' picked':''}${won?' won':''}" ${canVote?`role="button" tabindex="0"
           onclick="App.votePoll('${p.id}','${o.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();App.votePoll('${p.id}','${o.id}')}"`:''}>
        <div class="poll-bar" style="width:${pct}%"></div>
        <div class="poll-opt-row">
          <span class="poll-opt-text">${picked?fa('circle-check'):(won?fa('trophy'):'')}${esc(o.text)}</span>
          <span class="poll-opt-n">${n}${total?` · ${pct}%`:''}</span>
        </div>
        ${voters.length?`<div class="poll-voters">${esc(voters.join(', '))}</div>`:''}
      </div>`;
  }).join('');
  const yetToVote = (t.participants||[]).filter(n=>!pollVotes(p)[n]);
  return `
    <div class="card poll-card">
      <div class="section-head" style="margin-bottom:10px">
        <h3>${esc(p.q)}</h3>
        ${!ro?`<div style="display:flex;gap:2px;flex-shrink:0">
          <button class="iconbtn" title="${p.closed?'Reopen poll':'Close poll'}" aria-label="${p.closed?'Reopen poll':'Close poll'}" onclick="App.togglePoll('${p.id}')">${p.closed?fa('lock-open'):fa('lock')}</button>
          <button class="iconbtn del" title="Remove" aria-label="Remove poll" onclick="App.delPoll('${p.id}')">${ICONS.trash}</button>
        </div>`:''}
      </div>
      ${p.closed?`<p class="small muted" style="margin:-4px 0 10px;display:flex;align-items:center;gap:6px">${fa('lock')}Closed${leaders.length?' · '+esc((p.options||[]).filter(o=>leaders.includes(o.id)).map(o=>o.text).join(' / ')):''}</p>`:''}
      ${rows}
      <p class="small muted" style="margin-top:10px">
        ${total?`${total} ${total===1?'vote':'votes'}`:'No votes yet'}${!me?' · pick your name on the Overview to vote':''}${(!p.closed && me && yetToVote.length)?` · waiting on ${esc(yetToVote.join(', '))}`:''}
      </p>
    </div>`;
}
function tabPolls(t, ro){
  const polls = t.polls||[];
  if(!polls.length){
    return `<div class="empty">No polls yet.${!ro?'<br><br><button class="btn primary" onclick="App.pollForm()">+ New Poll</button>':''}</div>`;
  }
  const open = polls.filter(p=>!p.closed), closed = polls.filter(p=>p.closed);
  return [...open, ...closed].map((p,i)=>pollCardHTML(t, p, i, ro)).join('');
}

/* ================= weather (Open-Meteo: free, no API key, no sign-up) ================= */
/* Only the next couple of weeks have a real forecast, so days beyond that show nothing
   rather than an invented number. Coordinates are cached in localStorage (a place doesn't
   move); forecasts are fetched fresh each session so they don't go stale. Every failure
   path ends the same way: no weather shown, the itinerary itself is never affected. */
const WX_FORECAST_DAYS = 16;
const WX_GEO_KEY = 'calstrippin_wx_geo';
const WX_STATE = {};   // place -> {status:'loading'|'ok'|'fail', days:{'YYYY-MM-DD':{...}}, label}
/* WMO weather codes, grouped down to the handful of conditions worth showing on a trip plan.
   Emoji rather than icon-font glyphs: the weather is the one thing on the page that is
   genuinely worth a splash of colour, and it keeps rendering even if the icon font doesn't. */
const WX_CODES = {
  0:['Clear','☀️'], 1:['Mainly clear','🌤️'], 2:['Partly cloudy','⛅'], 3:['Overcast','☁️'],
  45:['Fog','🌫️'], 48:['Fog','🌫️'],
  51:['Light drizzle','🌦️'], 53:['Drizzle','🌦️'], 55:['Heavy drizzle','🌦️'],
  56:['Freezing drizzle','🌧️'], 57:['Freezing drizzle','🌧️'],
  61:['Light rain','🌦️'], 63:['Rain','🌧️'], 65:['Heavy rain','🌧️'],
  66:['Freezing rain','🌧️'], 67:['Freezing rain','🌧️'],
  71:['Light snow','🌨️'], 73:['Snow','🌨️'], 75:['Heavy snow','❄️'], 77:['Snow','🌨️'],
  80:['Showers','🌦️'], 81:['Showers','🌧️'], 82:['Heavy showers','🌧️'],
  85:['Snow showers','🌨️'], 86:['Snow showers','🌨️'],
  95:['Thunderstorm','⛈️'], 96:['Thunderstorm','⛈️'], 99:['Thunderstorm','⛈️']
};
function wxGeoGet(place){
  try{
    const v = JSON.parse(localStorage.getItem(WX_GEO_KEY)||'{}')[place.toLowerCase()];
    return v === undefined ? null : v;   // `false` is a remembered miss, not "not looked up"
  }catch(e){ return null; }
}
function wxGeoSet(place, val){
  try{
    const m = JSON.parse(localStorage.getItem(WX_GEO_KEY)||'{}');
    m[place.toLowerCase()] = val;
    localStorage.setItem(WX_GEO_KEY, JSON.stringify(m));
  }catch(e){}
}
function wxDayStr(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
/* --- working out where you are on any given day, with no input from anyone ---
   Walk the trip in date order keeping a "current place": a flight or ferry moves you to
   its destination, checking into a stay moves you to that stay's town, and every day in
   between inherits wherever you were last. A multi-country trip therefore switches its
   forecast on the day you actually travel. Each day ends up with a list of candidates,
   best guess first, tried in turn until one geocodes, so a hotel name that means nothing
   to a gazetteer falls through to the airport city and finally to the country. */
function wxAirportPlaces(code){
  const name = AIRPORTS[String(code||'').toUpperCase()];
  if(!name) return [];
  const first = name.split(' ')[0];
  // try the full airport name first ("Nice", "Gran Canaria"), then just the city it starts
  // with, which is what rescues "Rome Fiumicino" and "Amsterdam Schiphol"
  return first && first !== name ? [name, first] : [name];
}
function wxStayPlaces(a){
  const parts = String((a&&a.address)||'').split(',').map(s=>s.trim())
    .filter(s => s && /[a-z]{3}/i.test(s) && !/^\d/.test(s));   // drop house numbers and postcodes
  if(!parts.length) return [];
  // the town is usually the second-to-last comma part, with the country last
  return parts.length >= 2 ? [parts[parts.length-2], parts[parts.length-1]] : [parts[0]];
}
function wxDayPlaces(t, dayKeys){
  const fallback = (t.countries||[]).map(c=>(countryByCode(c)||{}).name).filter(Boolean);
  const events = [];
  // rank keeps a stay ahead of the flight that delivered you on the same date, since the
  // stay's address is the more precise of the two
  (t.flights||[]).forEach(f=>{ if(f.date && f.to) events.push({date:f.date, rank:0, cands:wxAirportPlaces(f.to)}); });
  (t.ferries||[]).forEach(f=>{ if(f.date && f.to) events.push({date:f.date, rank:0, cands:[f.to]}); });
  (t.accommodations||[]).forEach(a=>{ if(a.checkin) events.push({date:a.checkin, rank:1, cands:wxStayPlaces(a)}); });
  events.sort((a,b)=> a.date.localeCompare(b.date) || a.rank-b.rank);

  const keys = dayKeys.filter(Boolean).slice().sort();
  const map = {};
  let cur = fallback, ei = 0;
  keys.forEach(k=>{
    while(ei < events.length && events[ei].date <= k){
      if(events[ei].cands.length) cur = [...new Set(events[ei].cands.concat(fallback))];
      ei++;
    }
    map[k] = cur;
  });
  return map;
}
let WX_DAY_PLACES = {};   // 'YYYY-MM-DD' -> candidate place list, rebuilt on each itinerary render
const WX_LIST_GEO = {};   // candidate-list key -> resolved {lat,lon,label}, or false once all missed
/* try each candidate in turn; a miss is remembered so a vague name isn't re-queried forever */
function wxResolve(cands, cb){
  let i = 0;
  const tryNext = () => {
    if(i >= cands.length) return cb(null);
    const place = cands[i++];
    const cached = wxGeoGet(place);
    if(cached === false) return tryNext();
    if(cached && typeof cached.lat === 'number') return cb(cached);
    fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name='+encodeURIComponent(place))
      .then(r=>r.json())
      .then(j=>{
        const r0 = j && j.results && j.results[0];
        if(!r0 || typeof r0.latitude !== 'number'){ wxGeoSet(place, false); return tryNext(); }
        // "Greece, Greece" reads badly, so only add the country when it differs from the name
        const label = (r0.country && r0.country !== r0.name) ? r0.name+', '+r0.country : r0.name;
        const geo = {lat:r0.latitude, lon:r0.longitude, label};
        wxGeoSet(place, geo);
        cb(geo);
      })
      .catch(tryNext);
  };
  tryNext();
}
/* forecasts are keyed by coordinate, so two towns that resolve to the same spot, or a day
   list that repeats a place, only ever cost one request */
function wxForecast(geo, done){
  const key = geo.lat.toFixed(2)+','+geo.lon.toFixed(2);
  const cur = WX_STATE[key];
  if(cur){
    if(cur.status === 'loading') cur.waiting.push(done); else done();
    return;
  }
  const st = WX_STATE[key] = {status:'loading', days:{}, label:geo.label||'', waiting:[]};
  const finish = () => { const w = st.waiting; st.waiting = []; done(); w.forEach(fn=>fn()); };
  const today = new Date();
  const end = new Date(today.getTime() + (WX_FORECAST_DAYS-1)*86400000);
  fetch('https://api.open-meteo.com/v1/forecast?latitude='+encodeURIComponent(geo.lat)
    + '&longitude='+encodeURIComponent(geo.lon)
    + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max'
    + '&timezone=auto&start_date='+wxDayStr(today)+'&end_date='+wxDayStr(end))
    .then(r=>r.json())
    .then(j=>{
      const d = j && j.daily;
      if(!d || !Array.isArray(d.time)) throw 0;
      d.time.forEach((day,i)=>{
        st.days[day] = {
          code: (d.weather_code||[])[i],
          max:  (d.temperature_2m_max||[])[i],
          min:  (d.temperature_2m_min||[])[i],
          pop:  (d.precipitation_probability_max||[])[i]
        };
      });
      st.status = 'ok';
      finish();
    })
    .catch(()=>{ st.status = 'fail'; finish(); });
}
/* the small chip beside a day heading, empty whenever there's nothing honest to say */
function wxDayHTML(dateKey){
  const cands = WX_DAY_PLACES[dateKey];
  if(!cands || !cands.length) return '';
  const geo = WX_LIST_GEO[cands.join('|')];
  if(!geo) return '';
  const st = WX_STATE[geo.lat.toFixed(2)+','+geo.lon.toFixed(2)];
  if(!st || st.status !== 'ok') return '';
  const d = st.days[dateKey];
  if(!d || typeof d.max !== 'number') return '';
  const [label, emoji] = WX_CODES[d.code] || ['', '☁️'];
  const rain = (typeof d.pop === 'number' && d.pop >= 20) ? ` · ${Math.round(d.pop)}%` : '';
  const where = geo.label ? ' in '+geo.label : '';
  return `<span class="wx-chip" title="${esc(label+where)}"><span class="wx-emoji" aria-hidden="true">${emoji}</span>${Math.round(d.max)}°/${Math.round(d.min)}°${rain}</span>`;
}
function paintWeather(){
  document.querySelectorAll('#tab-body [data-wx-date]').forEach(el=>{
    el.innerHTML = wxDayHTML(el.dataset.wxDate);
  });
}
function initWeather(t){
  const keys = [...document.querySelectorAll('#tab-body [data-wx-date]')].map(el=>el.dataset.wxDate);
  WX_DAY_PLACES = wxDayPlaces(t, keys);
  const repaint = () => { if(CUR_TAB==='plan' && CUR_TRIP_ID===t.id) paintWeather(); };
  [...new Set(Object.values(WX_DAY_PLACES).map(c=>c.join('|')))].forEach(listKey=>{
    if(!listKey) return;
    const known = WX_LIST_GEO[listKey];
    if(known){ wxForecast(known, repaint); return; }
    if(known === false) return;                       // every candidate already missed
    wxResolve(listKey.split('|'), geo=>{
      WX_LIST_GEO[listKey] = geo || false;
      if(geo) wxForecast(geo, repaint);
    });
  });
}

/* ================= TAB: itinerary (day-by-day plan with maps) ================= */
function mapQuery(t, name){
  const extra = t.destination || ((t.countries||[]).length ? (countryByCode(t.countries[0])||{}).name : '') || '';
  return encodeURIComponent(name + (extra ? ', '+extra : ''));
}
function mapsSearchUrl(t, name){ return 'https://www.google.com/maps/search/?api=1&query='+mapQuery(t, name); }
const PLAN_PERIODS = {morning:['Morning','06:00'], afternoon:['Afternoon','13:00'], evening:['Evening','19:00']};
const TRAVEL_MODES = {
  undecided: {label:'Not Decided', icon:ICONS.question, emoji:'❓'},
  drive: {label:'Drive', icon:ICONS.car, emoji:'🚗'},
  walk: {label:'Walk', icon:ICONS.walk, emoji:'🚶'},
  ferry: {label:'Ferry', icon:ICONS.ferry, emoji:'⛴️'},
  flight: {label:'Flight', icon:ICONS.flight, emoji:'✈️'},
  train: {label:'Train', icon:ICONS.train, emoji:'🚂'},
  bus: {label:'Bus', icon:ICONS.bus, emoji:'🚌'}
};
function itineraryTimeKey(s){ return s.time || (s.period && PLAN_PERIODS[s.period] && PLAN_PERIODS[s.period][1]) || '99:99'; }
function travelDurationLabel(s){
  const h = s.durationH||0, m = s.durationM||0;
  if(!h && !m) return '';
  return [h?h+'h':'', m?m+'m':''].filter(Boolean).join(' ');
}
function itineraryItemLabel(s){
  if(s.kind==='travel') return (s.from||s.to) ? `${s.from||'?'} → ${s.to||'?'}` : 'a travel leg';
  return s.name || 'a stop';
}
/* auto flight/ferry/car/check-in/check-out cards are sorted by time, except flight vs
   check-in/check-out: a check-in's recorded time is usually just the property's standard
   check-in time, not your actual arrival, so it can't be trusted to order correctly against
   a same-day flight, force checkout, then flight, then check-in regardless of what the
   individual times say, unless an explicit arrival time has been set for that stay, in
   which case it's real and sorts normally like everything else */
function planCompare(a, b){
  const isAuto = x => !!(x._autoFlight || x._autoFerry || x._autoCar || x._autoStay);
  if(isAuto(a) && isAuto(b)){
    const untrustedCheckin = x => x._autoStay==='checkin' && !(x.ac && x.ac.arrivalTime);
    const rank = x => x._autoStay==='checkout' ? 0 : x._autoFlight ? 1 : untrustedCheckin(x) ? 2 : null;
    const ra = rank(a), rb = rank(b);
    if(ra!=null && rb!=null && ra!==rb) return ra-rb;
  }
  return itineraryTimeKey(a).localeCompare(itineraryTimeKey(b));
}
/* how early to be at the airport. Two hours is the usual short-haul advice and, more to the
   point, "leave at 16:05 for a 16:05 flight" was nonsense: the suggestion is about when you
   need to BE there, not when the plane goes. Clamped to 00:00 rather than rolling back a day,
   so the card stays on the flight's own date where you'd look for it. */
const AIRPORT_LEAD_MINS = 120;

  const m = /^(\d{1,2}):(\d{2})$/.exec(depTime||''); if(!m) return '';
  let total = (+m[1])*60 + (+m[2]) - AIRPORT_LEAD_MINS;

     actually hold (it offers 00/15/30/45) and the card doesn't shift by five minutes the
     moment you open it. Down rather than nearest: earlier is the safe direction here. */

   by booking the same place twice back-to-back isn't a journey anywhere. */
function stayMoves(t){
  const stays = (t.accommodations||[]);
  const out = [];
  stays.forEach((leaving, li)=>{
    if(!leaving.checkout) return;
    const arriving = stays.findIndex((a,ai)=>ai!==li && a.checkin===leaving.checkout);
    if(arriving < 0) return;
    const to = stays[arriving];
    const fromName = leaving.name||'', toName = to.name||'';
    if(!fromName && !toName) return;                       // nothing to name the journey by
    if(fromName && fromName === toName) return;            // same place under two bookings
    if((t.itinerary||[]).some(s=>s._autoForStay===arriving)) return;  // you've already saved it
    /* the check-out time is the hard deadline (you have to be out), so that's what the
       journey is pinned to. With no check-out time, fall back to being there for check-in. */
    const time = leaving.checkoutTime || to.checkinTime || '';
    out.push({date: leaving.checkout, from: fromName, to: toName, aci: arriving,

/* best-effort town/city out of a full address, drop a trailing postcode-looking segment,
   then take the last comma-separated part, e.g. "1 Rua X, Lisbon, 1000-001" -> "Lisbon" */
function guessCityFromAddress(address){
  if(!address) return '';
  const parts = address.split(',').map(s=>s.trim()).filter(Boolean);
  if(!parts.length) return '';
  const looksLikePostcode = /\d/.test(parts[parts.length-1]) && parts[parts.length-1].length<=10;
  if(looksLikePostcode && parts.length>1) parts.pop();
  // "Saranda, Albania" shouldn't guess the country as the city, drop it and use the town
  if(parts.length>1 && countryByName(parts[parts.length-1])) parts.pop();
  return parts[parts.length-1] || '';
}
function detectBookingService(url){
  if(!url) return '';
  if(/airbnb\./i.test(url)) return 'Airbnb';
  if(/booking\.com/i.test(url)) return 'Booking.com';
  if(/vrbo\.com/i.test(url)) return 'Vrbo';
  if(/expedia\./i.test(url)) return 'Expedia';
  if(/hotels\.com/i.test(url)) return 'Hotels.com';
  return '';
}
function autoAccomName(url, address){
  const service = detectBookingService(url);
  const city = guessCityFromAddress(address);
  if(service && city) return service+' in '+city;
  if(service) return service;
  if(city) return 'Stay in '+city;
  return '';
}

const DAY_MS = 86400000;
const isoAddDays = (iso, n) => {
  const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
};
/* Nights on this trip with nowhere booked to sleep.
   A stay from check-in D1 to check-out D2 covers the NIGHTS of D1 up to D2-1: you check out
   on the morning of D2, so that date doesn't need a bed from this booking. By the same logic
   the trip needs beds for its start date through to the night before its end date, since the
   end date is the day you travel home. Returns one entry per unbroken run of missing nights. */
function stayGaps(t){
  if(!t.startDate || !t.endDate) return [];
  const covered = new Set();
  (t.accommodations||[]).forEach(a=>{
    if(!a.checkin) return;
    const last = a.checkout || a.checkin;   // no check-out set: assume the one night
    for(let d=a.checkin; d<last; d=isoAddDays(d,1)) covered.add(d);
    if(!a.checkout) covered.add(a.checkin);
  });
  const gaps = [];
  for(let d=t.startDate; d<t.endDate; d=isoAddDays(d,1)){
    if(covered.has(d)) continue;
    const prev = gaps[gaps.length-1];
    if(prev && prev.lastNight === isoAddDays(d,-1)) prev.lastNight = d;
    else gaps.push({firstNight:d, lastNight:d});
  }
  /* the form wants a check-out date, which is the morning after the last night without a bed */
  return gaps.map(g=>({...g, checkout: isoAddDays(g.lastNight,1),
    nights: Math.round((new Date(g.lastNight+'T00:00:00') - new Date(g.firstNight+'T00:00:00'))/DAY_MS) + 1}));
}
function stayGapCardHTML(g, ro){
  const n = g.nights;
  const when = n===1 ? fmtDate(g.firstNight) : fmtRange(g.firstNight, g.lastNight);
  return `
    <div class="card gap-card">
      <div class="section-head" style="margin-bottom:6px">
        <h3>${secEmoji('🛏️')}${n} Night${n===1?'':'s'} with No Accommodation</h3>
      </div>
      <p class="small muted" style="margin-bottom:${ro?'0':'12px'}">${esc(when)}</p>
      ${ro?'':`<button class="btn primary sm" onclick="App.accomGapForm('${g.firstNight}','${g.checkout}')">+ Add Accommodation</button>`}
    </div>`;
}
function tabStay(t, ro){
  const list = t.accommodations||[];
  const gaps = stayGaps(t);
  if(!list.length && !gaps.length){
    return `<div class="empty">No accommodation added yet.${!ro?'<br><br><button class="btn primary" onclick="App.accomForm(-1)">+ Add Accommodation</button>':''}</div>`;
  }
  /* booked stays and the holes between them, read in date order, so a missing night shows up
     exactly where it falls rather than in a list of warnings at the bottom */
  const rows = list.map((a,i)=>({date:a.checkin||'', html: accomCardHTML(a, {
      headerActions: !ro?`<button class="iconbtn edit" aria-label="Edit accommodation" title="Edit" onclick="App.accomForm(${i})">${ICONS.edit}</button><button class="iconbtn del" aria-label="Remove accommodation" title="Remove" onclick="App.delAccom(${i})">${ICONS.trash}</button>`:''
    })}))
    .concat(gaps.map(g=>({date:g.firstNight, html: stayGapCardHTML(g, ro)})));
  rows.sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
  return rows.map(r=>r.html).join('');
}

/* --- shared attachment handling for travel items (boarding passes / docs) --- */
let FORM_DOC = null;   // pending {name,kind,dataUrl,size} while a travel form is open
function docStatusHTML(){
  return FORM_DOC
    ? `<span class="doc-attach">${ICONS.docs}${esc(FORM_DOC.name)}</span> <button type="button" class="iconbtn del" aria-label="Remove file" title="Remove file" onclick="App.clearFormDoc()">${ICONS.trash}</button>`
    : `<span class="muted small">No file attached</span>`;
}
function paintDocStatus(){ const el = $('#doc-status'); if(el) el.innerHTML = docStatusHTML(); }
App.clearFormDoc = () => { FORM_DOC = null; paintDocStatus(); };
App.attachDoc = input => {
  const file = input.files[0]; input.value=''; if(!file) return;
  if(file.type==='application/pdf'){
    const fr = new FileReader();
    fr.onload = e => { FORM_DOC = {name:file.name, kind:'pdf', size:file.size, dataUrl: file.size<=5*1048576 ? e.target.result : null}; paintDocStatus(); if(file.size>5*1048576) noteModal('Kept On This Device', 'That PDF is over 5 MB, so only its details will sync. The file itself stays on this device.'); };
    fr.readAsDataURL(file);
  } else {
    downscaleToDataURL(file, 1800, 0.85, dataUrl => { FORM_DOC = {name:file.name, kind:'img', size:dataUrl?Math.round(dataUrl.length*.75):0, dataUrl}; paintDocStatus(); });
  }
};
function attachField(){
  return `<div class="field"><label class="label">Boarding pass / document</label>
    <div id="doc-status" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px">${docStatusHTML()}</div>
    <label class="btn sm" style="cursor:pointer">${ICONS.upload} ${FORM_DOC?'Replace file':'Attach file'}<input type="file" accept="application/pdf,image/*" style="display:none" onchange="App.attachDoc(this)"></label></div>`;
}
/* data: URLs can't reliably render PDFs in iframes (especially on mobile), serve a blob URL
   instead, with open-in-new-tab and download as fallbacks */
function dataUrlToBlobUrl(dataUrl){
  try{
    const comma = dataUrl.indexOf(',');
    const mime = (dataUrl.slice(0,comma).match(/data:(.*?)(;|$)/)||[])[1] || 'application/octet-stream';
    const bin = atob(dataUrl.slice(comma+1));
    const arr = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([arr],{type:mime}));
  }catch(e){ return null; }
}
/* PDFs don't render reliably inside an embedded iframe on mobile Safari (a long-standing
   WebKit limitation with blob/data URLs in a nested browsing context, it can just show
   blank), so instead of trying to preview it in place, hand it straight to the device's
   own PDF viewer via a full navigation, that works everywhere */
function docViewerHTML(d){
  if(d.kind!=='pdf'){
    return `<img src="${d.dataUrl}" alt="${esc(d.name)}" style="max-width:100%;border-radius:12px;border:1px solid var(--line)">`;
  }
  const url = dataUrlToBlobUrl(d.dataUrl) || d.dataUrl;
  return `
    <p class="muted small" style="margin-bottom:14px">PDFs open in your device's own viewer rather than in-page, so you get proper zoom, search and sharing.</p>
    <div class="btn-row">
      <a class="btn primary" style="flex:1.4;min-width:0" href="${url}" target="_blank" rel="noopener">${ICONS.ext}Open PDF</a>
      <a class="btn" style="flex:1;min-width:0" href="${url}" download="${esc(d.name)}">${ICONS.download}Download</a>
    </div>`;
}

App.upload = input => {

  const t = getTrip(CUR_TRIP_ID); if(!t) return;
  const isPdf = file.type==='application/pdf';
  if(isPdf){
    const fr = new FileReader();
    fr.onload = e => {
      if(file.size > 5*1048576){ noteModal('Kept On This Device', 'That PDF is over 5 MB, so only its details synced. The file itself stays on this device.'); }
      t.documents.push({id:uid(), name:file.name, kind:'pdf', size:file.size,
                        dataUrl: file.size<=5*1048576 ? e.target.result : null});
      logEdit('Documents','uploaded '+file.name); save(); rerender();
      toast('File uploaded. Tap the pencil to rename it.');
    };
    fr.readAsDataURL(file);
  } else {
    // image → downscale, keeping plenty of quality for a personal, small-group trip
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      const scale = Math.min(1, 2000/Math.max(img.width,img.height));
      c.width = img.width*scale; c.height = img.height*scale;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      const dataUrl = c.toDataURL('image/jpeg',.85);
      t.documents.push({id:uid(), name:file.name, kind:'img', size:Math.round(dataUrl.length*.75), dataUrl});
      logEdit('Documents','uploaded '+file.name); save(); rerender();
      toast('Image uploaded. Tap the pencil to rename it.');
    };
    img.src = URL.createObjectURL(file);
  }
  input.value='';
};
function downscaleToDataURL(file, max, quality, cb){
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    const scale = Math.min(1, max/Math.max(img.width,img.height));
    c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    cb(c.toDataURL('image/jpeg', quality));
    URL.revokeObjectURL(img.src);
  };
  img.onerror = () => cb(null);
  img.src = URL.createObjectURL(file);
}
/* ================= TAB: money ================= */
function receiptTotal(r){
  return r.evenSplit ? (+r.amount||0) : (r.items||[]).reduce((s,it)=>s+(+it.amount||0),0);
}
function computeBalances(t){
  const net = {}; (t.participants||[]).forEach(p=>net[p]=0);
  (t.receipts||[]).forEach(r=>{
    const total = receiptTotal(r);
    if(net[r.paidBy]!==undefined) net[r.paidBy] += total;
    if(r.evenSplit){
      const ppl = (r.sharedWith&&r.sharedWith.length)?r.sharedWith:t.participants;
      ppl.forEach(p=>{ if(net[p]!==undefined) net[p] -= total/ppl.length; });
    } else {
      (r.items||[]).forEach(it=>{
        const ppl = (it.people&&it.people.length)?it.people:t.participants;
        ppl.forEach(p=>{ if(net[p]!==undefined) net[p] -= (+it.amount||0)/ppl.length; });
      });
    }
  });
  return net;
}
function settlements(net){
  const debt = [], cred = [];
  Object.entries(net).forEach(([p,v])=>{
    if(v < -0.005) debt.push({p, v:-v}); else if(v > 0.005) cred.push({p, v});
  });
  debt.sort((a,b)=>b.v-a.v); cred.sort((a,b)=>b.v-a.v);
  const out = [];
  let i=0, j=0;
  while(i<debt.length && j<cred.length){
    const pay = Math.min(debt[i].v, cred[j].v);
    out.push({from:debt[i].p, to:cred[j].p, amt:pay});
    debt[i].v -= pay; cred[j].v -= pay;
    if(debt[i].v < 0.005) i++;
    if(cred[j].v < 0.005) j++;
  }
  return out;
}
function tabMoney(t, ro){

    const total = receiptTotal(r);
    const detail = r.evenSplit

      : (r.items||[]).map(it=>`<div class="settle-row"><span>${esc(it.desc)} <span class="muted small">(${esc((it.people||[]).join(', ')||'everyone')})</span></span><span class="amount mono">${money(+it.amount||0)}</span></div>`).join('');
    return `

      <div class="section-head" style="margin-bottom:6px;flex-wrap:nowrap;align-items:flex-start">

        <span class="amount mono" style="font-size:1.15rem">${money(total)}</span>
      </div>
      ${detail}
      ${!ro?`<div class="btn-row" style="justify-content:flex-end;margin-top:10px">
        <button class="iconbtn edit" aria-label="Edit receipt" title="Edit" onclick="App.receiptForm(${i})">${ICONS.edit}</button>
        <button class="iconbtn del" aria-label="Remove receipt" title="Remove" onclick="App.delReceipt(${i})">${ICONS.trash}</button></div>`:''}
    </div>`;
  }).join('');

  const net = computeBalances(t);
  const stl = settlements(net);
  const me = whoAmI(t.id);
  const myNet = (me && net[me]!==undefined) ? net[me] : null;
  const hasRec = (t.receipts||[]).length;
  return `
    ${myNet!==null && hasRec ? `
      <div class="you-balance ${myNet>0.005?'pos':myNet<-0.005?'neg':'zero'}">${myNet>0.005?`You're owed ${money(myNet)}`:myNet<-0.005?`You owe ${money(-myNet)}`:`You're all square 🤝`}</div>`:''}
    ${hasRec ? `
      <h2>Settle Up</h2>
      <p class="muted small" style="margin-bottom:8px">Debts are combined into the fewest possible payments, so one transfer can settle several people at once.</p>
      <div class="settle" style="margin-top:8px">
        ${stl.length ? stl.map(s=>`<div class="settle-row"><span><strong>${esc(s.from)}</strong> → <strong>${esc(s.to)}</strong></span><span class="amount mono">${money(s.amt)}</span></div>`).join('') : `<div class="muted" style="padding:8px 0">Everyone is settled up 🤝</div>`}
      </div>`:''}
    <div class="section-head" ${hasRec?'style="margin-top:30px"':''}><h2>Receipts</h2>${!ro?`<button class="btn sm primary" onclick="App.receiptForm(-1)">+ Add Receipt</button>`:''}</div>
    ${receipts || `<div class="empty">No Receipts Yet</div>`}
    ${hasRec ? `
      <h2 style="margin-top:30px">Balances</h2>
      <div class="settle">
        ${Object.entries(net).map(([p,v])=>`<div class="settle-row ${p===me?'me':''}"><span>${esc(p)}${p===me?' <span class="muted small">(you)</span>':''}</span><span class="amount mono">${v>0.005?'is owed '+money(v):v<-0.005?'owes '+money(-v):'all square'}</span></div>`).join('')}
      </div>`:''}`;

App.saveReceipt = () => {
  const t = getTrip(CUR_TRIP_ID);
  if(!t||!R){ noteModal('Not Saved', "This trip isn't loaded. Try refreshing the page."); return; }
  try{
    if(!R.title.trim()) return markErr('#rc-title','Give the receipt a name');
    if(R.evenSplit){
      if(!(+R.amount>0)) return markErr('#rc-amt','Enter the amount');
      if(!R.sharedWith.length){ noteModal('Who Shares It?', 'Pick who this receipt is split between.'); return; }
    } else {

      if(!R.items.length || !R.items.some(it=>+it.amount>0)){ noteModal('Nothing To Split', 'Add at least one item with an amount.'); return; }
    }
    const editing = R._edit>=0 && t.receipts[R._edit];
    const rec = {id: editing ? t.receipts[R._edit].id : uid(), title:R.title.trim(), date:R.date, paidBy:R.paidBy,
      evenSplit:R.evenSplit, amount:+R.amount||0, sharedWith:[...R.sharedWith],
      items:R.items.map(it=>({desc:it.desc.trim()||'Item', amount:+it.amount||0, people:[...(it.people||[])]}))};
    if(editing) t.receipts[R._edit] = rec; else t.receipts.push(rec);
    logEdit('Money',(editing?'edited receipt ':'added receipt ')+rec.title+' ('+money(receiptTotal(rec))+')');
    save(); R=null; closeModal(); rerender(); toast(editing?'Receipt updated':'Receipt added');
  }catch(e){
    console.error("My Trips, couldn't save receipt:", e);
    noteModal('Receipt Not Saved', (e&&e.message||e)+'. Try again, and let Chris know if it keeps happening.');
  }
};
