/* A calendar event imports cleanly everywhere (iOS, Android, desktop) and actually fires an
   alert, which is what "remind me" needs to mean for a static site with no server to push
   from. VTODO would map more neatly onto a reminders app but is widely ignored on import. */
function icsEscape(s){
  return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
}
function icsStamp(d){
  return d.getUTCFullYear()+String(d.getUTCMonth()+1).padStart(2,'0')+String(d.getUTCDate()).padStart(2,'0')
    +'T'+String(d.getUTCHours()).padStart(2,'0')+String(d.getUTCMinutes()).padStart(2,'0')+'00Z';
}
/* RFC 5545 wants content lines folded at 75 octets, with continuations starting with a
   space. A long packing list blows past that easily, and stricter importers reject the
   file outright rather than just wrapping it themselves. */
function icsFold(line){
  const bytes = new TextEncoder().encode(line);
  if(bytes.length <= 75) return line;
  const out = [];
  let cur = '', curLen = 0, limit = 75;
  for(const ch of line){                       // iterate by code point, never split one
    const n = new TextEncoder().encode(ch).length;
    if(curLen + n > limit){ out.push(cur); cur = ' '; curLen = 1; limit = 75; }
    cur += ch; curLen += n;
  }
  if(cur) out.push(cur);
  return out.join('\r\n');
}
App.packReminder = () => {
  const t = getTrip(CUR_TRIP_ID); if(!t) return;
  if(!t.startDate) return noteModal('No Start Date', "Add a start date to the trip first, so there's a day to remind you on.");
  const left = packUnpackedFor(t);
  // the evening before you travel, local time, which is when packing actually happens
  const start = new Date(t.startDate+'T00:00:00');
  start.setDate(start.getDate()-1);
  start.setHours(19,0,0,0);
  const end = new Date(start.getTime() + 30*60000);
  const body = left.length
    ? 'Still to pack:\n' + left.map(it=>'- '+it.text).join('\n')
    : 'Everything on the list is already ticked off. Nice.';
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//My Trips//Packing//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'BEGIN:VEVENT',
    'UID:pack-'+t.id+'-'+Date.now()+'@cals-trippin',
    'DTSTAMP:'+icsStamp(new Date()),
    'DTSTART:'+icsStamp(start),
    'DTEND:'+icsStamp(end),
    'SUMMARY:'+icsEscape('Pack for '+t.name),
    'DESCRIPTION:'+icsEscape(body),
    'BEGIN:VALARM','TRIGGER:PT0S','ACTION:DISPLAY','DESCRIPTION:'+icsEscape('Pack for '+t.name),'END:VALARM',
    'END:VEVENT','END:VCALENDAR'
  ].map(icsFold).join('\r\n');
  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `pack-for-${(t.name||'trip').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}.ics`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast('Reminder saved, open it to add it to your calendar');
};

/* ================= TAB: polls (single-tally voting) ================= */
/* Votes are keyed by an anonymous per-device id (deviceVoteId()), not a name - each device
   gets one vote per poll, results only ever show counts, never who picked what. Anyone can
   close a poll (same trust model as the rest of the app: one shared link, one shared PIN). */
function pollVotes(p){ return (p && p.votes) || {}; }
/* a vote is a single option id for a normal poll, or an array of them once "allow multiple
   answers" is on - every reader goes through this so neither shape needs special-casing
   anywhere else */
function voteHasOpt(v, optId){ return Array.isArray(v) ? v.includes(optId) : v===optId; }
function pollCount(p, optId){ return Object.values(pollVotes(p)).filter(v=>voteHasOpt(v,optId)).length; }
function pollTotal(p){ return Object.keys(pollVotes(p)).length; }
/* the option(s) in front, so a decided poll reads at a glance; ties are kept as ties */
function pollLeaders(p){
  const counts = (p.options||[]).map(o=>pollCount(p,o.id));
  const top = Math.max(0, ...counts);
  return top===0 ? [] : (p.options||[]).filter((o,i)=>counts[i]===top).map(o=>o.id);
}
function pollSummaryLine(t){
  const polls = t.polls||[];
  if(!polls.length) return 'No Polls Yet';
  const open = polls.filter(p=>!p.closed);
  const needsMe = open.filter(p=>!pollVotes(p)[deviceVoteId()]).length;
  if(needsMe) return needsMe===1 ? '1 Poll Needs Your Vote' : needsMe+' Polls Need Your Vote';
  if(open.length) return open.length===1 ? '1 Open Poll' : open.length+' Open Polls';
  return polls.length===1 ? '1 Poll Closed' : 'All '+polls.length+' Polls Closed';
}
function pollCardHTML(t, p, i, ro){
  const mine = pollVotes(p)[deviceVoteId()];
  const total = pollTotal(p);
  const leaders = p.closed ? pollLeaders(p) : [];
  const rows = (p.options||[]).map(o=>{
    const n = pollCount(p, o.id);
    const pct = total ? Math.round(n/total*100) : 0;
    const picked = voteHasOpt(mine, o.id);
    const won = leaders.includes(o.id);
    const canVote = !ro && !p.closed;
    return `
      <div class="poll-opt${picked?' picked':''}${won?' won':''}" ${canVote?`role="button" tabindex="0"
           onclick="App.votePoll('${p.id}','${o.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();App.votePoll('${p.id}','${o.id}')}"`:''}>
        <div class="poll-bar" style="width:${pct}%"></div>
        <div class="poll-opt-row">
          <span class="poll-opt-text">${picked?fa('circle-check'):(won?fa('trophy'):'')}${esc(o.text)}</span>
          <span class="poll-opt-n">${n}${total?` · ${pct}%`:''}</span>
        </div>
      </div>`;
  }).join('');
  return `
    <div class="card poll-card">
      <div class="section-head" style="margin-bottom:${p.multi&&!p.closed?'2px':'10px'}">
        <h3>${esc(p.q)}</h3>
        ${!ro?`<div style="display:flex;gap:2px;flex-shrink:0">
          <button class="iconbtn" title="${p.closed?'Reopen poll':'Close poll'}" aria-label="${p.closed?'Reopen poll':'Close poll'}" onclick="App.togglePoll('${p.id}')">${p.closed?fa('lock-open'):fa('lock')}</button>
          <button class="iconbtn del" title="Remove" aria-label="Remove poll" onclick="App.delPoll('${p.id}')">${ICONS.trash}</button>
        </div>`:''}
      </div>
      ${p.multi&&!p.closed?`<p class="small muted" style="margin:0 0 10px">Pick as many as you like</p>`:''}
      ${p.closed?`<p class="small muted" style="margin:-4px 0 10px;display:flex;align-items:center;gap:6px">${fa('lock')}Closed${leaders.length?' · '+esc((p.options||[]).filter(o=>leaders.includes(o.id)).map(o=>o.text).join(' / ')):''}</p>`:''}
      ${rows}
      ${!ro&&!p.closed?`
      <div class="pack-add" style="margin-top:10px;margin-bottom:0" onclick="event.stopPropagation()">
        <input type="text" id="po-add-${p.id}" placeholder="Add another option…" onkeydown="if(event.key==='Enter'){event.preventDefault();App.addPollOptionLive('${p.id}')}">
        <button class="btn" type="button" onclick="App.addPollOptionLive('${p.id}')">+ Add</button>
      </div>`:''}
      <p class="small muted" style="margin-top:10px">${total?`${total} ${total===1?'vote':'votes'}`:'No votes yet'}</p>
    </div>`;
}

App.addPollOptionLive = pollId => {

App.votePoll = (pollId, optId) => {
  const t = getTrip(CUR_TRIP_ID); if(!t) return;
  const p = (t.polls||[]).find(x=>x.id===pollId); if(!p || p.closed) return;
  const me = deviceVoteId();
  p.votes = p.votes||{};
  if(p.multi){
    // several picks per person, so the stored vote is an array once multi is on
    const cur = Array.isArray(p.votes[me]) ? p.votes[me].slice() : (p.votes[me]!=null ? [p.votes[me]] : []);
    const idx = cur.indexOf(optId);
    if(idx>=0) cur.splice(idx,1); else cur.push(optId);   // tapping a picked option again clears just that one
    if(cur.length) p.votes[me] = cur; else delete p.votes[me];
  } else {
    if(p.votes[me]===optId) delete p.votes[me];   // tapping your own choice again clears it
    else p.votes[me] = optId;
  }
  logEdit('Polls','voted in a poll');
  save(); rerender();
};

App.delPoll = pollId => {
  const t = getTrip(CUR_TRIP_ID); if(!t) return;
  const tripId = t.id;
  const i = (t.polls||[]).findIndex(x=>x.id===pollId); if(i<0) return;

    logEdit('Polls','restored a poll'); save(); rerender();
  });
};

/* ================= weather (Open-Meteo: free, no API key, no sign-up) ================= */
/* Only the next couple of weeks have a real forecast, so days beyond that show nothing
   rather than an invented number. Coordinates are cached in localStorage (a place doesn't
   move); forecasts are fetched fresh each session so they don't go stale. Every failure
   path ends the same way: no weather shown, the itinerary itself is never affected. */
const WX_FORECAST_DAYS = 16;
const WX_GEO_KEY = 'calstrippin_wx_geo';
const WX_STATE = {};   // place -> {status:'loading'|'ok'|'fail', days:{'YYYY-MM-DD':{...}}, label}
/* WMO weather codes, grouped down to the handful of conditions worth showing on a trip plan.
   Emoji rather than icon-font glyphs: the weather is the one thing on the page that is
   genuinely worth a splash of colour, and it keeps rendering even if the icon font doesn't. */
const WX_CODES = {
  0:['Clear','☀️'], 1:['Mainly clear','🌤️'], 2:['Partly cloudy','⛅'], 3:['Overcast','☁️'],
  45:['Fog','🌫️'], 48:['Fog','🌫️'],
  51:['Light drizzle','🌦️'], 53:['Drizzle','🌦️'], 55:['Heavy drizzle','🌦️'],
  56:['Freezing drizzle','🌧️'], 57:['Freezing drizzle','🌧️'],
  61:['Light rain','🌦️'], 63:['Rain','🌧️'], 65:['Heavy rain','🌧️'],
  66:['Freezing rain','🌧️'], 67:['Freezing rain','🌧️'],
  71:['Light snow','🌨️'], 73:['Snow','🌨️'], 75:['Heavy snow','❄️'], 77:['Snow','🌨️'],
  80:['Showers','🌦️'], 81:['Showers','🌧️'], 82:['Heavy showers','🌧️'],
  85:['Snow showers','🌨️'], 86:['Snow showers','🌨️'],
  95:['Thunderstorm','⛈️'], 96:['Thunderstorm','⛈️'], 99:['Thunderstorm','⛈️']
};
function wxGeoGet(place){
  try{
    const v = JSON.parse(localStorage.getItem(WX_GEO_KEY)||'{}')[place.toLowerCase()];
    return v === undefined ? null : v;   // `false` is a remembered miss, not "not looked up"
  }catch(e){ return null; }
}
function wxGeoSet(place, val){
  try{
    const m = JSON.parse(localStorage.getItem(WX_GEO_KEY)||'{}');
    m[place.toLowerCase()] = val;
    localStorage.setItem(WX_GEO_KEY, JSON.stringify(m));
  }catch(e){}
}
function wxDayStr(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
/* --- working out where you are on any given day, with no input from anyone ---
   Walk the trip in date order keeping a "current place": a flight or ferry moves you to
   its destination, checking into a stay moves you to that stay's town, and every day in
   between inherits wherever you were last. A multi-country trip therefore switches its
   forecast on the day you actually travel. Each day ends up with a list of candidates,
   best guess first, tried in turn until one geocodes, so a hotel name that means nothing
   to a gazetteer falls through to the airport city and finally to the country. */
function wxAirportPlaces(code){
  const name = AIRPORTS[String(code||'').toUpperCase()];
  if(!name) return [];
  const first = name.split(' ')[0];
  // try the full airport name first ("Nice", "Gran Canaria"), then just the city it starts
  // with, which is what rescues "Rome Fiumicino" and "Amsterdam Schiphol"
  return first && first !== name ? [name, first] : [name];
}
function wxStayPlaces(a){
  const parts = String((a&&a.address)||'').split(',').map(s=>s.trim())
    .filter(s => s && /[a-z]{3}/i.test(s) && !/^\d/.test(s));   // drop house numbers and postcodes
  if(!parts.length) return [];
  // the town is usually the second-to-last comma part, with the country last
  return parts.length >= 2 ? [parts[parts.length-2], parts[parts.length-1]] : [parts[0]];
}
function wxDayPlaces(t, dayKeys){
  const fallback = (t.countries||[]).map(c=>(countryByCode(c)||{}).name).filter(Boolean);
  const events = [];
  // rank keeps a stay ahead of the flight that delivered you on the same date, since the
  // stay's address is the more precise of the two
  (t.flights||[]).forEach(f=>{ if(f.date && f.to) events.push({date:f.date, rank:0, cands:wxAirportPlaces(f.to)}); });
  (t.ferries||[]).forEach(f=>{ if(f.date && f.to) events.push({date:f.date, rank:0, cands:[f.to]}); });
  (t.accommodations||[]).forEach(a=>{ if(a.checkin) events.push({date:a.checkin, rank:1, cands:wxStayPlaces(a)}); });
  events.sort((a,b)=> a.date.localeCompare(b.date) || a.rank-b.rank);

  const keys = dayKeys.filter(Boolean).slice().sort();
  const map = {};
  let cur = fallback, ei = 0;
  keys.forEach(k=>{
    while(ei < events.length && events[ei].date <= k){
      if(events[ei].cands.length) cur = [...new Set(events[ei].cands.concat(fallback))];
      ei++;
    }
    map[k] = cur;
  });
  return map;
}
let WX_DAY_PLACES = {};   // 'YYYY-MM-DD' -> candidate place list, rebuilt on each itinerary render
const WX_LIST_GEO = {};   // candidate-list key -> resolved {lat,lon,label}, or false once all missed
/* try each candidate in turn; a miss is remembered so a vague name isn't re-queried forever */
function wxResolve(cands, cb){
  let i = 0;
  const tryNext = () => {
    if(i >= cands.length) return cb(null);
    const place = cands[i++];
    const cached = wxGeoGet(place);
    if(cached === false) return tryNext();
    if(cached && typeof cached.lat === 'number') return cb(cached);
    fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name='+encodeURIComponent(place))
      .then(r=>r.json())
      .then(j=>{
        const r0 = j && j.results && j.results[0];
        if(!r0 || typeof r0.latitude !== 'number'){ wxGeoSet(place, false); return tryNext(); }
        // "Greece, Greece" reads badly, so only add the country when it differs from the name
        const label = (r0.country && r0.country !== r0.name) ? r0.name+', '+r0.country : r0.name;
        const geo = {lat:r0.latitude, lon:r0.longitude, label};
        wxGeoSet(place, geo);
        cb(geo);
      })
      .catch(tryNext);
  };
  tryNext();
}
/* forecasts are keyed by coordinate, so two towns that resolve to the same spot, or a day
   list that repeats a place, only ever cost one request */
function wxForecast(geo, done){
  const key = geo.lat.toFixed(2)+','+geo.lon.toFixed(2);
  const cur = WX_STATE[key];
  if(cur){
    if(cur.status === 'loading') cur.waiting.push(done); else done();
    return;
  }
  const st = WX_STATE[key] = {status:'loading', days:{}, label:geo.label||'', waiting:[]};
  const finish = () => { const w = st.waiting; st.waiting = []; done(); w.forEach(fn=>fn()); };
  const today = new Date();
  const end = new Date(today.getTime() + (WX_FORECAST_DAYS-1)*86400000);
  fetch('https://api.open-meteo.com/v1/forecast?latitude='+encodeURIComponent(geo.lat)
    + '&longitude='+encodeURIComponent(geo.lon)
    + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max'
    + '&timezone=auto&start_date='+wxDayStr(today)+'&end_date='+wxDayStr(end))
    .then(r=>r.json())
    .then(j=>{
      const d = j && j.daily;
      if(!d || !Array.isArray(d.time)) throw 0;
      d.time.forEach((day,i)=>{
        st.days[day] = {
          code: (d.weather_code||[])[i],
          max:  (d.temperature_2m_max||[])[i],
          min:  (d.temperature_2m_min||[])[i],
          pop:  (d.precipitation_probability_max||[])[i]
        };
      });
      st.status = 'ok';
      finish();
    })
    .catch(()=>{ st.status = 'fail'; finish(); });
}
/* the small chip beside a day heading, empty whenever there's nothing honest to say */
function wxDayHTML(dateKey){
  const cands = WX_DAY_PLACES[dateKey];
  if(!cands || !cands.length) return '';
  const geo = WX_LIST_GEO[cands.join('|')];
  if(!geo) return '';
  const st = WX_STATE[geo.lat.toFixed(2)+','+geo.lon.toFixed(2)];
  if(!st || st.status !== 'ok') return '';
  const d = st.days[dateKey];
  if(!d || typeof d.max !== 'number') return '';
  const [label, emoji] = WX_CODES[d.code] || ['', '☁️'];
  const rain = (typeof d.pop === 'number' && d.pop >= 20) ? ` · ${Math.round(d.pop)}%` : '';
  const where = geo.label ? ' in '+geo.label : '';
  return `<span class="wx-chip" title="${esc(label+where)}"><span class="wx-emoji" aria-hidden="true">${emoji}</span>${Math.round(d.max)}°/${Math.round(d.min)}°${rain}</span>`;
}
function paintWeather(){
  document.querySelectorAll('#tab-body [data-wx-date]').forEach(el=>{
    el.innerHTML = wxDayHTML(el.dataset.wxDate);
  });
}
function initWeather(t){
  const keys = [...document.querySelectorAll('#tab-body [data-wx-date]')].map(el=>el.dataset.wxDate);
  WX_DAY_PLACES = wxDayPlaces(t, keys);
  const repaint = () => { if(CUR_TAB==='plan' && CUR_TRIP_ID===t.id) paintWeather(); };
  [...new Set(Object.values(WX_DAY_PLACES).map(c=>c.join('|')))].forEach(listKey=>{
    if(!listKey) return;
    const known = WX_LIST_GEO[listKey];
    if(known){ wxForecast(known, repaint); return; }
    if(known === false) return;                       // every candidate already missed
    wxResolve(listKey.split('|'), geo=>{
      WX_LIST_GEO[listKey] = geo || false;
      if(geo) wxForecast(geo, repaint);
    });
  });
}

function mapQuery(t, name){

/* '00:00' puts an all-day thing at the head of its day, which is where it belongs when

const PLAN_PERIODS = {allday:['All day','00:00'], morning:['Morning','06:00'], midday:['Midday','11:00'],

function itineraryTimeKey(s){ return s.time || (s.period && PLAN_PERIODS[s.period] && PLAN_PERIODS[s.period][1]) || '99:99'; }
function travelDurationLabel(s){
  const h = s.durationH||0, m = s.durationM||0;

}
function itineraryItemLabel(s){

  return s.name || 'a stop';

/* auto flight/ferry/car/check-in/check-out cards are sorted by time, except flight vs
   check-in/check-out: a check-in's recorded time is usually just the property's standard
   check-in time, not your actual arrival, so it can't be trusted to order correctly against
   a same-day flight, force checkout, then flight, then check-in regardless of what the
   individual times say, unless an explicit arrival time has been set for that stay, in
   which case it's real and sorts normally like everything else */
function planCompare(a, b){
  const isAuto = x => !!(x._autoFlight || x._autoFerry || x._autoCar || x._autoStay);
  if(isAuto(a) && isAuto(b)){
    const untrustedCheckin = x => x._autoStay==='checkin' && !(x.ac && x.ac.arrivalTime);
    const rank = x => x._autoStay==='checkout' ? 0 : x._autoFlight ? 1 : untrustedCheckin(x) ? 2 : null;
    const ra = rank(a), rb = rank(b);
    if(ra!=null && rb!=null && ra!==rb) return ra-rb;
  }
  return itineraryTimeKey(a).localeCompare(itineraryTimeKey(b));
}
/* how early to be at the airport. Two hours is the usual short-haul advice and, more to the
   point, "leave at 16:05 for a 16:05 flight" was nonsense: the suggestion is about when you
   need to BE there, not when the plane goes. Clamped to 00:00 rather than rolling back a day,
   so the card stays on the flight's own date where you'd look for it. */
const AIRPORT_LEAD_MINS = 120;
function airportArriveBy(depTime){
  const m = /^(\d{1,2}):(\d{2})$/.exec(depTime||''); if(!m) return '';
  let total = (+m[1])*60 + (+m[2]) - AIRPORT_LEAD_MINS;
  if(total < 0) return '00:00';
  /* down to the quarter hour, so the suggestion is a time the form's minute dropdown can
     actually hold (it offers 00/15/30/45) and the card doesn't shift by five minutes the
     moment you open it. Down rather than nearest: earlier is the safe direction here. */
  total -= total % 15;
  return String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0');
}
/* every same-day "check out of one place, check into another" pair, as the journey between
   them. Returns one entry per move, already skipping the ones you've saved a real travel leg
   for. Only pairs a check-out with a check-in at a DIFFERENT accommodation: extending a stay
   by booking the same place twice back-to-back isn't a journey anywhere. */
function stayMoves(t){
  const stays = (t.accommodations||[]);
  const out = [];
  stays.forEach((leaving, li)=>{
    if(!leaving.checkout || leaving.undecided) return;
    const arriving = stays.findIndex((a,ai)=>ai!==li && a.checkin===leaving.checkout && !a.undecided);
    if(arriving < 0) return;
    const to = stays[arriving];
    const fromName = leaving.name||'', toName = to.name||'';
    if(!fromName && !toName) return;                       // nothing to name the journey by
    if(fromName && fromName === toName) return;            // same place under two bookings
    if((t.itinerary||[]).some(s=>s._autoForStay===arriving)) return;  // you've already saved it
    /* the check-out time is the hard deadline (you have to be out), so that's what the
       journey is pinned to. With no check-out time, fall back to being there for check-in. */
    const time = leaving.checkoutTime || to.checkinTime || '';
    out.push({date: leaving.checkout, from: fromName, to: toName, aci: arriving,
      time, timing: time ? (leaving.checkoutTime ? 'leave' : 'arrive') : ''});
  });
  return out;
}
/* the day-by-day grouping tabPlan renders from, factored out so tabHome can count from the
   exact same buckets (an empty day, an undecided item, a gap) rather than keeping a second,
   drifting idea of what's still outstanding */
function planDayGroups(t){
  const items = (t.itinerary||[]);
  const groups = {};
  /* A trip that's only pencilled in for "next summer" has no calendar to hang things off, so
     its plan runs on day numbers instead: Day 1, Day 2. Same grouping machinery, the key is
     just "d3" rather than a date. Anything booked with a real date (a flight, a stay) has no
     day number to sit under, so it falls into Anytime until the trip gets real dates. */
  const rough = hasRoughWhen(t);
  items.forEach((s,i)=>{
    const k = rough ? (s.day ? 'd'+s.day : '') : (s.date||'');
    (groups[k]=groups[k]||[]).push({...s, _i:i});
  });
  // fold travel + accommodation into the schedule, with their full detail, so the whole trip
  // reads in one place, each still lives and is edited in its own section
  (t.flights||[]).forEach((f,fi)=>{
    const k = rough ? '' : (f.date||'');
    // a lightweight reminder to get to the airport, it's a real Add Travel card (same
    // rendering, same edit form) rather than a bespoke one, just suggested rather than
    // stored until you actually save it, so once you do it behaves exactly like any travel
    // leg you'd add yourself. Sorted immediately before its flight by sharing the same time
    // (stable sort keeps insertion order for ties). Skipped once a real entry for this
    // flight exists, so saving it once doesn't leave a duplicate suggestion behind.
    const alreadyAdded = (t.itinerary||[]).some(s=>s._autoForFlight===fi);
    if(f.from && !f.undecided && !alreadyAdded){
      const name = airportName(f.from) || f.from;
      const beThereBy = airportArriveBy(f.depTime);
      (groups[k]=groups[k]||[]).push({kind:'travel', mode:'undecided', from:'', to:name,
        time:beThereBy, timing:beThereBy?'arrive':'', fi});
    }
    (groups[k]=groups[k]||[]).push({_autoFlight:1, time:f.depTime||'', f, fi});
  });
  (t.ferries||[]).forEach((f,fi)=>{
    const k = rough ? '' : (f.date||'');
    (groups[k]=groups[k]||[]).push({_autoFerry:1, time:f.depTime||'', f, fi});
  });
  (t.carHire||[]).forEach((c,ci)=>{
    const pk = rough ? '' : c.pickupDate, dk = rough ? '' : c.dropoffDate;
    // undecided and neither date set yet: still has to land somewhere, same Anytime bucket
    // an unscheduled Task would use, rather than vanishing until a pick-up date exists
    if(!c.pickupDate && !c.dropoffDate){
      (groups['']=groups['']||[]).push({_autoCar:'pickup', time:'', c, ci});
    } else {
      if(c.pickupDate) (groups[pk]=groups[pk]||[]).push({_autoCar:'pickup', time:c.pickupTime||'', c, ci});
      if(c.dropoffDate) (groups[dk]=groups[dk]||[]).push({_autoCar:'dropoff', time:c.dropoffTime||'', c, ci});
    }
  });
  (t.accommodations||[]).forEach((ac,aci)=>{
    // your actual arrival time, when you've set one, is what the day should sort by, not
    // the property's generic check-in time
    const ik = rough ? '' : ac.checkin, ok = rough ? '' : ac.checkout;
    if(!ac.checkin && !ac.checkout){
      // undecided with no dates yet: same Anytime bucket an unscheduled Task would use
      (groups['']=groups['']||[]).push({_autoStay:'checkin', time:'', ac, aci});
    } else {
      if(ac.checkin) (groups[ik]=groups[ik]||[]).push({_autoStay:'checkin', time:ac.arrivalTime||ac.checkinTime||'', ac, aci});
      if(ac.checkout) (groups[ok]=groups[ok]||[]).push({_autoStay:'checkout', time:ac.checkoutTime||'', ac, aci});
    }
  });
  /* checking out of one place and into another on the same day means a journey between them
     that nothing else on the page accounts for. Same deal as the airport suggestion: a real
     Add Travel card, suggested rather than stored, that disappears once you save it. Pushed
     after the accommodation loop so a tie on the checkout time sorts it after the check-out
     card and before the check-in it leads to. */
  (rough ? [] : stayMoves(t)).forEach(mv=>{
    (groups[mv.date]=groups[mv.date]||[]).push({kind:'travel', mode:'undecided',
      from:mv.from, to:mv.to, time:mv.time, timing:mv.timing, aci:mv.aci});
  });
  /* an outstanding task folds into the day it's linked to, same red as the Tasks tab; once
     it's ticked booked there it stops appearing here too, since it's the same record. A task
     with no specific day isn't linked to anywhere on the Itinerary to fold into, so it's left
     out entirely - it still shows in Tasks, which is where a day-less task belongs. */
  (t.tasks||[]).forEach((task,ti)=>{
    if(task.done) return;
    const k = rough ? (task.day?'d'+task.day:'') : (task.date||'');
    if(!k) return;
    (groups[k]=groups[k]||[]).push({kind:'task', title:task.title, notes:task.notes,
      time:task.time||'', period:task.period||'', unscheduled:false, ti});
  });
  const hasAny = Object.keys(groups).length > 0;
  /* once there's something on the trip, every day of it shows up, not just the ones with
     something on them: a day nothing's been added to yet gets a dashed placeholder (same
     treatment as an accommodation gap) instead of silently not appearing at all. Only once
     the trip's length is actually known, real dates or a "How long" on a rough one, since
     otherwise there's no day range to fill in. Skipped entirely for a blank trip, which
     already gets its own "Nothing planned yet" empty state below. */
  if(hasAny){
    if(!rough && t.startDate && t.endDate){
      for(let d=t.startDate; d<=t.endDate; d=isoAddDays(d,1)) if(!groups[d]) groups[d] = [];
    } else if(rough){
      const days = roughTripDays(t);

    }

  const keys = Object.keys(groups).sort(rough
    ? (a,b)=>(a?+a.slice(1):9999)-(b?+b.slice(1):9999)
    : (a,b)=>(a||'9999').localeCompare(b||'9999'));
  return {groups, keys, rough, hasAny};
}
/* the shared "Day N" / date label for a plan day key, used both for the itinerary's own day

    if(!bk) return -1;

  const autoStayCard = s => {

      const way = s.mode==='walk' ? 'Walk' : mode.label;
      const line = modeUndecided
                 ? (s.to ? `Travel to ${esc(s.to)} not decided` : 'Travel not decided')
                 : s.to ? `${way} to ${esc(s.to)}`

      </div>`;
    }

    return time
      ? `<div class="plan-auto${!ro?' plan-click':''}" ${clickAttrs(`App.planForm(${s._i})`)}>${autoTag(secEmoji('🗺️'), 'Plan', time)}${card}</div>`
      : card;

  const stayGapsList = stayGaps(t);
  const stayGapAt = k => stayGapsList.find(g => g.firstNight === k);
  const dayBlock = k => {
    const dayItems = groups[k].slice().sort(planCompare);

      ${dayItems.length ? dayItems.map(card).join('') : (gap?'':emptyDayCard(k))}`;
  };
  return `
    ${hasAny ? keys.map(dayBlock).join('')
    : `<div class="empty">Nothing planned yet.${!ro?`<br><br><span class="btn-row" style="justify-content:center">
        <button class="btn" onclick="App.tab('mood')">Browse Ideas</button>

/* A small square logo for a card, from whatever we know about who it's with: the booking
   link's own domain for a stay, the airline's site for a flight. This is the site's icon, not
   a photo of the room - a real photo would mean scraping the page's og:image through the
   proxy, and the big travel sites (Airbnb especially) block that. */
const AIRLINE_SITES = {
  'easyJet':'easyjet.com','Ryanair':'ryanair.com','British Airways':'britishairways.com',
  'Jet2':'jet2.com','Wizz Air':'wizzair.com','Virgin Atlantic':'virginatlantic.com',
  'Emirates':'emirates.com','Qatar Airways':'qatarairways.com','Lufthansa':'lufthansa.com',
  'Air France':'airfrance.com','KLM':'klm.com','Iberia':'iberia.com','Vueling':'vueling.com',
  'TAP Air Portugal':'flytap.com','Aer Lingus':'aerlingus.com','Aegean Airlines':'aegeanair.com',
  'Turkish Airlines':'turkishairlines.com','SWISS':'swiss.com','Norwegian':'norwegian.com',
  'Finnair':'finnair.com','SAS':'flysas.com','Transavia':'transavia.com','Volotea':'volotea.com',
  'Pegasus Airlines':'flypgs.com','Brussels Airlines':'brusselsairlines.com','Eurowings':'eurowings.com',
  'American Airlines':'aa.com','Delta':'delta.com','United':'united.com','JetBlue':'jetblue.com',
  'Southwest':'southwest.com','Alaska Airlines':'alaskaair.com','WestJet':'westjet.com',
  'Air Canada':'aircanada.com','Qantas':'qantas.com','Etihad Airways':'etihad.com',
  'Singapore Airlines':'singaporeair.com','Cathay Pacific':'cathaypacific.com','Icelandair':'icelandair.com',
  'ITA Airways':'ita-airways.com','airBaltic':'airbaltic.com','Croatia Airlines':'croatiaairlines.com'
};
/* Google's favicon service doesn't guarantee it actually has one - some sites (easyJet's
   among them) come back blank rather than 404, which an onerror alone won't catch, so this
   also gives the <img> a byte-count floor: a real favicon is never a 1x1 transparent pixel,
   but that's exactly what a "no icon" response looks like. Either way, restoreText is what the
   caller wanted showing if there'd been no logo at all, so losing the logo just falls back to
   that rather than leaving a gap. */
function logoSquare(domain, label, restoreText){
  if(!domain) return '';
  return `<img class="card-logo" src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=128"
    alt="${esc(label||'')}" loading="lazy" data-restore="${esc(restoreText||label||'')}"
    onerror="App.cardLogoFail(this)" onload="App.cardLogoCheck(this)">`;
}
function siteLogoFor(url, label, restoreText){
  try{ return logoSquare(new URL(url).hostname, label, restoreText); }catch(e){ return ''; }
}
function airlineLogoFor(name, restoreText){
  const site = AIRLINE_SITES[name];
  return site ? logoSquare(site, name, restoreText) : '';
}
function faviconFor(url){
  try{ const h = new URL(url).hostname; return `<img class="fav" src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(h)}&sz=64" alt="" loading="lazy">`; }
  catch(e){ return ''; }
}
function googleMapsUrl(q){ return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q); }
/* a Google Maps link gets Google's own icon, the same way a booking link gets the site's;
   anything else (a maps.apple.com or what3words link somebody pasted) keeps the emoji.
   The domain can be preceded by the start of the string, a "." (a subdomain, as in
   "www.google.com/maps"), OR a "/" - which is what actually sits right before it in every
   real "https://maps.google.com/…" or "https://goo.gl/maps/…" URL this is tested against,
   so matching only "^" or "." here meant those never matched at all. */
function mapIcon(url){
  return /(^|[./])maps\.google\.[^/]*(\/|\?|$)|(^|[./])google\.[^/]*\/maps|(^|[./])goo\.gl\/maps|(^|[./])maps\.app\.goo\.gl/i.test(url||'')
    ? faviconFor('https://maps.google.com') : secEmoji('🗺️');
}
/* best-effort town/city out of a full address, drop a trailing postcode-looking segment,
   then take the last comma-separated part, e.g. "1 Rua X, Lisbon, 1000-001" -> "Lisbon" */
function guessCityFromAddress(address){
  if(!address) return '';
  const parts = address.split(',').map(s=>s.trim()).filter(Boolean);
  if(!parts.length) return '';
  const looksLikePostcode = /\d/.test(parts[parts.length-1]) && parts[parts.length-1].length<=10;
  if(looksLikePostcode && parts.length>1) parts.pop();
  // "Saranda, Albania" shouldn't guess the country as the city, drop it and use the town
  if(parts.length>1 && countryByName(parts[parts.length-1])) parts.pop();
  return parts[parts.length-1] || '';
}
function detectBookingService(url){
  if(!url) return '';
  if(/airbnb\./i.test(url)) return 'Airbnb';
  if(/booking\.com/i.test(url)) return 'Booking.com';
  if(/vrbo\.com/i.test(url)) return 'Vrbo';
  if(/expedia\./i.test(url)) return 'Expedia';
  if(/hotels\.com/i.test(url)) return 'Hotels.com';
  return '';
}
function autoAccomName(url, address){
  const service = detectBookingService(url);
  const city = guessCityFromAddress(address);
  if(service && city) return service+' in '+city;
  if(service) return service;
  if(city) return 'Stay in '+city;
  return '';
}
/* the full accommodation card, shared by Accommodation and, read-only, by the Itinerary.
   opts: headerActions (edit/delete, top-right), footerActions (e.g. a link back to this
   section), showDates (hide the check-in/out chips when the itinerary already shows the
   time), compact (icon-only View Booking/Open Map buttons, no label - used by the itinerary,
   where the favicon/pin are already clear enough and the label is just noise) */
function accomCardHTML(a, opts){
  opts = opts || {};
  const arrivalSuffix = a.arrivalTime ? ` (arriving ${esc(a.arrivalTime)})` : '';
  /* the year lands once, on the check-out, with each end's time tucked in after its own date:
     "23 September 15:00 - 25 September 2026 11:00" */
  const p = a.checkin && a.checkout ? rangeParts(a.checkin, a.checkout) : null;
  const stayRange = p
    ? `${p.from}${a.checkinTime?' '+esc(a.checkinTime):''}${arrivalSuffix} - ${p.to}${a.checkoutTime?' '+esc(a.checkoutTime):''}`
    : a.checkin ? `${fmtDate(a.checkin)}${a.checkinTime?' '+esc(a.checkinTime):''}${arrivalSuffix}`
    : a.checkout ? `${fmtDate(a.checkout)}${a.checkoutTime?' '+esc(a.checkoutTime):''}`
    : '';
  /* the head's right-hand slot mirrors a flight's date. On the Accommodation tab, where both
     ends are spelled out in the body anyway, it carries the check-in date instead. On the
     Itinerary's compact card it's a Maps link instead - the outer "Accommodation - 23:00" tag
     already carries this end's specific time, so repeating it here (as "From 15:00") was just
     the property's generic check-in window standing in for the useful thing, a way there. */
  const headNote = opts.phase==='checkin'  ? (a.checkinTime  ? 'From '+a.checkinTime   : 'Check in')
                 : opts.phase==='checkout' ? (a.checkoutTime ? 'Until '+a.checkoutTime : 'Check out')
                 : '';
  /* every button here is its own icon: a favicon, a map pin, a link, a pencil, a bin. The
     labels were saying what the icons already say, and three of them wrapped onto two lines
     each on a phone. */
  const iconBtn = (inner, label, attrs) =>
    `<a class="btn icon-only" ${attrs} aria-label="${esc(label)}" title="${esc(label)}">${inner}</a>`;
  const mapsUrl = a.address ? googleMapsUrl(a.address) : '';
  const bookingBtn = a.bookingUrl ? iconBtn(faviconFor(a.bookingUrl), 'View Booking',
      `href="${esc(a.bookingUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()"`) : '';
  const mapBtn = mapsUrl ? iconBtn(mapIcon(mapsUrl), 'Open Map',
      `href="${mapsUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()"`) : '';
  const copyBtn = a.address
      ? `<button type="button" class="btn icon-only" onclick="event.stopPropagation();App.copyText('${jsArg(a.address)}',this)" aria-label="Copy address" title="Copy address">${secEmoji('\u{1F517}')}</button>`
      : '';
  /* the two ends of the stay, a line each. They used to share one line that also repeated the
     check-in date already sitting up in the head. */
  const inLine  = a.checkin  ? `${fmtDate(a.checkin)}${a.checkinTime?' '+esc(a.checkinTime):''}${arrivalSuffix}` : '';
  const outLine = a.checkout ? `${fmtDate(a.checkout)}${a.checkoutTime?' '+esc(a.checkoutTime):''}` : '';
  const stayLine = (label, value) => value
    ? `<div class="small accom-when"><span class="accom-when-label">${label}</span><span>${value}</span></div>` : '';
  /* the compact itinerary card folds both footer buttons into the head instead of a row below:
     the logo becomes the booking link itself, and Maps takes the right-hand slot - between the
     two there's nothing left for the footer row to do, so it drops entirely and the card is
     just the one line. */
  const logoInner = a.bookingUrl ? siteLogoFor(a.bookingUrl, '', a.name||'Accommodation') : '';
  const logo = (opts.compact && a.bookingUrl)
    ? `<a href="${esc(a.bookingUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" aria-label="View Booking" title="View Booking">${logoInner}</a>`
    : logoInner;
  /* "Airbnb in Palaiokastritsa" said the same thing twice once the logo is doing the "Airbnb"
     part - only strips the exact auto-filled pattern, so a name typed or edited by hand is
     left alone */
  const service = detectBookingService(a.bookingUrl);
  const displayName = (opts.compact && service && a.name && a.name.toLowerCase().startsWith((service+' in ').toLowerCase()))
    ? a.name.slice(service.length+4) : (a.name||'Accommodation');
  const headRight = a.undecided ? `<span class="pill-notbooked">🎫 Not Booked</span>`

const DAY_MS = 86400000;
const isoAddDays = (iso, n) => {
  const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
};
/* Nights on this trip with nowhere booked to sleep.
   A stay from check-in D1 to check-out D2 covers the NIGHTS of D1 up to D2-1: you check out
   on the morning of D2, so that date doesn't need a bed from this booking. By the same logic
   the trip needs beds for its start date through to the night before its end date, since the
   end date is the day you travel home. Returns one entry per unbroken run of missing nights. */
function stayGaps(t){
  if(!t.startDate || !t.endDate) return [];
  const covered = new Set();
  (t.accommodations||[]).forEach(a=>{
    if(!a.checkin) return;
    const last = a.checkout || a.checkin;   // no check-out set: assume the one night
    for(let d=a.checkin; d<last; d=isoAddDays(d,1)) covered.add(d);
    if(!a.checkout) covered.add(a.checkin);
  });
  const gaps = [];
  for(let d=t.startDate; d<t.endDate; d=isoAddDays(d,1)){
    if(covered.has(d)) continue;
    const prev = gaps[gaps.length-1];
    if(prev && prev.lastNight === isoAddDays(d,-1)) prev.lastNight = d;
    else gaps.push({firstNight:d, lastNight:d});
  }
  /* the form wants a check-out date, which is the morning after the last night without a bed */
  return gaps.map(g=>({...g, checkout: isoAddDays(g.lastNight,1),
    nights: Math.round((new Date(g.lastNight+'T00:00:00') - new Date(g.firstNight+'T00:00:00'))/DAY_MS) + 1}));
}
function stayGapCardHTML(g, ro){
  const n = g.nights;
  const when = n===1 ? fmtDate(g.firstNight) : fmtRange(g.firstNight, g.lastNight);
  return `
    <div class="card gap-card">
      <div class="section-head" style="margin-bottom:6px">
        <h3>${secEmoji('🛏️')}${n} Night${n===1?'':'s'} with No Accommodation</h3>
      </div>
      <p class="small muted" style="margin-bottom:${ro?'0':'12px'}">${esc(when)}</p>
      ${ro?'':`<button class="btn primary sm" onclick="App.accomGapForm('${g.firstNight}','${g.checkout}')">+ Add Accommodation</button>`}
    </div>`;
}
function tabStay(t, ro){
  const list = t.accommodations||[];
  const gaps = stayGaps(t);
  if(!list.length && !gaps.length){
    return `<div class="empty">No accommodation added yet.${!ro?'<br><br><button class="btn primary" onclick="App.accomForm(-1)">+ Add Accommodation</button>':''}</div>`;
  }
  /* booked stays and the holes between them, read in date order, so a missing night shows up
     exactly where it falls rather than in a list of warnings at the bottom */
  const rows = list.map((a,i)=>({date:a.checkin||'', html: accomCardHTML(a, {
      rowActions: !ro?`<button type="button" class="btn icon-only" aria-label="Edit accommodation" title="Edit" onclick="App.accomForm(${i})">${ICONS.edit}</button><button type="button" class="btn icon-only danger" aria-label="Remove accommodation" title="Remove" onclick="App.delAccom(${i})">${ICONS.trash}</button>`:''
    })}))
    .concat(gaps.map(g=>({date:g.firstNight, html: stayGapCardHTML(g, ro)})));
  rows.sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
  return rows.map(r=>r.html).join('');
}

let FORM_DOC = null;   // pending {name,kind,dataUrl,size} while a travel form is open
function docStatusHTML(){
  return FORM_DOC
    ? `<span class="doc-attach">${ICONS.docs}${esc(FORM_DOC.name)}</span> <button type="button" class="iconbtn del" aria-label="Remove file" title="Remove file" onclick="App.clearFormDoc()">${ICONS.trash}</button>`
    : `<span class="muted small">No file attached</span>`;
}
function paintDocStatus(){ const el = $('#doc-status'); if(el) el.innerHTML = docStatusHTML(); }
App.clearFormDoc = () => { FORM_DOC = null; paintDocStatus(); };
App.attachDoc = input => {
  const file = input.files[0]; input.value=''; if(!file) return;
  if(file.type==='application/pdf'){
    const fr = new FileReader();
    fr.onload = e => { FORM_DOC = {name:file.name, kind:'pdf', size:file.size, dataUrl: file.size<=5*1048576 ? e.target.result : null}; paintDocStatus(); if(file.size>5*1048576) noteModal('Kept On This Device', 'That PDF is over 5 MB, so only its details will sync. The file itself stays on this device.'); };
    fr.readAsDataURL(file);
  } else {
    downscaleToDataURL(file, 1800, 0.85, dataUrl => { FORM_DOC = {name:file.name, kind:'img', size:dataUrl?Math.round(dataUrl.length*.75):0, dataUrl}; paintDocStatus(); });
  }
};
function attachField(){
  return `<div class="field"><label class="label">Boarding pass / document</label>
    <div id="doc-status" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px">${docStatusHTML()}</div>
    <label class="btn sm" style="cursor:pointer">${ICONS.upload} ${FORM_DOC?'Replace file':'Attach file'}<input type="file" accept="application/pdf,image/*" style="display:none" onchange="App.attachDoc(this)"></label></div>`;
}
/* data: URLs can't reliably render PDFs in iframes (especially on mobile), serve a blob URL
   instead, with open-in-new-tab and download as fallbacks */
function dataUrlToBlobUrl(dataUrl){
  try{
    const comma = dataUrl.indexOf(',');
    const mime = (dataUrl.slice(0,comma).match(/data:(.*?)(;|$)/)||[])[1] || 'application/octet-stream';
    const bin = atob(dataUrl.slice(comma+1));
    const arr = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([arr],{type:mime}));
  }catch(e){ return null; }
}
/* PDFs don't render reliably inside an embedded iframe on mobile Safari (a long-standing
   WebKit limitation with blob/data URLs in a nested browsing context, it can just show
   blank), so instead of trying to preview it in place, hand it straight to the device's
   own PDF viewer via a full navigation, that works everywhere */
function docViewerHTML(d){
  if(d.kind!=='pdf'){
    return `<img src="${d.dataUrl}" alt="${esc(d.name)}" style="max-width:100%;border-radius:12px;border:1px solid var(--line)">`;
  }
  const url = dataUrlToBlobUrl(d.dataUrl) || d.dataUrl;
  return `
    <p class="muted small" style="margin-bottom:14px">PDFs open in your device's own viewer rather than in-page, so you get proper zoom, search and sharing.</p>
    <div class="btn-row">
      <a class="btn primary" style="flex:1.4;min-width:0" href="${url}" target="_blank" rel="noopener">${ICONS.ext}Open PDF</a>
      <a class="btn" style="flex:1;min-width:0" href="${url}" download="${esc(d.name)}">${ICONS.download}Download</a>
    </div>`;
}

  if(isPdf){

      t.documents.push({id:uid(), name:file.name, kind:'pdf', size:file.size,

      logEdit('Documents','uploaded '+file.name); save(); rerender();

    };
    fr.readAsDataURL(file);
  } else {
    // image → downscale, keeping plenty of quality for a personal, small-group trip
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      const scale = Math.min(1, 2000/Math.max(img.width,img.height));
      c.width = img.width*scale; c.height = img.height*scale;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      const dataUrl = c.toDataURL('image/jpeg',.85);
      t.documents.push({id:uid(), name:file.name, kind:'img', size:Math.round(dataUrl.length*.75), dataUrl});
      logEdit('Documents','uploaded '+file.name); save(); rerender();
      toast('Image uploaded. Tap the pencil to rename it.');
    };
    img.src = URL.createObjectURL(file);
  }
  input.value='';
};
function downscaleToDataURL(file, max, quality, cb){
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    const scale = Math.min(1, max/Math.max(img.width,img.height));
    c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    cb(c.toDataURL('image/jpeg', quality));
    URL.revokeObjectURL(img.src);
  };
  img.onerror = () => cb(null);
  img.src = URL.createObjectURL(file);
}
/* PNG rather than downscaleToDataURL's JPEG - a custom vegetable icon (a Genmoji/Apple Emoji
   Maker sticker, say) is usually exported with a transparent background, and JPEG has no alpha
   channel, so it'd flatten that to a solid white square. These are icon-sized (max defaults to
   something small), so the bigger file PNG produces for the same image doesn't matter here the
   way it would for a full photo. */
function downscaleToDataURLPng(file, max, cb){
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    const scale = Math.min(1, max/Math.max(img.width,img.height));
    c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    cb(c.toDataURL('image/png'));
    URL.revokeObjectURL(img.src);
  };
  img.onerror = () => cb(null);
  img.src = URL.createObjectURL(file);
}
/* ================= TAB: money ================= */
function receiptTotal(r){
  return r.evenSplit ? (+r.amount||0) : (r.items||[]).reduce((s,it)=>s+(+it.amount||0),0);
}
function computeBalances(t){
  const net = {}; (t.participants||[]).forEach(p=>net[p]=0);
  (t.receipts||[]).forEach(r=>{
    const total = receiptTotal(r);
    if(net[r.paidBy]!==undefined) net[r.paidBy] += total;
    if(r.evenSplit){
      const ppl = (r.sharedWith&&r.sharedWith.length)?r.sharedWith:t.participants;
      ppl.forEach(p=>{ if(net[p]!==undefined) net[p] -= total/ppl.length; });
    } else {
      (r.items||[]).forEach(it=>{
        const ppl = (it.people&&it.people.length)?it.people:t.participants;
        ppl.forEach(p=>{ if(net[p]!==undefined) net[p] -= (+it.amount||0)/ppl.length; });
      });
    }
  });
  return net;
}
function settlements(net){
  const debt = [], cred = [];
  Object.entries(net).forEach(([p,v])=>{
    if(v < -0.005) debt.push({p, v:-v}); else if(v > 0.005) cred.push({p, v});
  });
  debt.sort((a,b)=>b.v-a.v); cred.sort((a,b)=>b.v-a.v);
  const out = [];
  let i=0, j=0;
  while(i<debt.length && j<cred.length){
    const pay = Math.min(debt[i].v, cred[j].v);
    out.push({from:debt[i].p, to:cred[j].p, amt:pay});
    debt[i].v -= pay; cred[j].v -= pay;
    if(debt[i].v < 0.005) i++;
    if(cred[j].v < 0.005) j++;
  }
  return out;
}
function tabMoney(t, ro){
  const receipts = (t.receipts||[]).map((r,i)=>{
    const total = receiptTotal(r);
    const detail = r.evenSplit
      ? `<div class="muted small">Split evenly between ${esc(((r.sharedWith&&r.sharedWith.length)?r.sharedWith:t.participants).join(', '))}</div>`
      : (r.items||[]).map(it=>`<div class="settle-row"><span>${esc(it.desc)} <span class="muted small">(${esc((it.people||[]).join(', ')||'everyone')})</span></span><span class="amount mono">${money(+it.amount||0)}</span></div>`).join('');
    return `
    <div class="card">
      <div class="section-head" style="margin-bottom:6px;flex-wrap:nowrap;align-items:flex-start">
        <div style="min-width:0"><h3>${esc(r.title)}</h3><div class="muted small">${r.date?fmtDate(r.date)+' · ':''}paid by <strong>${esc(r.paidBy)}</strong></div></div>
        <span class="amount mono" style="font-size:1.15rem">${money(total)}</span>
      </div>
      ${detail}
      ${!ro?`<div class="btn-row" style="justify-content:flex-end;margin-top:10px">
        <button class="iconbtn edit" aria-label="Edit receipt" title="Edit" onclick="App.receiptForm(${i})">${ICONS.edit}</button>
        <button class="iconbtn del" aria-label="Remove receipt" title="Remove" onclick="App.delReceipt(${i})">${ICONS.trash}</button></div>`:''}
    </div>`;
  }).join('');

  const net = computeBalances(t);
  const stl = settlements(net);
  const hasRec = (t.receipts||[]).length;
  return `
    ${hasRec ? `
      <h2>Settle Up</h2>
      <p class="muted small" style="margin-bottom:8px">Debts are combined into the fewest possible payments, so one transfer can settle several people at once.</p>
      <div class="settle" style="margin-top:8px">
        ${stl.length ? stl.map(s=>`<div class="settle-row"><span><strong>${esc(s.from)}</strong> → <strong>${esc(s.to)}</strong></span><span class="amount mono">${money(s.amt)}</span></div>`).join('') : `<div class="muted" style="padding:8px 0">Everyone is settled up 🤝</div>`}
      </div>`:''}
    <div class="section-head" ${hasRec?'style="margin-top:30px"':''}><h2>Receipts</h2>${!ro?`<button class="btn sm primary" onclick="App.receiptForm(-1)">+ Add Receipt</button>`:''}</div>
    ${receipts || `<div class="empty">No Receipts Yet</div>`}
    ${hasRec ? `
      <h2 style="margin-top:30px">Balances</h2>
      <div class="settle">
        ${Object.entries(net).map(([p,v])=>`<div class="settle-row"><span>${esc(p)}</span><span class="amount mono">${v>0.005?'is owed '+money(v):v<-0.005?'owes '+money(-v):'all square'}</span></div>`).join('')}
      </div>`:''}`;
}

  const it = R.items[idx]; it.people = it.people||[];
  const i = it.people.indexOf(p);

App.saveReceipt = () => {
  const t = getTrip(CUR_TRIP_ID);
  if(!t||!R){ noteModal('Not Saved', "This trip isn't loaded. Try refreshing the page."); return; }
  try{
    if(!R.title.trim()) return markErr('#rc-title','Give the receipt a name');
    if(R.evenSplit){
      if(!(+R.amount>0)) return markErr('#rc-amt','Enter the amount');
      if(!R.sharedWith.length){ noteModal('Who Shares It?', 'Pick who this receipt is split between.'); return; }
    } else {
      R.items = R.items.filter(it=>it.desc.trim()||+it.amount>0);
      if(!R.items.length || !R.items.some(it=>+it.amount>0)){ noteModal('Nothing To Split', 'Add at least one item with an amount.'); return; }
    }
    const editing = R._edit>=0 && t.receipts[R._edit];
    const rec = {id: editing ? t.receipts[R._edit].id : uid(), title:R.title.trim(), date:R.date, paidBy:R.paidBy,
      evenSplit:R.evenSplit, amount:+R.amount||0, sharedWith:[...R.sharedWith],
      items:R.items.map(it=>({desc:it.desc.trim()||'Item', amount:+it.amount||0, people:[...(it.people||[])]}))};
    if(editing) t.receipts[R._edit] = rec; else t.receipts.push(rec);
    logEdit('Money',(editing?'edited receipt ':'added receipt ')+rec.title+' ('+money(receiptTotal(rec))+')');
    save(); R=null; closeModal(); rerender(); toast(editing?'Receipt updated':'Receipt added');
  }catch(e){
    console.error("My Trips, couldn't save receipt:", e);
    noteModal('Receipt Not Saved', (e&&e.message||e)+'. Try again, and let Chris know if it keeps happening.');
  }
};
App.delReceipt = i => {
  const t = getTrip(CUR_TRIP_ID); if(!t) return;
  const tripId = t.id;
  const removed = t.receipts[i];
  confirmModal('Remove This Receipt?', `"${removed.title}" (${money(receiptTotal(removed))}) will be removed.`, 'Remove', ()=>{
    t.receipts.splice(i,1); logEdit('Money','removed receipt '+(removed.title||'')); save(); rerender();
    toast('Receipt removed', ()=>{
      const t2 = getTrip(tripId); if(!t2) return;
      t2.receipts = t2.receipts||[];
      t2.receipts.splice(Math.min(i,t2.receipts.length),0,removed);
      logEdit('Money','restored receipt '+(removed.title||'')); save(); rerender();
    });
  });
};

function fab(name){ return `<i class="icon fa-brands fa-${name}"></i>`; }
function detectVideoEmbed(url){
  if(!url) return null;
  if(/tiktok\.com\//i.test(url)) return {provider:'tiktok'};
  if(/instagram\.com\/(reel|reels|p)\//i.test(url)) return {provider:'instagram'};
  return null;
}
let VIDEO_THUMB = {}; // videoUrl -> {status:'loading'|'ok'|'error', thumb}
/* TikTok's oEmbed endpoint is public and CORS-open (no key needed) and returns a real
   thumbnail for the specific video. Instagram's oEmbed now requires an authenticated
   Facebook app token we don't have, so Instagram gets a branded placeholder instead of
   a real per-post thumbnail, both are just a clickable card that opens the real post. */
function loadVideoThumb(url){
  if(VIDEO_THUMB[url]) return;
  VIDEO_THUMB[url] = {status:'loading'};
  fetch('https://www.tiktok.com/oembed?url='+encodeURIComponent(url))
    .then(r=>r.json())
    .then(data=>{ VIDEO_THUMB[url] = {status:'ok', thumb:(data&&data.thumbnail_url)||null}; if(CUR_TAB==='mood') rerender(); })
    .catch(err=>{
      console.error('TikTok thumbnail fetch failed for', url, err);
      VIDEO_THUMB[url] = {status:'error'};
      if(CUR_TAB==='mood') rerender();
    });
}
function videoThumbHTML(embed, url){
  if(embed.provider==='tiktok'){
    loadVideoThumb(url);
    const entry = VIDEO_THUMB[url];
    const thumb = entry && entry.status==='ok' ? entry.thumb : null;
    return `<a class="video-thumb video-thumb-tiktok" href="${esc(url)}" target="_blank" rel="noopener" aria-label="Watch on TikTok"${thumb?` style="background-image:url('${esc(thumb)}')"`:''}>
      ${!thumb?`<span class="video-thumb-fallback">${fab('tiktok')}</span>`:''}
      <span class="video-thumb-play">${fa('play')}</span>
    </a>`;
  }
  return `<a class="video-thumb video-thumb-instagram" href="${esc(url)}" target="_blank" rel="noopener" aria-label="Watch on Instagram">
    <span class="video-thumb-fallback">${fab('instagram')}</span>
    <span class="video-thumb-play">${fa('play')}</span>
  </a>`;
}

function ideaEmojiFor(title){
  const s = String(title||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  if(!s.trim()) return IDEA_EMOJI_DEFAULT;
  const hit = IDEA_EMOJI_RULES.find(([re]) => re.test(s));
  return hit ? hit[1] : IDEA_EMOJI_DEFAULT;
}

App.attachMoodImg = input => {
  const file = input.files[0]; input.value=''; if(!file) return;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    const scale = Math.min(1, 1600/Math.max(img.width,img.height));
    c.width = img.width*scale; c.height = img.height*scale;
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    MOOD_IMG = c.toDataURL('image/jpeg',.85);
    const el=$('#md-img-status'); if(el) el.innerHTML = moodImgStatus();
  };
  img.src = URL.createObjectURL(file);
};
App.moodForm = i => {
  const t = getTrip(CUR_TRIP_ID); if(!t) return;
  const m = (i>=0 && (t.moodBoard||[])[i]) || {};
  MOOD_IMG = m.dataUrl || null;
  // an idea you've already given an emoji keeps it; a new one follows the title until you pick
  IDEA_EMOJI_TOUCHED = !!m.emoji;
  const emoji = m.emoji || ideaEmojiFor(m.title||'');
  openModal(`
    <h2>${i>=0?'Edit Idea':'New Idea'}</h2>
    <div class="field"><label class="label" for="md-title">Title</label><input id="md-title" type="text" value="${esc(m.title||'')}" placeholder="e.g. Sunset at Miradouro" oninput="App.ideaTitleTyped()"></div>
    ${ideaEmojiFieldHTML(emoji)}
    <div class="field"><label class="label" for="md-video">TikTok or Instagram link</label><input id="md-video" type="url" value="${esc(m.videoUrl||'')}" placeholder="https://www.tiktok.com/@user/video/…"></div>
    <div class="field"><label class="label" for="md-maps">Google Maps link</label><input id="md-maps" type="url" value="${esc(m.mapsUrl||'')}" placeholder="https://maps.google.com/…"></div>
    <div class="field"><label class="label">Image</label>
      <div id="md-img-status" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0">${moodImgStatus()}</div>
      <label class="btn sm" style="cursor:pointer">${ICONS.upload} ${MOOD_IMG?'Replace image':'Add image'}<input type="file" accept="image/*" style="display:none" onchange="App.attachMoodImg(this)"></label>
    </div>
    <div class="modal-actions">
      <button class="btn primary" style="width:100%" onclick="App.saveMood(${i>=0?i:-1})">${i>=0?'Save':'Add Idea'}</button>
      ${i>=0?`<button class="btn danger" style="width:100%;margin-top:10px" onclick="App.deleteMoodFromForm(${i})">Delete Idea</button>`:''}
    </div>`, {autofocus:false});
};
App.saveMood = i => {
  const t = getTrip(CUR_TRIP_ID); if(!t) return;
  const title = $('#md-title').value.trim();
  let videoUrl = $('#md-video').value.trim();
  if(videoUrl && !/^https?:\/\//i.test(videoUrl)) videoUrl = 'https://' + videoUrl;
  let mapsUrl = $('#md-maps').value.trim();
  if(mapsUrl && !/^https?:\/\//i.test(mapsUrl)) mapsUrl = 'https://' + mapsUrl;
  if(!title && !videoUrl && !mapsUrl && !MOOD_IMG) return markErr('#md-title','Add a title, video link, maps link or image');
  t.moodBoard = t.moodBoard||[];
  const emoji = (($('#md-emoji')||{}).value||'').trim() || ideaEmojiFor(title);
  const idea = {id: i>=0 && t.moodBoard[i] ? t.moodBoard[i].id : uid(),
    title, emoji, videoUrl, mapsUrl, ...(MOOD_IMG?{dataUrl:MOOD_IMG}:{})};
  if(i>=0) t.moodBoard[i]=idea; else t.moodBoard.push(idea);
  MOOD_IMG = null;
  logEdit('Ideas', (i>=0?'edited ':'added ')+(title||videoUrl||'an idea'));
  save(); closeModal(); rerender(); toast(i>=0?'Idea updated':'Idea added');
};
App.deleteMoodFromForm = i => { closeModal(); App.delMood(i); };
App.delMood = i => {
  const t=getTrip(CUR_TRIP_ID); if(!t) return;
  const tripId = t.id;
  const removed = t.moodBoard[i]; const label = removed.title||removed.videoUrl||'an idea';
  t.moodBoard.splice(i,1); logEdit('Ideas','removed '+label); save(); rerender();
  toast('Idea removed', ()=>{
    const t2=getTrip(tripId); if(!t2) return;
    t2.moodBoard = t2.moodBoard||[];
    t2.moodBoard.splice(Math.min(i,t2.moodBoard.length),0,removed);
    logEdit('Ideas','restored '+label); save(); rerender();
  });
};

</script>
</body>
</html>
