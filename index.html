.banner.dark{background:var(--ink); border-color:var(--ink); color:#fff;}
.mono{font-variant-numeric:tabular-nums; font-feature-settings:"tnum";}
.amount{font-weight:800; white-space:nowrap; color:var(--ink);}
.flight-strip{border:1px solid var(--line); border-radius:var(--radius); background:var(--paper); box-shadow:var(--shadow); margin-bottom:12px; overflow:hidden;}
.flight-head{display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--brand-ghost);}
/* the little square logo sitting with a card's title */
.head-with-logo{display:flex; align-items:center; gap:9px; min-width:0;}
/* a square logo, flex-centred against the title beside it, reads as sitting a touch high -
   the title text's own visual weight (cap-height, not its full line box) is lower than true
   geometric centre, so the logo wants a small nudge down to actually look aligned */
.card-logo{width:26px; height:26px; flex-shrink:0; border-radius:6px; object-fit:contain;
  background:var(--paper); border:1px solid var(--line); transform:translateY(2px);}
.flight-body{padding:14px; display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:start;}
/* accommodation runs down the card rather than across it, but shares the flight card's
   strip/head shell so the two read as the same kind of thing on the Itinerary */
.accom-body{padding:14px; display:flex; flex-direction:column; gap:10px;}
/* check-in and check-out on a line each, their labels in a fixed column so the dates line up */
.accom-when{display:flex; gap:10px; align-items:baseline; color:var(--ink);}
.accom-when-label{flex-shrink:0; width:2.2rem; font-weight:700; font-size:.72rem;
  text-transform:uppercase; letter-spacing:.08em; color:var(--muted);}
/* icons only, so they sit in a row on any width instead of wrapping two words each */
.accom-btns{margin-top:4px; flex-wrap:wrap; gap:8px;}
.accom-btns .btn.icon-only .icon{font-size:1rem;}
.accom-body > *{margin-top:0!important;}
.accom-addr{color:var(--ink); overflow-wrap:anywhere;}
.flight-body.loc-stack{display:flex; flex-direction:column; gap:10px;}
.flight-apt{font-size:1.5rem; font-weight:800; letter-spacing:.02em; color:var(--ink);}
.apt-name{font-size:.72rem; color:var(--muted); margin-top:1px; line-height:1.2;}
.loc-addr{font-size:1.05rem; font-weight:800; letter-spacing:.01em; color:var(--ink); line-height:1.3; overflow-wrap:break-word;}
.flight-arrow{align-self:center; color:var(--g3,#c9d5d5);}
.flight-arrow .icon{font-size:1.3rem; color:var(--line-strong);}
.loc-arrow-down{color:var(--g3,#c9d5d5);}
.loc-arrow-down .icon{font-size:1.2rem; color:var(--line-strong);}
.flight-meta{padding:0 14px 12px; display:flex; gap:8px 18px; flex-wrap:wrap; font-size:.8rem; color:var(--muted); align-items:center;}
.incl-chips{display:flex; flex-wrap:wrap; gap:6px; padding:0 14px 12px;}
.incl-chip{font-size:.7rem; font-weight:600; color:var(--brand-dark); background:var(--brand-tint); border-radius:999px; padding:3px 10px; display:inline-flex; align-items:center; gap:4px;}
.doc-attach{display:inline-flex; align-items:center; gap:6px; font-size:.78rem; font-weight:600; color:var(--brand-dark); text-decoration:none;}
.doc-attach .icon{font-size:.85rem;}
.mood-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; margin-top:14px;}
.mood-card{border:1px solid var(--line); border-radius:var(--radius); background:var(--paper); box-shadow:var(--shadow); padding:14px; word-break:break-word;}
.mood-card img{width:100%; display:block; border-radius:var(--radius-sm); margin-bottom:8px;}
.video-thumb{position:relative; display:block; width:100%; aspect-ratio:9/16; max-height:420px; border-radius:var(--radius-sm);
  margin-bottom:8px; overflow:hidden; background:#111 center/cover no-repeat; text-decoration:none;}
.video-thumb-tiktok{background-color:#000;}
.video-thumb-instagram{background-image:linear-gradient(135deg,#f58529,#dd2a7b,#8134af,#515bd4);}
.video-thumb-fallback{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:2.6rem; color:#fff; opacity:.85;}
.video-thumb-play{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:48px; height:48px; border-radius:50%;
  background:rgba(0,0,0,.55); color:#fff; display:flex; align-items:center; justify-content:center; font-size:1.1rem;}
.mood-type{font-size:.6rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--brand); margin-bottom:6px;}
.mood-actions{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
.settle{border:1px solid var(--line); border-radius:var(--radius); background:var(--paper); box-shadow:var(--shadow); padding:4px 16px; margin-top:14px;}
.settle-row{display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--line); font-size:.95rem;}
.settle-row:last-child{border-bottom:none;}
.steps{counter-reset:st; list-style:none;}
.steps li{counter-increment:st; padding:8px 0 8px 40px; position:relative; font-size:.9rem;}
.steps li::before{
  content:counter(st); position:absolute; left:0; top:6px; width:26px; height:26px;
  background:var(--brand-tint); color:var(--brand-dark); border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:.8rem;
}
details{border:1px solid var(--line); border-radius:var(--radius); background:var(--paper); margin-bottom:12px; overflow:hidden;}
details summary{padding:12px 16px; font-weight:700; cursor:pointer; font-size:.9rem; color:var(--ink); user-select:none;}
details[open] summary{border-bottom:1px solid var(--line);}
details .d-body{padding:14px 16px;}
.doc-icon{width:42px; height:52px; border-radius:var(--radius-sm); background:var(--brand-tint); color:var(--brand-dark); display:flex; align-items:center; justify-content:center; font-size:.6rem; font-weight:800; flex-shrink:0;}
.doc-icon .icon{font-size:1.2rem;}
.readonly-note{font-size:.75rem; color:var(--muted); font-style:italic;}
.section-head{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap;}
.section-head h2{margin-bottom:0;}
.section-head h3{display:inline-flex; align-items:center; gap:8px;}
.section-head h3 .icon{font-size:1.3rem; color:var(--brand); flex-shrink:0;}
/* most emoji glyphs carry extra padding low in their own box, so flex-centred against a
   title they read as sitting a touch low - nudged up to actually look aligned */
.sec-emoji{font-size:1.15rem; line-height:1; flex-shrink:0; transform:translateY(-1px);
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;}
@media(max-width:560px){
  h1{font-size:1.5rem;}
  .wrap{padding:calc(14px + env(safe-area-inset-top)) 12px 80px;}
  .modal{padding:6px 12px 40px;}
  .flight-apt{font-size:1.2rem;}
}
/* Touch screens keep :hover applied to whatever you tapped last, so a card sits there wearing
   its hover outline - a brand-coloured border on one random card - until you tap something
   else. Hover only means anything on a device that can actually hover, so on the ones that
   can't, every hover effect is handed back its resting state. */
@media (hover:none){
  .btn:hover{border-color:var(--line-strong); color:var(--ink); background:var(--paper);}
  .btn.primary:hover{background:var(--brand); border-color:var(--brand); color:#fff;}
  .btn.ghost:hover{background:none; color:var(--muted); border-color:transparent;}
  .btn.danger:hover{background:#FCEBE9; border-color:#FCEBE9; color:#C0392B;}
  .trip-card:hover,.hub-card:hover,.dash-tile:hover{
    transform:none; box-shadow:var(--shadow); border-color:var(--line);}
  .theme-swatch:hover,.bg-card:hover{transform:none; box-shadow:var(--shadow);}
  .emoji-pick:hover,.pack-check[role=checkbox]:hover,
  .poll-opt[role=button]:hover{border-color:var(--line-strong);}
  .plan-auto.plan-click:hover .flight-strip,.plan-auto.plan-click:hover .card,
  .card.plan-click:hover{border-color:var(--line);}
  /* the trash/pencil icon on every card list (places, tasks, travel, accommodation…) - its
     hover tint is a red-tinted pink that sticks on whichever one you last tapped, reading as
     a stray red outline on a "random" card until you tap something else */
  .iconbtn:hover{color:var(--muted); background:none;}
  .iconbtn.edit:hover{color:var(--brand); background:none;}
  .iconbtn.del:hover{color:#C0392B; background:none;}
}
@media print{.btn,.tabbar,.crumb{display:none!important;}}

/* ---------- sticky screen footer ---------- */
.modal-actions{
  position:sticky; bottom:0; background:var(--bg); padding:14px 0 10px;
  margin-top:16px; border-top:1px solid var(--line); z-index:2;
}

/* ---------- inline field errors ---------- */
.field.err input,.field.err textarea,.field.err select,input.err{border-color:var(--accent-dark); box-shadow:0 0 0 3px rgba(232,89,59,.15);}
.field-err{color:var(--accent-dark); font-size:.74rem; font-weight:600; margin-top:4px; display:none;}
.field.err .field-err{display:block;}

/* ---------- live split summary ---------- */
.split-sum{border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--brand-ghost); padding:12px 14px; margin-top:12px; font-size:.9rem;}
.split-sum .row{display:flex; justify-content:space-between; padding:3px 0;}
.split-sum .left{font-weight:700; color:var(--ink);}
.split-sum .left.clear{color:var(--brand-dark); font-weight:700;}

/* ---------- trip dashboard ---------- */
.dash-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:6px;}
.dash-tile{
  border:1px solid var(--line); border-radius:var(--radius); background:var(--paper); box-shadow:var(--shadow);
  padding:16px; cursor:pointer; position:relative; min-width:0;
  display:flex; flex-direction:column; align-items:flex-start; gap:10px;
  transition:transform .1s, box-shadow .1s, border-color .1s;
}
.dash-tile:hover,.dash-tile:focus-visible{transform:translateY(-2px); box-shadow:var(--shadow-lift); border-color:var(--brand); outline:none;}
.dash-tile > .dash-icon{font-size:1.5rem; color:var(--brand);}
/* emoji carry their own colour, so they only need sizing; the slightly larger size and
   flat line-height keep them optically level with the icon-font tiles they replaced */
.dash-emoji{font-size:1.65rem; line-height:1; display:inline-block; font-style:normal;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;}
.dash-text{display:flex; flex-direction:column; min-width:0; width:100%;}
.dash-tile .dash-label{font-family:var(--font-head); font-weight:700; font-size:.95rem; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.dash-tile .dash-sum{color:var(--muted); font-size:.78rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.dash-tile .dash-sum.unfilled{color:#C0392B; font-weight:600;}
.dash-tile.wide{grid-column:span 2;}
a.dash-tile{text-decoration:none;}
/* the Countries/Want to Go region tiles use the same icon-above-label column layout as every
   other dashboard tile - the one override still needed is letting the label wrap, since a
   two-word continent name ("North America") would otherwise truncate in a two-column tile */
.dash-tile.region-tile .dash-label{white-space:normal;}

/* ---------- backup / restore bar ---------- */
/* ---------- bottom bar ---------- */
.tabbar{display:none;}
.tabbar.on{
  display:grid; grid-template-columns:repeat(7,1fr); align-items:center;
  position:fixed; left:0; right:0; bottom:0; z-index:60;
  background:var(--paper); border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  box-shadow:0 -2px 14px rgba(20,40,47,.06);
  /* forces its own compositor layer so mobile Safari/Chrome keep it pinned smoothly
     during momentum scroll instead of lagging a frame behind and looking "unstuck" */
  transform:translateZ(0); will-change:transform;
}
/* hidden outright while a keyboard is up (see the focusin/focusout listeners toggling
   body.kb-open) rather than repositioned above it - a second bar stacked on top of the
   keyboard read as broken, not useful, especially with a search box already anchored there */
body.kb-open .tabbar.on{display:none;}
/* icon-only: a 6th tab (Films) made room for text labels too tight to read comfortably, and
   aria-label already carries the name for screen readers regardless */
.tabbar-item{
  display:flex; align-items:center; justify-content:center; min-width:0;
  background:none; border:none; padding:10px 2px; cursor:pointer; color:var(--muted);
  font:inherit;
}
/* only while the section menu is open, so the bar never floats over a full-screen form */
.tabbar.over-menu{z-index:130;}
.tabbar-item:disabled{opacity:.3; cursor:default;}
.tabbar-item.active{color:var(--brand-dark);}
.tabbar-emoji{font-size:1.5rem; line-height:1;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;}
/* keep the last of the page clear of the bar (harmless on the PIN gate, where it's hidden),
   set after the narrow-screen rule above so it wins on phones too, where the bar still needs
   the same clearance the wider layouts give it */
.wrap{padding-bottom:96px;}
/* a bigger group wraps onto a second line rather than being cut off; the icon sits at the
   top of its own line rather than centred, which only looked right with text one line tall */
.trip-people{display:flex; align-items:flex-start; gap:7px; margin-top:6px;}
.trip-people .icon{font-size:.72rem; margin-top:2px; flex-shrink:0;}
.trip-people-names{overflow-wrap:anywhere; min-width:0;}

/* ---------- idea emoji ---------- */
.mood-title{display:flex; align-items:baseline; gap:8px;}
.mood-emoji{flex-shrink:0; line-height:1;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;}
.mood-emoji.solo{font-size:1.5rem; margin-bottom:2px;}
/* chosen emoji directly under the name it belongs to, palette underneath that */
.emoji-picks{display:grid; grid-template-columns:repeat(auto-fill,minmax(40px,1fr)); gap:6px; margin-top:8px;}
.emoji-input{width:60px; text-align:center; font-size:1.25rem; line-height:1.2;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;}
.emoji-pick{
  aspect-ratio:1; width:100%; padding:0; font-size:1.15rem; line-height:1; cursor:pointer;
  border:1px solid var(--line-strong); border-radius:10px; background:var(--paper);
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
.emoji-pick:hover,.emoji-pick:focus-visible{border-color:var(--brand); outline:none;}
.emoji-pick.on{border-color:var(--brand); background:var(--brand-tint);}

/* ---------- trip status pill ---------- */
.status-pill{display:inline-block; font-size:.64rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; border:1px solid var(--line-strong); border-radius:999px; padding:3px 11px; white-space:nowrap; color:var(--muted); background:var(--paper);}
.status-pill.now{background:var(--accent); border-color:var(--accent); color:#fff;}
.status-pill.soon{background:var(--brand-tint); border-color:var(--brand-tint); color:var(--brand-dark);}
.status-pill.past,.status-pill.off{background:var(--bg); border-color:var(--bg); color:var(--muted);}


/* ---------- itinerary ---------- */
/* more air between days than the rest of the app's headings get, on purpose: a long trip's
   itinerary is the most stacked-up page there is, and the gap is what breaks it into days
   you can take in one at a time instead of one long scroll */
.plan-day{margin:40px 0 20px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.plan-day:first-child{margin-top:4px;}
/* "Day N" carries the weight - it's the number you actually navigate by while scrolling - the
   date beside it is just a cross-reference, so it stays small and quiet in comparison */
.plan-day-num{font-family:var(--font-head); font-size:1.3rem; font-weight:700; color:var(--brand-dark); line-height:1;}
.plan-day-date{font-size:.72rem; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.05em;}
.wx-chip{display:inline-flex; align-items:center; gap:5px; font-size:.72rem; font-weight:700; color:var(--muted); background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:2px 9px;}
.wx-emoji{font-size:.9rem; line-height:1;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;}
/* a touch more room between cards than elsewhere, same reasoning as the day gap above */
/* a leg you just turn up for: a line on the page rather than a card, so it doesn't carry the
   same weight as the flight above it */
.plan-leg{display:flex; align-items:flex-start; gap:9px; padding:6px 2px; margin-bottom:20px; font-size:.9rem; color:var(--ink);}
.plan-leg.plan-click{cursor:pointer; border-radius:var(--radius-sm);}
/* not booked yet already reads as dashed red text, same as every other "still outstanding"
   thing on the page - the dashed box round it just makes that legible from a glance rather
   than requiring you to actually read the words */
.plan-leg.card-undecided{border-radius:var(--radius-sm); padding:12px 14px;}
.plan-leg-icon{flex-shrink:0; line-height:1.4;}
.plan-leg-text{min-width:0; overflow-wrap:anywhere;}
.plan-card{margin-bottom:20px;}

/* ---------- packing list ---------- */
.pack-add{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
.pack-add input{flex:1 1 160px; min-width:0;}
.pack-add select{flex:0 1 140px;}
.pack-nudge{display:flex; align-items:center; gap:10px; border-left:3px solid var(--brand); border-radius:var(--radius-sm); background:var(--brand-tint); color:var(--brand-dark); padding:11px 14px; margin-bottom:16px; font-size:.82rem;}
.pack-nudge .icon{flex-shrink:0;}
.pack-progress{position:relative; overflow:hidden; border:1px solid var(--line); border-radius:999px; background:var(--bg); padding:5px 12px; margin-bottom:14px; font-size:.72rem; font-weight:700; color:var(--muted);}
.pack-progress-bar{position:absolute; inset:0 auto 0 0; background:var(--brand-tint); transition:width .2s;}
.pack-progress span{position:relative;}
.pack-heading{margin:20px 0 10px; font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);}
.pack-row{display:flex; align-items:center; gap:12px; padding:11px 2px; border-bottom:1px solid var(--line); min-height:48px;}
.pack-row .iconbtn{flex-shrink:0; align-self:center;}
.pack-check{flex-shrink:0; width:21px; height:21px; border:2px solid var(--line-strong); border-radius:6px; display:inline-flex; align-items:center; justify-content:center; font-size:.66rem; color:#fff; background:var(--paper);}
.pack-check[role=checkbox]{cursor:pointer;}
.pack-check[role=checkbox]:hover,.pack-check[role=checkbox]:focus-visible{border-color:var(--brand); outline:none;}
.pack-check.on{background:var(--brand); border-color:var(--brand);}
.pack-text{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:2px;}
.pack-label{font-size:.88rem; overflow-wrap:anywhere;}
.pack-row.done .pack-label{text-decoration:line-through; color:var(--muted);}
.pack-who{font-size:.7rem; color:var(--muted);}
.pack-who.done{color:var(--brand-dark);}

/* ---------- polls ---------- */
.poll-card{margin-bottom:14px;}
.poll-opt{position:relative; overflow:hidden; border:1px solid var(--line-strong); border-radius:var(--radius-sm); padding:9px 12px; margin-bottom:8px; background:var(--paper);}
.poll-opt[role=button]{cursor:pointer;}
.poll-opt[role=button]:hover,.poll-opt[role=button]:focus-visible{border-color:var(--brand); outline:none;}
.poll-opt.picked{border-color:var(--brand); background:var(--brand-ghost);}
.poll-opt.won{border-color:var(--brand); }
.poll-bar{position:absolute; inset:0 auto 0 0; background:var(--brand-tint); transition:width .2s; z-index:0;}
.poll-opt.picked .poll-bar{background:var(--brand-tint);}
.poll-opt-row{position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:10px;}
.poll-opt-text{display:inline-flex; align-items:center; gap:8px; font-size:.85rem; font-weight:600; min-width:0; overflow-wrap:anywhere;}
.poll-opt-text .icon{color:var(--brand-dark); flex-shrink:0;}
.poll-opt-n{font-size:.74rem; font-weight:700; color:var(--muted); white-space:nowrap; flex-shrink:0;}
/* full-bleed, no radius of its own - .plan-card-photo clips it back to the card's own rounded
   corners via overflow instead, so it reads as one continuous edge rather than a photo with a
   frame around it */
.plan-card.plan-card-photo{padding-left:0; padding-right:0; padding-bottom:0; overflow:hidden;}
.plan-card-photo .section-head,.plan-card-photo>p,.plan-card-photo>.small,.plan-card-photo>.btn-row{padding-left:18px; padding-right:18px;}
.plan-card-photo>.btn-row{padding-bottom:18px;}
.plan-img-wrap{position:relative;}
.plan-img{width:100%; max-height:220px; object-fit:cover; display:block;}
.plan-img-map{position:absolute; bottom:10px; right:10px; background:var(--paper); box-shadow:var(--shadow);}
/* an icon sitting beside a line of text rather than above a title, so it wants the text's own
   baseline instead of the bigger align-items:center a card head gets */
.plan-meta-line{display:flex; align-items:flex-start; gap:7px;}
.plan-meta-line .sec-emoji{margin-top:1px; flex-shrink:0;}
.plan-auto{margin-bottom:20px;}
.plan-auto-tag{display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--brand-dark);}
.plan-auto-tag .icon{font-size:.95rem;}
.plan-auto-tag .sec-emoji{font-size:.95rem;}
.plan-auto .flight-strip,.plan-auto .card{margin-bottom:0;}
.plan-click{cursor:pointer;}
.plan-auto.plan-click:hover .flight-strip,.plan-auto.plan-click:hover .card,.card.plan-click:hover{border-color:var(--brand);}
.plan-auto.plan-click:focus-visible .flight-strip,.plan-auto.plan-click:focus-visible .card,.card.plan-click:focus-visible{outline:none; border-color:var(--brand);}
.plan-travel-icon{font-size:1.1rem; color:var(--brand); flex-shrink:0; display:inline-flex;}
.plan-travel-icon .sec-emoji{font-size:1.05rem;}
/* the emoji leading a stop's title shouldn't scale with the heading */
.card > .section-head h3 .sec-emoji{font-size:1rem;}

/* ---------- edit log ---------- */
.log-row{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); align-items:baseline;}
.log-row:last-child{border-bottom:none;}
.log-row-link{cursor:pointer; margin:0 -8px; padding:12px 8px; border-radius:8px;}
.log-row-link:hover,.log-row-link:focus-visible{background:var(--bg); outline:none;}
.log-what{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.log-when{color:var(--muted); font-size:.75rem; white-space:nowrap; flex-shrink:0; margin-left:auto;}

/* ---------- desktop/tablet: sidebar nav instead of the mobile hamburger overlay ---------- */
@media(min-width:768px){
  .app-shell{display:flex; align-items:flex-start;}
  .sidebar{
    display:flex; flex-direction:column; gap:2px; flex-shrink:0; width:248px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
    padding:18px 10px; border-right:1px solid var(--line);
  }
  .sidebar .menu-item{padding:10px 12px; font-size:.88rem;}
  /* the sidebar is the nav here, so the mobile bottom bar (unconditional elsewhere - it has
     no width check of its own) would otherwise sit fixed over the page redundantly */
  .tabbar.on{display:none!important;}
  .wrap{max-width:1160px; margin:0; padding:calc(14px + env(safe-area-inset-top)) 40px 96px 32px; flex:1; min-width:0;}
  .dash-grid{grid-template-columns:repeat(3,1fr);}
  /* Itinerary reads as a stack of phone-width cards, not a dashboard - the wide 3-column
     layout the rest of the trip's pages use doesn't suit it, so it keeps its mobile width
     instead, sitting centred with room either side (which just shrinks on its own as the
     window narrows, right down to the sidebar breakpoint above) */
  .wrap[data-tab="plan"]{max-width:560px; margin:0 auto; padding:calc(14px + env(safe-area-inset-top)) 24px 96px;}
}
@media(min-width:768px) and (max-width:1279px){
  .sidebar{width:216px;}
}
</style>

    "Plants: added a dedicated Watering card (last watered, a plain Moist/Check Soil/Needs Water status, and one concrete next action) separate from the rest of the page.",
    "Plants: Growing Conditions are now individual icon-led cards instead of table rows; Care Tips renamed \"🌟 Today's Tips\" and capped at 4; Success Tracker renamed \"🎯 Today's Checklist\" with friendlier wording and ☑/☐ icons.",
    "Plants: the Growing Guide's Planted/Indoors/Repot/Outside/Munch fields are now 🌱 Sow/🏠 Start Indoors/🌤 Move Outside/✂️ Thin Out/🥦 Harvest, its phases are simple \"Step N\" cards with a short one-line summary above the fuller booklet text, and the photo section (now \"📸 Growth Journey\") shows an estimated day number next to each empty photo slot.",
  ]},
  {version:'2.29.17', notes:[
    "Plants: added a 4-tile dashboard (Total Plants/Need Water/Germinating/Ready To Harvest) above the grid, plus a sort picker - Needs Attention (the old default), Recently Watered, Plant Name, or Date Sown.",
  ]},
  {version:'2.29.16', notes:[
    "Plants redesign: a colour-coded 🟢/🟡/🔴 status badge now sits right under each vegetable's name - the most prominent thing on the card after its name - so it's obvious at a glance whether anything needs doing. The old \"Water Every N Days\" line and \"Last Watered: ...\" text are gone, replaced by a short 💧 status chip and a compact 🕒 relative-time footer.",
    "Plants: seeds and sprouts now show a germination countdown (⏳ 10 to 21d on the card, a day count with a progress ring on the detail page) for the vegetables this app has a known germination window for - so a slow starter doesn't read as a failure before it's had the time it actually needs.",
    "Plants detail page: added Growing Conditions (sun/water/temperature/spacing/pot size), up to 5 Care Tips, and a Success Tracker (Watered Today/Soil Moist/In Correct Location/Germination Window Active - the first three auto-tracked, Location a manual tap) for every vegetable this app has care data for.",
  ]},
  {version:'2.29.15', notes:[
    "Plants: added Growing Guides for Cauliflower and Rocket too, written from general growing knowledge since the seed kit's booklet doesn't cover either of them.",
    "Plants: every card (grid and detail) now shows what the soil should feel like right now - dry or moist - alongside the Watered button, a plain-language read of the same overdue/not-due state the button's own colour already carries.",
  ]},
  {version:'2.29.14', notes:[
    "Plants: added a Growing Guide to the vegetable page for Oregano, Spinach, Squash, Lettuce, Carrot and Radish, transcribed straight from our seed kit's own booklet - the full month-by-month facts, phase-by-phase instructions (tap a phase to open it), and three tap-to-add slots for your own progress photos. Every month range is editable too, since real planting rarely lines up exactly with a generic guide.",
  ]},
  {version:'2.29.13', notes:[
    "The search box on Places, Games, Board Games, Wishlist, Gig Artists and Films' Diary/Watchlist no longer floats above the keyboard - it's a normal part of the page now, sitting right at the top of each list, instead of pinned above the tabbar. That pinned positioning was the whole source of the keyboard-floating bug that kept coming back no matter how it was patched, so it's gone rather than fixed again.",
  ]},
  {version:'2.29.12', notes:[
    "Plants: a vegetable's Watered button now fades out and stops being tappable once it's had enough water for its schedule - previously only greyed out if watered that exact day, so a plant on a 2-day schedule watered yesterday still looked tappable even though it wasn't due yet.",
  ]},
  {version:'2.29.11', notes:[
    "Fixed the Places/Games-style search bar (now also used on Films' Diary and Watchlist tabs) floating well above the keyboard with a gap of page showing through underneath it - the keyboard-height tracking behind that has raced the keyboard's own resize animation for three fix attempts running, so it's gone for good in favour of trusting the page's viewport settings to position things correctly on their own.",
  ]},
  {version:'2.29.10', notes:[
    "Theatre watchlist: the Seen button now sits below the show title instead of squeezed in next to it.",
  ]},
  {version:'2.29.9', notes:[
    "Watchlist search now filters the films already on your watchlist instead of searching for new ones - Diary got the same treatment, both now match how Places and Games search their own lists.",
    "Finding a brand new film to log or add lives on its own full-page search screen (tap + Add Film) instead of the overlay bar that kept floating in the wrong spot above the keyboard - each result now offers both Log and + Add.",
  ]},
  {version:'2.29.8', notes:[
    "Fixed the Films search bar sometimes floating too high above the keyboard instead of sitting right against it - a timing quirk in how the keyboard's height gets measured could leave it holding a stale, oversized offset.",
  ]},
  {version:'2.29.7', notes:[
    "Fixed Films search: the results list could grow tall enough to push the search box itself off-screen with no way back - it's now a proper scrollable dropdown, plus a ✕ button to clear the search in one tap.",
    "The same search box is now on the Watchlist tab too, not just Diary - search, then Log or + Watchlist straight from there.",
    "Forced a fresh fetch for streaming logos so the Netflix/Prime Video duplicate-logo fix applies immediately instead of waiting for the old cached result to expire.",
  ]},
  {version:'2.29.6', notes:[
    "Fixed Netflix/Prime Video sometimes still showing two logos for the same service - TMDb inserts \"Standard\"/\"Basic\" between the brand name and \"with Ads\" for some titles, which the earlier de-dupe fix didn't account for.",
  ]},
  {version:'2.29.5', notes:[
    "Added a Streaming Services picker under Settings > Films - select what you actually subscribe to and Watch Next/Watchlist logos only show those.",
    "Watchlist cards: dropped the year under the poster (streaming logos now sit there instead) and switched to a plain row layout, since the grid's columns were too narrow for a side column.",
    "Theatre: a show's photo is now poster-shaped (tall, rounded corners) instead of cropped into a circle, same width as before.",
    "Plants: \"Mark as Planted\" no longer wraps onto two lines on a narrow card.",
  ]},
  {version:'2.29.4', notes:[
    "Streaming logos (Watch Next, Watchlist) moved off the poster itself - they sit in a slim column beside it now instead of overlapping the artwork.",
  ]},
  {version:'2.29.3', notes:[
    "Theatre: you can attach a photo when logging a show or adding one to the watchlist - there's no catalogue to search for stage-show posters, so this is a manual upload.",
    "Watchlist: dropped the film title text under a poster that already shows it - still shown for the rare film with no poster.",
  ]},
  {version:'2.29.2', notes:[
    "Plants: a Not Planted vegetable's button now says \"Mark as Planted\" and actually plants it, instead of showing \"Watered\" for something that isn't in the ground yet.",
  ]},
  {version:'2.29.1', notes:[
    "Streaming logos (Watch Next, Watchlist) now sit as a badge in the poster's top-right corner instead of a row below it, and dropped the \"via JustWatch\" credit line. Also cleaned up Amazon/Paramount+ listings so each service only shows once instead of once per billing tier.",
  ]},
  {version:'2.29.0', notes:[
    "Added Theatre: a new 🎭 section for logging stage shows you've seen and shows you want to see, right alongside Films and Music in the menu.",
  ]},
  {version:'2.28.2', notes:[
    "Home: Next Trip's flags are left-aligned and closer together now instead of stretched across the card, so the card itself is much shorter. Places Been's icon is a globe now instead of a pin. Games' stat tile reads \"N Played\" instead of \"N Games\".",
  ]},
  {version:'2.28.1', notes:[
    "Films: Home's Watch Next widget and every Watchlist card now show which UK streaming services a film's actually on (Netflix, Prime Video, etc. - subscription and free, not rent/buy), sourced from TMDb/JustWatch. Uses the same TMDb key film search already needs, so there's nothing extra to set up if that's already working.",
  ]},
  {version:'2.28.0', notes:[
    "Home: the Branch earnings card is full width now, and shows Made This Week alongside Made Today rather than just the one figure. Plants: a vegetable still on \"Not Planted\" fades on Home's chip too (not just the Plants page), and its water button shows a shovel instead of a water drop or checkmark, since it isn't due for watering yet - it's due for planting.",
  ]},
  {version:'2.27.3', notes:[
    "Home: Watch Next now shows above Last Seen instead of below it.",
  ]},
  {version:'2.27.2', notes:[
    "Plants: the Watered button's outline is blue now, and it fades noticeably more once it's disabled (already watered today). A vegetable still on \"Not Planted\" fades its whole card, on both the Plants page and its own detail page, so it reads as not-actively-growing-yet at a glance.",
  ]},
  {version:'2.27.1', notes:[
    "Plants: the Watered button is disabled once a vegetable's already had water today - it used to stay tappable and just say \"Watered\" either way, so an already-watered plant looked exactly like one still waiting for a tap. Also added a \"Not Planted\" stage ahead of Seed Sown, for a vegetable you're tracking before it's actually gone in the ground - new vegetables start there now.",
  ]},
  {version:'2.27.0', notes:[
    "Home: new \"Made Today\" tile at the top - today's freelance invoice line items from Branch (a separate CRM), plus a pro-rated day's pay from the 9-to-5 on weekdays. Tap it for the breakdown. Needs a one-time Worker setup - see psn-proxy/README.md's \"Connect Branch\" section - and just doesn't show until that's done.",
  ]},
  {version:'2.26.4', notes:[
    "Plants: dropped the circle around Home's water button once it's showing the checkmark - the checkmark already reads as \"done\" on its own, so the circle was just doubling up the shape. The water-drop state keeps its circle.",
  ]},
  {version:'2.26.3', notes:[
    "Plants: Home's small per-vegetable water button now shows a checkmark instead of a water drop once it's had enough water for now, so you can tell what still needs a top-up at a glance without opening each one. Still a single tap to log another watering either way.",
  ]},
  {version:'2.26.2', notes:[
    "Plants: Sprouted now has its own emoji (🌿). Dropped \"Flowering / Fruiting\" from the stage list too - it didn't fit root veg like carrots (they don't fruit, and flowering there usually means bolting, not progress), so the list is now Seed Sown, Sprouted, Growing, Ready to Harvest, Harvested for every vegetable. Anything already sat on the old Flowering stage now reads as Growing instead.",
  ]},
  {version:'2.26.1', notes:[
    "Plants: the stage buttons on a vegetable's own page are full width now, one per row, and the redundant status line above them is gone since the highlighted button already says what stage it's on. On both that page and the Plants grid card, \"Last Watered\" now sits below the watering button instead of above it.",
  ]},
  {version:'2.26.0', notes:[
    "Renamed the app to \"Chris app\".",
    "Plants: the stage dots are gone. The vegetable's own page now has a full labelled button per stage (with its emoji, where one's accurate) - only the current one highlighted, and a tap on any of them jumps straight there. The smaller Plants page card just shows the current stage as plain text now, plus how often it needs watering. \"Mark as Watered\" is now just \"Watered\", with more breathing room either side of it. Fixed the gap between cards on the Plants page so it's even on all sides.",
  ]},
  {version:'2.25.1', notes:[
    "Plants: the stage dots on a vegetable's page are properly bordered circles now, so they actually read as tappable buttons instead of plain dots. \"Mark as Watered\" is a single row now too - the label on the left, the water drop on the right - instead of stacked.",
  ]},
  {version:'2.25.0', notes:[
    "Plants: tapping a vegetable now opens its own page instead of the edit form - icon, stage, and a Timeline of everything that's happened to it (every watering and every stage change, newest first), each with its own delete button for a mis-tap. Deleting the latest stage entry reverts the plant's current stage to whatever's now the most recent. Editing its name, icon, planted date or watering frequency moved to a dedicated Edit button on this page.",
  ]},
  {version:'2.24.0', notes:[
    'Plants: names are 30% bigger on the Plants page. The water row now reads "Last Watered: 18:00" (24-hour clock), and the button is a proper "Mark as Watered" button with the water drop underneath it instead of an icon-only circle - "Undo Watering" in the brief post-tap undo window. Home\'s small chip buttons are unchanged.',
    "Plants: vegetables with no matching emoji can use a custom uploaded image instead - a Genmoji/Apple Emoji Maker sticker works well, or any small image. It takes over as that vegetable's icon everywhere (Plants grid, Home's chips) until removed.",
  ]},
  {version:'2.23.1', notes:[
    "Home's Plants widget: dropped the \"Plants\" header (redundant with the tabbar), removed the red/green circle around each vegetable's water button (the emoji and timestamp already say enough at that size), and the grid is a fixed 3 columns now so six vegetables sit neatly as two rows, growing downward rather than shrinking as more are added.",
  ]},
  {version:'2.23.0', notes:[
    "Plants: watering a vegetable now shows an Undo option for a few seconds right after, in case of a stray tap - it reverts on its own once that window passes. Also more space above the emoji on each card.",
    'Home\'s Plants widget now shows every vegetable, each with its own emoji, water button and a short "last watered" timestamp, instead of just the single neediest one.',
    "Next Trip's flags no longer make the card taller than its neighbours - the box is shorter/wider now, same overall size as Most Played/Currently Playing's.",
    "Games: tapping one (from the list, or Home's Currently Playing) now opens its own page in the app - platform, last played date, and a full trophy breakdown by tier (Platinum/Gold/Silver/Bronze, earned vs total) - instead of opening a TikTok search.",
  ]},
  {version:'2.22.0', notes:[
    'Removed the News feature entirely - the article feed, its Home tile, and the icon that replaced it on the tabbar are all gone.',
    "Plants: watering is a timestamped log now instead of a single date, so watering twice in one day (or checking exactly when it last happened) both work properly. The \"Needs watering\" text is gone too - the water button itself turns red when overdue and green once it's done for the day, so cards stay compact with a lot of vegetables on screen. Stage (including Seed Sown) is now a single tap on the card's own dots instead of only changeable from the edit form, and cards are noticeably more compact overall. Home's tile is now just the neediest vegetable's emoji and a watering badge, no text.",
    'Films: Watchlist\'s icon is a heart now instead of a bookmark.',
    "Next Gig's Songkick link now searches with London added, since that's far more likely to actually turn up a real, findable event than the artist name on its own.",
    "Next Trip's flag(s) are much bigger now - the box is the full width of the card instead of half of it, the way a real photo would fill it.",
  ]},
  {version:'2.21.1', notes:[
    "Plants: the auto-picked emoji now covers a lot more vegetables - radish, turnip, beetroot, avocado, olive, beans, herbs (basil, mint, coriander…), courgette, cauliflower, cabbage and more all get a sensible icon now instead of falling back to the plain seedling.",
  ]},
  {version:'2.21.0', notes:[
    'New Plants tab: track vegetables through six growth stages (Seed Sown to Harvested), log watering with a per-vegetable frequency so overdue ones get flagged, and see a tip for what each one needs next. Cards pick an emoji automatically from the name (tomato, carrot, pepper…), or pick your own from the grid.',
    'Home now shows the vegetable that needs the most attention, and the tabbar/menu are reordered to Home, Travel, Films, Music, Games, Plants - News moved off the tabbar onto a small icon next to Home\'s range dropdown.',
    'Films/Watchlist search placeholder shortened to "Search for a film…".',
    "Home's top news article no longer shows a newspaper emoji placeholder when it has no image - just the headline.",
    "Next Trip: multiple flags now sit on one line and fill the width between them evenly instead of a single fixed size (one flag still fills the whole space).",
  ]},
  {version:'2.20.0', notes:[
    "Simplified external links (Letterboxd, Spotify, TikTok, Songkick, News' Read on X, maps, booking links, shared albums, TikTok/Instagram mood board thumbnails) - dropped a Safari-handoff trick that was opening two windows instead of one and making it a hassle to get back to the app. Flight tracking keeps it, since it's the one link that genuinely needs Safari's own saved login.",
    'Fixed News articles occasionally showing literal HTML like &lt;p&gt; as visible text - some feeds entity-escape their own markup, which slipped past the tag-stripping step.',
    "Dropped UX Planet from Design News - its feed only ever carried a short teaser, so every one of its articles just linked out instead of being readable in the app.",
    'Home: renamed "From Your Watchlist" to "Watch Next", and Next Trip now matches Most Played/Currently Playing\'s height exactly instead of just closing most of the gap.',
    "Settings' link at the foot of Home now matches Next Gig's caption font instead of standing out in its own bolder, smaller one.",
    'Travel: closed the gap between the Your Trips heading and the first trip card.',
    'Countries: the continent tiles are two columns now instead of one, with the emoji sitting above the name instead of beside it.',
  ]},
  {version:'2.19.0', notes:[
    "Home: Last Seen and the Watchlist pick open that film on Letterboxd now, Most Played opens the song on Spotify, Currently Playing opens a TikTok search for the game, and Next Gig opens a Songkick search for the artist - external links throughout, in place of just opening the app's own tabs. Gigs Seen and Films Seen now always land on the actual list (not whatever tab/filter you last had open there), and the News feature picks a fresh random article every time you land on Home instead of showing whatever you last happened to read.",
    "Home: Next Trip's flag emoji is bigger now, closing most of the height gap it had next to its image-led neighbours.",
    "Music's four subtabs are Not Seen/Gigs on one row and Artists/Songs on the other now, both evenly filling their row, instead of Not Seen alone above the other three.",
    'Watchlist: dropped + Add Manually - search covers that (and more) on its own now that it has a proper home.',
    "Watchlist: search moved off the bottom of the page into its own screen, opened with a + Add Film button up top the same way Diary's + Log Film already works.",
    "Diary: a new search field above the genre filter finds a film to log (or relog, for a rewatch) or add straight to the Watchlist, without leaving the page - sits fixed above the tab bar on mobile the way Places/Games' own search does, inline above the filter on a wider screen.",
  ]},
  {version:'2.18.0', notes:[
    "Fixed Film and Music News showing nothing - the London-only location filter meant for Design was wrongly applying to those two as well, and Variety/Hollywood Reporter/Resident Advisor/DJ Mag mention Los Angeles/Berlin/Ibiza and the like constantly, so it was quietly dropping almost everything in both categories. It's Design-only now.",
    'Home: the "⚙️ Settings" link at the foot of the page gets breathing room below it now too, not just above.',
    'Home: Last Seen keeps its poster\'s actual 2:3 shape now instead of being cropped to a square, matching the Watchlist pick.',
    'Gigs: dates read as a short 18/8/26 now instead of the spelled-out full date.',
    "Music's four subtabs are two clean rows now instead of wrapping unpredictably - Not Seen on its own up top, Gigs/Artists/Songs evenly filling the row below.",
    "Watchlist: a + Add Manually option next to search, for a film TMDb search doesn't find (not yet released, obscure, or search isn't set up) - it saves with just a title and still gets its poster/genres filled in automatically afterwards.",
  ]},
  {version:'2.17.0', notes:[
    "Home: Places Been, Gigs Seen, Films Seen and Games now sit together in a fixed two-column row up top, above Currently Playing/Most Played/Last Seen - and Places Been and Films Seen now filter by the same All Time/Last Six Months/Last Four Weeks picker Gigs Seen and Games already did.",
    "Home: Most Played, Currently Playing, Last Seen and the Watchlist pick's images are left-aligned now instead of centred, and the Watchlist pick keeps its poster's actual 2:3 shape instead of being cropped to a square.",
    'Settings gets a little breathing room below its last card instead of ending flush with the screen.',
    'Films: fixed the Stats page\'s "Logged" tile not actually opening the Diary (it was changing the hash to where it already was, which does nothing) - it switches tab directly now, the same way Rewatches and the bar charts already did.',
    "Films: the year/rating/Rewatches page's title is genuinely centred now, not just centred within lopsided leftover space next to the back button and count pill.",
    'Films: watched dates are a short 19/4/26 now instead of the spelled-out 19 April 2026, so they sit comfortably next to the year and rating on a small poster card.',
    "Films: poster grids are strictly top-aligned now - a title clamps to exactly two lines, so a row of short titles no longer sits shorter than its neighbours and pulling the next row's posters out of alignment.",
    'Watchlist: tapping a poster now opens that film on Letterboxd (its exact page for anything imported from a Letterboxd CSV, a Letterboxd search for anything added via search) instead of doing nothing.',
  ]},
  {version:'2.16.0', notes:[
    "News: fixed the filter chips not showing which category you'd picked, fixed a thumbed-down article coming back when you navigated away and back, and turned the fade on a dismissed article into a permanent 70% dim instead of it vanishing outright.",
    "News: articles that aren't in English or aren't about London are filtered out now, missing images (DJ Mag's lazy-loaded ones, among others) are found properly, and articles are sorted newest-first using whichever date field a feed actually provides.",
    'Films Stats: films watched by year and by rating are bar charts now instead of plain lists - tap a bar to see just that year or rating, and Logged/Rewatches are tappable too, opening the Diary or a rewatches-only view.',
    "Watchlist films now get their posters (and genres, enabling the genre filter) backfilled automatically the same way the Diary already does - a CSV import leaves both blank, and nothing ever retried it before.",
    'Letterboxd sync moved into Settings alongside the CSV imports, out of the Diary header where it was competing for attention.',
    'Small tidy-ups: dropped the "(optional)" label next to Poster URL, shortened Games\' PlayStation subtab to "PS5/PS4" and Gigs\' "All Gigs" to "Gigs" so they fit their row, and Home\'s Currently Playing/Last Seen widgets now match Most Played\'s half-width image layout.',
  ]},
  {version:'2.15.0', notes:[
    "Design, and the Films and Music tabs' own News subtabs, are now one unified News tab (📰, in Design's old spot) - every article merged into a single dated feed with All/Design/Films/Music filter chips, instead of three separate places to remember to check.",
    "News articles have thumbs up/down now. Thumbs down fades an article out and it's gone for good from then on, and nudges its whole publication down the list; thumbs up nudges a publication up - the closest thing to \"shows more of what you like\" this app can honestly do without a real backend to learn from.",
  ]},
  {version:'2.14.6', notes:[
    "New Settings page (⚙️ Settings, at the foot of Home) - Import Diary CSV and Import Watchlist CSV moved there from the Films header, since they were competing for attention with Log Film and Letterboxd's own sync status for something you only really use once.",
  ]},
  {version:'2.14.5', notes:[
    "Fixed posters staying blank for films logged beyond Letterboxd's own ~50-entry sync limit - finding posters/genres only ever ran right after a CSV import or sync, so anything that failed to match a title at that moment (a hiccup, a title TMDb didn't recognise yet) stayed blank until you re-imported the whole file. It now retries automatically every time the Diary loads.",
  ]},
  {version:'2.14.4', notes:[
    "Films' News subtab drops Variety and The Hollywood Reporter's all-topics feeds (mostly industry deal news) for their Film/Movies-specific ones, and adds IndieWire for cinema culture and criticism and What's on Netflix for new streaming releases.",
  ]},
  {version:'2.14.3', notes:[
    "Fixed the Log Film search results not actually showing up (a missing style meant the dropdown could render off in the wrong spot) - and while in there, picking a result now shows its poster and year right in the form instead of just quietly filling in a URL field.",
    'Rating is a dropdown now instead of a row of stars - individual stars, even the bigger tap targets from an earlier fix, were still fiddly to hit precisely on a phone.',
  ]},
  {version:'2.14.2', notes:[
    "Fixed Diary duplicates from logging the same film both via Letterboxd sync and a CSV import - the two didn't always agree on what identifies an entry, so the same watch could show up twice. Existing duplicates now merge together automatically (keeping whichever side has the fuller data) next time the Diary loads, and new syncs/imports won't recreate them."
  ]},
  {version:'2.14.1', notes:[
    "Dropped the Menu button from a trip's mobile header - Share Trip already has its own button lower down the page, and All Trips is a tap away on the bottom bar's Travel tab, so the button was one more way to do things the page already offered."
  ]},
  {version:'2.14.0', notes:[
    'Films: a new News subtab (alongside Diary/Watchlist/Stats) with film industry headlines from Variety and The Hollywood Reporter, read right in the app the same way Design articles are.',
    'Music: a new News subtab (alongside Not Seen/Artists/Songs/All Gigs) with headlines from Resident Advisor, DJ Mag and Spotify Newsroom.',
  ]},
  {version:'2.13.2', notes:[
    "Home's column balancing now places the biggest tile (usually Currently Playing's own poster) first, instead of wherever it happened to land in reading order - the previous version could still end up noticeably lopsided whenever one tile was much taller than the rest."
  ]},
  {version:'2.13.1', notes:[
    "Home: the two columns now balance themselves by actual height instead of a fixed left/right split, so one side no longer ends up visibly taller than the other."
  ]},
  {version:'2.13.0', notes:[
    'Home: three new Films tiles, styled the same as everything else there - how many you\'ve watched this year, the last one you logged, and a randomly-picked film from your Watchlist (a fresh pick every visit) to nudge you toward actually watching something on it.'
  ]},
  {version:'2.12.1', notes:[
    "Stats' By Rating tiles show actual star icons now instead of a plain \"★ 4.5\" line.",
    "Stats' filtered pages (tap a year or rating to see its films) now put the Stats back button on the left, the year/rating centred, and how many films matched on the right, instead of the title and back button swapped."
  ]},
  {version:'2.12.0', notes:[
    "Diary and Watchlist both have a category dropdown now (Action, Comedy, Drama…) to filter down to just one genre - genres come from TMDb, so a film needs to have been picked from search (or backfilled after a CSV import/Letterboxd sync) to be categorised.",
    'Stats\' By Year and By Rating are now a 3-column grid instead of one column, so more of the breakdown fits on screen at once.'
  ]},
  {version:'2.11.0', notes:[
    "New Stats sub-tab on Films: how many you've watched each year, and a breakdown by star rating (half-stars included) - tap either to see the actual films behind the number.",
    "Films' Watchlist can now import Letterboxd's watchlist.csv export too, the same as the Diary's Import CSV.",
    "Importing a Letterboxd CSV now fetches a poster for every film that came in without one (Letterboxd's export doesn't include posters at all) - a few at a time in the background, right after the import finishes.",
    "Fixed CSV imports and Letterboxd syncs occasionally blanking out a film's poster it already had, when the new data didn't have one of its own."
  ]},
  {version:'2.10.0', notes:[
    "Films' Diary has an Import CSV button now, for Letterboxd's own full-history export (Settings › Data › Export Your Data, diary.csv) - the Connect Letterboxd sync only ever sees your ~50 most recent entries. No setup needed, works entirely on-device, and importing again later just updates entries rather than duplicating them."
  ]},
  {version:'2.9.1', notes:[
    "Log Film's star rating: each half-star's actual tap area now reaches past the visible star on every side, instead of relying on the star itself being bigger - should make it much easier to land the half you meant.",
    "Log Film's Watched date now defaults to today instead of blank."
  ]},
  {version:'2.9.0', notes:[
    'Films now has a Watchlist sub-tab - search and save films you mean to watch, then tap Watched when you actually do to log it properly (date, rating, rewatch) and drop it off the list. Syncs for everyone the same as the Diary.',
    "Log Film's star rating is bigger, so each half-star is an easier tap."
  ]},
  {version:'2.8.0', notes:[
    "Log Film's Title field now searches a real film catalogue as you type - pick a result and its year and poster fill in too - instead of typing everything by hand (needs a one-time TMDb key on the proxy, see psn-proxy/README.md; plain typing still always works).",
    'Log Film\'s Rating is now a row of tappable stars, half-stars included, instead of a dropdown.',
    "Fixed a confusing error when Films' Letterboxd sync hits a proxy that hasn't been redeployed since Films shipped - it now says so directly instead of a bare \"not found\"."
  ]},
  {version:'2.7.1', notes:[
    'Home: Currently Playing\'s box art is back above the title instead of beside it, matching the top song tile.'
  ]},
  {version:'2.7.0', notes:[
    'New Films tab: log films you\'ve watched (title, year, date, star rating, rewatch) with a poster-shelf grid, or connect your Letterboxd username to pull in your diary automatically - ratings, rewatches and all. Syncing again just updates what\'s changed rather than duplicating anything.',
    'The bottom tab bar now shows icons only, no text labels underneath, to make room for the new Films tab.'
  ]},
  {version:'2.6.0', notes:[
    'Home: "Games Played" is now just "Games", and there\'s proper spacing below it. Currently Playing is now a compact row - box art on the left at the same size as the next-gig photo, title and caption on the right - instead of a big square image.'
  ]},
  {version:'2.5.0', notes:[
    'Fixed the Places/Artists search box drifting away from the keyboard on some phones instead of sitting right above it, by telling the browser to resize around the keyboard properly instead of working around it after the fact.',
    'The bottom tab bar now hides outright while a keyboard is open, instead of sometimes showing up stacked above it.'
  ]},
  {version:'2.4.0', notes:[
    'Home: replaced the auto-balancing masonry with two fixed columns, so Games Played and its card can never land with a gap above them again. Places Been and Gigs Seen (renamed from Gigs Been To) are now a compact single-line row - icon left, count and label right - instead of stacked. The article card\'s title and caption now match Currently Playing\'s styling exactly.'
  ]},
  {version:'2.3.0', notes:[
    'Home is now the app\'s front door (opening with nothing after the address takes you straight there, same as tapping the Home tab) - Places is still there under Travel.',
    'Home: the article card is now a compact row - image on the left, title and "Next Article" (normal case, below the title now) on the right - instead of a tall banner. Games Played and Currently Playing always land in the same column together. A trip\'s flags now sit flush against each other.'
  ]},
  {version:'2.2.1', notes:[
    "Home: attempted fix for a stray shadow rendering above the masonry grid on some phones (a known Safari bug where a card's box-shadow can bleed into whatever sits just above a multi-column layout)."
  ]},
  {version:'2.2.0', notes:[
    'Home: the latest article is now a full-width card at the very top of the page, instead of squeezed into one masonry tile - that\'s the one piece of Home that changes on its own schedule, so it gets more room to notice at a glance.'
  ]},
  {version:'2.1.0', notes:[
    "Home: added a Places Been tile. Every tile's caption is now a plain label (Next Trip, Next Gig, Most Played, Next Article) instead of the specific date/location/artist, matching Currently Playing's style. Gigs Been To and Games Played now filter by the same Last 4 Weeks / Last 6 Months / All Time picker as the top song. Fixed a stray shadow under that picker on some phones."
  ]},
  {version:'2.0.0', notes:[
    'Home: a new tile shows your top song, with the same Last 4 Weeks / Last 6 Months / All Time picker as Songs (top right, next to the page title). The next-gig tile now shows its location too, and Gigs Been To / Games Played dropped their big-number look for the same small emoji-led style as everything else. Trips now shows up to three upcoming trips, shuffled, instead of just the next one, to give the masonry more to work with.'
  ]},
  {version:'1.99.0', notes:[
    'Home: the next gig\'s artist photo is now a circular avatar instead of a banner crop, and Currently Playing\'s box art keeps its own square shape instead of being cropped to the same strip as everything else.'
  ]},
  {version:'1.98.0', notes:[
    'Music: the Songs time filter is now a dropdown instead of three buttons, and the Not Seen / Artists / Songs / All Gigs subtabs wrap onto a second row instead of squeezing every label down to an unreadable ellipsis.'
  ]},
  {version:'1.97.0', notes:[
    'Gigs is now Music, and gained a Songs tab: your top tracks from Spotify, with a Last 4 Weeks / Last 6 Months / All Time filter (Spotify\'s own three listening windows - there\'s no real calendar week/month/year to pull from).'
  ]},
  {version:'1.96.0', notes:[
    'Added a Home tab - a quick glance across every section (upcoming trip, gigs been to and coming up, currently playing, latest Design read) in a masonry layout, each tile linking straight into its own tab. First in the bottom bar.'
  ]},
  {version:'1.95.0', notes:[
    'Added a Wishlist to the Games tab - search for a new or upcoming game (GTA VI, say) and save it to a list, backed by RAWG. Needs a free API key, see psn-proxy/README.md.'
  ]},
  {version:'1.94.0', notes:[
    'Removed Switch Name and the per-trip identity system - this is a single-user app, so picking your name before every trip opened was friction with nothing behind it.',
    'Packing is a single shared checklist now instead of per-person: one tick per item, no more "who is this for" field.',
    'Polls vote anonymously per device now instead of by name - one vote per poll, results just show counts.',
    'Money\'s Balances no longer personalise ("You owe"/"you") since there\'s no identity to compare against - still shows every participant\'s balance and the fewest-payments settle-up.',
    'Places I\'ve Been: countries on a future trip now sort by how soon that trip is, not an arbitrary order - a 2027 trip lists ahead of a 2028 one.'
  ]},
  {version:'1.93.0', notes:[
    'Artists checklist cards are centred now - photo on top (a circle, about 70% of the card\'s width), name below it, seen/not-seen status last - instead of the photo-beside-name row.'
  ]},
  {version:'1.92.0', notes:[
    'Board Games\' 401 wasn\'t a network block after all - last version\'s theory was wrong. BoardGameGeek now requires every request to carry a registered app token, which is why moving the request to a different host didn\'t help. Fixed properly this time: BGG_API_TOKEN is a one-time Vercel environment variable, see psn-proxy/README.md for how to get one (free, a couple of minutes).'
  ]},
  {version:'1.91.0', notes:[
    'Board Games is back on BoardGameGeek - Board Game Atlas turned out to have shut down, so last version\'s switch traded one broken source for a dead one. This time it\'s a small serverless function alongside the app itself rather than a route on the proxy, since BGG blocks the proxy\'s network specifically, not BGG access in general. Needs no setup on your end.',
    'Log a Gig drops Venue and Notes - just artist, location and date now.',
    '"City" is now "Location" on gig entries, since not every gig has one.',
    'The Artists checklist shows two columns instead of one, and gained a search box to jump straight to an artist.',
    'Added a "Not Seen" tab next to Artists - just the ones you follow but haven\'t logged a gig for yet, for working through as a checklist.',
    'Design articles with a lead image now show it, both on the card and at the top of the article.',
    'A gig with a future date now shows faded on the All Gigs list, the same treatment upcoming trips get on Places I\'ve Been - it hasn\'t happened yet, so it\'s there without looking like a done deal.'
  ]},
  {version:'1.90.0', notes:[
    'Board Games now talks to Board Game Atlas instead of BoardGameGeek, whose API kept 401ing every request from the proxy no matter what headers were sent - same search and trending list, just a different (and reachable) source. Needs its own free client_id, see psn-proxy/README.md. The Complexity filter is gone with it - Board Game Atlas doesn\'t have BGG\'s weight rating to filter by.',
    'Fixed the Gigs Artists checklist failing to load past the first 50 artists you follow or the first 50 in your listening history - a "next page" URL was being mangled into something fetch() couldn\'t use.',
    'The Artists checklist rows sit closer together now, with less padding inside each one - they\'re just a photo, a name and a status, not a full gig card.'
  ]},
  {version:'1.89.0', notes:[
    'Fixed Design news throwing on every article - a leftover reference to a renamed function meant every feed failed on every load.',
    'Board Games\' proxy request still 401s from BoardGameGeek after last version\'s User-Agent change - added the fuller set of headers a real browser sends along with it.',
    'Design, Board Games and the Gigs Artists checklist now all show the proxy\'s real error message instead of a bare status code when something goes wrong.'
  ]},
  {version:'1.88.0', notes:[
    'Gigs: new Artists tab, a checklist of every artist you follow on Spotify - ranked by how much you actually listen to them - with a Seen/Not seen status for each, worked out from your logged gigs. Tapping one opens the log-a-gig form pre-filled with that artist. Needs connecting your own Spotify account from the tab (separate from the plain artist search Add Gig already had). The old flat list of everything you\'ve logged is still there, now under an All Gigs tab.',
    'Board Games\' proxy requests were getting rejected with a 401 - swapped its User-Agent for a generic browser one, which is what the request was actually being blocked on.',
    'Gig cards on the Artists checklist and the artist search dropdown sit vertically centred against their photo now, and the list between them sits a bit tighter.'
  ]},
  {version:'1.87.0', notes:[
    'A gig card no longer shows the venue - just the artist, city and date (on one line), and any notes.',
    'Design and Board Games now surface the proxy\'s actual error ("BoardGameGeek returned 403", a design feed\'s real status) instead of a bare status code, and Design tells you outright when every feed failed rather than showing "nothing to show right now" as if it were just a quiet news day.'
  ]},
  {version:'1.86.0', notes:[
    'A stop\'s time ("Evening", or a set clock time) now reads as "Plan - Evening" above the card, the same way an auto-generated card\'s own tag sits above it, instead of as a plain line competing with the title inside.',
    'A stop\'s location and description swapped order and the description lost its icon: location (with its pin) now comes first, description underneath as plain text.',
    'Removed the copy-location link button from the bottom of a stop card.',
    'Fixed the Maps icon on a stop or accommodation card showing the plain folded-map emoji instead of Google\'s own for almost every real Google Maps link - the check for "is this a Google Maps URL" only matched a link at the very start of the string or right after a subdomain dot, never right after the "https://" every real link actually has.'
  ]},
  {version:'1.85.0', notes:[
    'The accommodation card\'s logo and Maps icon now sit in matching badges of the same size, instead of two differently-sized icons each pixel-nudged to try to line up.',
    'On desktop, the region tiles (Europe, Asia, Africa…) on Been/Want to Go/Countries now lay out three across instead of stacking one per row.'
  ]},
  {version:'1.84.0', notes:[
    'Added Gigs, a new top-level section for logging live music you\'ve been to - artist, venue, city, date and notes, with the artist field searching Spotify (via the same proxy Games and Design use) for a photo as you type.',
    'The mobile bottom bar dropped its Menu and + Add buttons to make room for Gigs alongside Travel, Games and Design - the menu they opened now lives behind a button in the trip\'s own header instead, and everything the + used to add still has its own button in the section it belongs to.'
  ]},
  {version:'1.83.0', notes:[
    'Fixed the desktop/tablet sidebar going blank on Games, Design and the Travel hub - it only ever held a trip\'s own menu, so leaving a trip left no navigation at all now the mobile bottom bar is hidden there. Travel, Games and Design now sit in the sidebar everywhere, underneath a trip\'s own menu when there is one.'
  ]},
  {version:'1.82.0', notes:[
    'A stop\'s photo: the Maps icon moved to the bottom-right corner of the image, notes and location now carry their own icon, and the leftover gap below the photo is gone.',
    'Fixed the Maps icon showing the folded-map emoji instead of Google\'s own for a "maps.google.com/?q=…" style link.',
    'A not-booked-yet travel leg that\'s just a text line (train, bus, drive…) now gets the same dashed box everything else outstanding has, instead of "- not booked yet" tacked onto the end of the line.',
    'Tasks now reads in day order - hand-typed tasks and the derived Not Booked / Nothing Planned cards are one combined list sorted by date, instead of two separate blocks. Nothing Planned\'s card now puts the date on its own line under "Day N", matching the accommodation-gap card, rather than folding both into one title.',
    'Nudged icon/emoji vertical alignment across cards - logos (Airbnb, airlines, booking sites) sit a couple of px lower and emoji a touch higher, so both actually line up with the text beside them instead of reading slightly off-centre.'
  ]},
  {version:'1.81.0', notes:[
    'Desktop/tablet: the sidebar now shows from 768px up instead of 1024px, so a tablet gets it too. The menu no longer leaves a blank gap above it (it was sized for a header this app hasn\'t had in a long time) - it now fills the space and fits more before scrolling.',
    'Itinerary keeps its mobile width even with the sidebar showing, sitting centred with room either side, instead of stretching edge to edge - that margin shrinks on its own as the window narrows. The rest of a trip\'s pages are unchanged. The mobile bottom bar, which had no width check of its own, no longer shows behind the sidebar.',
    'Shared Album Link now just says "Paste your PhotoCircle invite link below" instead of also mentioning Apple/Google as alternatives.'
  ]},
  {version:'1.80.0', notes:[
    'A bit more air above "All Countries" and below a Day heading.',
    'Country Finder: Going joins Want to Go / Not Exploring as a third option in the same switch, instead of a separate grey pill - locked once a country\'s actually going, and tapping it on one that isn\'t opens New Trip with that country already added.',
    'Places I\'ve Been: removed the delete icon from each card.',
    'The Accommodation gap card in Tasks now has a "Not Booked Yet" title above it like everything else there.',
    'A Task without a specific day now shows the same dashed outline as everything else outstanding in Tasks, and Tasks got a "No Specific Day" toggle - a day-less task no longer shows on the Itinerary, just in Tasks.',
    'The Accommodation tag\'s bracketed time now says what it is - "(15:00 Check In)", "(Check Out)" - and its Maps icon nudged down to sit centred against the row.',
    'Flights on the Travel tab now shows a plain "No flights yet." like Ferries and Car Hire, instead of its own bigger empty-state card.',
    'A stop\'s photo is full width and flush with the card now, with a Maps icon overlaid top-right on it instead of a button below; the time of day moved out of the title into its own line underneath.'
  ]},
  {version:'1.79.0', notes:[
    'The Itinerary\'s accommodation card is one line now: the logo is the booking link itself, Maps takes the header\'s right-hand slot, and the auto-filled "Airbnb in X" name drops the service name since the logo already says it. The check-in time moved into brackets next to the Accommodation tag\'s own time above the card.',
    'A flight card\'s head (airline, number, date) now opens live flight status directly - the separate Track Flight link is gone.'
  ]},
  {version:'1.78.0', notes:[
    'The dashed "still outstanding" border (Not Booked, Nothing Planned) is a faint red now instead of a bold one, matching the accommodation-gap card\'s lighter weight.',
    '"Nothing Planned" now uses ❌ instead of 📍.'
  ]},
  {version:'1.77.0', notes:[
    'Countries: added an "All Countries" title above the flat list, now that it\'s no longer broken up by continent headings of its own.'
  ]},
  {version:'1.76.0', notes:[
    'Fixed Places I\'ve Been order for Greece, Albania, Australia and Japan: they were archived out of order by the same old bug the previous fix addressed, but that fix only prevents new mistakes rather than correcting ones already baked into the saved order. These four are now pinned by hand to the right order (Greece, then Albania, then Australia, then Japan) regardless of how they were originally recorded.'
  ]},
  {version:'1.75.0', notes:[
    'Countries: the full list below the region tiles is one flat list again, not grouped and re-labelled by continent underneath tiles that already sort by continent. The tiles themselves are one column instead of two.',
    '"Not Booked" is now a solid pill instead of just coloured text, so it stands out at a glance.',
    'A travel leg\'s "arrive by" time now reads as just "By 14:00" (leave by is unchanged).',
    'Add Travel\'s icon changed from 🧭 to 🚌, matching Travel everywhere else.',
    'Fixed a stop card (e.g. a plain "Beach Day" with nothing else on it) showing more space below the title than above it.',
    'Day headings on the Itinerary are more distinct: a bigger "Day N" next to a small caps date underneath it, rather than one plain line.',
    'A bit more air above the photo/image upload button on Stop and Idea forms, so it doesn\'t sit jammed against the field above it.',
    'Fixed Tasks: the dashboard tile\'s count includes empty itinerary days, but the Tasks tab itself never showed a card for them, so the two disagreed. It now does, with a Nothing Planned card you can tap to add something.',
    'A "Not Booked Yet" travel leg in Tasks now shows its date (or day number), the same context the accommodation gap card already had, instead of just a bare route.'
  ]},
  {version:'1.74.0', notes:[
    'Only Flight and Ferry legs get a full card on the Itinerary now - Train and everything else (Drive, Walk, Bus, Taxi) read as a single line, the same lighter treatment Bus/Walk already had.',
    '"Undecided?" is now "Not Booked Yet?" everywhere it appears (flights, ferries, car hire, accommodation) - the same wording travel legs already used, so it reads the same across the whole app.',
    'A travel leg marked Not Booked Yet now matches the same dashed-card look as everything else in Tasks, instead of showing as plain text.',
    'Travel\'s emoji is now 🚌, matching the + menu\'s Travel item.',
    'The "Places I\'ve Been" home page card is now just "Places Been".'
  ]},
  {version:'1.73.0', notes:[
    'Travel legs get their own "Not Booked Yet?" toggle, separate from the Mode picker - for when you know it\'s a ferry, know the route and time, just haven\'t actually bought it. Shows dashed on the Itinerary and lists in Tasks, same as everywhere else something\'s still outstanding.',
    'Fixed Places I\'ve Been ordering across multiple finished trips: countries were being marked Been in whatever order the trips happened to sit in rather than the order they actually finished, which could show a more recent trip\'s countries as older than an earlier one\'s.',
    'The four home page cards: number and label are now the same size and style, just the number stays the brand colour. Tapping Going scrolls down to Your Trips instead of opening a second copy of the same list.',
    '"All day" no longer prints on an Itinerary card\'s title - it\'s the default, so leaving it off a card said the same thing a shorter way.',
    'The Tasks dashboard tile now counts everything the Tasks tab actually lists: hand-typed tasks, Undecided flights/ferries/car hire/accommodation, nights with nowhere booked, and days with nothing planned yet - not just hand-typed tasks.',
    'Tasks\' emoji is now ☑.'
  ]},
  {version:'1.72.0', notes:[
    'Undecided items are back to Undecided flights/ferries/car hire/accommodation only - stops and travel legs don\'t need the checkbox, a travel leg\'s existing "Not Decided" mode and a stop\'s own detail already say that clearly enough.',
    'An Undecided flight/ferry/car hire/accommodation is no longer a separate Task kept in sync with it - it IS the Task, read straight from wherever it already lives, so editing or deleting it in either place is editing or deleting the one thing.',
    'Nights with nowhere booked now show on the Itinerary too (not just the Accommodation tab), and as a reminder in Tasks - both worked out fresh each time rather than something that can go stale or get deleted by mistake.',
    'Removed the All / Day 1 / Day 2… row from the top of the Itinerary; every day shows at once.',
    'The four home page cards (Places I\'ve Been, Going, Want to Go, Countries) are shorter now: icon on the left, the count and label together on one line.',
    'Countries: region tiles dropped their "X of Y" count, fit on one line, and the full country list now sits right below them instead of behind a tap on an "All" tile.',
    'A country already on a booked trip no longer shows the Want to Go / Not Exploring switch on Country Finder - nothing to toggle once you\'re already going - just a fixed, greyed "Going" pill.',
    'Train\'s emoji is now 🚆, and Taxi joins Drive/Walk/Ferry/Flight/Train/Bus as a travel mode.'
  ]},
  {version:'1.71.0', notes:[
    'An Undecided item now still shows on the Itinerary (and the Travel/Accommodation tab it belongs to), not just as a Task - drawn with the same dashed red outline as an empty day or a "No Flights Yet" gap, since it isn\'t a plan yet either, just one you know is coming.',
    'Fixed a sticky red hover tint on a card\'s edit/delete icon after tapping it on a touch screen - the fix that stopped whole cards doing this didn\'t cover these icons.',
    'Places I\'ve Been: corrected the order of the earliest countries so England is #1 (the very first) and Wales #2, with the rest of that early run following on from there.',
    'Polls can now allow selecting multiple answers (a new toggle when creating one), and anyone answering an open poll can add another option on the spot, not just when it\'s first created.'
  ]},
  {version:'1.70.0', notes:[
    'Added an "Undecided?" checkbox to every Add form (stops, travel, flights, ferries, car hire, accommodation): tick it for something you know you need but haven\'t sorted yet, and it becomes a single red Task instead of a half-empty card on the Itinerary - resolve it later and the Task clears itself.',
    'A blank airline, operator or company on an otherwise-filled-in card now shows in red with a ❓, rather than just being left out, so a still-open detail stands out even when the rest of the booking is done.'
  ]},
  {version:'1.69.0', notes:[
    'Added Midday to When, alongside All day, Morning, Afternoon and Evening - on stops, travel legs and now tasks too, which get the same picker instead of a bare time field.',
    'Edit Trip is now a button above Share Trip instead of a dashboard tile.',
    'Fixed easyJet\'s logo not showing on flight cards (and any other airline/site whose icon comes back blank rather than missing) - it now falls back to the airline name and flight number instead of a gap.',
    'Flight cards only show the flight number when the airline\'s logo is showing, since the logo already says who; no logo still shows the full airline name.',
    'Airline is now a proper search-as-you-type picker rather than a plain text box - the old one used the browser\'s built-in autocomplete, which iOS Safari doesn\'t actually show a dropdown for.'
  ]},
  {version:'1.68.0', notes:[
    'Tasks take a day and a time again, and show on the Itinerary on that day. One without a day yet sits under "Anytime" in red, on both screens, as the thing still to sort out. Tap a task to fill it in; there\'s still no edit button, the card itself is the way in.',
    'Fixed links opening in the in-app browser when you came BACK to the app after reading them in Safari. iOS pauses timers while the app is in the background, so the fallback that was meant to have been cancelled on the way out was firing on the way back in.'
  ]},
  {version:'1.67.0', notes:[
    'Adding a stop or an idea from a particular day now fills that day in for you, whether you came from the day\'s own card or had that day showing on the Day picker.',
    'When: added an "All day" option, which sits at the head of its day.',
    'Flights and accommodation show the airline or booking site\'s logo as a small square on the card.',
    'A travel leg with no mode chosen now reads "Travel to Kassiopi not decided" rather than "Not Decided to Kassiopi".'
  ]},
  {version:'1.66.0', notes:[
    'Design articles now come through with their images, headings, bold text and quotes rather than as flat paragraphs.',
